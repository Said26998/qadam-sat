<title>Qadam SAT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1F45C8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: one phone-width column; sticky stats bar, scrolling skill path, fixed tab bar. Lessons open as a full-screen sheet.
   Palette: Rishtan ceramic cobalt + turquoise on porcelain, saffron for streak/XP. */
:root{
  --bg:#F2F4FA; --surface:#FFFFFF; --sunk:#E7EBF5; --ink:#141B46; --muted:#59618A; --line:#D7DDEE;
  --cobalt:#1F45C8; --cobalt-d:#14309A; --turq:#0E9C97; --turq-d:#0A716E; --saffron:#E89A12; --saffron-d:#B8770A;
  --plum:#8A3FB8; --plum-d:#682C8C; --coral:#D9503F; --coral-d:#A83A2C;
  --good:#17905A; --good-bg:#DDF5E8; --bad:#C93A33; --bad-bg:#FBE3E1; --heart:#E2434B; --on:#FFFFFF;
  --s1:var(--cobalt); --s1d:var(--cobalt-d); --s2:var(--turq); --s2d:var(--turq-d); --s3:var(--plum); --s3d:var(--plum-d); --s4:var(--coral); --s4d:var(--coral-d); --jade:#0F7A5C; --jade-d:#0A5641; --s5:var(--jade); --s5d:var(--jade-d);
  --f-disp:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-ui:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-read:"Source Serif 4", Georgia, "Times New Roman", serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1128; --surface:#161C3A; --sunk:#1E2549; --ink:#E9EDFB; --muted:#9AA3C9; --line:#2B3360;
  --cobalt:#5B7CFF; --cobalt-d:#3653CC; --turq:#26C2BA; --turq-d:#178F89; --saffron:#F4B13E; --saffron-d:#C1861F;
  --plum:#B47AE0; --plum-d:#8752AE; --coral:#F07462; --coral-d:#BE5141;
  --good:#3CCB84; --good-bg:#123A2A; --bad:#FF7468; --bad-bg:#45191A; --heart:#FF5A62; --on:#FFFFFF; --jade:#2FB487; --jade-d:#1E7D5D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1128; --surface:#161C3A; --sunk:#1E2549; --ink:#E9EDFB; --muted:#9AA3C9; --line:#2B3360;
  --cobalt:#5B7CFF; --cobalt-d:#3653CC; --turq:#26C2BA; --turq-d:#178F89; --saffron:#F4B13E; --saffron-d:#C1861F;
  --plum:#B47AE0; --plum-d:#8752AE; --coral:#F07462; --coral-d:#BE5141;
  --good:#3CCB84; --good-bg:#123A2A; --bad:#FF7468; --bad-bg:#45191A; --heart:#FF5A62; --on:#FFFFFF; --jade:#2FB487; --jade-d:#1E7D5D; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0;letter-spacing:-.01em}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

/* top stats bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:2px solid var(--line)}
.brand{font-family:var(--f-disp);font-weight:800;font-size:22px;color:var(--cobalt);margin-right:auto;display:flex;align-items:center;gap:6px}
.brand svg{width:24px;height:24px}
.chip{display:flex;align-items:center;gap:4px;font-weight:800;font-variant-numeric:tabular-nums;background:none;border:0;padding:6px 6px;border-radius:10px}
.chip svg{width:22px;height:22px}
.chip.streak{color:var(--saffron)} .chip.streak.off{color:var(--muted)}
.chip.theme{color:var(--muted)} .chip.xp{color:var(--cobalt)} .chip.energy{color:var(--turq)} .chip.score{color:var(--plum)} .chip.energy.low{color:var(--bad)}
.timer{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--muted);margin:0 0 12px;font-variant-numeric:tabular-nums}
.timer .tb{flex:1;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}.timer .tb i{display:block;height:100%;background:var(--turq);transition:width .25s linear}
.timer.low .tb i{background:var(--saffron)} .timer.over{color:var(--bad)} .timer.over .tb i{background:var(--bad)}
.dbadge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;padding:1px 7px;border-radius:99px;margin-left:6px;border:1.5px solid currentColor;vertical-align:1px}
.dbadge.d1{color:var(--good)} .dbadge.d2{color:var(--cobalt)} .dbadge.d3{color:var(--plum)}
.lb{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}.lb li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--sunk)}.lb li.me{outline:2px solid var(--cobalt)}
.lb .rk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--surface);flex:none}.lb .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}.lb b{font-variant-numeric:tabular-nums}
.glink2{background:none;border:0;color:var(--cobalt);font-weight:800;padding:4px;cursor:pointer}
.vword{font-size:22px;margin:0 0 6px}.vword span{font-size:14px;color:var(--muted);font-style:italic;margin-left:6px}
.typein{font-size:20px;text-align:center;letter-spacing:.02em}
.fb .meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}.fb .meta span{font-size:13px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--surface);color:var(--ink)}
.scard .big{font-family:var(--f-disp);font-size:46px;line-height:1;color:var(--plum);font-variant-numeric:tabular-nums}.scard .big small{font-size:16px;color:var(--muted);margin-left:6px}
.scale{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--sunk),var(--plum));margin:16px 0 4px}.scale b{position:absolute;top:-5px;width:6px;height:20px;margin-left:-3px;border-radius:3px;background:var(--ink)}
.scale-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700}
.nextbox{background:var(--sunk);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px}
.chip:hover{background:var(--sunk)}
@media (max-width:430px){.top .brand{font-size:0;gap:0}.top .chip{padding:6px 3px;gap:3px}.top .chip svg{width:20px;height:20px}}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.stack{display:flex;flex-direction:column;gap:14px}

/* daily goal */
.goal{display:flex;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px}
.ring{width:58px;height:58px;flex:none}
.ring circle{fill:none;stroke-width:7}
.ring .bgc{stroke:var(--sunk)} .ring .fgc{stroke:var(--saffron);stroke-linecap:round;transition:stroke-dashoffset .6s}
.goal b{font-family:var(--f-disp);font-size:18px;display:block}
.goal p{margin:2px 0 0;color:var(--muted);font-size:14px}

/* path */
.unit{border-radius:var(--r);color:var(--on);padding:14px 16px;display:flex;gap:12px;align-items:center;background:var(--tone);box-shadow:0 4px 0 var(--toned)}
.unit .k{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.unit h2{font-size:20px;color:var(--on)}
.unit .guide{margin-left:auto;flex:none;border:2px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:var(--on);border-radius:12px;padding:8px 10px;font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:10px;padding-inline:2px}
.sechead h3{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:var(--f-ui);font-weight:800}
.sechead span{font-size:12px;color:var(--muted)}
.nodes{display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:18px 8px}
.node{position:relative;width:76px;height:70px;border-radius:50%;border:0;background:var(--tone);box-shadow:0 7px 0 var(--toned);display:grid;place-items:center;color:var(--on);transition:transform .08s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--toned)}
.node svg{width:34px;height:34px}
.node.locked{background:var(--sunk);box-shadow:0 7px 0 var(--line);color:var(--muted)}
.node.done{background:var(--saffron);box-shadow:0 7px 0 var(--saffron-d)}
.node .ringc{position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--tone);opacity:.35;pointer-events:none}
.bubble{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);background:var(--surface);color:var(--tone);border:2px solid var(--line);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:10px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--line)}
@keyframes bob{50%{transform:translate(-50%,-5px)}}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{max-width:560px;margin:0 auto;display:flex}
.nav button{flex:1;background:none;border:0;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted)}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="page"]{color:var(--cobalt)}
.nav button[aria-current="page"] .ic{background:var(--sunk);border-radius:12px}
.nav .ic{padding:3px 10px;display:grid;place-items:center}

/* buttons */
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 18px;font-weight:800;font-size:16px;letter-spacing:.05em;text-transform:uppercase;background:var(--cobalt);color:var(--on);box-shadow:0 4px 0 var(--cobalt-d);transition:transform .06s}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn[disabled]{background:var(--sunk);color:var(--muted);box-shadow:0 4px 0 var(--line);cursor:default}
.btn.good{background:var(--good);box-shadow:0 4px 0 color-mix(in srgb,var(--good) 70%,#000)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 70%,#000)}
.btn.ghost{background:var(--surface);color:var(--cobalt);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.saff{background:var(--saffron);box-shadow:0 4px 0 var(--saffron-d)}
.row{display:flex;gap:10px}.row>*{flex:1}

/* cards and tiles */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-size:20px}
.muted{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;min-width:0}
.tile svg{width:28px;height:28px;flex:none}
.tile b{display:block;font-family:var(--f-disp);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:13px;color:var(--muted)}
.lbl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.week{display:flex;gap:8px;align-items:flex-end;height:120px;padding-top:18px}
.week .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.week .d i{display:block;width:100%;max-width:34px;background:var(--cobalt);border-radius:6px 6px 2px 2px;min-height:3px}
.week .d.today i{background:var(--saffron)}
.week .d span{font-size:12px;color:var(--muted);font-weight:700}
.week .d em{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.skill{display:grid;grid-template-columns:minmax(0,1fr) 90px 42px;gap:10px;align-items:center;padding-block:6px;font-size:14px}
.skill .tr{height:10px;border-radius:6px;background:var(--sunk);overflow:hidden}
.skill .tr i{display:block;height:100%;border-radius:6px}
.skill .pct{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.skill .nm{min-width:0;line-height:1.25}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;gap:10px;padding-block:9px;border-top:1px solid var(--line);font-size:14px;align-items:center}
.log li:first-child{border-top:0}
.log .what{min-width:0;flex:1}
.log .what small{display:block;color:var(--muted)}
.log .xpv{font-weight:800;color:var(--cobalt);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--cobalt);color:var(--cobalt);background:var(--sunk)}
.field{width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:8px}
.switch input{width:22px;height:22px;accent-color:var(--cobalt)}
.sync{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--good)} .sync.err i{background:var(--bad)}

/* class dashboard */
.roster{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.roster th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px 6px;font-weight:800;white-space:nowrap}
.roster th:first-child{text-align:left}
.roster td{padding:10px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.roster td:first-child{text-align:left;white-space:normal}
.roster tr.click{cursor:pointer}
.roster tr.click:hover td{background:var(--sunk)}
.who{display:flex;gap:8px;align-items:center;min-width:0}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--on);flex:none;background:var(--cobalt)}
.tblscroll{overflow-x:auto;margin-inline:-4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* lesson sheet */
.ls{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ls .hd{display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:640px;width:100%;margin:0 auto}
.x{background:none;border:0;padding:4px;color:var(--muted)} .x svg{width:28px;height:28px}
.prog{flex:1;height:16px;border-radius:10px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);border-radius:10px;transition:width .35s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.ls .bd{flex:1;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 24px}
.ls .bd>.in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.ls .ft{border-top:2px solid var(--line);padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg)}
.ls .ft>.in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.ls .ft .fb{max-height:42vh;overflow-y:auto}
.ls .ft.good{background:var(--good-bg);border-color:transparent} .ls .ft.bad{background:var(--bad-bg);border-color:transparent}
.fb h3{font-size:22px;display:flex;align-items:center;gap:8px}
.ft.good .fb h3{color:var(--good)} .ft.bad .fb h3{color:var(--bad)}
.fb p{margin:4px 0 0;font-size:15px}
.fb .ans{font-weight:700}
.qtype{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tone)}
.passage{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:16px;font-family:var(--f-read);font-size:17px;line-height:1.6}
.passage p{margin:0 0 10px}.passage p:last-child{margin:0}
.look summary{cursor:pointer;font-family:var(--f-ui,inherit);font-weight:800;color:var(--cobalt);font-size:15px}.look[open] summary{margin-bottom:10px}
.rtext{font-family:var(--f-read);font-size:18px;line-height:1.7}.rtext p{margin:0 0 14px}
.rclock{font-variant-numeric:tabular-nums;font-weight:800;color:var(--muted)}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer}
.trow:hover{border-color:var(--tone,var(--cobalt))}.trow b{display:block;font-size:16px}.trow small{color:var(--muted);font-size:13px}
.rulebox{border-left:4px solid var(--plum);background:var(--sunk);border-radius:0 12px 12px 0;padding:10px 12px;margin:0 0 8px;font-size:15px}.rulebox .rt{display:block;margin-bottom:2px;font-weight:800}
.exbox{border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px;font-size:15px}.exbox .w{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}.exbox .r{color:var(--good);font-weight:700}.exbox p{margin:2px 0}
.passage u{text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--saffron)}
.blank{display:inline-block;min-width:64px;border-bottom:3px solid var(--ink);margin-inline:2px;transform:translateY(-3px)}
.qtext{font-weight:700;font-size:17px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 3px 0 var(--line);font-size:16px}
.choice .letter{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--muted)}
.choice[aria-pressed="true"]{border-color:var(--cobalt);background:color-mix(in srgb,var(--cobalt) 9%,var(--surface));box-shadow:0 3px 0 var(--cobalt)}
.choice[aria-pressed="true"] .letter{border-color:var(--cobalt);color:var(--cobalt)}
.choice.right{border-color:var(--good);box-shadow:0 3px 0 var(--good)} .choice.right .letter{border-color:var(--good);color:var(--good)}
.choice.wrong{border-color:var(--bad);box-shadow:0 3px 0 var(--bad)} .choice.wrong .letter{border-color:var(--bad);color:var(--bad)}
.choice:disabled{cursor:default}
.data{margin:0 0 10px;font-family:var(--f-ui)}
.data figcaption{font-weight:700;font-size:14px;margin-bottom:8px}
.tblwrap{overflow-x:auto}
.data table{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;min-width:100%}
.data th,.data td{border:1px solid var(--line);padding:6px 10px;text-align:center}
.data thead th{background:var(--sunk)}
.bars{display:flex;gap:6px;height:150px;align-items:stretch}
.bar{flex:1;display:flex;flex-direction:column;min-width:0}

const KEY='qadam-sat-v1'+(window.QADAM_UID?'-'+window.QADAM_UID:''), MAXE=25, EREGEN=6*60*1000, INTV=[0,1,3,7,14,30];
const DR={1:450,2:580,3:700}, DNAME={1:'Easy',2:'Medium',3:'Hard'}, CAL=10;
function fresh(){ return {v:1, nick:'', xp:0, hist:{}, streak:0, lastDay:'', best:0, energy:MAXE, energyTs:Date.now(), score:450, sN:0, sHist:{}, dstat:{}, relaxed:false, goal:20,
  lessons:{}, unit:{}, ans:0, right:0, secs:0, mistakes:[], cards:{}, log:[], sound:true, openAll:false, updatedAt:0}; }
let S = fresh();
try{ const raw = localStorage.getItem(KEY); if(raw) S = Object.assign(fresh(), JSON.parse(raw)); }catch(e){}
function save(sync=true){ S.updatedAt = Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} if(sync) push(); }

const pad=n=>String(n).padStart(2,'0');
const dkey=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dkey(); const yday=()=>{const d=new Date();d.setDate(d.getDate()-1);return dkey(d)};
function streakNow(st=S){ if(st.lastDay===today()||st.lastDay===yday()) return st.streak||0; return st.lastDay && missedDays(st)<=(st.freeze||0) ? (st.streak||0) : 0; }
function todayXp(st=S){ return st.hist[today()]||0; }
function regen(){ if(S.energy>=MAXE){S.energyTs=Date.now();return;} const n=Math.floor((Date.now()-S.energyTs)/EREGEN); if(n>0){S.energy=Math.min(MAXE,S.energy+n); S.energyTs+=n*EREGEN; if(S.energy>=MAXE)S.energyTs=Date.now(); save(false);} }
function nextEnergyMin(){ return Math.max(1,Math.ceil((EREGEN-(Date.now()-S.energyTs))/60000)); }
function useEnergy(n){ if(S.energy>=MAXE) S.energyTs=Date.now(); S.energy=Math.max(0,S.energy-n); }
function addEnergy(n){ S.energy=Math.min(MAXE,S.energy+n); if(S.energy>=MAXE) S.energyTs=Date.now(); }
/* ---------- estimated SAT R&W score (200-800) ---------- */
const pRight=(th,R)=>.25+.75/(1+Math.pow(10,(R-th)/250));
const kOf=n=>Math.max(10,40-.5*n);
function scoreShown(st=S){ return (st.sN||0)>=CAL ? Math.round((st.score||450)/10)*10 : null; }
function band(s){ return s==null?'Calibrating':s>=700?'Top tier':s>=600?'Strong':s>=500?'Solid':s>=400?'Building':'Getting started'; }
function rate(it, ok){ if(!it.d || it.t==='m' || it.t==='mean' || it.t==='type') return null; const before=scoreShown();
  S.score=Math.max(200,Math.min(800,S.score+kOf(S.sN)*((ok?1:0)-pRight(S.score,DR[it.d])))); S.sN++;
  const ds=S.dstat[it.d]||(S.dstat[it.d]={r:0,n:0}); ds.n++; if(ok) ds.r++;
  S.sHist[today()]=Math.round(S.score); const k=Object.keys(S.sHist).sort(); if(k.length>90) delete S.sHist[k[0]];
  const after=scoreShown(); return {before, after, d:before!=null&&after!=null?after-before:null}; }
function nextStep(st=S){ const s=scoreShown(st); if(s==null||s>=800) return null; const target=Math.min(800,(Math.floor(st.score/50)+1)*50); let th=st.score, n=st.sN, c=0;
  while(th<target-5 && c<80){ th+=kOf(n)*(1-pRight(th,DR[3])); n++; c++; } return c<80?{target,c}:null; }
function trend(st=S){ const s=st.score; const ks=Object.keys(st.sHist||{}).sort(); const ago7=dkey(new Date(Date.now()-7*864e5)); const old=ks.filter(k=>k<=ago7).pop(); if(!old||scoreShown(st)==null) return null;
  const g=s-st.sHist[old]; return {g:Math.round(g), proj:Math.min(800,Math.round((s+4*Math.max(0,g))/10)*10)}; }
function spellOk(typed, w){ const t=String(typed).toLowerCase().replace(/[^a-z]/g,''); const e=w.replace(/e$/,''), y=w.replace(/y$/,'i');
  return [w, w+'s', w+'es', w+'d', w+'ed', e+'ed', e+'ing', w+'ing', y+'es', y+'ed', w+'ly'].includes(t); }
function limitOf(it){ return it.t==='type'?45 : it.t==='mean'?30 : it.t==='tap'?40 : it.t==='m'?45 : it.word?40 : (it.p&&it.p.length>650?95:75); }
const dBadge=it=>it.d?`<span class="dbadge d${it.d}">${DNAME[it.d]} · ${DR[it.d]}</span>`:'';
function addXp(n){ const t=today(); let bumped=false; if(S.lastDay!==t){ const m=missedDays(S); if(S.lastDay && S.streak && m<=(S.freeze||0)){ if(m>0) S.freeze-=m; S.streak++; } else S.streak=1; S.lastDay=t; bumped=true; S.best=Math.max(S.best,S.streak); if(S.streak%7===0 && (S.freeze||0)<2) S.freeze=(S.freeze||0)+1; } S.xp+=n; S.hist[t]=(S.hist[t]||0)+n; return bumped; }
function logEvent(e){ S.log.unshift(Object.assign({ts:Date.now()},e)); S.log=S.log.slice(0,60); }
function unlocked(l){ if(l.vocab) return S.openAll || l.li===0 || !!S.lessons[VLESSONS[l.n-1].id]; return S.openAll || l.n===0 || !!S.lessons[LESSONS[l.n-1].id]; }
function currentLesson(){ return LESSONS.find(l=>!S.lessons[l.id]) || null; }

function accPct(r,n){ return n? Math.round(r/n*100) : null; }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const escI=s=>esc(s).replace(/&lt;(\/?)i&gt;/g,'<$1i>');
const fmt=s=>s.replace(/_{3,}/g,'<span class="blank" aria-label="blank"></span>');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const toneOf=u=>SECTIONS[u.sec].tone;
const ago=ts=>{ if(!ts) return 'never'; const m=Math.round((Date.now()-ts)/60000); if(m<1)return 'just now'; if(m<60)return m+' min ago'; const h=Math.round(m/60); if(h<24)return h+' h ago'; const d=Math.round(h/24); return d===1?'yesterday':d+' days ago'; };

let AC=null;
function tone(seq){ if(!S.sound) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); let t=AC.currentTime; seq.forEach(([f,d,type])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.02); t+=d*.8; }); }catch(e){} }
const sfx={ good:()=>tone([[660,.12],[880,.18]]), bad:()=>tone([[220,.22,'triangle'],[180,.25,'triangle']]), done:()=>tone([[523,.12],[659,.12],[784,.12],[1047,.3]]), tap:()=>tone([[520,.05]]) };

async function connect(){
  if(!window.claude || !window.claude.use) return;
  try{
    USER = await window.claude.use('user');
    if(USER){ OWNER = await USER.isOwner().catch(()=>false); UID = await USER.id().catch(()=>null); }
    DB = await window.claude.use('db');
    if(!DB || !UID){ paintSync(); if(OWNER) renderNav(); return; }
    const snap = await DB.doc('students/'+UID).get();
    if(snap.exists){ const d=snap.data(); if(d && d.state && (d.updatedAt||0) > (S.updatedAt||0)){ S = Object.assign(fresh(), JSON.parse(JSON.stringify(d.state))); save(false); render(); } else push(); SYNC='ok'; }
    else { await push(); }
    paintSync();
    if(OWNER){ renderNav(); watchClass(); loadAccess(); loadLogins(); }
    loadBank(); watchBoard(); pushBoard(); loadClassDoc();
  }catch(e){ SYNC='err'; paintSync(); }
}

/* ---------- session engine ---------- */
let SES=null; const LS=document.getElementById('lesson');
function startSession(mode, items, lesson, opts){
  SES={mode, lesson, queue:items.slice(), total:items.length, done:0, firstTry:0, tries:0, wrongOnce:new Set(), start:Date.now(), sel:null, checked:false, energy0:S.energy, score0:scoreShown(), sN0:S.sN, run:0, eBonus:0};
  if(mode!=='lesson' && mode!=='reading') SES.queue=shuffle(SES.queue);

}
function startPractice(){
  const pool = LESSONS.concat(VLESSONS).filter(l=>S.lessons[l.id]).flatMap(l=>l.items);
  const src = pool.length>=6 ? pool : LESSONS.slice(0,2).flatMap(l=>l.items);
  startSession('practice', shuffle(src).slice(0,6));
}
function startMistakes(){ const items=S.mistakes.map(id=>ITEM[id]).filter(Boolean).slice(0,8); if(items.length) startSession('mistakes', items); }
function stopTimer(){ if(SES&&SES.tmr){ clearInterval(SES.tmr); SES.tmr=null; } }
function stopAll(){ stopTimer(); if(SES){ clearInterval(SES.speedT); clearTimeout(SES.adv); } }
function closeSession(){ stopAll(); LS.hidden=true; LS.innerHTML=''; document.body.style.overflow=''; SES=null; render(); setTimeout(()=>{ if(LS.hidden && modal.hidden) checkBadges(false); },350); }
function head(){ const pct=Math.round(SES.done/SES.total*100);
  return `<div class="hd"><button class="x" id="lsX" aria-label="Quit">${I.x}</button><div class="prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>${SES.mode==='speed'?`<span class="pill" id="spd" style="font-size:15px">${Math.max(0,Math.ceil((SES.deadline-Date.now())/1000))}s · ${SES.firstTry} ✓</span>`:SES.mode==='mastery'?`<span class="pill" style="font-size:14px">Level ${SES.lesson.mlv} · ${SES.pass}/${SES.need} ✓</span>`:SES.mode==='lesson'?`<span class="chip energy${S.energy<5?' low':''}">${I.battery}${S.energy}</span>`:`<span class="pill">${SES.mode==='mistakes'?'Mistakes':SES.mode==='daily'?'Daily challenge':SES.mode==='spaced'?'Review':SES.mode==='weak'?'Weak spot: '+SES.weakU.title:SES.mode==='hw'?'Homework':SES.mode==='quiz'?'Word quiz':SES.mode==='official'?'Official SAT':SES.mode==='reading'?'Reading':'Practice'}</span>`}</div>`; }
function showItem(){
  stopTimer(); const it=SES.queue[0]; SES.sel=null; SES.checked=false; SES.item=it; SES.qStart=Date.now(); SES.limit=Math.round(limitOf(it)*(SES.tf||1));
  const u=UNIT[it.unit]; const tone=toneOf(u);
  let body='';
  if(SES.mode==='speed' && Date.now()>=SES.deadline){ finish(); return; }
  if(it.t==='m'){
    SES.left=shuffle(it.pairs.map((p,i)=>i)); SES.right=shuffle(it.pairs.map((p,i)=>i)); SES.matched=new Set(); SES.mL=null; SES.mR=null; SES.mMiss=0;
    body=`<div class="qtype">${u.title} · Vocabulary${dBadge(it)}</div><h2 style="font-size:22px">Match each word to its meaning</h2><div class="match"><div class="colm">${SES.left.map(i=>`<button class="mt w" data-l="${i}">${esc(it.pairs[i][0])}</button>`).join('')}</div><div class="colm">${SES.right.map(i=>`<button class="mt" data-r="${i}">${esc(it.pairs[i][1])}</button>`).join('')}</div></div>`;
  } else if(it.t==='type'){
    body=`<div class="qtype">${u.title} · Spell it${dBadge(it)}</div><div class="passage"><p>${fmt(esc(it.p))}</p></div><div class="qtext">${esc(it.q)}</div><input class="field typein" id="tIn" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type the missing word">`;
  } else if(it.t==='tap'){
    SES.tokens=it.s.split(' '); SES.ans=SES.tokens.findIndex(w=>w.includes('*')); SES.tokens=SES.tokens.map(w=>w.replace(/\*/g,''));
    body=`<div class="qtype">${u.title}${dBadge(it)}</div><div class="qtext">${it.tq||Q_TAP}</div><div class="tokens">${SES.tokens.map((w,i)=>`<button class="tok" data-t="${i}" aria-pressed="false">${esc(w)}</button>`).join('')}</div>`;
  } else {
    SES.order=it.fixed?[0,1,2,3]:shuffle([0,1,2,3]);
    body=`<div class="qtype">${u.title}${dBadge(it)}</div>${it.p?`<div class="passage">${it.p.startsWith('<')?fmt(it.p):'<p>'+fmt(it.p)+'</p>'}</div>`:''}<div class="qtext">${it.q}</div><div class="choices">${SES.order.map((ci,k)=>`<button class="choice" data-k="${k}" aria-pressed="false"><span class="letter">${'ABCD'[k]}</span><span>${escI(it.c[ci])}</span></button>`).join('')}</div>`;
  }
  LS.innerHTML=head()+`<div class="bd"><div class="in" style="--tone:var(--${tone})">${(S.relaxed&&!SES.forceT)||SES.mode==='speed'?'':`<div class="timer" id="tmr" role="timer"><span>${I.clock.replace('<svg','<svg width="18" height="18"')}</span><span class="tb"><i style="width:100%"></i></span><span id="tmrT"></span></div>`}${body}</div></div><div class="ft" id="lsFt"><div class="in">${it.t==='m'?'<p class="muted" style="margin:0;text-align:center">Tap a word, then its meaning.</p>':'<button class="btn" id="lsCheck" disabled>Check</button>'}</div></div>`;
  LS.querySelector('.bd').scrollTop=0;
  document.getElementById('lsX').onclick=quitAsk;
  if((!S.relaxed||SES.forceT) && SES.mode!=='speed'){ const tick=()=>{ const el=document.getElementById('tmr'); if(!el||!SES){ stopTimer(); return; } const left=SES.limit-(Date.now()-SES.qStart)/1000;
      el.className='timer'+(left<=0?' over':left<SES.limit*.25?' low':''); el.querySelector('i').style.width=Math.max(0,left/SES.limit*100)+'%';
      document.getElementById('tmrT').textContent=left<=0?'Over time':Math.ceil(left)+'s'; if(left<=0) stopTimer(); };
    tick(); SES.tmr=setInterval(tick,250); }
  if(it.t==='m') bindMatch(it);
  else if(it.t==='type'){ const ti=document.getElementById('tIn'), cb=document.getElementById('lsCheck');
    ti.oninput=()=>{ SES.sel=ti.value.trim()?0:null; cb.disabled=SES.sel==null; }; ti.onkeydown=e=>{ if(e.key==='Enter' && SES.sel!=null){ e.preventDefault(); check(); } };
    cb.onclick=check; setTimeout(()=>ti.focus({preventScroll:true}),50); }
  else {
    LS.querySelectorAll('.choice,.tok').forEach(b=>b.onclick=()=>{ if(SES.checked) return; LS.querySelectorAll('.choice,.tok').forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); SES.sel=+(b.dataset.k??b.dataset.t); document.getElementById('lsCheck').disabled=false; sfx.tap(); if(SES.mode==='speed') check(); });
    document.getElementById('lsCheck').onclick=check;
  }
}
function bindMatch(it){
  const pick=()=>{ if(SES.mL==null||SES.mR==null) return; const L=LS.querySelector(`[data-l="${SES.mL}"]`), R=LS.querySelector(`[data-r="${SES.mR}"]`);
    if(SES.mL===SES.mR){ [L,R].forEach(x=>{x.classList.add('ok');x.disabled=true;x.setAttribute('aria-pressed','false');}); SES.matched.add(SES.mL); sfx.tap(); }
    else { SES.mMiss++; [L,R].forEach(x=>{x.classList.add('no');x.setAttribute('aria-pressed','false');setTimeout(()=>x.classList.remove('no'),350);}); sfx.bad(); }
    SES.mL=SES.mR=null;
    if(SES.matched.size===it.pairs.length) setTimeout(()=>feedback(true, SES.mMiss?`Matched with ${SES.mMiss} miss${SES.mMiss>1?'es':''}. Review these words in the Words tab.`:'All four matched on the first try.'), 250);
  };
  LS.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{ LS.querySelectorAll('[data-l]').forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); SES.mL=+b.dataset.l; pick(); });
  LS.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ LS.querySelectorAll('[data-r]').forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); SES.mR=+b.dataset.r; pick(); });
}
function check(){
  if(SES.sel==null||SES.checked) return; SES.checked=true; const it=SES.item; let ok, ansText='';
  if(it.t==='type'){ const ti=document.getElementById('tIn'); ti.disabled=true; ok=spellOk(ti.value, it.ans); ti.style.borderColor=ok?'var(--good)':'var(--bad)'; ansText=ok?'':'The word is "'+it.ans+'".'; }
  else if(it.t==='tap'){ ok=SES.sel===SES.ans; LS.querySelectorAll('.tok').forEach((b,i)=>{ b.disabled=true; if(i===SES.ans)b.classList.add('right'); else if(i===SES.sel)b.classList.add('wrong'); }); ansText='The error is "'+SES.tokens[SES.ans]+'".'; }
  else { const A=it.a||0; ok=SES.order[SES.sel]===A; LS.querySelectorAll('.choice').forEach((b,k)=>{ b.disabled=true; if(SES.order[k]===A)b.classList.add('right'); else if(k===SES.sel)b.classList.add('wrong'); }); ansText='Correct answer: '+(it.fixed?'ABCD'[A]+'. ':'')+it.c[A]; }
  feedback(ok, it.e, ok?'':ansText);
}
function feedback(ok, expl, ansText){
  stopTimer(); const it=SES.item; const first=!SES.wrongOnce.has(it.id);
  const secs=Math.round((Date.now()-SES.qStart)/1000); const onTime=(S.relaxed&&!SES.forceT)||secs<=SES.limit; const meta=[];
  if(SES.mode==='mastery' && ok && first){ if(onTime) SES.pass++; else meta.push('Over time: does not count'); }
  const sc=first?rate(it,ok):null;
  if(sc){ if(sc.d!=null) meta.push(`Score ${sc.d>=0?'+':''}${sc.d} → ${sc.after}`); else if(sc.after!=null) meta.push(`Your first score: ${sc.after}`); else meta.push(`Finding your level ${S.sN}/${CAL}`); }
  if(SES.mode==='lesson'){ useEnergy(1);
    if(ok){ SES.run++; if(onTime){ addEnergy(1); meta.push('Energy kept'); } else meta.push('Over time: −1 energy'); if(SES.run%5===0){ addEnergy(2); SES.eBonus+=2; meta.push('5 in a row: +2 energy'); } }
    else { SES.run=0; meta.push('−1 energy'); } }
  if(!S.relaxed||SES.forceT) meta.push((onTime?'':'Over time · ')+Math.floor(secs/60)+':'+pad(secs%60));
  // stats: only first attempts count toward accuracy
  if(first && it.t!=='m'){ S.ans++; const sk=it.stat||it.unit; const us=S.unit[sk]||(S.unit[sk]={r:0,n:0}); us.n++; if(ok){S.right++;us.r++;} }
  if(it.fixed && first){ S.bank=S.bank||{}; S.bank[it.id]=ok?1:0; }
  if(first) qsMark(it, ok);
  if(it.word && !ok){ S.cards[it.word]=Object.assign({seen:0}, S.cards[it.word], {box:0, due:today()}); }
  else if(it.word && ok && !S.cards[it.word]){ const d=new Date(); d.setDate(d.getDate()+1); S.cards[it.word]={box:1, due:dkey(d), seen:1}; }

      document.getElementById('fC').onclick=()=>{LS.hidden=true;LS.innerHTML='';document.body.style.overflow='';render();}; return; }

    LS.innerHTML=`<div class="hd"><button class="x" id="lsX" aria-label="Quit">${I.x}</button><div class="prog"><i style="width:${pct}%"></i></div><span class="pill">${q.length} left</span></div>
      <div class="bd"><div class="in"><p class="muted" style="margin:0;text-align:center">Say the meaning out loud, then tap the card.</p><div class="fc" id="fc" role="button" tabindex="0" aria-label="Flip card"><div class="inner"><div class="face"><div class="wd">${w[0]}</div><div class="pos">${w[1]}</div></div><div class="face back"><div class="pos">${w[0]} · ${w[1]}</div><div class="df">${esc(w[2])}</div><div class="ex">“${esc(w[3])}”</div></div></div></div></div></div>
      <div class="ft"><div class="in"><div class="row" id="fcBtns" hidden><button class="btn bad" id="fA">Still learning</button><button class="btn good" id="fK">Learned</button></div><button class="btn" id="fF">Show meaning</button></div></div>`;
    const fc=document.getElementById('fc'); const flip=()=>{ fc.classList.add('flip'); document.getElementById('fcBtns').hidden=false; document.getElementById('fF').hidden=true; };
    fc.onclick=flip; fc.onkeydown=e=>{ if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();} }; document.getElementById('fF').onclick=flip;
    document.getElementById('lsX').onclick=()=>{ save(); LS.hidden=true; LS.innerHTML=''; document.body.style.overflow=''; render(); };
    const grade=(knew)=>{ const c=Object.assign({box:0,due:'',seen:0}, S.cards[w[0]]); c.seen++; n++;
      if(knew && !again.has(w[0])){ c.box=Math.min(5,Math.max(4,c.box+1)); sfx.good(); } else if(!knew){ c.box=0; again.add(w[0]); q.push(w); sfx.bad(); } else { sfx.good(); }
      const d=new Date(); d.setDate(d.getDate()+INTV[c.box]); c.due=dkey(d); S.cards[w[0]]=c; q.shift(); reviewed++; save(false); draw(); };
    document.getElementById('fA').onclick=()=>grade(false); document.getElementById('fK').onclick=()=>grade(true);
  };
  draw();
}

let OBD=0;
function officialCard(){ if(!BANK||!BANK.length) return '';
  const done=S.bank||{}; const units=[...new Set(BANK.map(x=>x.unit))];
  const row=u=>{ const its=BANK.filter(x=>x.unit===u&&(!OBD||x.d===OBD)); if(!its.length) return ''; const n=its.filter(x=>x.id in done).length, r=its.filter(x=>done[x.id]===1).length;
    return `<button class="vbtn" data-ob="${u}" style="justify-content:space-between;width:100%"><span>${UNIT[u].title}</span><span class="pill ${n&&r/n>=.8?'good':''}">${n}/${its.length}${n?` · ${Math.round(r/n*100)}%`:''}</span></button>`; };
  return `<div class="card stack" style="gap:10px;border-color:var(--plum)"><p class="lbl" style="margin:0;color:var(--plum)">Official SAT practice</p><p style="margin:0" class="muted">${BANK.length} real questions from the College Board question bank, shared by your teacher. Five per round, in test order, with the official explanations.</p>
   <div class="seg" id="obD">${[[0,'All'],[1,'Easy'],[2,'Medium'],[3,'Hard']].map(([d,l])=>`<button data-od="${d}" aria-pressed="${OBD===d}">${l}</button>`).join('')}</div>
   <div class="stack" style="gap:8px">${units.map(row).join('')}</div></div>`; }
function startOfficial(u){ const done=S.bank||{}; const pool=BANK.filter(x=>x.unit===u&&(!OBD||x.d===OBD));
  const next=pool.filter(x=>!(x.id in done)).concat(pool.filter(x=>done[x.id]===0), pool.filter(x=>done[x.id]===1));

  return `<div class="week">${days.map((d,i)=>`<div class="d ${i===6?'today':''}"><em>${vals[i]||''}</em><i style="height:${Math.round(vals[i]/mx*100)}%"></i><span>${'SMTWTFS'[d.getDay()]}</span></div>`).join('')}</div>`; }
function skillRows(unitStats){ return SKILLS.map(u=>{ const s=unitStats[u.id]; const p=s&&s.n?accPct(s.r,s.n):null; const col=p==null?'var(--line)':p>=80?'var(--good)':p>=60?'var(--saffron)':'var(--bad)';

function diffRows(ds){ return [1,2,3].map(d=>{ const s=(ds||{})[d]; const p=s&&s.n?accPct(s.r,s.n):null; const col=p==null?'var(--line)':p>=80?'var(--good)':p>=60?'var(--saffron)':'var(--bad)';

const MLV={2:{mix:[2,4,2],pass:6,tf:1,txt:'a mix of Easy, Medium and Hard'},3:{mix:[0,4,4],pass:6,tf:.9,txt:'Medium and Hard, with 10% less time'},4:{mix:[0,2,6],pass:7,tf:.8,force:1,txt:'mostly Hard, with 20% less time'},5:{mix:[0,0,8],pass:7,tf:.75,force:1,txt:'all Hard, with 25% less time'}};
const MAXLV=UNITS.length*5, GMAP={bd:[1], fss:[0,2]};
function unitDone(u,st=S){ return LESSONS.filter(l=>l.unit===u).every(l=>(st.lessons||{})[l.id]); }
function mLevel(u,st=S){ return unitDone(u,st) ? Math.max(1,((st.mast||{})[u.id]||{}).lv||0) : 0; }
function totalLv(st=S){ return UNITS.reduce((a,u)=>a+mLevel(u,st),0); }
function unitPool(u, mc, pub){ const ok=it=>it.d && (mc ? (!it.t && it.c && it.c.length===4) : (!it.t || it.t==='tap'));
  let p=u.lessons.flat().concat(u.extra||[]).filter(ok);
  (GMAP[u.id]||[]).forEach(g=>GRAMMAR.filter(x=>x.grp===g).forEach(x=>{ p=p.concat(x.items.filter(ok)); }));
  if(BANK && !pub) p=p.concat(BANK.filter(x=>x.unit===u.id && ok(x)));
  return p; }
function pickD(pool, want, avoid, taken=new Set()){ const out=[];

  return out; }

   ${lv===0?`<p class="muted">Finish all ${u.lessons.length} lessons in this unit to reach Level 1. Then you can climb to Level 5 with harder challenges.</p><button class="btn ghost" data-close>OK</button>`:
   `<p>${lv>=5?'You have mastered this skill. Replay the Master challenge any time to stay sharp.':`You are at <b>Level ${lv} · ${LVN[lv]}</b>. Pass a challenge to reach <b>Level ${nx} · ${LVN[nx]}</b>.`}</p>
    <div class="tipbox" style="${tone}"><b>Level ${nx} challenge</b>8 questions, ${spec.txt}. Get ${spec.pass} of 8 right on the first try${timed?', within the timer':''}.${spec.force&&S.relaxed?' The timer stays on at this level, even in Relaxed mode.':''} Costs no energy.</div>

const MOCK_BP=[['wic',4],['ts',2],['ct',2],['ci',2],['ev',2],['qe',1],['inf',2],['bd',4],['fss',3],['tr',3],['rs',2]];

const MTAB={hard:[[0,200],[20,480],[28,540],[34,580],[40,640],[44,680],[48,720],[50,740],[52,770],[54,800]], easy:[[0,200],[4,220],[8,270],[12,320],[16,360],[20,400],[24,430],[28,460],[32,490],[36,520],[40,560],[44,600],[54,640]]};
// Raw score to 200-800, modelled on published digital SAT curves: the harder Module 2 unlocks the top of the range.
function mockScale(right, n, route){ const x=Math.max(0,Math.min(54,right*54/Math.max(1,n))); const t=MTAB[route]||MTAB.easy;

function hashStr(s){ let h=1779033703^s.length; for(let i=0;i<s.length;i++){ h=Math.imul(h^s.charCodeAt(i),3432918353); h=h<<13|h>>>19; } return h>>>0; }
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function dailyItems(day=today()){ const r=rng(hashStr('qadam-'+day));
  const pool=UNITS.flatMap(u=>unitPool(u,true,true).map(it=>[u.id,it])).sort((a,b)=>a[1].id<b[1].id?-1:1); const out=[], used=new Set();
  for(const d of [2,2,3,3,3]){ const c=pool.filter(([u,it])=>it.d===d && !used.has(u)); if(!c.length) continue; const [u,it]=c[Math.floor(r()*c.length)]; out.push(it); used.add(u); }
  return out; }

    <div class="tile" style="color:var(--turq)">${I.book}<div><b style="color:var(--ink)">${ev.length}</b><span>rounds finished</span></div></div><div class="tile" style="color:var(--plum)">${I.gauge}<div><b style="color:var(--ink)">${s1==null?'–':s1}</b><span>est. score${s0!=null&&s1!=null&&s1!==s0?` (${s1>s0?'+':''}${s1-s0})`:''}</span></div></div></div>
   ${bd.length?`<p style="margin:0"><b>New badges:</b> ${bd.map(b=>b[1]).join(', ')}</p>`:''}
   <p class="muted">${days>=5?'Keep this rhythm and your score will follow.':'Try to practice on at least 5 days this week. Even 10 minutes counts.'} Har kuni bir qadam.</p><button class="btn" data-close>Start this week</button>`); }

/* ---------- Teacher's class settings: announcement, homework, weekly goal ---------- */
let CLS=null, CLS_MSG='';
async function loadClassDoc(){ try{ const s=await DB.doc('class/main').get(); CLS=s.exists?(s.data()||{}):{}; }catch(e){ CLS=OWNER?{}:null; } if(LS.hidden) render(); }
async function saveClassDoc(patch){ const next=Object.assign({},CLS||{},patch); try{ await DB.doc('class/main').set(next); CLS=next; CLS_MSG='Saved. Students see it the next time they open the app.'; }catch(e){ CLS_MSG='Could not save ('+((e&&e.code)||'error')+'). Paste the new database rules into Firebase first (see the note in the pull request).'; } vClass(); }
function annCard(){ const a=CLS&&CLS.ann; if(!a||!a.text||(!OWNER&&S.annSeen===a.at)) return '';
  return `<div class="card ann"><p class="lbl" style="margin:0 0 6px;color:var(--cobalt)">From your teacher</p><p style="margin:0;white-space:pre-wrap">${esc(a.text)}</p>${OWNER?'':'<button class="btn ghost sm" id="annOk" style="margin-top:10px">Got it</button>'}</div>`; }
const hwUnits=hw=>(hw.units||[]).map(id=>UNIT[id]).filter(Boolean);
const fmtDay=k=>{ try{ return new Date(k+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}); }catch(e){ return k; } };
function hwCard(){ const hw=CLS&&CLS.hw; if(!hw||!hw.id||OWNER) return ''; const d=(S.hwDone||{})[hw.id]; const late=!d&&hw.due&&hw.due<today();
  return `<div class="card stack" style="gap:10px;border-color:${d?'var(--good)':late?'var(--bad)':'var(--saffron)'}"><p class="lbl" style="margin:0">Homework from your teacher</p>
   <p style="margin:0"><b>${hw.n} questions</b> on ${hwUnits(hw).map(u=>u.title).join(', ')}${hw.due?` · due ${fmtDay(hw.due)}`:''}${late?' · <b style="color:var(--bad)">late</b>':''}</p>${hw.note?`<p class="muted" style="margin:0">${esc(hw.note)}</p>`:''}
   ${d?`<p style="margin:0;color:var(--good);font-weight:800">Done · ${d.r}/${d.n} right on the first try</p>`:`<button class="btn saff" id="hwGo">Start homework</button>`}</div>`; }
function startHw(){ const hw=CLS&&CLS.hw; if(!hw) return; const us=hwUnits(hw); if(!us.length) return; const per=Math.ceil(hw.n/us.length);
  const items=shuffle(us.flatMap(u=>shuffle(unitPool(u,false)).slice(0,per))).slice(0,hw.n); if(items.length) startSession('hw', items, null, {hw}); }
function attention(rows){ const now=Date.now(), hw=CLS&&CLS.hw; const out=[];
  rows.forEach(r=>{ const s=r.s, why=[]; const days=r.upd?Math.floor((now-r.upd)/864e5):99;
    if(days>=3) why.push(['away', days>=99?'Never practiced':`No practice for ${days} days`]);
    if((s.streak||0)>=3 && !r.live) why.push(['streak', `Lost a ${s.streak}-day streak`]);
    const tr=trend(Object.assign({score:450,sN:0,sHist:{}},r.st)); if(tr&&tr.g<=-30) why.push(['drop', `Score down ${Math.abs(Math.round(tr.g))} this week`]);
    if((s.ans||0)>=20 && r.acc!=null && r.acc<55) why.push(['acc', `Accuracy ${r.acc}%`]);
    if((s.mistakes||0)>=15) why.push(['mis', `${s.mistakes} unfixed mistakes`]);
    if(hw&&hw.id&&hw.due&&hw.due<today()&&!((r.st.hwDone||{})[hw.id])) why.push(['hw','Missed homework']);
    if(why.length) out.push({r, why}); });
  return out.sort((a,b)=>b.why.length-a.why.length); }
function nudgeText(r, why){ const first=esc(r.name).split(' ')[0]; const k=why[0][0]; const link=location.href.split('#')[0];
  const body={away:`we miss you on Qadam! Just 10 minutes today will get you back on track.`, streak:`your ${r.s.streak}-day streak ended, but you can start a new one today. One lesson is enough.`, drop:`your estimated score dipped a little this week. A round of "Fix my weak spot" in the Review tab will help a lot.`, acc:`try slowing down a little and reading every answer choice. Accuracy beats speed. The Review tab has your mistakes ready to fix.`, mis:`you have ${r.s.mistakes} mistakes waiting in the Review tab. Fixing them is the fastest way to raise your score.`, hw:`your homework on Qadam is still waiting. It only takes about 10 minutes.`}[k];
  return `Hi ${first}, ${body} ${link}\nHar kuni bir qadam!`; }
function nudgeSheet(r, why){ const t=nudgeText(r, why);
  openModal(`<h2>Nudge ${esc(r.name)}</h2><p class="muted">Copy this and send it on Telegram or by text. You can edit it first.</p><textarea class="field" id="ngT" rows="5">${esc(t)}</textarea><div class="row"><button class="btn ghost" data-close>Close</button><button class="btn" id="ngC">Copy message</button></div>`);
  document.getElementById('ngC').onclick=async e=>{ const v=document.getElementById('ngT').value; try{ await navigator.clipboard.writeText(v); e.target.textContent='Copied'; }catch(x){ const ta=document.getElementById('ngT'); ta.select(); e.target.textContent='Select and copy'; } }; }
function attentionCard(rows){ const a=attention(rows);
  return `<div class="card" style="border-color:${a.length?'var(--saffron)':'var(--line)'}"><p class="lbl">Needs attention${a.length?' · '+a.length:''}</p>${a.length?`<div class="stack" style="gap:10px">${a.map((x,i)=>`<div class="attn"><div style="min-width:0"><b>${esc(x.r.name)}</b><div class="seg" style="gap:4px;margin-top:4px">${x.why.map(w=>`<span class="pill ${w[0]==='away'||w[0]==='hw'?'bad':''}">${esc(w[1])}</span>`).join('')}</div></div><button class="btn sm ghost" data-ng="${i}">Nudge</button></div>`).join('')}</div>`:`<p class="muted" style="margin:0">Everyone is on track right now.</p>`}</div>`; }
function teachCard(rows){ const c=CLS||{}, hw=c.hw||{}; const sel=new Set(LFORM_HW||hw.units||[]); const done=hw.id?rows.filter(r=>(r.st.hwDone||{})[hw.id]):[];
  return `<div class="card stack" style="gap:12px"><p class="lbl" style="margin:0">Message, homework and class goal</p>
   <label for="tAnn" style="font-weight:700">Announcement on every student's home screen</label><textarea class="field" id="tAnn" rows="3" maxlength="400" placeholder="e.g. Quiz on Thursday: bring a pencil!">${esc((c.ann&&c.ann.text)||'')}</textarea>
   <div class="row"><button class="btn sm ghost" id="tAnnX">Remove</button><button class="btn sm" id="tAnnS">Post announcement</button></div>
   <hr class="hr">
   <p style="margin:0;font-weight:700">Homework</p>
   ${hw.id?`<div class="tipbox" style="--tone:var(--saffron)"><b>Current · due ${hw.due?fmtDay(hw.due):'any time'}</b>${hw.n} questions on ${hwUnits(hw).map(u=>u.title).join(', ')}<br><span style="font-weight:700">${done.length} of ${rows.length} done</span>${done.length?`: ${done.map(r=>esc(r.name)+' ('+r.st.hwDone[hw.id].r+'/'+r.st.hwDone[hw.id].n+')').join(', ')}`:''}</div>`:''}
   <div class="seg" id="tHwU">${UNITS.map(u=>`<button data-u="${u.id}" aria-pressed="${sel.has(u.id)}" style="padding:6px 10px;font-size:13px">${u.title}</button>`).join('')}</div>
   <div class="row" style="align-items:center"><label style="font-weight:700;flex:none">Questions</label><div class="seg" id="tHwN">${[5,10,15,20].map(n=>`<button data-n="${n}" aria-pressed="${(LFORM_N||hw.n||10)===n}" style="padding:6px 10px">${n}</button>`).join('')}</div></div>
   <div class="row" style="align-items:center"><label for="tHwD" style="font-weight:700;flex:none">Due</label><input class="field" type="date" id="tHwD" value="${esc(hw.due||'')}"></div>
   <input class="field" id="tHwNote" maxlength="200" placeholder="Optional note, e.g. Review Tuesday's lesson first" value="${esc(hw.note||'')}">
   <div class="row"><button class="btn sm ghost" id="tHwX">Clear homework</button><button class="btn sm" id="tHwS">${hw.id?'Set new homework':'Set homework'}</button></div>
   <hr class="hr">
   <div class="row" style="align-items:center"><label for="tGoal" style="font-weight:700;flex:none">Weekly class goal (XP)</label><input class="field" type="number" min="100" step="100" id="tGoal" style="min-width:96px" value="${c.goal||''}" placeholder="${Math.max(300,150*Math.max(1,(BOARD||[]).length))}"><button class="btn sm" id="tGoalS" style="flex:none">Save</button></div>
   ${CLS_MSG?`<p class="muted" style="margin:0;font-size:14px">${esc(CLS_MSG)}</p>`:''}</div>`; }
let LFORM_HW=null, LFORM_N=null;
function wireTeach(rows){ const g=id=>document.getElementById(id); if(!g('tAnnS')) return;
  const a=attention(rows); view.querySelectorAll('[data-ng]').forEach(b=>b.onclick=()=>{ const x=a[+b.dataset.ng]; nudgeSheet(x.r, x.why); });
  g('tAnnS').onclick=()=>{ const t=g('tAnn').value.trim(); if(t) saveClassDoc({ann:{text:t, at:Date.now()}}); };
  g('tAnnX').onclick=()=>saveClassDoc({ann:null});
  g('tHwU').onclick=e=>{ const b=e.target.closest('[data-u]'); if(!b) return; const s=new Set(LFORM_HW||((CLS||{}).hw||{}).units||[]); s.has(b.dataset.u)?s.delete(b.dataset.u):s.add(b.dataset.u); LFORM_HW=[...s]; b.setAttribute('aria-pressed', String(s.has(b.dataset.u))); };
  g('tHwN').onclick=e=>{ const b=e.target.closest('[data-n]'); if(!b) return; LFORM_N=+b.dataset.n; g('tHwN').querySelectorAll('[data-n]').forEach(x=>x.setAttribute('aria-pressed', String(x===b))); };
  g('tHwS').onclick=()=>{ const units=LFORM_HW||((CLS||{}).hw||{}).units||[]; if(!units.length){ CLS_MSG='Pick at least one skill for the homework.'; return vClass(); }
    saveClassDoc({hw:{id:'hw'+Date.now().toString(36), units, n:LFORM_N||((CLS||{}).hw||{}).n||10, due:g('tHwD').value||'', note:g('tHwNote').value.trim(), at:Date.now()}}); LFORM_HW=null; LFORM_N=null; };
  g('tHwX').onclick=()=>saveClassDoc({hw:null});
  g('tGoalS').onclick=()=>{ const v=Math.max(0,Math.round(+g('tGoal').value||0)); saveClassDoc({goal:v||null}); };
}

/* ---------- welcome ---------- */
function welcome(){
  S.welcomed=true; save(false);
  openModal(`<div style="text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center"><svg viewBox="0 0 24 24" width="64" height="64" aria-hidden="true" style="color:var(--cobalt)"><path fill="currentColor" d="M12 1.5l2.6 4.2 4.8-1.1-1.1 4.8 4.2 2.6-4.2 2.6 1.1 4.8-4.8-1.1L12 22.5l-2.6-4.2-4.8 1.1 1.1-4.8L1.5 12l4.2-2.6-1.1-4.8 4.8 1.1z"/><circle cx="12" cy="12" r="3.6" fill="var(--surface)"/></svg><h2>Welcome to Qadam</h2><p class="muted"><i>Qadam</i> means “step” in Uzbek.</p></div>
  <p>Nobody climbs a mountain in one jump. You climb it one step at a time, and the SAT works the same way. A few focused minutes today and a few more tomorrow add up to a score you will be proud of.</p>
  <div class="stack" style="gap:8px">
   <div class="tipbox" style="--tone:var(--cobalt)"><b>Learn</b>Follow the path through every Reading and Writing skill, one short lesson at a time.</div>
   <div class="tipbox" style="--tone:var(--jade)"><b>Words</b>Build your SAT vocabulary with word sets, flashcards, and a daily quiz.</div>
   <div class="tipbox" style="--tone:var(--plum)"><b>Train</b>Time your reading in the Reading Gym and master every SAT grammar rule in the Grammar Guide.</div>
   <div class="tipbox" style="--tone:var(--coral)"><b>Review</b>Every mistake is a lesson. Fix yours here and refill your energy.</div>
   <div class="tipbox" style="--tone:var(--plum)"><b>Your SAT score</b>Every answer updates your estimated SAT Reading and Writing score, out of 800. Beat the timer to keep your energy.</div>
  </div>
  <p>Set a daily goal and keep your streak alive. You do not have to be perfect. You just have to keep stepping forward.</p>
  <p style="text-align:center;font-weight:800;color:var(--cobalt)">Har kuni bir qadam. One step every day.</p>
  <button class="btn" data-close>Take my first step</button>`);
}

  e:'Because schooling was held equal, the difference points to something extra, such as having books at home. The text does not say schooling has no effect.'},
 {d:3,p:'Some songbirds learn their songs by imitating adults during a sensitive period early in life. In one experiment, young birds raised in silence during this period later produced simple, unusual songs. When those birds\' offspring were raised hearing only their parents\' unusual songs, each new generation\'s songs became more similar to the normal songs of wild birds. This finding suggests that ______',
  q:Q_LOGIC, c:['some features of the species\' typical song may emerge over generations even without a normal model to copy.','young birds cannot learn songs from their parents.','songbirds raised in silence never produce any song at all.','wild birds learn their songs more slowly than birds raised in laboratories.'],
  e:'The songs drifted back toward normal across generations without a normal model, so some typical features must arise on their own. The text says the isolated birds did sing, so the "never produce any song" choice contradicts it.'},
 {d:3,p:'Economic historians have noted that cities with older universities tend to have more new technology companies today. Yet when researchers examined cities where universities were founded mainly for political reasons, such as being placed in a ruler\'s favorite town, those cities also developed more technology companies than similar cities without universities. Because the location of these universities was not chosen for economic reasons, the findings suggest that ______',
  q:Q_LOGIC, c:['universities themselves may help cause the growth of technology companies, rather than simply being located in already prosperous cities.','technology companies prefer cities that rulers favored.','older universities produce fewer graduates than newer ones.','political leaders usually chose cities with strong economies for new universities.'],
  e:'If location was chosen for non-economic reasons, the universities were not just following prosperity, so they likely contributed to it. The choice about rulers picking strong economies contradicts the text.'},
],[
 {d:2,p:'Snow leopards rarely attack people, and they generally avoid areas with heavy human activity. In one mountain region, though, herders reported more snow leopard attacks on their livestock after wild goats, the leopards\' main prey, declined because of hunting. These reports suggest that ______',
  q:Q_LOGIC, c:['snow leopards may turn to livestock when their usual prey becomes scarce.','snow leopards prefer livestock to wild goats.','hunting has increased the number of snow leopards.','herders in the region have stopped keeping livestock.'],
  e:'Attacks rose after wild prey declined, which points to leopards replacing lost prey. Nothing says they prefer livestock in general.'},
 {d:3,p:'Linguists studying a language spoken in the Pamir Mountains found that speakers in isolated valleys preserved older word forms that had disappeared in valleys linked by roads. In one valley, a road was built only twenty years ago, yet older speakers there still use the older forms while younger speakers mostly do not. This pattern suggests that ______',
  q:Q_LOGIC, c:['increased contact with other communities may speed the loss of older word forms, especially among younger speakers.','older word forms are easier to learn than newer ones.','the language is no longer spoken in any isolated valley.','roads were built first in the valleys where older forms survived.'],
  e:'The change appears soon after the road arrives and mostly among younger speakers, linking contact to faster change.'},
 {d:1,p:'A bakery in Bukhara noticed that its bread sold out by noon on weekdays but was often left over on Sundays, when many offices were closed. The manager therefore decided to ______',
  q:Q_LOGIC, c:['bake less bread on Sundays.','close the bakery on weekdays.','raise the price of bread on weekdays only.','stop selling bread altogether.'],
  e:'Bread is left over on Sundays, so baking less on that day is the logical response.'},
 {d:3,p:'Astronomers estimate the ages of some stars by measuring how fast they spin, since stars like the Sun gradually slow down as they age. However, a team recently found that once such stars reach middle age, their spin slows much less than expected. If the team is correct, then for older Sun-like stars, ages estimated from spin alone are likely ______',
  q:Q_LOGIC, c:['too low, because these stars spin faster than the standard method assumes for their age.','too high, because these stars spin more slowly than expected.','exact, because spin is the most reliable measure of age.','impossible to calculate, because these stars do not spin.'],
  e:'If older stars keep spinning faster than the method assumes, the method will read them as younger than they are, so the estimates are too low.'},
 {d:2,p:'Researchers gave two groups of shoppers the same coupon. For the first group, the coupon said "Save 2,000 som"; for the second, it said "Save 10%," which was the same amount. Shoppers in the first group were much more likely to use the coupon. The results suggest that ______',
  q:Q_LOGIC, c:['the way a discount is described can influence whether people use it, even when its value is the same.','shoppers prefer coupons that offer larger discounts.','percentages are always more persuasive than exact amounts.','most shoppers do not use coupons.'],
  e:'The value was identical, so only the wording differed, and the wording changed behavior. The "always more persuasive" choice reverses the result.'},
]],
qe:[[
 {d:1,p:tbl('Students in a school science fair',['Grade','Projects entered','Projects that won a prize'],[['9','24','3'],['10','30','5'],['11','18','6'],['12','12','4']])+'<p>A teacher notes that grade 10 entered the most projects in the science fair, entering ______</p>',
  q:'Which choice most effectively uses data from the table to complete the statement?', c:['30 projects.','24 projects.','5 projects.','12 projects.'],
  e:'In the "Projects entered" column, grade 10 has 30, the largest number. Five is the number of grade 10 projects that won prizes.'},
 {d:2,p:bars('Average daily screen time of surveyed teenagers, 2016–2024','Hours per day',[['2016',4.1],['2018',4.9],['2020',7.2],['2022',6.6],['2024',6.4]])+'<p>A student claims that teenagers\' screen time rose sharply around 2020 and then declined only slightly.</p>',
  q:'Which choice most effectively uses data from the graph to support the claim?', c:['Screen time jumped from 4.9 hours in 2018 to 7.2 hours in 2020, then fell to 6.4 hours by 2024.','Screen time was 4.1 hours in 2016.','Screen time was higher in 2022 than in 2018.','Screen time in 2024 was 6.4 hours.'],
  e:'The claim has two parts, a sharp rise and a small decline. Only one choice gives data for both.'},
 {d:2,p:tbl('Seed germination after 14 days',['Soil type','Seeds planted','Seeds that sprouted'],[['Sandy','50','21'],['Clay','50','17'],['Loam','50','41'],['Peat','50','33']])+'<p>A gardener hypothesized that loam soil would produce the highest rate of sprouting among the four soils tested.</p>',
  q:'Which choice best describes data from the table that support the gardener\'s hypothesis?', c:['Of the 50 seeds planted in each soil, 41 sprouted in loam, more than in any other soil.','Seeds planted in clay sprouted less often than seeds in sandy soil.','The same number of seeds was planted in each soil type.','33 seeds sprouted in peat.'],
  e:'Support must show loam had the most sprouting. With equal seeds planted, 41 is the highest count.'},
 {d:3,p:tbl('Bird species observed before and after a wetland restoration',['Group','2015 (before)','2023 (after)'],[['Wading birds','6','14'],['Ducks','9','11'],['Songbirds','22','20'],['Birds of prey','4','5']])+'<p>Ecologists restored a drained wetland in 2016 by allowing water to flow back into it. They expected the restoration to benefit especially those birds that feed in shallow water. Their expectation is supported by the observation that ______</p>',
  q:'Which choice most effectively uses data from the table to complete the statement?', c:['the number of wading bird species more than doubled, rising from 6 to 14, while other groups changed little.','songbirds remained the group with the most species in both years.','the number of bird-of-prey species rose from 4 to 5.','the number of songbird species fell from 22 to 20.'],
  e:'Wading birds feed in shallow water. Their large increase, compared with small changes elsewhere, matches the expectation.'},
 {d:3,p:bars('Share of electricity from solar power in one country','Percent',[['2014',1],['2016',2],['2018',4],['2020',8],['2022',15]])+'<p>An energy analyst argues that solar power\'s share of the country\'s electricity has not merely grown but has grown at an accelerating pace.</p>',
  q:'Which choice most effectively uses data from the graph to support the analyst\'s argument?', c:['The share roughly doubled every two years, so each increase was larger than the one before it, from 1 point to 7 points.','The share was higher in 2022 than in 2014.','In 2018, solar power provided 4 percent of electricity.','Solar power provided less than 20 percent of electricity in every year shown.'],
  e:'"Accelerating" means the increases themselves get larger. Only one choice compares the size of the increases.'},
],[
 {d:1,p:tbl('Visitors to three museums in one week',['Museum','Weekday visitors','Weekend visitors'],[['History','1,200','2,600'],['Art','900','2,100'],['Science','1,500','3,400']])+'<p>According to the table, the museum with the most weekend visitors was the ______</p>',
  q:'Which choice most effectively uses data from the table to complete the statement?', c:['Science museum, with 3,400 weekend visitors.','History museum, with 2,600 weekend visitors.','Science museum, with 1,500 weekend visitors.','Art museum, with 2,100 weekend visitors.'],
  e:'In the weekend column, 3,400 is the largest value, and it belongs to the Science museum. 1,500 is its weekday figure.'},
 {d:2,p:tbl('Average test scores by study method',['Study method','Score after 1 day','Score after 1 week'],[['Rereading notes','78','52'],['Practice testing','76','71'],['Highlighting','74','49']])+'<p>A student claims that practice testing leads to better long-term memory than the other two methods, even though it does not produce the highest score right away.</p>',
  q:'Which choice most effectively uses data from the table to support the claim?', c:['Practice testing scored 76 after one day, below rereading\'s 78, but 71 after one week, far above rereading\'s 52 and highlighting\'s 49.','Rereading notes produced the highest score after one day.','Highlighting produced the lowest scores at both times.','All three methods produced lower scores after one week than after one day.'],
  e:'The claim has two parts: not the best right away, but the best later. Only one choice addresses both.'},
 {d:3,p:tbl('Households with internet access, by region (%)',['Region','2015','2020','2025'],[['North','40','62','81'],['South','55','68','74'],['East','35','58','79'],['West','60','70','76']])+'<p>An economist claims that the regions that had the lowest internet access in 2015 made the largest gains over the following ten years.</p>',
  q:'Which choice most effectively uses data from the table to support the claim?', c:['North and East, which had the lowest access in 2015 (40% and 35%), gained 41 and 44 percentage points by 2025, while South and West gained 19 and 16.','West had the highest access in 2015.','All four regions had more than 70% access by 2025.','South\'s access rose from 55% to 74% between 2015 and 2025.'],
  e:'The claim links low starting levels with large gains. Only one choice compares starting levels with the size of the gains.'},
 {d:2,p:bars('Average monthly rainfall in one city (mm)','Millimeters',[['Jan',45],['Mar',70],['May',35],['Jul',5],['Sep',10],['Nov',40]])+'<p>A travel guide recommends visiting the city in summer for those who want to avoid rain, noting that in July the city receives only ______</p>',
  q:'Which choice most effectively uses data from the graph to complete the statement?', c:['5 millimeters of rain on average.','70 millimeters of rain on average.','10 millimeters of rain in March.','45 millimeters of rain on average.'],
  e:'The July bar shows 5 millimeters, the lowest value on the graph.'},
 {d:3,p:tbl('Results of a fertilizer trial on wheat',['Treatment','Yield (tons per hectare)','Water used (relative to control)'],[['No fertilizer (control)','3.1','100%'],['Fertilizer A','4.6','125%'],['Fertilizer B','4.4','101%']])+'<p>Farmers in a dry region must limit water use. An agronomist recommends Fertilizer B over Fertilizer A for these farmers, noting that ______</p>',
  q:'Which choice most effectively uses data from the table to complete the statement?', c:['Fertilizer B produced nearly the same yield as Fertilizer A (4.4 versus 4.6 tons per hectare) while using about the same amount of water as the control.','Fertilizer A produced the highest yield of any treatment.','both fertilizers produced higher yields than the control.','the control used 100% of the water.'],
  e:'For dry regions, the case for B must combine yield and water. The correct choice shows B is close in yield and uses much less water than A.'},
]],
};

/* ---------- Test-style lessons for Craft and Structure, Expression of Ideas, and Standard English (original) ---------- */
const Q_RS = 'Which choice most effectively uses relevant information from the notes to accomplish this goal?';
const MORE3 = {
wic:[
 {d:1,p:'Many desert plants open their pores only at night, when the air is cooler. This habit allows them to ______ water that would otherwise be lost to the heat of the day.',
  q:Q_WORD, c:['conserve','spend','observe','release'],
  e:'Opening pores at night prevents water loss, so the plants "conserve," or save, water. "Release" and "spend" mean the opposite.'},
 {d:2,p:'Although the novelist\'s early books sold poorly, critics now regard them as ______ works that shaped the style of a whole generation of writers.',
  q:Q_WORD, c:['seminal','obscure','derivative','trivial'],
  e:'Works that "shaped the style of a whole generation" are "seminal," meaning highly influential. "Derivative" means copied from others, the opposite of shaping others.'},
 {d:2,p:'The following text is from a 1909 short story.<br><br>The old clockmaker did not hurry. He held each gear up to the window, turning it slowly in the light, as if the smallest scratch might <u>betray</u> a lifetime of careless work.',
  q:'As used in the text, what does the word "betray" most nearly mean?', c:['reveal','abandon','deceive','sell'],
  e:'A scratch that might "betray" careless work would show, or "reveal," it. The other meanings of "betray" do not fit a scratch on a gear.'},
 {d:3,p:'Historian Kamola Ergasheva cautions that the merchant\'s diary, though vivid, should be read with care: written years after the events it describes, it may reflect the merchant\'s later opinions as much as his ______ experiences.',
  q:Q_WORD, c:['contemporaneous','fabricated','subsequent','collective'],
  e:'The contrast is between later opinions and experiences from the time of the events. "Contemporaneous" means happening at the same time. "Subsequent" means later, the opposite.'},
 {d:3,p:'The new species of frog is so ______ that researchers spent three seasons searching the forest before they recorded a single individual.',
  q:Q_WORD, c:['elusive','abundant','vocal','conspicuous'],
  e:'Three seasons of searching to find one frog shows the species is hard to find: "elusive." "Conspicuous" means easy to notice.'},
 {d:2,p:'Engineers did not abandon the original bridge design; instead, they ______ it, adding a second support tower while keeping the shape of the deck the same.',
  q:Q_WORD, c:['modified','rejected','duplicated','concealed'],
  e:'They kept the design but added a tower, so they changed it slightly: "modified." "Rejected" contradicts "did not abandon."'},
],
ts:[
 {d:2,p:'Many people picture glaciers as frozen and still. In fact, glaciers flow. Under their own enormous weight, the ice at the bottom slowly deforms, and the whole mass can creep downhill by several meters a day. Some glaciers even "surge," suddenly moving many times faster for months at a time.',
  q:'Which choice best describes the overall structure of the text?', c:['It presents a common belief about glaciers and then corrects it with details about how glaciers move.','It compares two different types of ice and explains why one melts faster.','It describes a scientific debate and then explains why it remains unresolved.','It tells the story of the discovery of glaciers by early explorers.'],
  e:'The text begins with the belief that glaciers are still, then corrects it ("In fact, glaciers flow") and adds supporting details.'},
 {d:2,p:'The following text is from a 1913 novel. Aziza has just finished her first day teaching in a village school.<br><br>She had planned every minute of the lesson, but the children had questions she had never imagined. By evening she was exhausted, and yet, walking home under the apricot trees, she found herself already planning tomorrow.',
  q:'Which choice best describes the function of the final sentence in the text?', c:['It shows that despite her tiredness, Aziza remains eager to continue teaching.','It explains why Aziza decided to stop teaching.','It describes the questions the children asked.','It suggests that Aziza had not prepared for her lesson.'],
  e:'"And yet" turns from her exhaustion to her eagerness: she is already planning the next day.'},
 {d:3,p:'Some economists argue that raising the minimum wage reduces employment, because businesses hire fewer workers when labor costs more. A study of neighboring regions, one of which raised its minimum wage while the other did not, found no significant difference in employment over the next three years. The authors note, however, that their data cover only restaurants, where demand for workers may be unusually steady.',
  q:'Which choice best describes the function of the final sentence in the overall structure of the text?', c:['It acknowledges a limitation that may affect how widely the study\'s findings apply.','It presents the main conclusion of the study.','It restates the economists\' argument mentioned at the beginning.','It describes the method the researchers used to choose the two regions.'],
  e:'"However" introduces a caution: the data cover only one industry, which limits how far the results can be generalized.'},
 {d:2,p:'Tea did not always come in bags. In 1908, a New York merchant began sending customers samples of tea in small silk pouches. Some customers, assuming the pouches were meant to go into the pot, dropped them straight into hot water. The merchant noticed the trend and began selling tea in pouches on purpose.',
  q:'Which choice best states the main purpose of the text?', c:['To explain how a misunderstanding by customers led to a new way of selling tea','To argue that tea bags make better tea than loose leaves','To describe how silk is produced','To compare tea-drinking habits in different countries'],
  e:'The text tells how customers\' mistaken use of the sample pouches led the merchant to sell tea in bags.'},
 {d:3,p:'Researchers once believed that the giant stone heads of Rapa Nui were moved by being dragged on wooden sleds, a method that would have required enormous numbers of trees. Experiments in which teams rocked a replica statue from side to side with ropes, "walking" it forward, showed that a small group could move a statue with no sleds at all. This finding <u>challenges an explanation for the island\'s loss of its forests</u> that some historians had proposed.',
  q:'Which choice best describes the function of the underlined portion in the text as a whole?', c:['It indicates that the experiment\'s results raise doubts about one proposed reason for deforestation on the island.','It summarizes the history of the island\'s forests.','It describes the method used in the rocking experiment.','It confirms that the statues were moved on wooden sleds.'],
  e:'If statues did not need sleds, the idea that sled-building used up the trees is weakened, which is what the underlined portion points out.'},
 {d:1,p:'Every spring, millions of red crabs on Christmas Island leave the forest and march to the sea to lay their eggs. During the migration, roads are closed, and special bridges and tunnels help the crabs cross safely.',
  q:'Which choice best states the main purpose of the text?', c:['To describe the red crabs\' yearly migration and the steps taken to protect them','To argue that Christmas Island should close all of its roads permanently','To explain how red crabs find food in the forest','To compare red crabs with other kinds of crabs'],
  e:'The text describes the migration and the measures, such as closed roads and crab bridges, that protect the crabs.'},
],
ct:[
 {d:2,p:'<p><b>Text 1</b><br>Many city planners argue that building more roads reduces traffic. With more lanes available, they say, cars spread out and congestion falls.</p><p><b>Text 2</b><br>Studies of new highways have repeatedly found that traffic soon returns to its earlier levels. Wider roads make driving more convenient, so people drive more often and farther, a pattern known as "induced demand."</p>',
  q:'Based on the texts, how would the author of Text 2 most likely respond to the planners discussed in Text 1?', c:['By arguing that new roads tend to encourage more driving, so congestion does not fall for long','By agreeing that more lanes always reduce congestion','By suggesting that planners should build roads only in rural areas','By claiming that people will stop driving if roads are widened'],
  e:'Text 2 says new roads lead to more driving, so traffic returns. That directly challenges the planners\' claim.'},
 {d:3,p:'<p><b>Text 1</b><br>Archaeologist Rustam Holov argues that the ancient city was abandoned suddenly, probably after an earthquake. He points to collapsed walls and household items left in place.</p><p><b>Text 2</b><br>Collapsed walls and abandoned items show that buildings fell, but not when. Soil layers at the site suggest the city\'s population declined over many decades as its river shifted away; the walls may have fallen long after most residents had already left.</p>',
  q:'Based on the texts, how would the author of Text 2 most likely respond to Holov\'s argument?', c:['By noting that the evidence Holov cites does not show that the city was abandoned suddenly','By agreeing that an earthquake was the main reason residents left','By arguing that the walls of the city never collapsed','By claiming that no household items were found at the site'],
  e:'Text 2 accepts that walls fell but says this does not show when, and offers evidence of a slow decline instead.'},
 {d:2,p:'<p><b>Text 1</b><br>Some teachers worry that calculators weaken students\' arithmetic skills, since students no longer practice basic calculations by hand.</p><p><b>Text 2</b><br>In a study of middle school classes, students who used calculators for complex problems did as well on hand-calculation tests as students who did not, and they solved more advanced problems.</p>',
  q:'Based on the texts, how would the researchers in Text 2 most likely respond to the teachers\' concern in Text 1?', c:['Their findings suggest the concern may be unfounded, at least when calculators are used for complex problems.','They would agree that calculators should be banned in classrooms.','They would argue that hand calculation is more important than advanced problem solving.','They would say that their study did not measure arithmetic skills.'],
  e:'Calculator users did just as well on hand calculation, which suggests the worry is not supported, at least in the situation studied.'},
 {d:3,p:'<p><b>Text 1</b><br>Literary critic Nilufar Saidova argues that the poet\'s later work abandoned the rich imagery of his youth in favor of plain statement, and that his poetry grew weaker as a result.</p><p><b>Text 2</b><br>The poet\'s later style is indeed plainer, but this was a deliberate choice. In letters, he described ornament as "a curtain between the reader and the truth," and the later poems, though simple, are among his most widely quoted.</p>',
  q:'Based on the texts, how would the author of Text 2 most likely respond to Saidova\'s argument?', c:['By accepting that the later style is plainer while disputing that the change made the poetry weaker','By agreeing that the poet\'s later work is weaker than his early work','By denying that the poet\'s style changed over time','By arguing that the poet wrote very little after his youth'],
  e:'Text 2 agrees the style became plainer ("indeed plainer") but argues the change was deliberate and successful, rejecting the claim that the poems grew weaker.'},
 {d:2,p:'<p><b>Text 1</b><br>Bird feeders are often praised for helping birds survive harsh winters.</p><p><b>Text 2</b><br>Feeders can also spread disease, because many birds touch the same surfaces. Researchers recommend cleaning feeders every two weeks.</p>',
  q:'Which choice best describes how Text 2 relates to Text 1?', c:['It points out a possible drawback of feeders and suggests a way to reduce it.','It argues that feeders do not help birds in winter.','It describes the history of bird feeders.','It agrees that feeders have no disadvantages.'],
  e:'Text 2 adds a risk, disease, and gives advice to limit it. It does not deny that feeders help birds.'},
 {d:3,p:'<p><b>Text 1</b><br>Economist Jamshid Tursunov contends that remote work lowers productivity because employees lose the quick, informal exchanges that happen in an office.</p><p><b>Text 2</b><br>A large study of software companies found that remote employees completed slightly more tasks per week, but that teams working remotely produced fewer new product ideas than teams working in the same building.</p>',
  q:'Based on the texts, how would the authors of the study in Text 2 most likely respond to Tursunov\'s claim?', c:['By suggesting that remote work may not reduce individual output, though informal exchanges may matter for generating new ideas','By agreeing completely that remote employees complete fewer tasks','By arguing that office workers produce fewer new ideas than remote workers','By claiming that informal exchanges have no value for companies'],
  e:'The study partly supports and partly challenges Tursunov: output did not fall, but idea generation did, which fits his point about informal exchanges.'},
],
tr:[
 {d:1,p:'Snow leopards are well adapted to cold mountains. Their thick fur keeps them warm. ______ their wide paws work like snowshoes, helping them walk on deep snow.',
  q:Q_TRANS, c:['Additionally,','However,','Instead,','As a result,'],
  e:'The text lists a second adaptation, so "Additionally" fits. Nothing contrasts or follows as a result.'},
 {d:2,p:'Early telescopes produced blurry images with colored edges. ______ astronomers could identify only the largest features of the planets they observed.',
  q:Q_TRANS, c:['Consequently,','Nevertheless,','Similarly,','For example,'],
  e:'Blurry images caused the limited observations, so a cause-and-effect transition, "Consequently," fits.'},
 {d:2,p:'Most metals expand when heated. Water, ______ behaves unusually: between 0 and 4 degrees Celsius, it contracts as it warms.',
  q:Q_TRANS, c:['by contrast,','for instance,','in addition,','therefore,'],
  e:'Water does the opposite of most metals, so a contrast transition is needed.'},
 {d:3,p:'The museum\'s collection includes thousands of textiles from Central Asia. Many have never been displayed, since light can fade their dyes. ______ curators have photographed every piece so that researchers can study them online.',
  q:Q_TRANS, c:['To make the collection accessible anyway,','For this reason, the textiles are often displayed, and','In other words,','Similarly,'],
  e:'The textiles cannot be displayed, yet curators found another way to share them, which "To make the collection accessible anyway" expresses. The choice saying the textiles are often displayed contradicts the text.'},
 {d:3,p:'Some scientists predicted that the new drug would help patients sleep longer. In the trial, ______ patients who took the drug slept no longer than those who took a placebo, though they reported feeling more rested.',
  q:Q_TRANS, c:['however,','moreover,','likewise,','accordingly,'],
  e:'The result goes against the prediction, so "however" is needed.'},
 {d:2,p:'The city first tested electric buses on a single route in 2021. The trial was a success. ______ by 2024, electric buses served every route in the city center.',
  q:Q_TRANS, c:['Subsequently,','Conversely,','In comparison,','Even so,'],
  e:'The text describes what happened next in time, so "Subsequently" fits.'},
],
rs:[
 {d:2,p:notes(['Ulugh Beg was a 15th-century ruler and astronomer in Samarkand.','He built a large observatory there in the 1420s.','His star catalog listed the positions of more than 1,000 stars.','It was the most accurate star catalog of its time.']),
  q:'The student wants to emphasize the importance of Ulugh Beg\'s scientific work. '+Q_RS, c:['Ulugh Beg\'s catalog of more than 1,000 stars was the most accurate of its time.','Ulugh Beg was a ruler in Samarkand in the 15th century.','Ulugh Beg built an observatory in the 1420s.','Samarkand had a ruler named Ulugh Beg.'],
  e:'"Most accurate of its time" shows the importance of the work. The other choices give facts without showing importance.'},
 {d:2,p:notes(['Hummingbirds can hover in place.','They beat their wings up to 80 times per second.','Bees also hover, but they beat their wings about 230 times per second.','Both animals hover to feed on flowers.']),
  q:'The student wants to compare how fast hummingbirds and bees beat their wings. '+Q_RS, c:['While hummingbirds beat their wings up to 80 times per second, bees beat theirs about 230 times per second.','Hummingbirds and bees both hover to feed on flowers.','Hummingbirds can hover in place by beating their wings.','Bees beat their wings about 230 times per second.'],
  e:'A comparison needs both numbers. Only one choice gives both numbers.'},
 {d:3,p:notes(['A study tested two ways of teaching new vocabulary.','Group A read each word\'s definition.','Group B used each new word in a sentence of their own.','One week later, Group B remembered 40% more words than Group A.']),
  q:'The student wants to present the study\'s finding to readers unfamiliar with it. '+Q_RS, c:['In one study, students who used new words in their own sentences remembered 40% more of the words a week later than students who only read definitions.','Group B remembered 40% more words than Group A.','A study tested two different ways of teaching vocabulary.','Some students read definitions, while others wrote sentences.'],
  e:'Readers unfamiliar with the study need to know what the groups did and what happened. "Group A" and "Group B" mean nothing to them on their own.'},
 {d:3,p:notes(['The Great Green Wall is a project to plant trees across Africa\'s Sahel region.','It began in 2007.','Its goal is to restore 100 million hectares of land by 2030.','By 2023, about 18 million hectares had been restored.']),
  q:'The student wants to emphasize how much work remains to reach the project\'s goal. '+Q_RS, c:['By 2023, the Great Green Wall had restored about 18 million of the 100 million hectares it aims to restore by 2030.','The Great Green Wall project began in 2007.','The Great Green Wall involves planting trees across the Sahel region.','The Great Green Wall aims to restore land in Africa.'],
  e:'To show what remains, the sentence must compare progress (18 million) with the goal (100 million).'},
 {d:1,p:notes(['Amir Timur founded the Timurid Empire.','He was born in 1336 near Shahrisabz.','He made Samarkand his capital.','He built many mosques and palaces there.']),
  q:'The student wants to identify Timur\'s capital city. '+Q_RS, c:['Timur made Samarkand the capital of his empire.','Timur was born in 1336.','Timur founded the Timurid Empire.','Timur was born near Shahrisabz.'],
  e:'Only one choice names his capital: Samarkand.'},

  q:'The student wants to explain how penguins\' wings help them in water. '+Q_RS, c:['Penguins\' wings have become stiff flippers that let them swim at up to 35 kilometers per hour.','Penguins cannot fly.','Some penguins dive deeper than 500 meters.','Penguins have wings, but they cannot fly with them.'],

bd:[
 {d:1,p:'The library was ______ only a few students were studying at the long wooden tables.',
  q:Q_CONV, c:['quiet;','quiet','quiet,','quiet and,'],
  e:'Two complete sentences ("The library was quiet" and "only a few students were studying...") can be joined with a semicolon.'},
 {d:2,p:'The expedition\'s goals were ambitious ______ to map the glacier, measure its speed, and collect ice samples from its base.',
  q:Q_CONV, c:[':',';',',','.'],
  e:'A colon introduces the list that explains "goals." A semicolon would need a complete sentence after it.'},
 {d:2,p:'Navoi, who wrote poetry in both Persian and ______ is often called the founder of Uzbek literature.',
  q:Q_CONV, c:['Chagatai,','Chagatai','Chagatai;','Chagatai:'],
  e:'The clause "who wrote poetry in both Persian and Chagatai" needs a comma on each side.'},
 {d:3,p:'The researchers had expected the seeds to sprout within a ______ after two weeks, however, none had appeared.',
  q:Q_CONV, c:['week;','week,','week','week:'],
  e:'"After two weeks, however, none had appeared" is a complete sentence, so it must be separated from the first with a semicolon, not a comma.'},
 {t:'tap', d:2, s:'The museum\'s first exhibit *featured,* rugs and ceramics from Bukhara and Khiva.',
  e:'No comma belongs between the verb "featured" and its object "rugs."'},
 {t:'tap', d:3, s:'The river floods every *spring,* the farmers, therefore, plant their crops only in early summer.',
  e:'Two complete sentences are joined by only a comma after "spring." A semicolon or a period is needed there. "Therefore" does not join sentences.'},
],
fss:[
 {d:1,p:'Each of the students in the robotics club ______ a different part of the machine.',
  q:Q_CONV, c:['builds','build','are building','have built'],
  e:'The subject is "Each," which is singular, so the verb must be singular: "builds."'},
 {d:2,p:'The collection of ancient coins, found by farmers in the Zarafshan Valley, ______ now on display at the museum.',
  q:Q_CONV, c:['is','are','were','have been'],
  e:'The subject is "collection," which is singular. "Of ancient coins" and the phrase between commas do not change the subject.'},
 {d:2,p:'When the scientists finally reviewed the data, ______ realized that the instrument had been recording the wrong temperatures.',
  q:Q_CONV, c:['they','it','one','he or she'],
  e:'The pronoun refers to "the scientists," which is plural, so "they" is correct.'},
 {d:3,p:'Walking through the old city at dawn, ______',
  q:Q_CONV, c:['the visitor heard the call of doves echoing from the blue domes.','the call of doves could be heard echoing from the blue domes.','the blue domes echoed with the call of doves.','echoes of doves\' calls filled the blue domes.'],
  e:'The phrase "Walking through the old city" must describe the person doing the walking, so "the visitor" must come right after the comma. The other choices make the domes or the calls the walkers.'},
 {d:3,p:'By the time the bridge was completed, engineers ______ more than twenty different designs.',
  q:Q_CONV, c:['had tested','have tested','test','will test'],
  e:'The testing happened before another past event (the bridge was completed), so the past perfect "had tested" is needed.'},
 {d:2,p:'The coach praised the team for its speed, its teamwork, and ______',
  q:Q_CONV, c:['its determination.','being determined.','because it was determined.','they were determined.'],
  e:'Items in a list should be parallel: "its speed, its teamwork, and its determination."'},
],
};

const MORE4 = {
ci:[[
 {d:2,p:"Lichens, which look like flat patches of paint on rocks and tree bark, are not single organisms. Each lichen is a partnership between a fungus and an alga or bacterium. The fungus provides structure and holds moisture, while its partner makes food through photosynthesis. Together they survive on bare rock, in deserts, and on Antarctic cliffs where neither partner could live alone.",
  q:Q_MAIN, c:["A lichen is a partnership that lets two organisms survive in places where neither could live alone.","Fungi are more important to a lichen than algae are.","Lichens grow mainly in Antarctica.","Photosynthesis is impossible on bare rock."],
  e:"Every sentence builds toward the partnership and what it makes possible. Antarctica is only one of several examples, and the text never ranks the partners."},
 {d:2,p:"The following text is from a short story.<br><br>Before the concert, Timur had practiced the opening bars until his fingers ached. Now, standing in the wings, he could not remember a single note. Then the lights dimmed, the audience fell silent, and his hands, as if they belonged to someone else, began to play.",
  q:"Which choice best describes what happens in the text?", c:["A nervous performer finds that his practice carries him through despite his fear.","A performer forgets the music and leaves the stage.","A musician decides that his practice was a waste of time.","An audience refuses to quiet down for a performance."],
  e:"He panics in the wings, but his hands play \"as if they belonged to someone else\": the hours of practice take over. He never leaves the stage, and the audience does fall silent."},
 {d:3,p:"Economist Dilshod Nazarov studied weekly bazaars in rural Uzbekistan. Officials had predicted that the bazaars would disappear once large supermarkets opened nearby. Nazarov found instead that many bazaars grew: shoppers still bought packaged groceries at supermarkets but visited bazaars to buy fresh produce, meet neighbors, and hear local news, roles the supermarkets did not fill.",
  q:Q_MAIN, c:["Rural bazaars survived the arrival of supermarkets because they served purposes that supermarkets did not.","Supermarkets in rural Uzbekistan failed because shoppers preferred bazaars for all their purchases.","Officials encouraged supermarkets to open near bazaars.","Bazaars sell fresher produce than supermarkets at lower prices."],
  e:"The text says shoppers \"still bought packaged groceries at supermarkets,\" so the supermarkets did not fail. Prices are never mentioned. The point is that bazaars filled different roles."},
 {d:2,p:"Sea otters often float on their backs and use rocks to crack open shellfish. Researchers studying otters along the California coast found that individual otters tend to specialize: some eat mainly sea urchins, while others eat mainly crabs or snails. The otters that specialize in hard-shelled snails are the most frequent tool users.",
  q:"According to the text, which otters use tools most often?", c:["Otters that mainly eat hard-shelled snails","Otters that eat sea urchins and crabs equally","The youngest otters in a group","Otters that live farthest from the coast"],
  e:"The last sentence answers the question directly. The text never mentions age or distance from the coast."},
 {d:3,p:"Some critics fault architect Zaha Hadid's buildings for being impractical, pointing to curved walls that make furniture hard to arrange. Her defenders respond that the buildings were never meant to be judged only as containers for furniture. Hadid's designs, they argue, invite visitors to move through space in new ways, and in doing so they changed what many architects believed a building could look like.",
  q:Q_MAIN, c:["Hadid's defenders argue that her buildings should be valued for how they changed ideas about architecture, not only for their practicality.","Hadid's buildings are impractical, so critics are right to dismiss them.","Hadid designed furniture that fits curved walls.","Most architects now refuse to design buildings with straight walls."],
  e:"The critics' view is set up so the defenders can answer it, and the text ends on their answer. \"Most architects now refuse\" goes far beyond \"changed what many architects believed.\""},
 {d:3,p:"The following text is adapted from a 1911 short story.<br><br>The new teacher arrived in the village on a gray afternoon. The children had been told to expect someone stern, and they stood in a silent row at the schoolhouse door. She looked at them for a long moment. Then she knelt in the mud, picked up a small frog that had hopped onto the step, and asked whether anyone knew its name.",
  q:Q_MAIN, c:["The teacher's first act surprises children who expected her to be strict.","The children are afraid of the frog on the step.","The teacher is unhappy to have arrived on a gray day.","The village children have never attended school before."],
  e:"The children expect \"someone stern,\" and the teacher kneels in the mud to ask about a frog. The contrast between expectation and action is the point."},
],[
 {d:2,p:"In the 1970s, the Brazilian city of Curitiba could not afford to build a subway. Instead, planners gave buses their own lanes and built raised, tube-shaped stations where passengers paid before boarding. Because buses no longer sat in traffic or waited at the door while riders paid, they moved almost as quickly as trains, at a fraction of the cost. Cities around the world later copied the system.",
  q:Q_MAIN, c:["Curitiba created an affordable bus system that worked almost as well as a subway and became a model for other cities.","Curitiba eventually built a subway after its bus system failed.","Passengers in Curitiba preferred trains to buses.","The raised stations were the most expensive part of Curitiba's system."],
  e:"The text moves from the problem (no money for a subway) to the solution and its success. Nothing says the system failed or ranks its costs."},
 {d:2,p:"In a study of 300 households, researchers found that families who ate dinner together at least four nights a week threw away less food than families who rarely did. The researchers suggest that shared meals encourage planning: when one person cooks for everyone, groceries are bought with specific meals in mind.",
  q:"According to the text, why might shared meals reduce food waste?", c:["They lead families to buy groceries with particular meals in mind.","They require smaller portions than separate meals.","They are usually cooked by more than one person.","They happen only four nights a week."],
  e:"The researchers' explanation is planning: groceries \"bought with specific meals in mind.\" The text says one person cooks, not several."},
 {d:3,p:"Musicologist Shahlo Rahimova studied recordings of shashmaqam, the classical music of Bukhara and Samarkand, made between 1920 and 1990. Many listeners assume that the tradition was passed down unchanged for centuries. Rahimova found, however, that performers regularly shortened long pieces, added new instruments, and adjusted melodies to suit radio broadcasts, all while describing their performances as faithful to tradition.",
  q:Q_MAIN, c:["Rahimova's research shows that shashmaqam changed during the twentieth century even as performers presented it as unchanged.","Rahimova argues that radio broadcasts damaged shashmaqam beyond repair.","Shashmaqam was invented in 1920.","Performers of shashmaqam refused to use new instruments."],
  e:"\"However\" turns from the common assumption to Rahimova's finding: real change, described as faithfulness. She never judges the changes as damage."},
 {d:2,p:"Every evening Grandmother Zebo set out two cups of tea, although Grandfather had been gone for three years. When her granddaughter finally asked why, Zebo only smiled and said that some habits are a way of keeping someone company.",
  q:Q_MAIN, c:["Zebo continues a daily habit as a way of remembering her husband.","Zebo has forgotten that her husband is gone.","Zebo wants her granddaughter to drink more tea.","Zebo expects her husband to return soon."],
  e:"Her answer, that habits can be \"a way of keeping someone company,\" shows she knows he is gone and keeps the ritual to stay close to his memory."},
 {d:3,p:"Tardigrades, animals less than a millimeter long, can survive being dried out for years. As they dry, they produce a protein that forms a glass-like gel inside their cells, holding delicate molecules in place until water returns. When scientists inserted the gene for this protein into yeast, the yeast also became more tolerant of drying out.",
  q:"According to the text, what happened when scientists inserted the gene into yeast?", c:["The yeast became better able to survive drying out.","The yeast stopped needing water entirely.","The yeast grew to the size of tardigrades.","The yeast began producing water inside its cells."],
  e:"\"More tolerant of drying out\" means better able to survive it. \"Stopped needing water entirely\" is a big overstatement."},
 {d:3,p:"Many people assume that a forest left alone will return to its original state after a fire. Ecologist Ana Reyes studied pine forests burned by intense wildfires and found that in many areas, shrubs took over the burned ground and blocked pine seedlings for decades. Where fires had burned less intensely, by contrast, young pines returned within a few years.",
  q:Q_MAIN, c:["Reyes found that how a pine forest recovers after a fire depends on how intense the fire was.","Pine forests can never recover after a wildfire.","Shrubs are more resistant to fire than pines are.","Low-intensity fires cause more damage than high-intensity fires."],
  e:"The text contrasts intense fires (shrubs take over) with milder ones (pines return quickly). \"Never recover\" ignores the milder fires."},
]],
ev:[[
 {d:2,p:"A student claims that in the poem \"Winter Orchard,\" the speaker finds hope in a bleak setting.",
  q:"Which quotation from the poem most effectively illustrates the claim?", c:["\"The branches stand like bare black wire, / but each one holds a bud wrapped tight against the cold.\"","\"The snow has buried every path I knew.\"","\"In summer, children climbed these trees.\"","\"The wind is louder than my voice.\""],
  e:"The claim has two parts: a bleak setting and hope. \"Bare black wire\" is bleak, and the bud waiting to open is hope. The snow quotation is bleak only."},
 {d:2,p:"A researcher hypothesizes that office workers recycle more when recycling bins are placed closer to them than trash bins are.",
  q:"Which finding, if true, would most directly support the hypothesis?", c:["In offices where recycling bins were moved next to desks and trash bins were moved to the hallway, recycling rose sharply.","Most office workers said in a survey that they support recycling.","Recycling bins cost less than trash bins.","Offices with more workers produced more trash."],
  e:"The hypothesis is about where the bins are placed. Only the bin-moving result tests placement and shows the predicted effect."},
 {d:3,p:"Archaeologist Bekzod Usmonov claims that a walled settlement in the Fergana Valley was built mainly for defense.",
  q:"Which finding, if true, would most directly weaken Usmonov's claim?", c:["The walls were less than a meter high and had wide gaps at regular intervals.","Arrowheads were found inside the walls.","About 500 people lived in the settlement.","Similar walls surround other ancient towns in the region."],
  e:"Low walls full of gaps could not stop attackers, which undercuts a defensive purpose. Arrowheads, if anything, support the claim."},
 {d:2,p:"In the novel, the narrator describes Rustam as someone who hides his kindness behind a gruff manner.",
  q:"Which quotation from the novel most effectively illustrates this description?", c:["\"'Take it and stop thanking me,' Rustam grumbled, pushing the warm bread into the boy's hands without looking at him.\"","\"Rustam spoke kindly to everyone he met.\"","\"Rustam rarely spoke, and when he did, he complained about the weather.\"","\"The boy had never met Rustam before.\""],
  e:"Giving bread is kind; grumbling and not looking at the boy is gruff. Only that quotation shows both halves of the description."},
 {d:3,p:"Psychologists hypothesize that short rest breaks during study sessions improve memory because, during the breaks, the brain replays what was just learned.",
  q:"Which finding, if true, would most directly support the hypothesis?", c:["During rest breaks, participants' brain activity repeated patterns recorded while they were learning, and those with more repetition remembered more.","Participants said they enjoyed studying more when they took breaks.","Participants who took breaks spent more total time studying.","Most students do not take breaks while studying."],
  e:"The hypothesis names a cause: replay during breaks. Only the brain-activity finding shows replay and links it to memory. More total study time would be a different explanation."},
 {d:3,p:"Economist Malika Tosheva argues that free public transit mainly benefits riders who already use buses, rather than drawing drivers out of their cars.",
  q:"If Tosheva is correct, which result would be most expected after a city makes its buses free?", c:["Bus trips increase mostly among people who rode buses before, while car traffic stays about the same.","Car traffic falls sharply as drivers switch to buses.","The number of bus trips falls.","The city builds several new bus routes."],
  e:"Tosheva predicts gains for existing riders and little change for drivers. A sharp drop in car traffic is what her critics would predict."},
],[
 {d:2,p:"A student claims that the narrator of a memoir feels torn between two homes.",
  q:"Which quotation from the memoir most effectively illustrates the claim?", c:["\"In Tashkent I missed the sea; by the sea I caught myself listening for the sound of Tashkent's trams.\"","\"I never wanted to leave Tashkent.\"","\"The sea was colder than I had expected.\"","\"My parents moved often for work.\""],
  e:"Being torn means missing each place while in the other. Only that quotation shows longing in both directions."},
 {d:2,p:"Botanists hypothesize that a desert flower blooms only after heavy rain because its seeds contain a chemical that must be washed away before they can sprout.",
  q:"Which finding, if true, would most directly support the hypothesis?", c:["In a lab, seeds rinsed repeatedly with water sprouted, while seeds kept moist without rinsing did not.","The flower is brightly colored.","Heavy rain is rare in the desert.","Many desert animals eat the flower's seeds."],
  e:"Rinsing washes the chemical away; simply keeping seeds moist does not. That comparison isolates the cause the botanists propose."},
 {d:3,p:"A historian claims that a 17th-century merchant's letters were written for publication rather than as private messages to his family.",
  q:"Which finding, if true, would most directly weaken the historian's claim?", c:["The letters contain household instructions, private jokes, and requests that they be burned after reading.","The letters were published fifty years after the merchant's death.","The merchant wrote more than 300 letters.","Other merchants of the period also wrote letters."],
  e:"Asking that letters be burned shows the writer did not expect a public audience. Being published long after his death says nothing about his intent."},
 {d:3,p:"A student claims that in a play, the character Laylo is both proud of her success and worried that it has cost her friendships.",
  q:"Which quotation from the play most effectively illustrates the claim?", c:["\"I won the prize I wanted most,\" Laylo says, \"and yet my phone hasn't rung all week.\"","\"I won the prize I wanted most,\" Laylo says.","\"My friends are coming to dinner tonight,\" Laylo says.","\"I don't care about prizes,\" Laylo says."],
  e:"The claim has two parts. The full quotation shows pride (the prize) and worry (no one has called). The shorter version shows only pride."},
 {d:2,p:"A nutrition researcher claims that teenagers who sleep less tend to eat more sugary snacks.",
  q:"Which finding, if true, would most directly support the researcher's claim?", c:["In a survey of 1,000 teenagers, those who slept under seven hours a night reported eating sugary snacks nearly twice as often as those who slept eight hours or more.","Teenagers sleep less, on average, than younger children do.","Sugary snacks are often cheaper than fruit.","Some teenagers who sleep eight hours a night eat sugary snacks."],
  e:"Support must connect less sleep with more sugary snacks. Only the survey comparison does that."},
 {d:3,p:"After ecologists introduced a fish species to a lake, the number of dragonflies around the lake fell. The ecologists concluded that the fish were eating dragonfly larvae, which live in the water.",
  q:"Which finding, if true, would most strongly support the ecologists' conclusion?", c:["Dragonfly larvae were found in the stomachs of many of the introduced fish.","Dragonflies also declined at nearby lakes that had no introduced fish.","The introduced fish grew larger each year.","Adult dragonflies lay their eggs in water."],
  e:"Larvae in the fishes' stomachs is direct evidence of the cause. Declines at lakes without the fish would point to some other cause and weaken the conclusion."},
]],
qe:[[
 {d:1,p:tbl("Books borrowed from a school library in one month",["Genre","Grade 9","Grade 12"],[["Mystery","42","18"],["Science fiction","35","40"],["History","12","31"],["Poetry","8","6"]])+"<p>A librarian notes that grade 12 students borrowed more history books than grade 9 students did, borrowing ______</p>",
  q:"Which choice most effectively uses data from the table to complete the statement?", c:["31 history books, compared with 12 for grade 9.","12 history books, compared with 31 for grade 9.","40 science fiction books.","18 mystery books, compared with 42 for grade 9."],
  e:"Find the History row: grade 12 borrowed 31 and grade 9 borrowed 12. The reversed choice swaps the two grades."},
 {d:2,p:bars("Average daily steps of participants in a walking program","Steps",[["Week 1",4200],["Week 2",5100],["Week 3",6300],["Week 4",6200],["Week 5",7400]])+"<p>The program's director claims that participants' daily steps increased in almost every week of the program.</p>",
  q:"Which choice most effectively uses data from the graph to support the claim?", c:["Steps rose from 4,200 in week 1 to 7,400 in week 5, falling only slightly in week 4.","Participants took 6,300 steps in week 3.","Steps fell from week 3 to week 4.","Participants took fewer than 5,000 steps in week 1."],
  e:"\"Almost every week\" needs the overall rise plus the one small exception. A single week's number cannot show a pattern."},
 {d:2,p:tbl("Trees planted and still alive after three years",["Species","Planted","Surviving"],[["Elm","200","150"],["Oak","200","170"],["Maple","200","96"],["Pine","200","182"]])+"<p>A forester claims that pine had the highest survival rate of the four species.</p>",
  q:"Which choice most effectively uses data from the table to support the forester's claim?", c:["Of the 200 pines planted, 182 survived, more than for any other species.","Of the 200 oaks planted, 170 survived.","Maple had the fewest surviving trees.","Each species had 200 trees planted."],
  e:"Because every species started at 200, the species with the most survivors has the highest rate. Pine's 182 tops the column."},
 {d:3,p:tbl("Average commute and share of workers who bike, four cities",["City","Average commute (minutes)","Workers who bike (%)"],[["A","22","18"],["B","35","4"],["C","27","11"],["D","31","6"]])+"<p>An urban researcher hypothesized that cities where more workers bike tend to have shorter average commutes. The data support this hypothesis because ______</p>",
  q:"Which choice most effectively uses data from the table to complete the text?", c:["the city with the highest share of bikers, City A, has the shortest commute, and the city with the lowest share, City B, has the longest.","City C has an average commute of 27 minutes.","City B has the longest commute of the four cities.","City D has a higher share of bikers than City B does."],
  e:"A pattern needs both variables. Only the correct choice links the most biking to the shortest commute and the least biking to the longest."},
 {d:3,p:bars("Monthly visitors to a national park","Thousands of visitors",[["Jan",12],["Apr",45],["Jul",98],["Oct",40]])+"<p>Park managers added a shuttle bus to reduce traffic jams on the park's roads. They chose to run the shuttle only from May through September, reasoning that ______</p>",
  q:"Which choice most effectively uses data from the graph to complete the text?", c:["visitor numbers in July are far higher than in January, April, or October.","the park had 12 thousand visitors in January.","visitor numbers were about the same in April and October.","the park receives more visitors in winter than in summer."],
  e:"The shuttle runs in the warm months because that is when crowds peak. July's 98 thousand, far above the other months, supports that choice. The winter claim is false."},
 {d:3,p:tbl("Minutes spent reading per day, before and after an 8-week trial of a reading app",["Group","Before","After"],[["App users","18","31"],["Non-users","17","19"]])+"<p>A researcher concludes that the app, rather than a general rise in reading among all students, explains most of the app users' gain.</p>",
  q:"Which choice most effectively uses data from the table to support the researcher's conclusion?", c:["Reading time rose from 18 to 31 minutes for app users but only from 17 to 19 minutes for non-users.","App users read for 31 minutes per day after the trial.","Non-users read for 17 minutes per day before the trial.","Both groups read more after the trial than before it."],
  e:"To rule out a general rise, compare the two groups' gains: 13 minutes versus 2. \"Both groups read more\" points toward a general rise, the opposite of the conclusion."},
],[
 {d:1,p:bars("Tickets sold for a school play","Tickets",[["Thu",120],["Fri",210],["Sat",260],["Sun",150]])+"<p>The drama teacher notes that the play sold the most tickets on ______</p>",
  q:"Which choice most effectively uses data from the graph to complete the statement?", c:["Saturday, with 260 tickets.","Friday, with 210 tickets.","Sunday, with 150 tickets.","Thursday, with 120 tickets."],
  e:"The tallest bar is Saturday at 260."},
 {d:2,p:tbl("Survey respondents who use each news source daily (%)",["Source","Ages 18–29","Ages 50–64"],[["Social media","62","28"],["Television","19","55"],["Newspapers","7","24"],["Podcasts","30","12"]])+"<p>A media researcher claims that the older group in the survey relies more on traditional news sources than the younger group does.</p>",
  q:"Which choice most effectively uses data from the table to support the claim?", c:["55% of people aged 50–64 watch television news daily, compared with 19% of people aged 18–29.","62% of people aged 18–29 use social media for news daily.","30% of people aged 18–29 listen to news podcasts daily.","7% of people aged 18–29 read newspapers daily."],
  e:"The claim compares two groups on a traditional source. Only the television choice gives both groups' numbers for a traditional source."},
 {d:2,p:tbl("Three types of light bulbs",["Bulb","Power used (watts)","Lifespan (hours)"],[["Incandescent","60","1,000"],["Halogen","43","2,000"],["LED","9","25,000"]])+"<p>Although LED bulbs cost more to buy, an engineer argues that they save money over time because they ______</p>",
  q:"Which choice most effectively uses data from the table to complete the text?", c:["use 9 watts and last 25,000 hours, compared with 60 watts and 1,000 hours for incandescent bulbs.","last 2,000 hours, longer than incandescent bulbs.","use 43 watts of power.","were the newest of the three types."],
  e:"Saving money over time comes from using less power and lasting longer. The 2,000-hour and 43-watt figures belong to halogen bulbs."},
 {d:3,p:bars("Share of a reef covered by living coral","Percent",[["2000",52],["2005",47],["2010",30],["2015",33],["2020",36]])+"<p>A marine biologist claims that the reef suffered its steepest decline between 2005 and 2010 but has partly recovered since then.</p>",
  q:"Which choice most effectively uses data from the graph to support the claim?", c:["Coral cover dropped from 47% to 30% between 2005 and 2010, then rose to 36% by 2020.","Coral cover was 52% in 2000.","Coral cover rose between 2010 and 2015.","Coral cover in 2020 was lower than in 2000."],
  e:"The claim has two parts, the steep drop and the partial recovery. Only one choice gives data for both."},
 {d:3,p:tbl("Average test score by hours slept the night before",["Hours of sleep","Students","Average score"],[["Under 6","40","71"],["6–7","85","78"],["7–8","90","83"],["Over 8","35","80"]])+"<p>A student claims that the more students slept before the test, the higher their scores were.</p>",
  q:"Which choice most effectively uses data from the table to weaken the student's claim?", c:["Students who slept over 8 hours averaged 80, lower than the 83 averaged by students who slept 7–8 hours.","Students who slept under 6 hours averaged 71.","More students slept 7–8 hours than any other amount.","Students who slept 6–7 hours scored higher than those who slept under 6."],
  e:"If more sleep always meant higher scores, the over-8 group would score highest. It does not, which weakens the claim. The 6–7 versus under-6 comparison supports it."},
 {d:3,p:tbl("Seabird nesting on two islands, 2022",["Island","Nests","Chicks that fledged"],[["North (rats present)","120","18"],["South (rats removed in 2019)","115","74"]])+"<p>Conservationists removed rats from South Island in 2019 because rats eat seabird eggs. Data from 2022 suggest that the effort helped the birds, since ______</p>",
  q:"Which choice most effectively uses data from the table to complete the text?", c:["South Island's 115 nests produced 74 fledged chicks, while North Island's 120 nests produced only 18.","North Island had more nests than South Island did.","South Island had 115 nests in 2022.","both islands had more than 100 nests."],
  e:"The effect of removing rats shows up in chick survival. Comparing chicks from a similar number of nests on each island makes the point."},
]],
inf:[[
 {d:2,p:"Bats that hunt insects use echolocation: they send out calls and listen for the echoes. Some moths can hear these calls, and when they detect a bat, they drop suddenly toward the ground. Researchers found that moths of one species whose ears did not work were caught by bats far more often than moths of the same species with working ears. This finding suggests that ______",
  q:Q_LOGIC, c:["the moths' ability to hear bat calls helps them escape.","bats rely on sight rather than echolocation to find moths.","moths without working ears are more common than moths with working ears.","bats prefer to hunt moths that fly close to the ground."],
  e:"The only difference between the two groups is hearing, and the hearing moths escaped more often. So hearing helps them escape."},
 {d:2,p:"A 19th-century farmer's diary records the date each spring when the first apple blossoms opened in his orchard. Modern records from the same orchard show the blossoms opening, on average, eleven days earlier. Because the orchard still grows the same apple varieties, the change most likely reflects ______",
  q:Q_LOGIC, c:["a change in conditions such as spring temperatures rather than a change in the trees.","an error in the farmer's diary.","the planting of new apple varieties.","a decline in the number of bees in the orchard."],
  e:"\"Same varieties\" rules out a change in the trees, so the cause must be in their conditions. The new-varieties choice contradicts the text."},
 {d:3,p:"In one experiment, participants solved puzzles in either a tidy room or a messy room. Afterward, those in the tidy room were more likely to choose a healthy snack, while those in the messy room came up with more creative ideas when asked for new uses of a ping-pong ball. These results suggest that ______",
  q:Q_LOGIC, c:["orderly and disorderly settings may each encourage different kinds of behavior.","messy rooms make people unhealthy.","tidy rooms improve every kind of thinking.","most people prefer to work in messy rooms."],
  e:"Each room had its own benefit, so neither is simply better. \"Every kind of thinking\" ignores the messy room's creative advantage."},
 {d:3,p:"When the old bridge in the town of Sayram was replaced, residents expected the café beside it to close, since car traffic would now cross the river a kilometer to the north. Instead, the café became busier than ever. The old bridge had been turned into a walkway lined with benches, and families now spent their evenings strolling across it. The café's success therefore most likely depended on ______",
  q:Q_LOGIC, c:["the walkers who now gathered at the old bridge rather than on passing car traffic.","the new bridge being built a kilometer to the north.","residents avoiding the new walkway.","the café lowering its prices."],
  e:"Car traffic left, yet business grew, and the new thing nearby is the busy walkway. Prices are never mentioned."},
 {d:3,p:"Seeds of a certain wildflower sprout only after they have passed through the digestive system of a particular bird. In a region where that bird has become rare, botanists have found very few young plants, even though older plants still produce plenty of seeds each year. The botanists conclude that ______",
  q:Q_LOGIC, c:["the decline of the bird is likely limiting the growth of new wildflowers.","the older plants have stopped producing seeds.","the wildflower is spreading to new regions.","the bird prefers other kinds of seeds."],
  e:"Seeds are still produced, so the missing step is the bird. The text directly contradicts the claim that older plants stopped producing seeds."},
 {d:2,p:"Archaeologists found that pottery in an ancient town changed suddenly around 900 BCE: decorated bowls in the local style gave way to plain bowls identical to those made in a city 300 kilometers away. Other parts of daily life, such as house design and burial customs, did not change. These findings suggest that around 900 BCE, the town ______",
  q:Q_LOGIC, c:["adopted the distant city's pottery style without changing many of its other customs.","was conquered and resettled by people from the distant city.","stopped making pottery altogether.","began sending decorated bowls to the distant city."],
  e:"If newcomers had replaced the population, houses and burials would likely have changed too. Only pottery changed, so the town borrowed a style."},
],[
 {d:2,p:"Researchers tracked shoppers in a supermarket that played background music at different tempos. On days when slow music played, shoppers walked more slowly through the aisles and spent more money than on days when fast music played. The researchers concluded that ______",
  q:Q_LOGIC, c:["slower music might encourage shoppers to spend more time and money in a store.","shoppers dislike fast music.","music has no effect on how people shop.","the store should stop playing music."],
  e:"Slow music was linked to slower walking and more spending. Nothing in the text shows what shoppers liked or disliked."},
 {d:3,p:"Moving glaciers can carry rocks far from where the rocks formed. In a flat region, geologists found large granite boulders resting on limestone, although the nearest granite bedrock lies 400 kilometers to the north. The geologists most likely concluded that ______",
  q:Q_LOGIC, c:["glaciers once moved through the region from the north.","the limestone formed on top of the boulders.","people recently carried the boulders into the region.","granite can easily form from limestone."],
  e:"The first sentence gives the tool: glaciers move rocks. Granite from the north lying on local limestone suggests a glacier brought it."},
 {d:2,p:"Nigora checked the mailbox three times before noon, although the mail never arrived until the afternoon. When her brother asked what she was waiting for, she said, \"Nothing,\" and went back to the window.",
  q:"Based on the text, what can most reasonably be inferred about Nigora?", c:["She is anxiously hoping for a particular piece of mail.","She dislikes her brother.","She works at the post office.","She is expecting no mail at all."],
  e:"Her actions (checking three times, returning to the window) say more than her one-word answer. Taking \"Nothing\" literally ignores the evidence."},
 {d:3,p:"Many languages add basic color words in a similar order. A language with only three color words almost always has words for black, white, and red, and a language that adds a fourth word usually adds either green or yellow. A linguist studying a language with exactly four basic color words would therefore most likely expect to find ______",
  q:Q_LOGIC, c:["words for black, white, red, and either green or yellow.","words for blue and purple but not for red.","no word for white.","words only for colors found in plants."],
  e:"Follow the pattern: three words give black, white, red, and the fourth is usually green or yellow."},
 {d:3,p:"A company let half of its employees choose their own working hours while the other half kept a fixed schedule. After six months, the two groups had completed similar amounts of work, but the employees with flexible hours had taken fewer sick days. These results suggest that flexible hours ______",
  q:Q_LOGIC, c:["may improve employees' well-being without reducing how much they accomplish.","greatly increase how much work employees complete.","prevent illness among workers at every company.","are preferred by most managers."],
  e:"Similar output plus fewer sick days supports a modest claim. \"Greatly increase\" contradicts \"similar amounts of work,\" and \"every company\" overgeneralizes from one."},
 {d:2,p:"Pots of honey found in ancient Egyptian tombs have been reported to be still edible after thousands of years. Honey contains very little water and is slightly acidic, and most bacteria cannot grow in such conditions. It is therefore likely that ______",
  q:Q_LOGIC, c:["honey's low water content and acidity help it resist spoiling.","ancient Egyptians added preservatives to their honey.","bacteria grow best in honey.","all foods placed in tombs remained edible."],
  e:"The text gives two properties that stop bacteria, which explains why honey lasts. Preservatives are never mentioned."},
]],
wic:[[
 {d:2,p:"The scientist's explanation was so ______ that even students with no background in chemistry could follow it.",
  q:Q_WORD, c:["lucid","convoluted","tentative","lengthy"],
  e:"If beginners could follow it, the explanation was \"lucid,\" meaning clear. \"Convoluted\" means tangled and hard to follow, the opposite."},
 {d:2,p:"Although the ruins look ______ today, records show that the city was once crowded with markets, temples, and workshops.",
  q:Q_WORD, c:["desolate","bustling","renovated","enormous"],
  e:"\"Although\" sets up a contrast with \"once crowded,\" so the ruins must now look empty: \"desolate.\" \"Bustling\" repeats the crowded idea instead of contrasting with it."},
 {d:3,p:"The committee's report was deliberately ______: it listed several possible causes of the budget shortfall but declined to name any one of them as the most important.",
  q:Q_WORD, c:["noncommittal","decisive","fraudulent","celebratory"],
  e:"Refusing to choose among causes is being \"noncommittal.\" \"Decisive\" is the opposite, and nothing suggests the report was dishonest."},
 {d:2,p:"The following text is from a 1905 novel.<br><br>The storm had passed, but the sea was still <u>sullen</u>, rolling in long gray swells that broke heavily against the rocks.",
  q:"As used in the text, what does the word \"sullen\" most nearly mean?", c:["dark and threatening","resentful","quiet","motionless"],
  e:"Gray, heavy swells after a storm describe a dark, threatening sea. \"Resentful\" is the meaning for a sulking person, and \"motionless\" clashes with \"rolling.\""},
 {d:3,p:"Early reviewers found the novelist's plots ______, complaining that they could predict every ending by the second chapter.",
  q:Q_WORD, c:["formulaic","labyrinthine","innovative","ambiguous"],
  e:"Endings you can predict early come from plots that follow a formula: \"formulaic.\" \"Labyrinthine\" (maze-like) and \"ambiguous\" would make endings harder to predict."},
 {d:3,p:"Rather than ______ the findings of earlier researchers, the new study builds on them, using the same methods with a much larger group of participants.",
  q:Q_WORD, c:["repudiate","corroborate","extend","adopt"],
  e:"\"Rather than\" needs the opposite of building on earlier work. \"Repudiate\" means reject. \"Corroborate,\" \"extend,\" and \"adopt\" all describe building on the work."},
],[
 {d:2,p:"Camels are well suited to desert travel: they can go for days without water and ______ heat that would exhaust most other animals.",
  q:Q_WORD, c:["withstand","avoid","produce","measure"],
  e:"Being \"well suited\" to the desert means camels can endure, or \"withstand,\" the heat. Avoiding the heat would not show they are suited to it."},
 {d:2,p:"The mayor's decision to <u>table</u> the proposal until spring disappointed residents who had hoped for an immediate vote.",
  q:"As used in the text, what does the word \"table\" most nearly mean?", c:["postpone discussion of","present formally","arrange neatly","reject permanently"],
  e:"\"Until spring\" and the disappointed hope for \"an immediate vote\" show the proposal was put off, not rejected forever."},
 {d:3,p:"The historian's account of the war is notably ______: she gives equal attention to the views of soldiers, civilians, and political leaders on every side.",
  q:Q_WORD, c:["evenhanded","partisan","cursory","sensational"],
  e:"Equal attention to every side is \"evenhanded,\" or fair. \"Partisan\" means taking one side."},
 {d:3,p:"Because the chemical is ______ even in tiny amounts, workers who handle it must wear gloves and masks at all times.",
  q:Q_WORD, c:["potent","inert","soluble","scarce"],
  e:"Precautions for tiny amounts mean the chemical has a strong effect: \"potent.\" \"Inert\" means it has no effect at all."},
 {d:2,p:"Kamila's first attempts at pottery were clumsy, but with daily practice her technique became increasingly ______.",
  q:Q_WORD, c:["refined","careless","erratic","hesitant"],
  e:"\"But\" contrasts with \"clumsy,\" and daily practice suggests improvement: \"refined.\" The other words describe a technique that has not improved."},
 {d:3,p:"The following text is from a 1920 essay.<br><br>The old merchant had a <u>singular</u> way of bargaining: he praised the buyer's choice so warmly that the buyer felt embarrassed to argue about the price.",
  q:"As used in the text, what does the word \"singular\" most nearly mean?", c:["unusual","lonely","single","grammatical"],
  e:"The colon introduces a strange, distinctive method, so \"singular\" means unusual. \"Single\" and \"grammatical\" are other meanings of the word that do not fit."},
]],
ts:[[
 {d:2,p:"<u>Most people think of sand as a nearly endless resource.</u> Yet the sand used in concrete must have sharp, angular grains, and desert sand, worn smooth by the wind, does not work. As construction booms worldwide, some regions now face shortages of usable sand, and illegal sand mining has damaged rivers and coastlines.",
  q:"Which choice best describes the function of the underlined sentence in the text as a whole?", c:["It presents a common assumption that the rest of the text challenges.","It states the main conclusion of a study described later in the text.","It gives an example of the damage caused by illegal sand mining.","It explains why desert sand cannot be used in concrete."],
  e:"\"Yet\" right after the sentence signals that what follows will challenge it. No study is described."},
 {d:2,p:"The following text is from a short story.<br><br>At first the stranger answered the villagers' questions with a single word. By the end of the week, he was telling stories at the teahouse until midnight, and by the end of the month, no one could remember the village without him.",
  q:"Which choice best describes the overall structure of the text?", c:["It traces a gradual change in how the stranger fits into village life.","It describes a conflict between the stranger and the villagers and then its resolution.","It compares the stranger with another newcomer to the village.","It explains why the stranger came to the village."],
  e:"The time markers (at first, by the end of the week, by the end of the month) trace step-by-step change. There is no conflict, only quietness that fades."},
 {d:3,p:"Researchers have long known that crows can use sticks as tools. A recent study went further. Crows were given a short stick that could not reach a piece of food and a long stick placed inside a narrow box. The crows used the short stick to pull out the long one and then used the long stick to reach the food. Few animals other than humans and great apes have shown this kind of planning.",
  q:"Which choice best describes the main purpose of the text?", c:["To describe a study suggesting that crows can plan a sequence of tool uses","To argue that crows are more intelligent than great apes","To explain how crows make tools out of sticks","To question whether crows really use tools"],
  e:"The text reports a study and ends by naming what it shows: planning. It compares crows with apes but never ranks them."},
 {d:3,p:"Some critics argue that translated poems always lose the music of the original. <u>Translator Otabek Jalilov concedes that rhyme and rhythm rarely survive the journey from one language to another.</u> He argues, however, that a skilled translator can recreate a poem's effect by finding new patterns of sound in the second language, as he did in his Uzbek versions of Spanish ballads.",
  q:"Which choice best describes the function of the underlined sentence in the text as a whole?", c:["It acknowledges part of the critics' position before the text presents Jalilov's counterargument.","It provides the main evidence for the critics' claim.","It describes the technique Jalilov uses to translate rhyme.","It explains why Spanish ballads are hard to translate."],
  e:"\"Concedes\" means he admits part of the other side's point, and the next sentence's \"however\" turns to his own argument."},
 {d:2,p:"The following text is from a 1912 novel.<br><br>The house had nine rooms, and Madina's aunt kept eight of them closed. Dust sheets covered the chairs, the clocks had been allowed to stop, and the curtains stayed drawn even at noon. Only the kitchen, warm and bright, seemed to belong to the living.",
  q:"Which choice best describes the function of the final sentence in the text as a whole?", c:["It contrasts one lively room with the stillness of the rest of the house.","It explains why Madina's aunt closed the other rooms.","It introduces a character who lives in the kitchen.","It suggests that the house will soon be sold."],
  e:"\"Only\" sets the warm, bright kitchen against the dusty, stopped, dark rooms before it. No reason for closing the rooms is given."},

 {d:3,p:"Engineers once designed skyscrapers to be as stiff as possible so they would resist the wind. Very tall buildings, however, sway in strong winds no matter how stiff they are. Many modern towers therefore have a huge weight near the top that swings opposite to the building's sway, reducing the movement felt by people inside.",
  q:"Which choice best describes the overall structure of the text?", c:["It describes an older approach, notes its limitation, and then presents a newer solution.","It explains a problem and argues that it cannot be solved.","It compares two buildings and explains why one is taller.","It presents a theory and then gives evidence that disproves it."],
  e:"Old approach (stiffness), limitation (\"however,\" they still sway), newer solution (\"therefore,\" a swinging weight)."},
],[
 {d:2,p:"Mosquitoes find people partly by detecting the carbon dioxide we breathe out. Once they are close, they rely on other cues, such as body heat and the smell of skin. This is why some people seem to attract more mosquitoes than others: their skin gives off chemicals that mosquitoes find especially appealing.",
  q:"Which choice best describes the main purpose of the text?", c:["To explain how mosquitoes locate people and why some people attract more of them","To recommend ways to avoid mosquito bites","To argue that carbon dioxide is the only cue mosquitoes use","To describe how mosquitoes spread disease"],
  e:"The text explains a process and then a consequence of it. It names several cues, so \"only cue\" is wrong, and it gives no advice."},
 {d:3,p:"Many museums display ancient Greek statues as gleaming white marble. <u>Traces of paint found on the statues tell a different story.</u> Using ultraviolet light, researchers have detected remains of bright blues, reds, and golds, showing that many statues were once vividly painted.",
  q:"Which choice best describes the function of the underlined sentence in the text as a whole?", c:["It signals that the evidence described next will challenge a common image of Greek statues.","It describes how museums clean their statues.","It states that the paint was added by modern restorers.","It summarizes the collection of a single museum."],
  e:"\"A different story\" turns away from the white-marble image and sets up the evidence that follows."},
 {d:2,p:"The following text is from a 1903 novel.<br><br>The letter lay on the table all morning. Feruza walked past it on her way to the garden, again on her way back, and a third time with a basket of apples, each time slowing a little more. At last she set down the basket, picked up the letter, and carried it, still unopened, to the window.",
  q:"Which choice best describes the overall structure of the text?", c:["It shows a character's growing pull toward an object she has been avoiding.","It lists a character's daily chores in the order she does them.","It reveals what a letter says and how the character reacts.","It contrasts two characters' attitudes toward a letter."],
  e:"Each pass she slows \"a little more\" until she finally picks it up. The letter stays unopened, so its contents are never revealed."},
 {d:3,p:"Some economists measure a country's well-being only by its total production of goods and services. Economist Gulnoza Saidova argues that this measure leaves out unpaid work, such as caring for children and older relatives, which in many households takes up more hours than paid jobs do. Ignoring such work, she contends, makes economies that depend heavily on it look poorer than they really are.",
  q:"Which choice best describes the main purpose of the text?", c:["To present Saidova's argument that a common economic measure overlooks important work","To explain how a country's total production is calculated","To argue that unpaid work should be replaced by paid work","To show that caring for relatives takes more time than any paid job"],
  e:"The text introduces a measure only so Saidova can criticize it. \"In many households\" is far narrower than \"any paid job.\""},
 {d:3,p:"Monarch butterflies travel up to 4,000 kilometers to spend the winter in the mountains of central Mexico. <u>No single butterfly makes the round trip.</u> The monarchs that fly south in autumn are the great-grandchildren of those that left Mexico the previous spring, yet they find their way to the same forests.",
  q:"Which choice best describes the function of the underlined sentence in the text as a whole?", c:["It introduces a surprising fact that the next sentence explains in more detail.","It contradicts the claim that monarchs migrate to Mexico.","It gives the distance that monarchs travel.","It explains how the butterflies find the same forests."],
  e:"The next sentence explains why no butterfly makes the round trip: several generations share the journey. How they navigate is left as a mystery."},
 {d:2,p:"The following text is from a 1919 poem. The speaker is addressing a river.<br><br>You carried my grandfather's boats to market,<br>my father's logs to the mill;<br>now you carry only light<br>and children's paper ships.",
  q:"Which choice best describes the overall structure of the text?", c:["It describes how the river's role has changed across generations.","It argues that the river should be used for trade again.","It describes a flood that destroyed the mill.","It compares the river with the sea."],
  e:"Grandfather, father, now: the poem moves through generations, from working river to quiet, playful river. It makes no argument."},
]],
ct:[[
 {d:2,p:"<p><b>Text 1</b><br>Some nutrition writers advise eating many small meals throughout the day. They claim this keeps metabolism high and therefore helps people lose weight.</p><p><b>Text 2</b><br>In controlled studies, people who ate the same total calories in two or three meals lost just as much weight as people who ate six small meals. What matters, the researchers concluded, is how much people eat, not how often.</p>",
  q:"Based on the texts, how would the researchers in Text 2 most likely respond to the claim in Text 1?", c:["By arguing that meal frequency matters less for weight loss than total calories eaten","By agreeing that frequent small meals raise metabolism","By recommending that people eat only one meal a day","By claiming that weight loss is impossible without exercise"],
  e:"Text 2's results show no benefit from more frequent meals and point to total intake instead."},
 {d:3,p:"<p><b>Text 1</b><br>Many readers complain that novelist Hamid Ergashev ends his books abruptly, leaving major questions unanswered. They see this as carelessness, as if he simply lost interest in his own stories.</p><p><b>Text 2</b><br>Ergashev's endings are deliberate. He has said in interviews that he wants readers to keep thinking about his characters after the last page, and his drafts show that he rewrote his final chapters several times to make them more open.</p>",
  q:"Based on the texts, how would the author of Text 2 most likely respond to the readers described in Text 1?", c:["The readers mistake an intentional choice for carelessness.","The readers are right that Ergashev's open endings are a flaw.","Ergashev's endings became more complete with each draft.","Ergashev agrees that he lost interest in his stories."],
  e:"Text 2 accepts that the endings are open but denies the cause: they are \"deliberate.\" The drafts made the endings more open, not more complete."},
 {d:3,p:"<p><b>Text 1</b><br>Many astronomers think the best places to search for life beyond Earth are planets orbiting other stars at just the right distance for liquid water to exist on their surfaces.</p><p><b>Text 2</b><br>Some of the most promising places may be much closer. Moons such as Jupiter's Europa and Saturn's Enceladus lie far outside the zone where surface water could stay liquid, yet beneath their icy crusts they appear to hold oceans kept warm from within.</p>",
  q:"Based on the texts, how would the author of Text 2 most likely respond to the astronomers in Text 1?", c:["By noting that liquid water may exist in places that do not meet the astronomers' distance requirement","By agreeing that only planets at the right distance from a star can hold water","By arguing that life cannot exist beneath ice","By claiming that Europa and Enceladus orbit other stars"],
  e:"Text 2's moons are outside the \"right distance\" zone yet seem to have liquid water, which expands where to look."},
 {d:2,p:"<p><b>Text 1</b><br>Homework in elementary school does little to improve learning, some researchers argue. Studies find only a weak link between time spent on homework and test scores for young children.</p><p><b>Text 2</b><br>Even if homework barely raises young children's test scores, it may build habits such as planning and working independently, and those habits pay off in later grades.</p>",
  q:"Based on the texts, how would the author of Text 2 most likely respond to the researchers in Text 1?", c:["By suggesting that homework may have benefits that test scores do not capture","By rejecting the studies' findings about test scores","By agreeing that homework should be eliminated","By arguing that young children should get more homework than older students"],
  e:"\"Even if\" accepts the test-score finding, then points to other benefits. So Text 2 does not reject the studies."},
 {d:3,p:"<p><b>Text 1</b><br>Historian Sanjar Rahimov argues that the caravan cities on Central Asia's old trade routes began to decline in the 1500s, when European ships opened sea routes to Asia and drew trade away from the overland roads.</p><p><b>Text 2</b><br>Records from the region's caravanserais show that overland trade remained strong well into the 1600s. The cities' decline, argues historian Zarina Olimova, owed more to wars between local states, which made the roads dangerous, than to competition from ships.</p>",
  q:"Based on the texts, how would Olimova most likely respond to Rahimov's argument?", c:["She would say he overstates the effect of sea routes and overlooks the role of regional wars.","She would agree that sea routes made overland trade collapse in the 1500s.","She would argue that the caravan cities never declined.","She would claim that European ships traveled overland."],
  e:"Olimova accepts the decline but disputes the cause and the timing: trade stayed strong into the 1600s, and wars mattered more."},
 {d:3,p:"<p><b>Text 1</b><br>Many ecologists have assumed that city parks are too small and too disturbed by people to support much wildlife.</p><p><b>Text 2</b><br>A survey of 50 parks in one city recorded more than 200 bee species, including several rare ones. The researchers noted that parks with a wide variety of flowering plants, even small parks, supported the most species.</p>",
  q:"Based on the texts, how would the researchers in Text 2 most likely respond to the assumption in Text 1?", c:["By pointing to evidence that even small city parks can support many species","By agreeing that small parks support little wildlife","By arguing that bees are the only animals found in parks","By claiming that parks must be enlarged before they can be studied"],
  e:"Text 2's survey directly counters the assumption, and \"even small parks\" answers the size concern."},
],[
 {d:2,p:"<p><b>Text 1</b><br>Some architects argue that government buildings should have walls of glass, since transparent walls signal openness and honesty.</p><p><b>Text 2</b><br>Glass walls make buildings expensive to heat and cool, and visitors often report feeling watched rather than welcomed. Openness, these critics say, depends on how a government behaves, not on what its buildings are made of.</p>",
  q:"Based on the texts, how would the critics in Text 2 most likely respond to the architects in Text 1?", c:["By arguing that transparent buildings do not by themselves make a government open","By agreeing that glass buildings signal honesty","By claiming that glass is cheaper than stone","By arguing that government buildings should have no windows"],
  e:"Text 2's last sentence answers Text 1 directly: openness comes from behavior, not building materials."},
 {d:3,p:"<p><b>Text 1</b><br>Identical twins raised apart often show striking similarities in personality. Some psychologists conclude from this that personality is largely inherited.</p><p><b>Text 2</b><br>Twins raised apart were often placed by agencies that matched families by background, so the twins grew up in similar homes. Their shared traits may reflect similar environments as much as shared genes.</p>",
  q:"Based on the texts, how would the author of Text 2 most likely respond to the psychologists' conclusion in Text 1?", c:["It may overlook the possibility that similar upbringings help explain the twins' similarities.","It is correct because the twins grew up in completely different homes.","It ignores evidence that identical twins are not genetically identical.","It shows that environment has no effect on personality."],
  e:"Text 2 offers another explanation, similar homes, without denying a role for genes."},
 {d:2,p:"<p><b>Text 1</b><br>Critic Dildora Yuldasheva praises the film for its long, quiet scenes, which she says let viewers feel the slow passing of time in the mountain village where it is set.</p><p><b>Text 2</b><br>Critic Botir Nurmatov found the same scenes tedious. Although he admires the film's photography, he argues that its pacing tests the patience of even devoted viewers.</p>",
  q:"Which choice best describes a difference in how the two critics view the film?", c:["Yuldasheva sees the film's slow pace as a strength, while Nurmatov sees it as a weakness.","Yuldasheva dislikes the film's photography, while Nurmatov admires it.","Both critics believe the film is too short.","Nurmatov finds the setting unrealistic, while Yuldasheva does not discuss the setting."],
  e:"They disagree about the same feature, the long quiet scenes. Yuldasheva never mentions the photography."},
 {d:3,p:"<p><b>Text 1</b><br>Many historians describe the invention of the mechanical clock in medieval Europe as the moment when ordinary people began to organize their days by the hour.</p><p><b>Text 2</b><br>For centuries after clocks appeared in town towers, most rural workers still timed their days by the sun and by church bells that rang only a few times a day. Clock time, this historian argues, spread slowly and unevenly, reaching most households only with cheap pocket watches in the 1800s.</p>",
  q:"Based on the texts, how would the author of Text 2 most likely respond to the historians in Text 1?", c:["By arguing that the shift to clock time happened far more gradually than they suggest","By denying that mechanical clocks were invented in medieval Europe","By agreeing that clocks quickly changed daily life for most people","By claiming that church bells kept better time than clocks"],
  e:"Text 2 accepts the invention but challenges the timing of its effect: centuries, not a single \"moment.\""},
 {d:3,p:"<p><b>Text 1</b><br>Conservation groups often focus on large, appealing animals such as tigers and pandas. Critics call this unscientific, since many less charming species play larger roles in their ecosystems.</p><p><b>Text 2</b><br>Protecting a tiger means protecting the forest it roams, along with the countless insects, plants, and fungi that share it. Appealing animals attract funding that ends up benefiting whole ecosystems.</p>",
  q:"Based on the texts, how would the author of Text 2 most likely respond to the critics discussed in Text 1?", c:["Focusing on appealing animals can also protect the less charming species the critics care about.","Less charming species do not matter to ecosystems.","Tigers play the largest role in every ecosystem.","Conservation money should be divided equally among all species."],
  e:"Text 2 answers the critics on their own terms: protecting the tiger protects the insects, plants, and fungi too."},
 {d:2,p:"<p><b>Text 1</b><br>Online reviews help shoppers make better choices, some economists argue, because they let buyers learn from the experiences of thousands of other customers.</p><p><b>Text 2</b><br>Studies have found that a large share of online reviews are written by people who were paid or given free products, and that shoppers struggle to tell such reviews apart from genuine ones.</p>",
  q:"Based on the texts, how would the author of Text 2 most likely respond to the economists' argument?", c:["Reviews are less useful when many of them are not honest accounts of customers' experiences.","Shoppers should never buy products online.","Paid reviews are easier to spot than genuine ones.","Reviews are helpful because thousands of customers write them."],
  e:"The economists assume reviews reflect real experiences. Text 2 says many do not, and shoppers cannot tell which. It never says to stop shopping online."},
]],
tr:[[
 {d:1,p:"Ostriches are the largest living birds. ______ they cannot fly; their wings are far too small to lift their heavy bodies.",
  q:Q_TRANS, c:["However,","Therefore,","For example,","Similarly,"],
  e:"Birds are expected to fly, so \"cannot fly\" is a contrast: \"However.\""},
 {d:2,p:"The first version of the app crashed often and drained phone batteries. ______ the developers rewrote much of its code before releasing a second version.",
  q:Q_TRANS, c:["Consequently,","Nevertheless,","In contrast,","For instance,"],
  e:"The rewrite is a result of the problems, so \"Consequently\" fits. \"Nevertheless\" would suggest they rewrote it despite the problems."},
 {d:2,p:"Many spices once traveled thousands of kilometers to reach European kitchens. Cinnamon, ______ came from Sri Lanka, and nutmeg came from a small group of islands in what is now Indonesia.",
  q:Q_TRANS, c:["for example,","however,","therefore,","instead,"],
  e:"Cinnamon and nutmeg are examples of spices that traveled far."},
 {d:3,p:"Scientists expected the drought to harm the region's oak trees, which need plenty of water. ______ the oaks survived with little damage, while the supposedly hardier pines nearby lost many of their needles.",
  q:Q_TRANS, c:["Surprisingly,","Predictably,","Similarly,","In other words,"],
  e:"The result goes against what scientists expected, so \"Surprisingly\" fits. \"Predictably\" says the opposite."},
 {d:3,p:"Most of the bazaar's vendors sell food: dried fruit, bread, spices, and fresh vegetables. ______ a small section near the north gate is devoted to hand-painted ceramics and embroidered textiles.",
  q:Q_TRANS, c:["That said,","Likewise,","As a result,","Specifically,"],
  e:"The ceramics section is an exception to \"most vendors sell food.\" \"That said\" introduces a qualification. \"Specifically\" would introduce more detail about the food."},
 {d:3,p:"The new railway cut the travel time between the two cities from six hours to just over two. ______ many people who once moved to the capital for work now commute there from their hometowns.",
  q:Q_TRANS, c:["As a result,","Even so,","By contrast,","Previously,"],
  e:"Commuting became possible because the trip got shorter, a cause and effect relationship."},
],[
 {d:2,p:"The ancient city was abandoned around 1400. ______ its ruins were buried by sand and forgotten for nearly five hundred years.",
  q:Q_TRANS, c:["Afterward,","Previously,","In contrast,","For instance,"],
  e:"Being buried and forgotten happened after the abandonment, so a time transition, \"Afterward,\" fits."},
 {d:2,p:"Solar panels produce no electricity at night. ______ many solar power plants now store energy in large batteries during the day so they can supply power after sunset.",
  q:Q_TRANS, c:["For this reason,","Similarly,","In other words,","By contrast,"],
  e:"Storing energy is a response to the night-time problem, so \"For this reason\" fits."},
 {d:3,p:"The critic praised the novel's vivid descriptions of the mountains. ______ she found its characters flat and its dialogue stiff.",
  q:Q_TRANS, c:["However,","Accordingly,","Indeed,","Likewise,"],
  e:"Praise is followed by criticism, a contrast. \"Indeed\" and \"Likewise\" would continue the praise."},
 {d:3,p:"Researchers found that the medicine lowered blood pressure in adults under fifty. ______ it had almost no effect on patients over seventy, a group the researchers plan to study further.",
  q:Q_TRANS, c:["In contrast,","Moreover,","Thus,","For example,"],
  e:"One age group responded and another did not, which is a contrast."},
 {d:3,p:"The poet rarely used rhyme in her early work. ______ her later collections are full of carefully rhymed sonnets, a change critics link to the years she spent translating classical Persian poetry.",
  q:Q_TRANS, c:["By contrast,","Similarly,","For instance,","That is,"],
  e:"\"Rarely used rhyme\" and \"full of rhymed sonnets\" are opposites, so the sentences contrast."},
 {d:2,p:"To prepare for the exam, Kamron reviewed his old mistakes every evening. ______ he took a full, timed practice test every Saturday morning.",
  q:Q_TRANS, c:["Additionally,","Instead,","However,","In conclusion,"],
  e:"The practice test is a second, added part of his preparation. \"Instead\" would mean it replaced the evening reviews."},
]],
rs:[[
 {d:2,p:notes(["The Registan is a public square in Samarkand.","It is framed by three madrasas (Islamic schools).","The Ulugh Beg Madrasa was completed in 1420.","The Tilya-Kori Madrasa was completed around 1660."]),
  q:"The student wants to emphasize that the Registan's madrasas were built at very different times. "+Q_RS, c:["The Registan's Ulugh Beg Madrasa was completed in 1420, while its Tilya-Kori Madrasa was not finished until around 1660.","The Registan, a public square in Samarkand, is framed by three madrasas.","The Ulugh Beg Madrasa was completed in 1420.","Madrasas are Islamic schools, and three of them frame the Registan."],
  e:"\"Very different times\" needs two dates to compare. Only one choice gives both."},
 {d:2,p:notes(["Axolotls are salamanders native to lakes near Mexico City.","Unlike most salamanders, they keep their gills as adults.","Axolotls can regrow lost limbs.","They can also regrow parts of their heart and spinal cord."]),
  q:"The student wants to emphasize how far the axolotl's ability to regrow body parts extends. "+Q_RS, c:["Axolotls can regrow not only lost limbs but also parts of their heart and spinal cord.","Axolotls, salamanders native to lakes near Mexico City, can regrow lost limbs.","Unlike most salamanders, axolotls keep their gills as adults.","Axolotls are salamanders that live near Mexico City."],
  e:"\"How far it extends\" calls for the full range, limbs plus heart and spinal cord. Limbs alone shows less."},
 {d:3,p:notes(["Two schools tried different class start times.","School A started classes at 7:30 a.m.","School B started classes at 8:45 a.m.","Students at School B slept 40 minutes more per night, on average.","Attendance at School B was 6% higher."]),
  q:"The student wants to suggest that later start times may benefit students. "+Q_RS, c:["At School B, where classes started at 8:45 a.m. rather than 7:30 a.m., students slept 40 minutes more per night and had 6% higher attendance.","School A started classes at 7:30 a.m., and School B started at 8:45 a.m.","Two schools tried different start times to study student sleep.","Students at School B slept about 40 minutes more per night."],
  e:"The choice must link the later start time to benefits. The sleep-only choice never mentions start times, and the times-only choice gives no benefits."},
 {d:3,p:notes(["Alisher Navoi (1441–1501) was a poet and statesman in Herat.","He wrote mainly in Chagatai Turkic.","At the time, Persian was considered the main literary language of the region.","In one work, he argued that Turkic was at least as rich a literary language as Persian."]),
  q:"The student wants to explain why Navoi's choice of language was significant. "+Q_RS, c:["Navoi wrote mainly in Chagatai Turkic at a time when Persian was considered the region's main literary language, and he argued that Turkic was just as rich.","Alisher Navoi, who lived from 1441 to 1501, was a poet and statesman in Herat.","Persian was considered the main literary language of Navoi's region.","Navoi was a statesman as well as a poet."],
  e:"Significance comes from the contrast: he chose Turkic when Persian dominated, and he defended that choice."},
 {d:2,p:notes(["The Aral Sea was once the fourth-largest lake in the world.","In the 1960s, the rivers feeding it were diverted to irrigate cotton fields.","By 2010, it had shrunk to about 10% of its original area.","A dam built in 2005 has helped its northern part recover."]),
  q:"The student wants to emphasize the scale of the Aral Sea's decline. "+Q_RS, c:["Once the world's fourth-largest lake, the Aral Sea had shrunk to about 10% of its original area by 2010.","A dam built in 2005 has helped the northern part of the Aral Sea recover.","In the 1960s, rivers feeding the Aral Sea were diverted to irrigate cotton.","The Aral Sea was once the fourth-largest lake in the world."],
  e:"Scale means how big the loss was: from fourth-largest to about a tenth of its size. The cause and the recovery are not the scale."},
 {d:3,p:notes(["Researchers compared two fertilizers on tomato plants.","Fertilizer X increased yield by 20%.","Fertilizer Y increased yield by 18%.","Fertilizer Y costs half as much as Fertilizer X."]),
  q:"The student wants to make a case for choosing Fertilizer Y. "+Q_RS, c:["Although Fertilizer Y raised tomato yields slightly less than Fertilizer X did (18% versus 20%), it costs only half as much.","Fertilizer X increased tomato yields by 20%, more than Fertilizer Y did.","Researchers compared two fertilizers on tomato plants.","Fertilizer Y increased tomato yields by 18%."],
  e:"The case for Y is its price for nearly the same result. A choice that leads with Fertilizer X’s bigger gain argues for the other fertilizer."},
],[
 {d:2,p:notes(["Hedy Lamarr was a film actress in the 1930s and 1940s.","During World War II, she co-invented a radio system with composer George Antheil.","The system rapidly switched frequencies so that signals could not be jammed.","Similar \"frequency hopping\" ideas are used today in Wi-Fi and Bluetooth."]),
  q:"The student wants to emphasize the lasting impact of Lamarr's invention. "+Q_RS, c:["Ideas similar to the frequency-hopping system that Hedy Lamarr co-invented during World War II are used today in Wi-Fi and Bluetooth.","Hedy Lamarr was a film actress who co-invented a radio system with George Antheil.","Lamarr's system switched frequencies rapidly so signals could not be jammed.","Lamarr acted in films in the 1930s and 1940s."],
  e:"\"Lasting impact\" means a link to today. Only one choice connects the invention to present-day technology."},
 {d:2,p:notes(["The cheetah can run up to about 110 kilometers per hour.","It can keep this speed for only about 30 seconds.","The pronghorn, a North American mammal, can run about 90 kilometers per hour.","The pronghorn can keep up a high speed for several minutes."]),
  q:"The student wants to contrast the running abilities of the two animals. "+Q_RS, c:["While the cheetah is faster, reaching about 110 kilometers per hour, the pronghorn can keep up a high speed far longer: several minutes rather than about 30 seconds.","The cheetah can run about 110 kilometers per hour for about 30 seconds.","The pronghorn is a North American mammal that can run about 90 kilometers per hour.","Both the cheetah and the pronghorn are fast runners."],
  e:"A contrast needs both animals and a difference between them. The \"both are fast\" choice shows a similarity instead."},
 {d:3,p:notes(["A survey asked 500 teenagers where they learn most of their new words.","45% said from reading for fun.","30% said from videos and social media.","25% said from school lessons."]),
  q:"The student wants to emphasize that most surveyed teenagers learn new words outside of school lessons. "+Q_RS, c:["Three-quarters of the surveyed teenagers said they learn most new words outside school lessons: 45% from reading for fun and 30% from videos and social media.","25% of the surveyed teenagers said they learn most new words from school lessons.","45% of the surveyed teenagers said they learn most new words from reading for fun.","A survey asked 500 teenagers where they learn most of their new words."],
  e:"\"Most\" needs a majority. 45% alone is not a majority, but 45% plus 30% is three-quarters."},
 {d:3,p:notes(["Paleontologists found a dinosaur fossil in Uzbekistan's Kyzylkum Desert.","The dinosaur, named Timurlengia, lived about 90 million years ago.","It was a relative of Tyrannosaurus rex but only about the size of a horse.","Its well-preserved braincase showed that it had excellent hearing."]),
  q:"The student wants to introduce Timurlengia to an audience unfamiliar with it. "+Q_RS, c:["Timurlengia, a horse-sized relative of Tyrannosaurus rex, lived about 90 million years ago in what is now Uzbekistan's Kyzylkum Desert.","Its braincase showed that it had excellent hearing.","Paleontologists often search for fossils in deserts.","Like Tyrannosaurus rex, it lived millions of years ago."],
  e:"An introduction names the animal and tells what, when, and where. Two choices use \"it\" without ever saying what \"it\" is."},
 {d:2,p:notes(["In 1953, Tenzing Norgay and Edmund Hillary reached the summit of Mount Everest.","They were the first people confirmed to do so.","Everest is 8,849 meters tall.","Today, hundreds of climbers reach the summit each year."]),
  q:"The student wants to emphasize how common reaching Everest's summit has become since 1953. "+Q_RS, c:["Since Tenzing Norgay and Edmund Hillary first reached Everest's summit in 1953, the climb has become so common that hundreds of people reach the top each year.","Everest is 8,849 meters tall.","In 1953, Tenzing Norgay and Edmund Hillary became the first people confirmed to reach Everest's summit.","Tenzing Norgay and Edmund Hillary climbed Mount Everest."],
  e:"\"How common it has become\" needs the change from the first climb to today's hundreds."},
 {d:3,p:notes(["A city added protected bike lanes on Main Street in 2022.","Bike trips on Main Street rose from 300 to 1,100 per day.","Car traffic on Main Street fell by 8%.","Sales at shops on Main Street rose by 12%."]),
  q:"The student wants to reassure shop owners who fear that bike lanes will hurt their business. "+Q_RS, c:["After protected bike lanes were added to Main Street in 2022, sales at shops there rose by 12%.","Bike trips on Main Street rose from 300 to 1,100 per day.","Car traffic on Main Street fell by 8% after the bike lanes were added.","The city added protected bike lanes on Main Street in 2022."],
  e:"Shop owners care about sales. The car-traffic fact might even worry them more."},
]],
bd:[[
 {d:2,p:"The Zarafshan River gives its name to a valley rich in ______ its water has irrigated farms there for more than two thousand years.",
  q:Q_CONV, c:["orchards;","orchards,","orchards","orchards, which"],
  e:"Both sides are complete sentences, so a semicolon joins them. A comma alone makes a comma splice, and no punctuation makes a run-on."},
 {d:2,p:"The museum's newest exhibit includes three kinds of ______ painted ceramics, woven carpets, and silver jewelry.",
  q:Q_CONV, c:["objects:","objects;","objects, such as:","objects"],
  e:"A complete sentence introduces a list, so a colon is correct. A semicolon needs a complete sentence after it, and a colon never follows \"such as.\""},
 {d:3,p:"Biologist Dilnoza Rashidova, who has studied snow leopards in the Pamir Mountains for more than a ______ uses hidden cameras to track the animals' movements.",
  q:Q_CONV, c:["decade,","decade","decade;","decade—"],
  e:"The extra information began with a comma after \"Rashidova,\" so it must end with a comma too. A dash cannot close a comma pair."},
 {t:'tap', d:3, s:"The festival drew thousands of *visitors,* however, many residents complained about the noise.",
  e:"Two complete sentences surround \"however,\" so a comma cannot join them. It should read \"visitors; however, many residents...\""},
 {d:2,p:"When the bridge finally opened in ______ the ferry that had carried passengers across the river for decades stopped running.",
  q:Q_CONV, c:["1936,","1936;","1936.","1936"],
  e:"\"When the bridge finally opened in 1936\" is an introductory clause, not a full sentence, so it ends with a comma, not a semicolon or period."},
 {d:3,p:"Many plants rely on animals to spread their ______ cherry trees, for instance, depend on birds that eat the fruit and drop the pits far away.",
  q:Q_CONV, c:["seeds;","seeds,","seeds","seeds, where"],
  e:"Both halves are complete sentences, and \"for instance\" does not join them. A semicolon is needed."},
],[
 {d:2,p:"The expedition set out at ______ by noon, the climbers had reached the first camp.",
  q:Q_CONV, c:["dawn, and","dawn,","dawn","dawn, which"],
  e:"Two complete sentences can be joined with a comma plus \"and.\" A comma alone is a comma splice."},
 {d:3,p:"The term \"Silk Road\" was coined in 1877 by the German geographer Ferdinand von ______ who used it to describe the network of trade routes linking China and the Mediterranean.",
  q:Q_CONV, c:["Richthofen,","Richthofen;","Richthofen","Richthofen."],
  e:"\"Who used it...\" is extra information about Richthofen, set off with a comma. It is not a complete sentence, so a semicolon or period is wrong."},
 {d:3,p:"Two features make the building ______ its walls are made of rammed earth, and its roof collects rainwater for the garden below.",
  q:Q_CONV, c:["unusual:","unusual","unusual,","unusual, and"],
  e:"The colon introduces the two features that explain \"unusual.\" A comma alone would create a comma splice."},
 {d:2,p:"The violinist practiced the difficult passage for ______ she still worried that she would stumble during the concert.",
  q:Q_CONV, c:["hours, but","hours,","hours","hours but,"],
  e:"Two complete sentences joined by \"but\" need a comma before \"but,\" not after it."},
 {t:'tap', d:3, s:"Samarkand's Registan square is framed by three *madrasas,* each one is decorated with blue and gold tilework.",
  e:"\"Each one is decorated...\" is a complete sentence, so a comma cannot join it to the first one. Use a semicolon, or drop \"is\": \"madrasas, each one decorated...\""},
 {d:3,p:"The scientist's explanation—that the strange lights were caused by a rare type of ______ satisfied most of the people who had reported seeing them.",
  q:Q_CONV, c:["lightning—","lightning,","lightning;","lightning"],
  e:"The explanation opens with a dash, so it must close with a dash. Mixing a dash with a comma breaks the pair."},
]],
fss:[[
 {d:2,p:"The list of ingredients on the jars ______ printed in three languages.",
  q:Q_CONV, c:["is","are","were","have been"],
  e:"The subject is \"list\" (singular), not \"ingredients\" or \"jars.\" Skip the prepositional phrases to find it."},
 {d:2,p:"Last spring, the students ______ a small garden behind the school, and now it supplies vegetables for the cafeteria.",
  q:Q_CONV, c:["planted","plant","will plant","are planting"],
  e:"\"Last spring\" calls for the past tense."},
 {d:3,p:"Having studied the ancient coins for months, ______",
  q:Q_CONV, c:["the historian concluded that they had been minted in Bukhara.","the coins were found to have been minted in Bukhara.","Bukhara was where the historian concluded the coins were minted.","it was concluded by the historian that the coins had been minted in Bukhara."],
  e:"The person who did the studying must come right after the comma. Only \"the historian\" can study coins."},
 {d:3,p:"Each of the volunteers who cleaned the riverbank ______ given a certificate at the end of the day.",
  q:Q_CONV, c:["was","were","are","have been"],
  e:"The subject is \"Each,\" which is singular. The story is in the past, so \"was.\""},
 {t:'tap', d:2, s:"The stork built *it's* nest on top of the old minaret.",
  e:"\"It's\" means \"it is.\" The possessive form, with no apostrophe, is \"its.\""},
 {d:3,p:"The architect's designs for the new library are more daring than ______",
  q:Q_CONV, c:["those of her rivals.","her rivals.","her rivals are.","that of her rivals."],
  e:"Compare designs with designs. \"Designs\" is plural, so the stand-in word is \"those,\" not \"that.\""},
],[
 {d:2,p:"The researchers ______ their results next month, after a second laboratory repeats the experiment.",
  q:Q_CONV, c:["will publish","published","have published","had published"],
  e:"\"Next month\" points to the future."},
 {d:3,p:"Neither the manager nor her assistants ______ aware that the shipment had been delayed.",
  q:Q_CONV, c:["were","was","is","has been"],
  e:"With \"neither... nor,\" the verb agrees with the nearer subject, \"assistants,\" which is plural. The sentence is in the past, so \"were.\""},
 {d:2,p:"The students handed in ______ essays before leaving for the trip.",
  q:Q_CONV, c:["their","there","they're","its"],
  e:"The essays belong to the students, so use the plural possessive \"their.\" \"There\" is a place and \"they're\" means \"they are.\""},
 {d:3,p:"Known for its blue-tiled domes, ______",
  q:Q_CONV, c:["Samarkand attracts visitors from around the world.","visitors from around the world are attracted to Samarkand.","many visitors from around the world come to Samarkand.","the world sends visitors to Samarkand."],
  e:"The city, not the visitors, is known for its domes, so \"Samarkand\" must come right after the comma."},
 {d:3,p:"The festival's organizers hope to attract more visitors, raise money for local schools, and ______",
  q:Q_CONV, c:["promote traditional crafts.","promoting traditional crafts.","to promote traditional crafts.","traditional crafts will be promoted."],
  e:"The list after \"hope to\" is attract, raise, and promote. Keep the same verb form for all three items."},
 {t:'tap', d:3, s:"The number of students who signed up for the debate club *have* doubled since last year.",
  e:"The subject is \"number\" (singular), not \"students.\" It should read \"has doubled.\""},
]],
};

const WORDS = VSETS.flatMap(s=>s.words.map(w=>w.slice(0,4)));

const VUNITS = VSETS.map((set,k)=>{
  const all = VSETS.flatMap((s,j)=>s.words.map(w=>({w,j})));
  const near = w => new Set(NEAR.filter(g=>g.includes(w)).flat());
  const cloze = (w,i) => {
    const bad = near(w[0]);
    let pool = all.filter(x=>x.j!==k && x.w[1]===w[1] && !bad.has(x.w[0])).map(x=>x.w);
    if(pool.length<6) pool = all.filter(x=>x.j!==k && !bad.has(x.w[0])).map(x=>x.w);
    const pick = []; let h = (k*31 + i*17 + w[0].length) % pool.length;
    while(pick.length<3){ const c = pool[h % pool.length]; if(!pick.includes(c)) pick.push(c); h += 1; }
    return { p:w[4], q:Q_WORD, c:[w[0], ...pick.map(x=>x[0])], word:w[0], d:set.d||2,
      e:`"${w[0]}" means ${w[2]}, which fits the clue in the sentence. ` + pick.map(x=>`"${x[0]}" means ${x[2]}.`).join(' ') };
  };
  const ws = set.words;
  const A = [{t:'m', d:1, pairs:ws.slice(0,4).map(w=>[w[0],w[2]])}, ...ws.slice(0,5).map(cloze)];
  const B = [{t:'m', d:1, pairs:ws.slice(5,9).map(w=>[w[0],w[2]])}, ...ws.slice(5,10).map((w,i)=>cloze(w,i+5))];
  const meaning = (w,i) => { const others=[1,2,3].map(s=>ws[(i+s*3)%10]); return { t:'mean', d:1, word:w[0], p:`<p class="vword"><b>${w[0]}</b> <span>${w[1]}</span></p><p>“${w[3]}”</p>`, q:'Which choice best gives the meaning of the word as it is used in the sentence?',
      c:[w[2], ...others.map(o=>o[2])], e:`"${w[0]}" means ${w[2]}.` + others.map(o=>` ${o[2].charAt(0).toUpperCase()+o[2].slice(1)} would be "${o[0]}".`).join('') }; };
  const spell = w => ({ t:'type', d:2, word:w[0], ans:w[0], p:w[4], q:`Type the missing word. It means “${w[2]}” and starts with “${w[0][0]}”.`, e:`The word is "${w[0]}": ${w[2]}. Example: ${w[3]}` });
  const C = [...[1,3,5,7,9].map(i=>meaning(ws[i],i)), ...[0,4,8].map(i=>spell(ws[i]))];
  return { id:'v'+(k+1), sec:4, vocab:true, title:set.title, setNo:k+1,
    tip:'Read the whole sentence before the choices. Find the clue (a colon, "but," "because," an example), predict your own word, then pick the closest match.',
    lessons:[A,B,C], meaning };
});

{ id:'gfrag', grp:0, stat:'bd', title:'Sentences and Fragments',
  intro:'A complete sentence (an independent clause) needs a subject and a main verb and must express a complete thought. Anything less is a fragment, and the SAT always marks fragments wrong.',
  rules:[
   ['Independent clause','Subject + main verb + complete thought. <i>The river flooded.</i> It can stand alone as a sentence.'],
   ['Dependent clause','Starts with a word like <i>because, although, when, which, that, who, if, since</i>. <i>Because the river flooded</i> cannot stand alone.'],
   ['Fragment check','Read the sentence by itself. If you are left waiting ("Because the river flooded... what?"), or there is no main verb, it is a fragment.'],
   ['Watch for -ing and which','<i>The study, which lasted ten years.</i> is a fragment: "which lasted" belongs to a describing clause, so the sentence still has no main verb.'],
  ],
  ex:[['Although the museum was small. It held many treasures.','Although the museum was small, it held many treasures.','"Although the museum was small" is dependent; it must attach to an independent clause.'],
      ['The researcher, who collected samples for a decade.','The researcher collected samples for a decade.','The "who" clause leaves the subject without a main verb.']],
  items:[
   {d:1,p:'Because the bridge was closed for ______ drivers had to take a longer route.',q:Q_CONV,c:['repairs,','repairs;','repairs.','repairs:'],e:'"Because the bridge was closed..." is a dependent clause. It joins the independent clause with a comma. A period or semicolon would leave it as a fragment.'},
   {d:2,p:'The ancient manuscript, discovered in a monastery library in 1950, ______ a list of medicinal plants.',q:Q_CONV,c:['contains','containing','which contains','that contains'],e:'The subject "manuscript" needs a main verb. The other choices turn the rest of the sentence into a description, leaving no main verb.'},
   {d:2,p:'Scientists studying the glacier ______ that it had retreated almost two kilometers.',q:Q_CONV,c:['found','finding','who found','having found'],e:'"Scientists studying the glacier" is the subject; it needs the main verb "found."'},

   {t:'tap',d:2,tq:'Tap the word that makes this group of words a fragment.',s:'*Although* the experiment produced clear results.',e:'"Although" makes the clause dependent. Without it, the words form a complete sentence.'},
   {d:3,p:'Mirzo Ulugbek, ______ an observatory that measured the length of the year with remarkable accuracy.',q:Q_CONV,c:['a ruler and astronomer, built','a ruler and astronomer who built','who was a ruler and astronomer, building','a ruler and astronomer, building'],e:'Only one choice gives "Mirzo Ulugbek" a main verb ("built"). The others leave the sentence without one.'},

{ id:'gjoin', grp:1, stat:'bd', title:'Joining Sentences: Periods, Semicolons, Commas',
  intro:'This is the most tested boundary rule on the digital SAT. When two independent clauses meet, only a few punctuation patterns are allowed.',

   ['Comma splice','A comma alone between two sentences is <b>always wrong</b>: <i>The rain stopped, the sun came out.</i>'],

  ]},
{ id:'gcolon', grp:1, stat:'bd', title:'Colons and Dashes',
  intro:'Colons and dashes are tested often because students use them loosely. The rules are actually simple.',
  rules:[
   ['Colon','Must follow a <b>complete sentence</b>. What comes after explains, lists, or gives an example: <i>The recipe needs three things<b>:</b> flour, water and salt.</i>'],
   ['No colon after a verb or "such as"','Wrong: <i>The recipe needs: flour...</i> / <i>such as: flour</i>. The part before the colon must be able to stand alone.'],
   ['A single dash','Works like a colon: complete sentence first, then an explanation: <i>Only one thing mattered<b>—</b>speed.</i>'],
   ['A pair of dashes','Surrounds extra information, like a pair of commas: <i>The tower<b>—</b>built in 1127<b>—</b>still stands.</i> Never mix a dash with a comma for one interruption.'],
  ],
  ex:[['The bag contained: a map, a compass, and a knife.','The bag contained a map, a compass, and a knife.','"The bag contained" is not a complete thought, so no colon.'],
      ['The poet—who was born in Khiva, wrote in three languages.','The poet—who was born in Khiva—wrote in three languages.','Extra information opened with a dash must close with a dash.']],
  items:[
   {d:1,p:'The expedition carried only the ______ water, rope, and a satellite phone.',q:Q_CONV,c:['essentials:','essentials;','essentials, such as:','essentials'],e:'A complete sentence comes before the list, so a colon is right. A semicolon needs a complete sentence after it.'},
   {d:2,p:'The garden includes plants such ______ basil, mint, and coriander.',q:Q_CONV,c:['as','as:','as;','as—'],e:'Never put a colon or dash right after "such as." No punctuation is needed.'},
   {d:2,p:'The painter Kamoliddin Behzod was famous for one quality above ______ his figures seemed to move.',q:Q_CONV,c:['all:','all,','all','all, that'],e:'A complete sentence comes first, and the second part explains the "quality," so a colon fits.'},
   {d:3,p:'The rare orchid—found only on a few cliffs in the ______ blooms for just two days each year.',q:Q_CONV,c:['Pamirs—','Pamirs,','Pamirs','Pamirs;'],e:'The interruption opened with a dash, so it must close with a dash.'},
   {d:3,p:'The study\'s conclusion was ______ students who slept more remembered more.',q:Q_CONV,c:['clear:','clear;','clear, that','clear:that'],e:'"The study\'s conclusion was clear" is complete, and what follows explains it: use a colon followed by a space.'},
   {t:'tap',d:2,s:'The best route to the summit *includes:* a river crossing and a steep ridge.',e:'"The best route to the summit includes" is not a complete sentence, so it cannot come before a colon.'},
  ]},
{ id:'gness', grp:1, stat:'bd', title:'Extra Information (Nonessential Elements)',
  intro:'Extra information can be removed without breaking the sentence. It must be set off on both sides by the same punctuation: two commas, two dashes, or two parentheses.',
  rules:[
   ['The removal test','Cross out the phrase. If the sentence still makes complete sense, the phrase is extra (nonessential) and needs punctuation on both sides.'],
   ['Match the pair','Comma ... comma, dash ... dash, parenthesis ... parenthesis. Never comma ... dash.'],
   ['Essential = no commas','If removing the phrase changes the meaning or identifies which one, it is essential: <i>The students <b>who finished early</b> left.</i> (no commas)'],
   ['Names and titles','<i>The author Abdulla Qodiriy wrote...</i> (no commas: the name identifies which author). <i>Abdulla Qodiriy, the author of "Bygone Days," wrote...</i> (commas: the title is extra).'],
  ],
  ex:[['Samarkand, one of the oldest cities in Central Asia was a key stop on the Silk Road.','Samarkand, one of the oldest cities in Central Asia, was a key stop on the Silk Road.','The extra phrase needs a comma on both sides.'],
      ['The biologist, Feruza Karimova, studies snow leopards.','The biologist Feruza Karimova studies snow leopards.','The name tells us which biologist, so it is essential: no commas.']],
  items:[
   {d:1,p:'The Amu Darya, one of the longest rivers in Central ______ flows into the Aral Sea basin.',q:Q_CONV,c:['Asia,','Asia','Asia—','Asia;'],e:'The extra phrase opened with a comma, so it must close with a comma.'},
   {d:2,p:'The novelist ______ wrote her first book at the age of seventy.',q:Q_CONV,c:['Zulfiya Isroilova','Zulfiya Isroilova,',', Zulfiya Isroilova,',', Zulfiya Isroilova'],e:'The name identifies which novelist, so it is essential and takes no commas.'},
   {d:2,p:'The telescope (completed in ______ allowed astronomers to see galaxies never observed before.',q:Q_CONV,c:['2021)','2021),','2021,','2021'],e:'The parenthesis must close, and no comma is needed after it, since none would be used if the phrase were removed.'},
   {d:3,p:'Wind turbines—which convert the motion of air into ______ now provide more than a tenth of the country\'s power.',q:Q_CONV,c:['electricity—','electricity,','electricity','electricity;'],e:'The interruption began with a dash and must end with one.'},
   {d:3,p:'Students ______ improved their scores the most.',q:Q_CONV,c:['who practiced daily',', who practiced daily,','who practiced daily,',', who practiced daily'],e:'"Who practiced daily" tells which students, so it is essential: no commas.'},
   {t:'tap',d:2,s:'Khiva, a city famous for its mud-brick *walls* attracts thousands of visitors each year.',e:'The extra phrase "a city famous for its mud-brick walls" opened with a comma, so a comma is needed after "walls."'},
  ]},
{ id:'gcomma', grp:1, stat:'bd', title:'Commas You Should Not Use',
  intro:'Many SAT wrong answers simply add commas where none belong. When in doubt, a comma needs a reason.',
  rules:[
   ['No comma between subject and verb','Wrong: <i>The results of the long study<b>,</b> surprised everyone.</i>'],
   ['No comma between verb and object','Wrong: <i>The team discovered<b>,</b> a new species.</i>'],
   ['No comma before "that" or a preposition that continues the idea','Wrong: <i>She argued<b>,</b> that the data were incomplete.</i>'],
   ['Lists of three or more','<i>apples, pears, and plums</i>. Two items need no comma: <i>apples and pears</i>.'],
  ],
  ex:[['The oldest building in the city, is the mausoleum.','The oldest building in the city is the mausoleum.','No comma between the subject and its verb.'],
      ['Researchers found, that the bees preferred blue flowers.','Researchers found that the bees preferred blue flowers.','No comma before "that" when it introduces what was found.']],
  items:[
   {d:1,p:'The students in the robotics ______ a machine that sorts recycling.',q:Q_CONV,c:['club built','club, built','club built,','club, built,'],e:'No comma between the subject ("students in the robotics club") and the verb, or between the verb and its object.'},
   {d:2,p:'The historian argued ______ the map was drawn decades later than its date suggests.',q:Q_CONV,c:['that','that,',', that',':that'],e:'No comma before or after "that" here; it simply introduces what she argued.'},
   {d:2,p:'The festival featured music from ______',q:Q_CONV,c:['Uzbekistan and Tajikistan.','Uzbekistan, and Tajikistan.','Uzbekistan and, Tajikistan.','Uzbekistan, and, Tajikistan.'],e:'Two items joined by "and" need no comma.'},
   {d:3,p:'A recent survey of farmers in the Fergana ______ that most had switched to drip irrigation.',q:Q_CONV,c:['Valley found','Valley, found','Valley found,','Valley—found'],e:'The subject is "A recent survey of farmers in the Fergana Valley." No punctuation between it and the verb "found."'},
   {t:'tap',d:2,s:'The scientist who discovered the *fossil,* donated it to the national museum.',e:'The comma separates the subject ("The scientist who discovered the fossil") from its verb "donated."'},
   {t:'tap',d:3,s:'The guide pointed out the domes, minarets, and *arches,* of the ancient square.',e:'No comma between "arches" and the phrase "of the ancient square," which continues the list item.'},
  ]},
{ id:'gsva', grp:2, stat:'fss', title:'Subject-Verb Agreement',
  intro:'A singular subject takes a singular verb (<i>it is, it runs</i>); a plural subject takes a plural verb (<i>they are, they run</i>). The SAT hides the subject so you match the verb to the wrong word.',
  rules:[
   ['Skip prepositional phrases','<i>The <b>box</b> of old letters <b>is</b> heavy.</i> "Of old letters" is not the subject.'],
   ['Skip interrupters','<i>The <b>director</b>, along with the actors, <b>was</b> late.</i> "Along with," "as well as" and phrases between commas do not change the subject.'],
   ['Singular words that sound plural','<i>Each, every, either, neither, everyone, the number of, a collection, a series, a team</i> take singular verbs.'],
   ['Inverted sentences','<i>Near the gate <b>stand</b> two old <b>trees</b>.</i> Find the subject after the verb.'],
  ],
  ex:[['The list of required books are long.','The list of required books is long.','The subject is "list," not "books."'],
      ['Each of the paintings were restored.','Each of the paintings was restored.','"Each" is singular.']],
  items:[
   {d:1,p:'The collection of rare coins ______ kept in a locked case.',q:Q_CONV,c:['is','are','were','have been'],e:'The subject is "collection," which is singular.'},
   {d:2,p:'The number of students taking the exam ______ grown every year.',q:Q_CONV,c:['has','have','are','were'],e:'"The number of" is singular, so "has."'},
   {d:2,p:'The mayor, along with several council members, ______ the opening of the new park.',q:Q_CONV,c:['attended','have attended','were attending','attend'],e:'"Along with several council members" does not change the singular subject "mayor." "Attended" works for singular subjects.'},
   {d:3,p:'Among the treasures found in the tomb ______ a gold necklace and two painted bowls.',q:Q_CONV,c:['were','was','is','has been'],e:'The sentence is inverted: the subject is "a gold necklace and two painted bowls," which is plural.'},
   {t:'tap',d:2,s:'The results of the new study *suggests* that bees can count.',e:'The subject is "results" (plural), so the verb must be "suggest."'},
   {t:'tap',d:3,s:'Neither of the proposed bridge designs *were* strong enough to survive the test.',e:'"Neither" is singular, so the verb must be "was."'},
  ]},
{ id:'gtense', grp:2, stat:'fss', title:'Verb Tense and Form',
  intro:'Keep the tense consistent with the time clues in the sentence and the passage. Change tense only when the timing actually changes.',
  rules:[
   ['Follow the time clues','Words like <i>in 1920, last year, now, currently, by the time</i> tell you which tense is needed.'],
   ['Past perfect (had + verb)','An action completed <b>before another past action</b>: <i>By the time the rescuers arrived, the storm <b>had passed</b>.</i>'],
   ['Present perfect (has/have + verb)','Started in the past and continues or matters now: <i>Scientists <b>have studied</b> the lake since 1960.</i>'],
   ['Correct forms','<i>has <b>begun</b></i> (not began), <i>had <b>written</b></i> (not wrote), <i>has <b>gone</b></i> (not went).'],
  ],
  ex:[['In 1903, the brothers fly the first powered airplane.','In 1903, the brothers flew the first powered airplane.','"In 1903" requires the past tense.'],
      ['She has wrote three novels.','She has written three novels.','After "has," use the past participle "written."']],
  items:[
   {d:1,p:'In 1924, the city ______ its first electric tram line.',q:Q_CONV,c:['opened','opens','will open','has opened'],e:'"In 1924" is a finished past time, so the simple past "opened."'},
   {d:2,p:'By the time the firefighters arrived, the neighbors ______ most of the animals from the barn.',q:Q_CONV,c:['had rescued','rescue','have rescued','will have rescued'],e:'The rescuing finished before the firefighters arrived, so the past perfect is needed.'},
   {d:2,p:'Since 2015, researchers ______ more than 200 new species in the forest.',q:Q_CONV,c:['have identified','identified','identify','had identified'],e:'"Since 2015" describes a period continuing to now: present perfect.'},
   {d:3,p:'The novel follows a young weaver who leaves her village. At first she struggles, but eventually she ______ her own workshop.',q:Q_CONV,c:['opens','opened','had opened','would have opened'],e:'The passage describes the novel in the present tense ("follows," "leaves," "struggles"), so stay in present: "opens."'},
   {t:'tap',d:2,s:'The team has *began* testing the new design.',e:'After "has," the correct form is "begun."'},
   {t:'tap',d:3,s:'Last summer the volunteers *plant* trees along the river and repaired the old footbridge.',e:'"Last summer" calls for the past tense: "planted," which matches "repaired."'},
  ]},
{ id:'gpro', grp:2, stat:'fss', title:'Pronouns',
  intro:'A pronoun must clearly refer to one noun and agree with it in number. The SAT most often tests <i>it/its</i> vs <i>they/their</i>.',
  rules:[
   ['Agreement','Singular nouns take <i>it, its</i>; plural nouns take <i>they, their</i>. Companies, teams, cities and organizations are singular: <i>The company changed <b>its</b> logo.</i>'],
   ['Find the noun','Look back for the noun the pronoun replaces, skipping nouns in prepositional phrases.'],
   ['Its vs it\'s, their vs they\'re','<i>its</i> = belonging to it; <i>it\'s</i> = it is. <i>their</i> = belonging to them; <i>they\'re</i> = they are; <i>there</i> = a place.'],
   ['Who vs which','<i>who</i> for people, <i>which</i> for things. <i>Whose</i> shows possession for both.'],
  ],
  ex:[['The museum reopened their doors in May.','The museum reopened its doors in May.','"Museum" is singular.'],
      ['The bees returned to it\'s hive.','The bees returned to their hive.','"Bees" is plural, and "it\'s" means "it is."']],
  items:[
   {d:1,p:'The orchestra performed ______ final concert of the season in the open air.',q:Q_CONV,c:['its','their','it\'s','they\'re'],e:'"Orchestra" is a single group: "its."'},
   {d:2,p:'The leaves of the plant change color when ______ exposed to cold air.',q:Q_CONV,c:['they are','it is','it was','its'],e:'The pronoun refers to "leaves," which is plural.'},
   {d:2,p:'The scientist ______ discovery changed the field later won a national prize.',q:Q_CONV,c:['whose','who\'s','which','who'],e:'Possession ("the scientist\'s discovery") requires "whose."'},
   {d:3,p:'The city\'s new library, along with its two branches, ______ visitors free access to online databases.',q:Q_CONV,c:['offers','offer','are offering','have offered'],e:'"Along with its two branches" is an interrupter; the subject "library" is singular.'},
   {t:'tap',d:2,s:'The company announced that *their* profits had doubled.',e:'"Company" is singular, so the pronoun must be "its."'},
   {t:'tap',d:3,s:'The giraffe stretched *it\'s* long neck toward the highest leaves.',e:'"It\'s" means "it is." To show possession, use "its."'},
  ]},
{ id:'gapos', grp:2, stat:'fss', title:'Apostrophes: Possessives and Plurals',
  intro:'An apostrophe shows possession (or a contraction). A plain plural never takes an apostrophe.',
  rules:[
   ['Singular possessive','Add <b>\'s</b>: <i>the city\'s walls, the student\'s book.</i>'],
   ['Plural possessive','Plural ending in s: add only <b>\'</b>: <i>the students\' books, the cities\' walls.</i> Irregular plural: <i>the children\'s books.</i>'],
   ['Plain plural','No apostrophe: <i>the students left.</i>'],
   ['Test','Ask: does the word own the next noun? If yes, use an apostrophe. Is it one or many owners? That decides \'s or s\'.'],
  ],
  ex:[['The farmer\'s harvested their crops.','The farmers harvested their crops.','"Farmers" is a plain plural; it owns nothing.'],
      ['The two countries\'s borders were redrawn.','The two countries\' borders were redrawn.','Plural ending in s: add only an apostrophe.']],
  items:[
   {d:1,p:'The ______ performance impressed the judges.',q:Q_CONV,c:['dancer\'s','dancers','dancers\'s','dancer'],e:'One dancer owns the performance: "dancer\'s."'},
   {d:2,p:'Several ______ were damaged by the storm.',q:Q_CONV,c:['houses\' roofs','house\'s roofs','houses roofs\'','houses roof\'s'],e:'Many houses (plural) own the roofs: "houses\' roofs." "Roofs" is a plain plural.'},
   {d:2,p:'The ______ research focused on how bats find insects in complete darkness.',q:Q_CONV,c:['scientists\'','scientists','scientist\'s\'','scientists\'s'],e:'Several scientists own the research: plural possessive "scientists\'."'},
   {d:3,p:'The museum displayed the ______ toys alongside drawings made by their parents.',q:Q_CONV,c:['children\'s','childrens\'','childrens','children\'s\''],e:'"Children" is an irregular plural, so add \'s.'},
   {t:'tap',d:2,s:'The *tourist\'s* crowded into the narrow streets of the old city.',e:'"Tourists" is a plain plural here; it owns nothing.'},
   {t:'tap',d:3,s:'Both *country\'s* governments signed the water agreement in 2023.',e:'Two countries own the governments: the plural possessive is "countries\'."'},
  ]},
{ id:'gmod', grp:2, stat:'fss', title:'Modifiers',
  intro:'A describing phrase at the start of a sentence must be followed immediately by the noun it describes. If not, it is a dangling modifier.',
  rules:[
   ['Who is doing it?','After an opening phrase like <i>Walking to school,</i> ask "who was walking?" That noun must come right after the comma.'],
   ['Most-tested form','The SAT gives the opening phrase and asks you to choose the rest of the sentence. Pick the choice that begins with the correct noun.'],
   ['Possessives do not count','<i>Walking to school, <b>Ali\'s</b> bag broke</i> is wrong: the bag was not walking.'],
   ['Place modifiers near the word they describe','<i>She almost failed every test</i> (did not fail) is different from <i>She failed almost every test</i>.'],
  ],
  ex:[['Flying over the mountains, the villages looked tiny.','Flying over the mountains, the pilot saw tiny villages.','The villages were not flying.'],
      ['Known for its tilework, tourists visit the Shah-i-Zinda.','Known for its tilework, the Shah-i-Zinda attracts tourists.','The tilework belongs to the Shah-i-Zinda, so it must follow the comma.']],
  items:[
   {d:2,p:'Built in the fifteenth century, ______',q:Q_CONV,c:['the observatory once held a giant marble instrument for measuring stars.','astronomers once used a giant marble instrument in the observatory.','a giant marble instrument for measuring stars was once held in the observatory.','the giant instrument\'s marble once measured stars in the observatory.'],e:'The observatory was built in the fifteenth century, so it must come right after the comma.'},
   {d:2,p:'After studying the data for months, ______',q:Q_CONV,c:['the researchers concluded that the river was shrinking.','the conclusion was that the river was shrinking.','the river was found to be shrinking by the researchers.','the researchers\' conclusion was that the river was shrinking.'],e:'Only the researchers studied the data.'},
   {d:3,p:'A pioneer of modern Uzbek theater, ______',q:Q_CONV,c:['Hamza Hakimzoda Niyoziy wrote plays that addressed social reform.','plays about social reform were written by Hamza Hakimzoda Niyoziy.','social reform was a theme of Hamza Hakimzoda Niyoziy\'s plays.','Hamza Hakimzoda Niyoziy\'s plays addressed social reform.'],e:'The pioneer is a person, so his name must follow the comma. "Niyoziy\'s plays" makes the plays the pioneer.'},
   {d:1,p:'Hungry after the long hike, ______',q:Q_CONV,c:['the students ate everything in the picnic basket.','everything in the picnic basket was eaten.','the picnic basket was emptied by the students.','the students\' picnic basket was emptied.'],e:'The students were hungry, so "the students" must follow the comma.'},
   {d:3,p:'Using a new type of satellite, ______',q:Q_CONV,c:['scientists mapped the ocean floor in greater detail than ever before.','the ocean floor was mapped in greater detail than ever before.','a more detailed map of the ocean floor was produced.','the ocean floor\'s map became more detailed than ever before.'],e:'Scientists used the satellite, so they must be named right after the comma.'},
   {d:2,p:'Covered in snow for most of the year, ______',q:Q_CONV,c:['the peaks of the Pamirs are home to few plants.','few plants grow on the peaks of the Pamirs.','there are few plants on the peaks of the Pamirs.','the Pamirs\' plants are few on the peaks.'],e:'The peaks are covered in snow, so "the peaks" must come first.'},
  ]},
{ id:'gpar', grp:2, stat:'fss', title:'Parallel Structure',
  intro:'Items in a list or comparison must have the same grammatical form.',
  rules:[
   ['Lists','<i>She likes reading, writing, and <b>painting</b></i> (not "to paint").'],
   ['Pairs','<i>not only ... but also, either ... or, neither ... nor, both ... and</i> must join matching forms: <i>not only <b>fast</b> but also <b>cheap</b>.</i>'],
   ['Comparisons','Compare like with like: <i>The climate of Tashkent is drier than <b>that of</b> London</i> (not "than London").'],
  ],
  ex:[['The program teaches students to code, design, and they also present projects.','The program teaches students to code, design, and present projects.','All three items should be verbs in the same form.'],
      ['Her essay was longer than her classmates.','Her essay was longer than her classmates\' essays.','Compare an essay to essays, not to people.']],
  items:[
   {d:1,p:'The new park offers space for running, cycling, and ______',q:Q_CONV,c:['picnicking.','to picnic.','people picnic.','a picnic is possible.'],e:'The list uses -ing words: "running, cycling, and picnicking."'},
   {d:2,p:'The guide was not only knowledgeable but also ______',q:Q_CONV,c:['patient.','had patience.','she was patient.','showing patience.'],e:'"Not only knowledgeable" (an adjective) must be matched by "but also patient."'},
   {d:3,p:'The population of Tashkent is far larger than ______',q:Q_CONV,c:['that of Bukhara.','Bukhara.','Bukhara\'s city.','in Bukhara.'],e:'Compare population to population: "that of Bukhara."'},
   {d:2,p:'Volunteers cleaned the riverbank, planted new trees, and ______ signs about protecting wildlife.',q:Q_CONV,c:['put up','putting up','they put up','to put up'],e:'The list uses past-tense verbs: "cleaned, planted, and put up."'},
   {t:'tap',d:2,s:'The coach wanted players who were fast, focused, and *having* discipline.',e:'The list of adjectives needs "disciplined."'},
   {d:3,p:'For the competition, students may either submit a written essay or ______',q:Q_CONV,c:['present a short film.','a short film.','presenting a short film.','they may present a short film.'],e:'"Either submit..." must be matched by "or present..."'},
  ]},
];

GRAMMAR.push(
{ id:'gintro', grp:1, stat:'bd', title:'Introductory Phrases and Clauses',
  intro:'Many SAT sentences open with a phrase or a dependent clause before the main idea. A single comma usually separates that opener from the independent clause that follows.',
  rules:[
   ['Comma after a dependent opener','<i>Although the storm passed, the roads stayed closed.</i> The clause starting with <b>although, because, when, if, since, while</b> ends with a comma.'],
   ['Comma after a long phrase','<i>After three hours of careful work, the team found the error.</i> Longer prepositional or -ing phrases take a comma.'],
   ['No comma after the subject','The opener ends where the subject begins. Never put a comma between the subject and its verb: <i>The team, found the error</i> is wrong.'],
   ['Not a semicolon','A semicolon needs a complete sentence on <b>both</b> sides. <i>Because it rained; we stayed inside</i> is wrong because the first part is dependent.'],
  ],
  ex:[['When the bell rang the students rushed out.','When the bell rang, the students rushed out.','The dependent clause "When the bell rang" needs a comma before the main clause.'],
      ['Because the bridge was closed; we took the ferry.','Because the bridge was closed, we took the ferry.','A dependent clause cannot stand before a semicolon.']],
  items:[
   {d:1,p:'Although the museum is small ______ holds more than two thousand ancient coins.',q:Q_CONV,c:[', it',' it','; it','. It'],e:'The dependent clause "Although the museum is small" ends with a comma before the main clause.'},
   {d:1,p:'After weeks of practice ______ finally mastered the difficult piece.',q:Q_CONV,c:[', the pianist',' the pianist,','; the pianist','. The pianist'],e:'A comma closes the long introductory phrase. No comma goes between the subject and the verb "mastered."'},
   {t:'tap',d:2,tq:'Tap the punctuation mark that should be a comma.',s:'Since the river changed its course*;* the old village now sits far from the water.',e:'"Since the river changed its course" is dependent, so it is followed by a comma, not a semicolon.'},
   {d:2,p:'Using satellite images from the past forty years, ______ how quickly the glacier had retreated.',q:Q_CONV,c:['the researchers measured','the researchers, measured','measuring the researchers','the researchers\' measurement of'],e:'The subject right after the opener must be the ones "using" the images, and no comma separates it from the verb.'},
   {d:3,p:'If the results of the second trial match those of the ______ will publish the findings next spring.',q:Q_CONV,c:['first, the team','first the team','first; the team','first. The team'],e:'The "If" clause is dependent and ends after "first," so a comma comes next.'},
   {t:'tap',d:3,tq:'Tap the unnecessary comma.',s:'When the festival ended, the musicians from Khiva*,* packed their instruments and drove home.',e:'"The musicians from Khiva" is the subject. No comma goes between a subject and its verb "packed."'},
  ]},
{ id:'glist', grp:1, stat:'bd', title:'Punctuating Lists',
  intro:'Lists appear in many SAT punctuation questions. Most lists use commas. When the items themselves contain commas, the list switches to semicolons.',
  rules:[
   ['Simple list','Use commas between items: <i>wool, silk, and cotton</i>. The SAT accepts the comma before <i>and</i>.'],
   ['Colon to introduce a list','A colon may introduce a list only after a <b>complete sentence</b>: <i>She packed three things: a map, water, and a hat.</i>'],
   ['No colon after a verb or preposition','<i>The kit includes: a map</i> is wrong. The words before the colon are not a complete sentence.'],
   ['Semicolons for complex lists','If items already contain commas, separate them with semicolons: <i>Tashkent, Uzbekistan; Almaty, Kazakhstan; and Bishkek, Kyrgyzstan</i>.'],
  ],
  ex:[['The recipe needs: flour, salt, and water.','The recipe needs flour, salt, and water.','"The recipe needs" is not a complete sentence, so no colon.'],
      ['They visited Rome, Italy, Paris, France, and Madrid, Spain.','They visited Rome, Italy; Paris, France; and Madrid, Spain.','Each item contains a comma, so semicolons separate the items.']],
  items:[

   {d:2,p:'The expedition carried everything it needed to survive ______ tents, stoves, and two months of food.',q:Q_CONV,c:[':',';',', such as:',' including:'],e:'"The expedition carried everything it needed to survive" is a complete sentence, so a colon can introduce the list.'},
   {t:'tap',d:2,tq:'Tap the punctuation mark that should be removed.',s:'The new library includes*:* a reading hall, a recording studio, and a café.',e:'"The new library includes" is not a complete sentence, so no colon. The verb leads straight into its objects.'},

{ id:'gcomp', grp:2, stat:'fss', title:'Logical Comparisons',
  intro:'When a sentence compares two things, they must be the same kind of thing. The SAT likes to compare a thing with a person or a place by mistake.',
  rules:[
   ['Compare like with like','<i>Her score was higher than <b>his</b></i> (his score) is fine. <i>Her score was higher than <b>him</b></i> compares a score to a person.'],
   ['that of / those of','Use <i>that of</i> (singular) or <i>those of</i> (plural) to avoid repeating the noun: <i>The climate of Nukus is drier than <b>that of</b> Tashkent.</i>'],
   ['Possessives can do it too','<i>Samarkand\'s history is older than <b>Tashkent\'s</b></i> means Tashkent\'s history.'],
   ['Than vs. then','<i>Than</i> compares (<i>taller than</i>). <i>Then</i> shows time (<i>first this, then that</i>).'],
  ],
  ex:[['The rivers in Africa are longer than Europe.','The rivers in Africa are longer than those in Europe.','Compare rivers to rivers, not to a continent.'],
      ['A cheetah\'s speed is greater than a lion.','A cheetah\'s speed is greater than a lion\'s.','Compare speed to speed.']],
  items:[
   {d:1,p:'The new phone\'s battery lasts much longer than ______',q:Q_CONV,c:['the old phone\'s.','the old phone.','the old phone does battery.','then the old phone.'],e:'Compare battery to battery: "the old phone\'s" (battery).'},
   {d:2,p:'The population of Samarkand is smaller than ______ but its tourist industry is larger.',q:Q_CONV,c:['that of Tashkent,','Tashkent,','those of Tashkent,','Tashkent\'s population is,'],e:'"That of Tashkent" means "the population of Tashkent," a singular noun, so "that" not "those."'},
   {d:2,p:'Unlike ______ the Aral Sea has shrunk to a small fraction of its former size.',q:Q_CONV,c:['Lake Issyk-Kul,','Lake Issyk-Kul\'s water level,','that of Lake Issyk-Kul,','those of Lake Issyk-Kul,'],e:'The Aral Sea (a body of water) is compared with another body of water, Lake Issyk-Kul, not with its water level.'},
   {t:'tap',d:2,tq:'Tap the word that creates an illogical comparison.',s:'The leaves of the Asian elm are smaller than the *oak*, so the tree lets in more light.',e:'Leaves are compared with a tree. It should be "those of the oak."'},
   {d:3,p:'Researchers found that the bones of birds are lighter than ______ because they are filled with tiny air pockets.',q:Q_CONV,c:['those of mammals','mammals','that of mammals','mammal'],e:'Compare bones (plural) with bones: "those of mammals."'},
   {d:2,p:'Today, the train trip from Tashkent to Samarkand takes far less time ______ it did twenty years ago.',q:Q_CONV,c:['than','then','than what','then what'],e:'"Than" makes a comparison. "Then" is about time order, and "what" adds an extra word that breaks the sentence.'},
  ]},
{ id:'gconf', grp:2, stat:'fss', title:'Commonly Confused Words',
  intro:'Some small words sound alike but play different roles. The SAT tests the most common pairs, especially contractions and possessives.',
  rules:[
   ['its / it\'s','<i>Its</i> = belonging to it (<i>the tree lost its leaves</i>). <i>It\'s</i> = it is or it has.'],
   ['their / there / they\'re','<i>Their</i> = belonging to them. <i>There</i> = a place or "there is." <i>They\'re</i> = they are.'],
   ['whose / who\'s','<i>Whose</i> = belonging to whom. <i>Who\'s</i> = who is or who has.'],
   ['affect / effect','Usually <i>affect</i> is the verb (<i>rain affects crops</i>) and <i>effect</i> is the noun (<i>the effect of rain</i>).'],
  ],
  ex:[['The company changed it\'s logo.','The company changed its logo.','Possession needs "its," with no apostrophe.'],
      ['The scientist who\'s research won the prize spoke first.','The scientist whose research won the prize spoke first.','"Whose" shows possession; "who\'s" means "who is."']],
  items:[
   {d:1,p:'The falcon spread ______ wings and rose above the canyon.',q:Q_CONV,c:['its','it\'s','its\'','their'],e:'The wings belong to the falcon (singular), so "its."'},
   {d:1,p:'The students left ______ backpacks in the hall before the exam.',q:Q_CONV,c:['their','there','they\'re','its'],e:'The backpacks belong to the students: "their."'},
   {d:2,p:'Doctors are studying how screen time ______ the sleep of teenagers.',q:Q_CONV,c:['affects','effects','affect','effect'],e:'The verb is needed, and the subject "screen time" is singular: "affects."'},
   {t:'tap',d:2,tq:'Tap the word that is used incorrectly.',s:'The author, *who\'s* novels have been translated into twenty languages, lives in Tashkent.',e:'The novels belong to the author, so it should be "whose."'},
   {d:3,p:'The museum says ______ planning to return the manuscript to the library where it was first found.',q:Q_CONV,c:['it\'s','its','its\'','it'],e:'"It is planning" is needed, so the contraction "it\'s."'},
   {d:3,p:'The new policy had an immediate ______ on traffic: commute times dropped by twenty percent.',q:Q_CONV,c:['effect','affect','effects','affects'],e:'After "an immediate," a singular noun is needed: "effect."'},
  ]},
);

{ id:'r1', title:'The Water Wheels of Bukhara', genre:'History', d:1, text:[
 'For more than a thousand years, the people of Bukhara lived at the edge of a desert. Rain was rare, and summers were long and hot. Yet travelers who arrived at the city described green gardens, shady pools and fruit trees heavy with apricots and pomegranates. The secret was water, carefully moved from the Zarafshan River through a network of canals.',
 'The canals were only part of the system. Because much of the land sat higher than the canals, farmers needed a way to lift the water. They built tall wooden wheels, called <i>chigir</i>, fitted with clay pots around the rim. As a donkey or camel walked in a circle, the wheel turned. Each pot dipped into the canal, filled with water, rose to the top and emptied into a channel that fed the fields.',
 'Within the city, water was stored in large stone pools known as <i>hauz</i>. The most famous, the Lyab-i Hauz, was built in 1620 and surrounded by mulberry trees. These pools were more than reservoirs. People gathered beside them to drink tea, trade news and escape the heat. In this way, the water system shaped not only farming but also the social life of the city.',
 'The pools had a serious drawback, however. Still water became a breeding ground for disease, and in the early twentieth century most of them were filled in. Today only a few remain, but they still remind visitors how much ingenuity it took to make a desert city bloom.'],
 qs:[
  {d:1,q:'What is the main idea of the passage?',c:['Bukhara\'s people built a clever water system that supported both farming and city life.','Bukhara was one of the rainiest cities in Central Asia.','Donkeys and camels were the most valuable animals in Bukhara.','The Lyab-i Hauz is the oldest building in Bukhara.'],e:'Every paragraph describes part of the water system and its effects on farming and social life.'},
  {d:1,q:'According to the passage, how did the chigir lift water?',c:['Clay pots on a turning wheel filled with water and emptied it at the top.','Workers carried water up hills in clay pots.','Water flowed uphill through stone pipes.','Rain collected in pots attached to the city walls.'],e:'Paragraph 2: each pot "dipped into the canal, filled with water, rose to the top and emptied."'},
  {d:2,q:'As used in paragraph 3, "reservoirs" most nearly means',c:['places for storing water','meeting halls','gardens','markets'],e:'The pools stored water, so they were "places for storing water," but also more than that.'},
  {d:2,q:'Why does the author mention that people drank tea and traded news beside the pools?',c:['To show that the pools also played a role in social life','To argue that tea was more popular than water','To explain how the pools were built','To show that the pools caused disease'],e:'The next sentence says the system shaped "the social life of the city."'},
  {d:3,q:'Which choice best describes the function of the final paragraph?',c:['It notes a problem with the pools and explains why most of them disappeared.','It introduces a new type of water wheel.','It argues that the pools should be rebuilt.','It summarizes the history of the Zarafshan River.'],e:'"The pools had a serious drawback" introduces the disease problem and their filling-in.'},

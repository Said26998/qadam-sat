{ id:'r2', title:'Why Zebras Have Stripes', genre:'Science', d:2, text:[
 'Few questions in biology have produced as many theories as the zebra\'s stripes. Over the past century, scientists have suggested that the stripes confuse lions during a chase, help zebras recognize one another, or keep the animals cool by creating small breezes over the skin. Each idea seemed reasonable, but none had strong evidence behind it.',
 'In the 2010s, a team led by biologist Tim Caro took a different approach. Instead of asking what stripes might do, they asked where stripes are found. They compared dozens of species of horses and zebras across Africa and Asia and mapped how strongly striped each one was. The pattern that emerged surprised them. Stripes were not linked to the number of lions in an area, nor to temperature. They were most closely linked to the presence of biting flies.',
 'To test the idea directly, the researchers dressed horses in coats printed with black-and-white stripes and filmed flies approaching them. The flies flew toward the striped coats as often as toward plain ones, but they failed to land. Many flew past or bumped into the coats clumsily, as if they could not judge the distance. On plain coats, by contrast, flies slowed down and landed smoothly.',
 'Exactly why stripes confuse flies is still debated. One possibility is that the pattern interferes with the way flies\' eyes detect motion. Whatever the mechanism, the finding matters: in regions where biting flies spread serious diseases, avoiding bites may make the difference between life and death.'],
 qs:[
  {d:2,q:'Which choice best states the main idea of the passage?',c:['Evidence suggests that zebra stripes mainly protect against biting flies.','Zebra stripes have no purpose at all.','Lions are confused by zebra stripes during a chase.','Scientists have proved exactly how stripes affect flies\' eyes.'],e:'The research described points to biting flies; the mechanism is still debated, so "proved exactly how" overstates it.'},
  {d:2,q:'How was Caro\'s team\'s first approach different from earlier research?',c:['It examined where striped animals live instead of guessing what stripes do.','It studied only zebras in captivity.','It focused on how lions hunt.','It measured the temperature of zebras\' skin.'],e:'Paragraph 2: "Instead of asking what stripes might do, they asked where stripes are found."'},
  {d:2,q:'What did the experiment with striped coats show?',c:['Flies approached the striped coats but often failed to land on them.','Flies avoided striped coats completely.','Flies landed more often on striped coats.','Horses refused to wear the coats.'],e:'Flies "flew toward the striped coats as often" but "failed to land."'},
  {d:3,q:'As used in paragraph 4, "mechanism" most nearly means',c:['the process by which something works','a machine','an experiment','a disease'],e:'The author is discussing how the effect works, so "process."'},
  {d:3,q:'Based on the passage, the researchers would most likely agree that',c:['the earlier theories about stripes were not well supported by evidence.','zebras would survive equally well without stripes.','biting flies are found only in Asia.','temperature is the main factor in stripe patterns.'],e:'Paragraph 1 says none of the earlier ideas "had strong evidence," and the mapping found no link with temperature.'},
 ]},
{ id:'r3', title:'The Last Letter', genre:'Fiction', d:2, text:[
 'Every Thursday for eleven years, Dilfuza had walked to the post office at the end of Navoi Street to collect letters for her grandmother. The old woman could no longer manage the stairs, and so the errand had passed to Dilfuza when she was nine. At first she had resented it. The walk was long, the clerk was rude, and most of the letters were from people she had never met.',
 'Somewhere along the way, though, the errand had changed. She began to recognize the handwriting: the careful loops of a cousin in Namangan, the cramped, hurried script of an old friend in Moscow. She learned which envelopes would make her grandmother laugh and which would make her fall silent for an afternoon. By the time she was sixteen, she was reading the letters aloud, and her grandmother was dictating the replies.',
 'Now, on this Thursday, there was only one letter, and it was addressed not to her grandmother but to Dilfuza herself. She recognized the handwriting at once. It was her grandmother\'s, the same steady hand that had written a thousand replies through her.',
 'She did not open it on the street. She carried it home, past the bakery and the plane trees, and sat in the empty chair by the window where her grandmother had always waited for her. Only then did she break the seal.'],
 qs:[
  {d:2,q:'Which choice best describes how Dilfuza\'s attitude toward the errand changes over the passage?',c:['She resents it at first but comes to value it.','She enjoys it at first but grows bored of it.','She is indifferent to it throughout.','She refuses to do it after her grandmother stops writing.'],e:'Paragraph 1: "At first she had resented it." Paragraph 2: the errand "had changed" as she grew attached to the letters.'},
  {d:2,q:'As used in paragraph 2, "script" most nearly means',c:['handwriting','a film screenplay','a written test','a computer program'],e:'The sentence describes the "cramped, hurried" way someone writes, so "handwriting."'},
  {d:3,q:'The details in paragraph 4, such as the "empty chair by the window," most strongly suggest that',c:['Dilfuza\'s grandmother is no longer living.','Dilfuza is angry with her grandmother.','the letter contains bad news about a cousin.','Dilfuza has moved to a new house.'],e:'The empty chair where her grandmother "had always waited," and a letter written to her, suggest the grandmother has died.'},
  {d:2,q:'Why does the author mention that the grandmother had "written a thousand replies through her"?',c:['To emphasize the close bond the letters created between Dilfuza and her grandmother','To show that the grandmother was a professional writer','To criticize the grandmother for relying on Dilfuza','To explain why the post office clerk was rude'],e:'Dilfuza had written replies as her grandmother dictated, which shows how connected they became.'},
  {d:3,q:'Which choice best describes the overall structure of the passage?',c:['It traces a long-standing routine and ends with a moment that breaks it.','It compares two different post offices.','It explains how to write a formal letter.','It describes a single conversation in detail.'],e:'Paragraphs 1–2 describe the routine; paragraphs 3–4 show the unusual letter that ends it.'},
 ]},
{ id:'r4', title:'The Cost of a Free Map', genre:'Social science', d:3, text:[
 'When digital maps became free to use on every phone, they seemed to offer only benefits. Drivers could find the fastest route, avoid traffic jams and discover shortcuts that only taxi drivers once knew. Within a few years, however, residents of some quiet neighborhoods noticed a change: streets that had been nearly empty were suddenly crowded with cars.',
 'The cause was the very feature that made the apps useful. Navigation programs calculate routes for each driver individually, choosing whatever path is fastest at that moment. When a main road becomes congested, the apps send drivers onto side streets. Each driver saves a few minutes, but the side streets, which were never designed for heavy traffic, become congested in turn.',
 'Economists call this a problem of individual versus collective benefit. A choice that is sensible for one person can produce a worse outcome when thousands make the same choice. Some studies suggest that when every driver follows such an app, total travel time across a city can actually increase.',
 'Cities have responded in different ways. Some have added speed bumps or turned residential streets into dead ends. Others have begun sharing traffic plans with app companies, hoping the programs can be adjusted to consider the whole road network rather than the single fastest route. Whether such cooperation will work remains an open question.'],
 qs:[
  {d:3,q:'Which choice best states the central idea of the passage?',c:['Navigation apps help individual drivers but can create traffic problems for cities as a whole.','Digital maps have made driving slower for every driver.','Taxi drivers know better shortcuts than navigation apps.','Cities have solved the problem of app-driven traffic.'],e:'The passage contrasts individual benefits with collective costs; the last sentence says the solution is uncertain.'},
  {d:2,q:'According to paragraph 2, why do navigation apps send drivers onto side streets?',c:['They choose the fastest route for each driver at that moment.','They are designed to avoid speed bumps.','Side streets are always shorter than main roads.','City governments require them to do so.'],e:'"Navigation programs calculate routes for each driver individually, choosing whatever path is fastest at that moment."'},
  {d:3,q:'As used in paragraph 3, "collective" most nearly means',c:['shared by a whole group','collected over time','expensive','personal'],e:'It is contrasted with "individual," so it means belonging to the whole group.'},
  {d:3,q:'Which finding, if true, would most strongly support the claim in paragraph 3?',c:['In a city simulation, average travel time rose when all drivers followed app routes compared with when some did not.','Most drivers say they enjoy using navigation apps.','Navigation apps are free in most countries.','Side streets have more trees than main roads.'],e:'The claim is that total travel time can increase when everyone uses the apps; the simulation shows exactly that.'},
  {d:3,q:'The author\'s attitude toward cities\' cooperation with app companies is best described as',c:['uncertain','enthusiastic','hostile','mocking'],e:'The final sentence: "Whether such cooperation will work remains an open question."'},
 ]},
{ id:'r5', title:'Navoi and the Turkic Language', genre:'History', d:2, text:[
 'In the fifteenth century, educated people in Central Asia faced a choice whenever they sat down to write poetry. Persian was the language of the court and of most respected literature. Turkic languages, spoken by much of the population, were widely considered too rough for serious art.',
 'Alisher Navoi disagreed. Born in Herat in 1441, he wrote fluently in Persian, but he devoted most of his work to Chagatai, the Turkic literary language of his time. In a famous essay, <i>Judgment of Two Languages</i>, he argued that Turkic was in some ways richer than Persian. To prove his point, he listed words for which Turkic had several precise terms while Persian had only one, such as the many Turkic words for different kinds of weeping.',
 'Navoi did not only argue; he demonstrated. He wrote five long narrative poems in Chagatai, modeled on a celebrated Persian series, along with thousands of shorter poems. His work showed that the language could express love, grief, philosophy and humor with great subtlety.',
 'His influence was lasting. Later poets across the Turkic-speaking world studied his work, and today he is honored in Uzbekistan as the founder of its literary tradition. Streets, theaters and a national library bear his name.'],
 qs:[
  {d:2,q:'What is the main purpose of the passage?',c:['To explain how Navoi helped establish Turkic as a language for serious literature','To compare Persian and Turkic grammar in detail','To describe the city of Herat in the fifteenth century','To argue that Persian poetry is better than Turkic poetry'],e:'The passage describes Navoi\'s argument for Turkic, his poetry in Chagatai and his lasting influence.'},
  {d:2,q:'Why does the author mention the many Turkic words for kinds of weeping?',c:['To give an example Navoi used to show the richness of Turkic','To show that Navoi\'s poems were sad','To explain why Persian was the language of the court','To criticize the Turkic language'],e:'Paragraph 2: "To prove his point, he listed words..." It is Navoi\'s evidence.'},
  {d:2,q:'As used in paragraph 3, "demonstrated" most nearly means',c:['showed through example','protested in public','taught in a classroom','argued loudly'],e:'"Navoi did not only argue; he demonstrated" by writing poems that showed the language\'s power.'},
  {d:3,q:'Based on the passage, which statement about Navoi is most likely true?',c:['He could have written his major works in Persian but chose Chagatai.','He spoke no language other than Chagatai.','He believed Persian should be banned.','He wrote only short poems.'],e:'He "wrote fluently in Persian, but he devoted most of his work to Chagatai."'},
  {d:2,q:'Which detail best supports the claim that Navoi\'s influence was "lasting"?',c:['Streets, theaters and a national library bear his name today.','He was born in Herat in 1441.','He wrote fluently in Persian.','Persian was the language of the court.'],e:'Things named after him today show influence that continues.'},
 ]},
{ id:'r6', title:'Sleep and Memory', genre:'Science', d:3, text:[
 'Students often treat sleep as the first thing to sacrifice before an exam. Research in neuroscience suggests this may be a costly mistake, because sleep appears to play an active role in turning new information into lasting memories.',
 'During the day, the brain stores new experiences temporarily in a region called the hippocampus. Studies in rats and humans suggest that during deep sleep, the hippocampus "replays" these experiences, sending signals to the outer layer of the brain, the cortex, where long-term memories are kept. In one well-known experiment, rats that ran through a maze showed the same pattern of brain activity during sleep that they had shown while running, as if they were practicing the route.',
 'Human studies point in the same direction. In a typical experiment, two groups learn a list of word pairs. One group sleeps for a night; the other stays awake for the same number of hours. When both groups are tested, the group that slept usually remembers significantly more, even though both had the same amount of time since learning.',
 'Sleep does not simply preserve memories; it may also reorganize them. Some studies have found that people are more likely to discover a hidden rule in a set of problems after a night of sleep than after an equal period awake. For students, the lesson is clear: an all-night study session may leave less in memory than a shorter session followed by a full night\'s rest.'],
 qs:[
  {d:2,q:'Which choice best states the main idea of the passage?',c:['Sleep appears to help the brain strengthen and reorganize new memories.','Rats remember mazes better than humans remember word lists.','The hippocampus stores all long-term memories.','Students should never study before an exam.'],e:'The passage presents evidence that sleep turns new information into lasting memories and may reorganize them.'},
  {d:3,q:'Why does the author describe the experiment with rats in paragraph 2?',c:['To give evidence that the brain replays experiences during sleep','To show that rats sleep more than humans','To explain how mazes are built','To argue that rats are smarter than expected'],e:'The rats\' brain activity during sleep matched their activity while running, supporting the idea of replay.'},
  {d:3,q:'In the word-pair experiment, why is it important that both groups had "the same number of hours" since learning?',c:['It ensures that the difference in memory is due to sleep, not to the amount of time passed.','It ensures that both groups learned the same words.','It makes the experiment shorter.','It shows that staying awake improves memory.'],e:'Equal time rules out time as the explanation, isolating sleep.'},
  {d:2,q:'As used in paragraph 4, "preserve" most nearly means',c:['keep safe','cook','hide','reduce'],e:'Sleep "does not simply preserve memories": it keeps them, and also reorganizes them.'},
  {d:3,q:'Which conclusion about studying is most supported by the passage?',c:['A shorter study session followed by sleep may be more effective than staying up all night.','Students should study only in the morning.','Sleep has no effect on solving problems.','Studying word pairs is the best way to prepare for exams.'],e:'The final sentence draws exactly this conclusion.'},
 ]},
{ id:'r7', title:'The Silk Road Was Not a Road', genre:'History', d:3, text:[
 'The phrase "Silk Road" calls to mind a single highway running from China to Rome, crowded with camel caravans carrying silk westward. The image is memorable but misleading. The term itself was coined only in 1877, by the German geographer Ferdinand von Richthofen, long after the trade it describes had faded.',
 'Historians now describe a shifting web of routes rather than one road. Paths split around deserts and mountain ranges, joined at oasis cities such as Samarkand and Kashgar, and changed as empires rose and fell. Few merchants traveled the entire distance. Instead, goods passed from hand to hand, moving a few hundred kilometers at a time between local traders.',
 'Silk was also only part of the story. Caravans carried paper, glass, spices, horses, metalwork and medicines. Ideas traveled too. Buddhism spread from India into China along these routes, and techniques such as papermaking moved westward, reaching Samarkand by the eighth century and later the Islamic world and Europe.',
 'Some historians argue that the exchange of knowledge mattered far more than the exchange of goods. Silk could be worn out in a few years; the ability to make paper changed how societies stored information for centuries.'],
 qs:[
  {d:3,q:'The author\'s main purpose in the passage is to',c:['correct a common but oversimplified picture of the Silk Road','argue that silk was the most valuable good ever traded','describe the life of Ferdinand von Richthofen','explain how camels were used in caravans'],e:'The first paragraph calls the usual image "misleading," and the rest replaces it with a more accurate picture.'},
  {d:2,q:'According to the passage, how did most goods travel along the routes?',c:['They passed between many local traders over short distances.','Single merchants carried them from China to Rome.','They were shipped by sea.','Governments transported them in large convoys.'],e:'"Goods passed from hand to hand, moving a few hundred kilometers at a time between local traders."'},
  {d:3,q:'Why does the author mention that the term was "coined only in 1877"?',c:['To suggest that the name reflects a later view rather than the traders\' own understanding','To show that trade began in 1877','To praise von Richthofen\'s accuracy','To explain why silk was valuable'],e:'A name invented long after the trade faded is not how the traders themselves saw it.'},
  {d:2,q:'As used in paragraph 2, "shifting" most nearly means',c:['changing','sliding','hidden','dangerous'],e:'The routes "changed as empires rose and fell."'},
  {d:3,q:'Which choice best supports the claim in the final paragraph that knowledge mattered more than goods?',c:['Papermaking changed how societies stored information for centuries.','Caravans carried glass and spices.','Samarkand was an oasis city.','Silk was carried westward.'],e:'The author contrasts silk, which wears out, with papermaking\'s long-lasting effect.'},
 ]},
{ id:'r8', title:'A Garden on the Roof', genre:'Fiction', d:1, text:[
 'When Timur\'s family moved into the ninth-floor apartment, the only outdoor space was a flat, gray roof above the stairwell. His mother called it "the desert." His father said it was too hot for anything to grow.',
 'Timur was twelve and stubborn. He collected old paint buckets from a building site, drilled holes in their bottoms and filled them with soil he carried up the stairs one bag at a time. He planted tomatoes, mint and a single sunflower, and every evening he climbed up with a bottle of water.',
 'For weeks nothing much happened. The tomatoes stayed small and the sunflower leaned sadly to one side. Then, in July, everything changed at once. The tomatoes turned red, the mint spread over the edges of its bucket, and the sunflower straightened and opened, taller than Timur himself.',
 'One evening his mother followed him up the stairs. She stood for a long time looking at the green buckets against the gray roof. "Well," she said at last, "I suppose I\'ll have to stop calling it the desert."'],
 qs:[

{ id:'r9', title:'The Prince Who Mapped the Stars', genre:'History', d:2, text:[
 'In the 1420s, the ruler of Samarkand was not only a prince but also a serious scientist. Ulugh Beg, the grandson of Timur, was fascinated by mathematics and astronomy. Rather than spend the city\'s wealth only on palaces, he built an observatory on a hill outside Samarkand and invited dozens of scholars to work there.',
 'The observatory\'s most remarkable instrument was a giant curved track cut deep into the rock, with a radius of about forty meters. Because it was so large, astronomers could measure the height of the sun and stars with unusual precision. Small errors that would ruin a measurement on a handheld instrument became tiny when spread across such a huge scale.',
 'The results were impressive. Ulugh Beg\'s team produced a catalogue listing the positions of more than a thousand stars, the most complete since ancient times. They also calculated the length of the year to within about a minute of the modern value. Scholars in Europe would later translate and study the catalogue.',
 'The story did not end happily. Ulugh Beg was killed in 1449, and the observatory was abandoned and slowly buried. For centuries, its location was forgotten. In 1908, the archaeologist Vasily Vyatkin found the remains of the great curved track underground. Today visitors can walk down into it and see how one prince turned a hilltop into one of the world\'s great centers of science.'],

  {d:3,q:'Which choice best describes the function of the final paragraph?',c:['It explains what happened to the observatory and how it was found again.','It describes how the curved track was used.','It compares Ulugh Beg with European astronomers.','It lists the stars in Ulugh Beg\'s catalogue.'],e:'The paragraph covers the abandonment, the rediscovery in 1908 and what visitors see today.'},

{ id:'r10', title:'Skin That Sees', genre:'Science', d:2, text:[
 'An octopus resting on a coral reef can vanish in less than a second. Its skin changes color, brightness and even texture until it matches the rock or seaweed behind it. Few animals can disguise themselves so quickly or so completely.',
 'The change is controlled by thousands of tiny sacs of pigment in the skin called chromatophores. Each sac is surrounded by muscles connected to nerves. When the muscles pull, the sac stretches and its color spreads across a wider area; when they relax, the sac shrinks to a dot. Because the brain controls these muscles directly, the octopus can change its whole body almost instantly.',
 'This ability raises a puzzle. Most evidence suggests that octopuses are color-blind: their eyes have only one type of light-sensitive cell, so they should not be able to tell red from green. How, then, can they match colors so well? One possible answer came when researchers found light-sensing proteins in octopus skin itself. These proteins may allow the skin to respond to light directly, without waiting for the eyes.',
 'Scientists do not yet know how much this "seeing skin" helps with camouflage. Still, the discovery has inspired engineers, who are trying to build flexible materials that change color when light hits them. One day, such materials could be used to make clothing or buildings that adjust to their surroundings.'],
 qs:[
  {d:1,q:'What is the main purpose of paragraph 2?',c:['To explain how an octopus physically changes its color','To argue that octopuses are color-blind','To describe where octopuses live','To compare octopuses with other animals'],e:'It describes chromatophores and the muscles that stretch them.'},
  {d:2,q:'According to the passage, what happens when the muscles around a chromatophore relax?',c:['The sac shrinks and shows less color.','The sac stretches and spreads its color.','The octopus becomes color-blind.','The skin changes texture.'],e:'"When they relax, the sac shrinks to a dot."'},
  {d:2,q:'What puzzle does the author describe in paragraph 3?',c:['Octopuses match colors well even though their eyes probably cannot see color.','Octopuses cannot change color in bright light.','Octopuses have no nerves in their skin.','Octopuses change color more slowly than other animals.'],e:'The author asks how a color-blind animal "can match colors so well."'},
  {d:3,q:'Which choice best describes the author\'s view of the "seeing skin" idea?',c:['It is a promising possibility that has not yet been fully confirmed.','It has been proved to be the main source of camouflage.','It has been disproved by later experiments.','It is unimportant to scientists.'],e:'The author says the proteins "may allow" a response, and scientists "do not yet know how much" it helps.'},
  {d:2,q:'As used in paragraph 4, "inspired" most nearly means',c:['given ideas to','breathed in','frightened','confused'],e:'The discovery gave engineers ideas for new materials.'},
 ]},
{ id:'r11', title:'Why Cities Are Hotter', genre:'Social science', d:3, text:[
 'On a summer night, the center of a large city can stay several degrees warmer than the farmland around it. Scientists call this effect the urban heat island. It is not caused by a different climate but by the city itself: by the materials it is built from and the way it is arranged.',
 'Dark surfaces such as asphalt and roofing tar absorb most of the sunlight that hits them. During the day they store this energy, and at night they release it slowly as heat. Tall buildings make the problem worse by trapping warm air in narrow streets and blocking breezes. Meanwhile, cities have fewer trees and less open soil. In the countryside, plants release water vapor that cools the air, much as sweat cools the skin. Concrete does not.',
 'The consequences are more than uncomfortable. Hot nights prevent people\'s bodies from recovering from daytime heat, which is especially dangerous for older residents. Air conditioners run longer, raising electricity use and, in many places, pollution from power plants, which can in turn warm the city further.',
 'Cities are now testing ways to cool themselves. Some paint roofs white or light gray so that they reflect sunlight instead of absorbing it. Others plant trees along streets or create "green roofs" covered with grass. Each measure is small, but together they show that the heat island is not inevitable. Because people created it through choices about building, people can also reduce it.'],
 qs:[
  {d:2,q:'Which choice best states the main idea of the passage?',c:['Cities trap extra heat because of how they are built, but changes in building can reduce it.','Cities have a different climate from the countryside because they are farther north.','Air conditioners are the main cause of hot nights in cities.','Trees cannot survive in cities because of the heat.'],e:'Paragraphs 1–2 explain the causes in the built environment; paragraph 4 describes solutions.'},
  {d:2,q:'According to the passage, how do plants help cool the countryside?',c:['They release water vapor that cools the air.','They absorb sunlight and release it at night.','They block breezes from reaching farms.','They reflect sunlight back into space like white roofs.'],e:'"Plants release water vapor that cools the air, much as sweat cools the skin."'},
  {d:3,q:'Why does the author mention pollution from power plants in paragraph 3?',c:['To show how the heat island can make itself worse through a cycle','To argue that cities should close all power plants','To explain why older residents are at risk','To prove that air conditioners do not work'],e:'More cooling leads to more power use and pollution, "which can in turn warm the city further."'},
  {d:3,q:'As used in paragraph 4, "inevitable" most nearly means',c:['impossible to avoid','very expensive','easy to see','recently discovered'],e:'The author argues the heat island can be reduced, so it is not unavoidable.'},
  {d:3,q:'Based on the passage, which change would most likely reduce a city\'s nighttime temperature?',c:['Replacing a dark parking lot with a park full of trees','Building taller towers along narrow streets','Covering more roofs with black tar','Running air conditioners for longer'],e:'Trees add cooling water vapor and replace a dark heat-storing surface; the other choices add heat.'},
 ]},
{ id:'r12', title:'Stories in Thread', genre:'Arts', d:1, text:[
 'In many Uzbek homes, the brightest object in the room is a suzani. These large cloth panels are covered with embroidery: red and orange circles, curling vines, flowers and pomegranates stitched in silk or cotton thread. They hang on walls, cover beds or are spread out for special guests.',
 'Traditionally, a suzani was made for a wedding. When a girl was born, the women of her family would begin planning the panels she would one day take to her new home. The work was often shared. One woman would draw the design onto the cloth, and the cloth would be cut into strips so that several women could stitch at the same time. Later, the strips were sewn back together.',
 'This method left small clues. Because different women worked on different strips, the colors or stitches sometimes do not line up perfectly where the pieces meet. Collectors once saw these mismatches as mistakes. Today many people see them as a record of the family members who worked side by side.',
 'The designs carry meaning, too. Pomegranates, full of seeds, stand for many children and a large family. Large circles may represent the sun or the moon. Every suzani is therefore more than decoration. It is a wish for the future, written in thread.'],
 qs:[
  {d:1,q:'What is the main idea of the passage?',c:['Suzanis are embroidered panels that carry family history and meaning.','Suzanis are made by machines in large factories.','Pomegranates are the most popular fruit in Uzbekistan.','Suzanis are used only in museums.'],e:'The passage describes how suzanis were made and what their designs mean.'},
  {d:1,q:'According to the passage, why was the cloth cut into strips?',c:['So that several women could stitch at the same time','So that the suzani would be easier to sell','So that the colors would match perfectly','So that the design could be drawn more easily'],e:'"The cloth would be cut into strips so that several women could stitch at the same time."'},
  {d:2,q:'How has the view of mismatched strips changed over time?',c:['They were once seen as mistakes but are now valued as signs of shared work.','They were once valued but are now seen as mistakes.','They have always been seen as beautiful.','They have always been hidden by collectors.'],e:'Paragraph 3: "Collectors once saw these mismatches as mistakes. Today many people see them as a record..."'},
  {d:2,q:'As used in paragraph 4, "stand for" most nearly means',c:['represent','tolerate','rise up','support'],e:'Pomegranates represent many children.'},
  {d:2,q:'What does the author mean by calling a suzani "a wish for the future, written in thread"?',c:['Its designs express hopes for the family\'s future.','It contains written words sewn in thread.','It was made to be sold in the future.','It predicts the weather.'],e:'Symbols such as pomegranates express wishes, like the wish for a large family.'},
 ]},
{ id:'r13', title:'The Chess Clock', genre:'Fiction', d:1, text:[
 'Farrukh had beaten everyone in his class at chess, so when his teacher signed him up for the city tournament, he expected to win easily. He did not expect the chess clock.',
 'In his first game, his opponent, a quiet girl named Shahnoza, moved quickly and pressed the clock after every move. Farrukh, used to thinking as long as he liked, stared at the board while his minutes drained away. He found a brilliant plan, but by then he had only seconds left. His flag fell before he could finish. He had lost a game he was winning.',
 'That evening he told his grandfather, who had taught him to play. The old man laughed gently. "You learned chess without time," he said. "Now you must learn time." For the next month, they played every evening with a clock, five minutes each. At first Farrukh lost again and again. Slowly he learned to trust his first good idea instead of searching forever for a perfect one.',
 'At the next tournament, he met Shahnoza in the third round. This time the game was close, and both clocks ran low together. When Farrukh finally won, Shahnoza shook his hand and smiled. "You got faster," she said. "You got better," he answered, and they both laughed.'],
 qs:[
  {d:1,q:'Why did Farrukh lose his first tournament game?',c:['He ran out of time on the clock.','He made a careless mistake with his queen.','He arrived late to the tournament.','Shahnoza found a brilliant plan first.'],e:'"His flag fell before he could finish. He had lost a game he was winning."'},
  {d:1,q:'What does the grandfather mean when he says, "Now you must learn time"?',c:['Farrukh must learn to play well under time pressure.','Farrukh must learn to tell time on a clock.','Farrukh must stop playing chess.','Farrukh must practice for more hours each day.'],e:'Farrukh plays well without a clock but has not learned to manage time limits.'},
  {d:2,q:'Which choice best describes how Farrukh changes?',c:['He learns to act on good ideas instead of always searching for perfect ones.','He decides that winning is no longer important.','He becomes more careless in his play.','He stops listening to his grandfather.'],e:'"Slowly he learned to trust his first good idea instead of searching forever for a perfect one."'},
  {d:2,q:'As used in paragraph 2, "drained away" most nearly means',c:['ran out gradually','flowed into a river','became heavier','stopped completely'],e:'His minutes were used up little by little.'},
  {d:2,q:'Which choice best describes the structure of the passage?',c:['A character faces a setback, practices to overcome it, and succeeds.','Two friends compete and end their friendship.','A narrator describes the history of chess.','A character remembers his grandfather\'s life.'],e:'Loss on time (setback), a month of practice, and a win in the next tournament.'},
 ]},
);

  c:["Trips rose by more than 20 thousand in City A and City C but by only 3 thousand in City B.","City B had the most trips both before and after the new bike lanes.","All three cities had more trips after the new bike lanes than before.","City C had the fewest trips before the new bike lanes."],
  e:"The argument contrasts large increases with almost no change, so the answer must compare the size of the change across cities."},
 {p:"<figure class=\"data\"><figcaption>Share of students who passed a writing test</figcaption><div class=\"tblwrap\"><table><thead><tr><th>Group</th><th>2021</th><th>2023</th></tr></thead><tbody><tr><th scope=\"row\">Used peer review</th><td>61%</td><td>78%</td></tr><tr><th scope=\"row\">Did not use peer review</th><td>63%</td><td>65%</td></tr></tbody></table></div></figure><p>A teacher claims that the introduction of peer review in 2022 contributed to improved writing scores.</p>",
  q:"Which choice most effectively uses data from the table to support the teacher’s claim?",
  c:["The peer-review group’s pass rate rose 17 points, while the other group’s rose only 2 points, even though the two groups started at similar rates.","The peer-review group had a pass rate of 78% in 2023.","Both groups had higher pass rates in 2023 than in 2021.","The group without peer review had a higher pass rate in 2021."],
  e:"Similar starting points plus very different gains is the comparison that points to peer review. Simply noting that both groups improved does not support the claim."},
 {p:"<figure class=\"data\"><figcaption>Nesting success of sea turtles at two beaches</figcaption><div class=\"tblwrap\"><table><thead><tr><th>Beach</th><th>Nests</th><th>Hatching rate</th></tr></thead><tbody><tr><th scope=\"row\">Lit beach (streetlights)</th><td>140</td><td>52%</td></tr><tr><th scope=\"row\">Dark beach</th><td>95</td><td>81%</td></tr></tbody></table></div></figure><p>Artificial light can disorient hatchlings, drawing them away from the ocean. A biologist suggests that the lit beach attracts more nesting turtles but that ___</p>",
  q:"Which choice most effectively uses data from the table to complete the statement?",
  c:["a smaller share of eggs there hatch successfully than at the dark beach.","the dark beach has more nests than the lit beach.","hatching rates at both beaches are above 75%.","the lit beach has a hatching rate of 81%."],
  e:"The lit beach has more nests (140) but a lower hatching rate (52% vs. 81%). The other choices misread the table."},
 {p:"<figure class=\"data\"><figcaption>Hours of sleep and quiz scores (class average)</figcaption><div class=\"tblwrap\"><table><thead><tr><th>Sleep the night before</th><th>Average score</th></tr></thead><tbody><tr><th scope=\"row\">Under 6 hours</th><td>68</td></tr><tr><th scope=\"row\">6–7 hours</th><td>77</td></tr><tr><th scope=\"row\">7–8 hours</th><td>84</td></tr><tr><th scope=\"row\">Over 8 hours</th><td>83</td></tr></tbody></table></div></figure><p>A student concludes that more sleep is associated with higher scores only up to a point.</p>",
  q:"Which choice most effectively uses data from the table to support the student’s conclusion?",
  c:["Scores rose from 68 to 84 as sleep increased to 7–8 hours but did not rise further for students who slept over 8 hours.","Students who slept under 6 hours had the lowest average score.","Students who slept 7–8 hours scored 84 on average.","Every group scored above 65 on average."],
  e:"“Only up to a point” needs both the rise and the leveling off. The correct choice shows the increase and then the flat result."},
 {p:"<figure class=\"data\"><figcaption>Languages spoken at home in one district</figcaption><div class=\"tblwrap\"><table><thead><tr><th>Language</th><th>2010</th><th>2020</th></tr></thead><tbody><tr><th scope=\"row\">English only</th><td>71%</td><td>62%</td></tr><tr><th scope=\"row\">Spanish</th><td>18%</td><td>21%</td></tr><tr><th scope=\"row\">Uzbek</th><td>2%</td><td>7%</td></tr><tr><th scope=\"row\">Other</th><td>9%</td><td>10%</td></tr></tbody></table></div></figure><p>A district official notes that although Spanish remains the most common language other than English, ___</p>",
  q:"Which choice most effectively uses data from the table to complete the statement?",
  c:["the share of households speaking Uzbek grew more between 2010 and 2020 than the share speaking Spanish.","the share of households speaking only English increased between 2010 and 2020.","Uzbek was spoken in more households than Spanish in 2020.","the share of households speaking other languages fell between 2010 and 2020."],
  e:"“Although” sets up a contrast with Spanish being most common. Uzbek grew by 5 points versus 3 for Spanish. Uzbek was not more common than Spanish in 2020."},
 {p:"<figure class=\"data\"><figcaption>Bird species recorded in a restored wetland</figcaption><div class=\"tblwrap\"><table><thead><tr><th>Year</th><th>Species</th></tr></thead><tbody><tr><th scope=\"row\">Before restoration (2015)</th><td>24</td></tr><tr><th scope=\"row\">2017</th><td>31</td></tr><tr><th scope=\"row\">2019</th><td>47</td></tr><tr><th scope=\"row\">2021</th><td>49</td></tr></tbody></table></div></figure><p>An ecologist claims that the restoration produced its largest gains in bird diversity within the first few years, after which growth slowed.</p>",
  q:"Which choice most effectively uses data from the table to support the claim?",
  c:["The number of species roughly doubled from 24 to 47 by 2019 but rose by only 2 more by 2021.","There were 49 species recorded in 2021.","The wetland had fewer than 30 species before restoration.","The number of species increased in every year recorded."],
  e:"The claim needs a big early gain and a later slowdown. The correct choice shows both."},
 {p:"<figure class=\"data\"><figcaption>Average price of solar panels (dollars per watt)</figcaption><div class=\"tblwrap\"><table><thead><tr><th>Year</th><th>Price</th></tr></thead><tbody><tr><th scope=\"row\">2010</th><td>2.00</td></tr><tr><th scope=\"row\">2014</th><td>0.80</td></tr><tr><th scope=\"row\">2018</th><td>0.40</td></tr><tr><th scope=\"row\">2022</th><td>0.30</td></tr></tbody></table></div></figure><p>An energy analyst states that solar panel prices fell steeply in the early 2010s, ___</p>",
  q:"Which choice most effectively uses data from the table to complete the statement?",
  c:["dropping by more than half between 2010 and 2014, though later declines were smaller.","rising from 0.30 to 2.00 dollars per watt.","and stayed the same from 2018 to 2022.","reaching 0.80 dollars per watt in 2022."],
  e:"From 2.00 to 0.80 is a drop of more than half, and later drops were smaller. The other choices misstate the numbers."},
 {p:"<figure class=\"data\"><figcaption>Library visits per month after opening hours changed</figcaption><div class=\"tblwrap\"><table><thead><tr><th>Time of day</th><th>Before change</th><th>After change</th></tr></thead><tbody><tr><th scope=\"row\">Morning</th><td>3,200</td><td>2,900</td></tr><tr><th scope=\"row\">Afternoon</th><td>4,100</td><td>4,000</td></tr><tr><th scope=\"row\">Evening</th><td>900</td><td>2,600</td></tr></tbody></table></div></figure><p>The library extended its evening hours. A librarian claims that the change attracted many new evening visitors without greatly reducing visits at other times.</p>",
  q:"Which choice most effectively uses data from the table to support the claim?",
  c:["Evening visits nearly tripled, while morning and afternoon visits fell by only a few hundred combined.","Afternoon remained the busiest time of day.","Morning visits decreased after the change.","Total visits before the change were 8,200."],
  e:"The claim has two parts: big evening gain, small losses elsewhere. The correct choice gives both. Noting only the morning decline would weaken the claim."},
 {p:"<figure class=\"data\"><figcaption>Reading speed (words per minute) by format</figcaption><div class=\"tblwrap\"><table><thead><tr><th>Format</th><th>Speed</th><th>Comprehension score</th></tr></thead><tbody><tr><th scope=\"row\">Print</th><td>240</td><td>82</td></tr><tr><th scope=\"row\">Tablet</th><td>252</td><td>76</td></tr><tr><th scope=\"row\">Phone</th><td>265</td><td>70</td></tr></tbody></table></div></figure><p>A researcher suggests that faster reading on screens may come at a cost.</p>",
  q:"Which choice most effectively uses data from the table to support the researcher’s suggestion?",
  c:["Reading speed was highest on phones, but comprehension was lowest on phones.","Print readers read 240 words per minute.","Tablet readers scored 76 on comprehension.","Comprehension scores ranged from 70 to 82."],
  e:"“At a cost” means speed was gained but something was lost. Pairing the highest speed with the lowest comprehension shows that trade-off."},
],
inf: [
 {p:"Some cave-dwelling fish species have lost their eyes over many generations. Because building and maintaining eyes uses energy, biologists hypothesize that in total darkness, where eyes provide no benefit, fish that invested less energy in eye development had more energy for other functions. If this hypothesis is correct, then ___",
  q:"Which choice most logically completes the text?",
  c:["eyeless cave fish should use less energy on eye tissue than closely related fish living in lit waters.","cave fish should have better eyesight than fish living near the surface.","fish living in lit waters should gradually lose their eyes as well.","cave fish should be unable to survive outside caves."],
  e:"The hypothesis is about saving energy on eyes in darkness. Fish in lit waters still benefit from eyes, so they would not be expected to lose them."},
 {p:"Medieval scribes copying manuscripts by hand sometimes made errors, and later scribes copying those copies tended to reproduce earlier mistakes while adding new ones. Scholars comparing surviving manuscripts can therefore group copies into “families” based on shared errors. A manuscript that contains all the errors of another manuscript, plus several of its own, was most likely ___",
  q:"Which choice most logically completes the text?",
  c:["copied, directly or indirectly, from that other manuscript.","the original from which the other manuscript was copied.","produced by the same scribe as the other manuscript.","written earlier than every other surviving manuscript."],
  e:"Errors pile up with each copy. Having all of another copy’s errors plus new ones means it came later in that line of copying."},
 {p:"In a classic experiment, children were offered one marshmallow now or two if they waited. Later research found that children from homes where promises were often broken were less likely to wait, and that when researchers first broke a small promise to children, those children also waited less. These findings suggest that a child’s decision not to wait ___",
  q:"Which choice most logically completes the text?",
  c:["may reflect a reasonable judgment about whether the reward will actually come, not only a lack of self-control.","proves that the child will have lower test scores as an adult.","is unaffected by the child’s experiences with adults.","shows that children prefer one marshmallow to two."],
  e:"Children who had reason to distrust promises waited less, so not waiting can be a sensible response to unreliable rewards."},
 {p:"Ancient Roman concrete in seawalls has survived for two thousand years, while modern concrete in seawater often cracks within decades. Researchers found that seawater seeping into Roman concrete reacted with volcanic ash in the mix to grow new minerals inside existing cracks. This suggests that the Roman structures endured partly because ___",
  q:"Which choice most logically completes the text?",
  c:["contact with seawater helped strengthen the material over time rather than only wearing it down.","the Romans built their seawalls in places where waves were weak.","modern concrete does not contain any minerals.","Roman builders repaired the seawalls every few years."],
  e:"New minerals growing in cracks after seawater contact means seawater was helping, not only damaging."},
 {p:"A city replaced its old streetlights with bright white LEDs. Residents near parks soon reported seeing fewer fireflies, insects that use flashes of light to find mates. Laboratory studies show that fireflies flash less often under artificial light. Taken together, these observations suggest that ___",
  q:"Which choice most logically completes the text?",
  c:["the new streetlights may be interfering with fireflies’ ability to find mates.","fireflies are attracted to LED lights more than to older lights.","the city should remove all of its parks.","fireflies produce brighter flashes in cities than in the countryside."],
  e:"Fireflies flash less under artificial light and use flashes to find mates, so the LEDs may be disrupting mating."},
 {p:"A historian notes that a famous nineteenth-century diary contains detailed weather descriptions for every day of a month during which, according to the diarist’s letters, she was seriously ill and unable to write. Ship records also show that the weather she described for several days does not match conditions recorded nearby. The historian concludes that those diary entries ___",
  q:"Which choice most logically completes the text?",
  c:["were probably written later, possibly from memory or by someone else.","prove that the diarist was never ill.","are the most reliable source of weather data from that period.","were copied from the ship records."],
  e:"She could not write at the time, and the weather does not match records. Copying from ship records is impossible because the details disagree with them."},
 {p:"Most of a tree’s growth in width happens in a thin layer just under the bark, producing one ring per year. In years with plenty of rain, the ring is wide; in drought years, it is narrow. A researcher examining an old wooden beam found a sequence of very narrow rings matching a well-documented drought from 1580 to 1584. The researcher can most reasonably conclude that ___",
  q:"Which choice most logically completes the text?",
  c:["the tree used for the beam was alive during that drought.","the beam was made in 1580.","the tree died because of the drought.","the beam came from the same forest as every other beam in the building."],
  e:"The rings record years the tree was growing. The beam could have been cut long after 1584, so “made in 1580” does not follow."},
 {p:"Some birds lay their eggs in the nests of other species, leaving the host parents to raise the chicks. In one region, host birds that live near many of these “brood parasites” reject foreign eggs far more often than members of the same host species living where parasites are rare. This pattern suggests that ___",
  q:"Which choice most logically completes the text?",
  c:["the ability to reject foreign eggs is more strongly favored where parasitism is common.","brood parasites lay their eggs only in the nests of their own species.","host birds cannot tell their own eggs from foreign eggs.","brood parasites are becoming less common in every region."],
  e:"Rejection is common where the threat is common. That fits a defense that pays off where parasites are frequent. Saying hosts cannot tell eggs apart contradicts the rejections."},
 {p:"Sociologists studying a town where a factory closed found that residents who had joined local clubs, teams, or religious groups found new jobs faster than residents with similar skills who had not. The researchers noted that many new jobs were never advertised publicly. This suggests that the group members’ advantage came at least partly from ___",
  q:"Which choice most logically completes the text?",
  c:["hearing about job openings through the people they knew.","having more education than other residents.","moving to a different town after the factory closed.","receiving higher pay at the factory before it closed."],
  e:"The researchers compared people with similar skills and noted that jobs were not advertised. Personal connections explain the advantage, not education."},
],
wic: [
 {p:"Critics praised the documentary for its ___ approach: rather than telling viewers what to think about the dispute, it presented each side’s strongest arguments and let the audience decide.",
  q:"Which choice completes the text with the most logical and precise word or phrase?",
  c:["evenhanded","polemical","sentimental","perfunctory"],
  e:"Presenting each side fairly is evenhanded. Polemical means strongly arguing one side, which is the opposite."},
 {p:"Although the senator’s speech was full of sweeping promises, it was ___ on details: she never explained how any of her proposals would be paid for.",
  q:"Which choice completes the text with the most logical and precise word or phrase?",
  c:["scant","lavish","precise","redundant"],
  e:"“Although” contrasts sweeping promises with a lack of details. Scant means very little."},
 {p:"The novelist’s early work was praised for its restraint, but her later books became increasingly ___, packed with long descriptions and elaborate metaphors.",
  q:"Which choice completes the text with the most logical and precise word or phrase?",
  c:["ornate","austere","concise","tentative"],
  e:"“But” contrasts restraint with long descriptions and elaborate metaphors, which is ornate. Austere and concise describe restraint itself."},
 {p:"Because the original treaty’s language was ___, each nation could interpret its terms in a way that favored its own interests, which led to decades of dispute.",
  q:"Which choice completes the text with the most logical and precise word or phrase?",
  c:["ambiguous","explicit","eloquent","obsolete"],
  e:"Language that allows several interpretations is ambiguous. Explicit language would prevent the dispute."},
 {p:"The coach was known for being ___ with praise; players said that a simple “good job” from her meant more than lengthy compliments from other coaches.",
  q:"Which choice completes the text with the most logical and precise word or phrase?",
  c:["sparing","effusive","indifferent","generous"],
  e:"Her rare “good job” meant a lot, so she gave praise sparingly. Effusive and generous mean the opposite, and indifferent does not explain why her praise was valued."},
 {p:"Early reviewers dismissed the composer’s symphony as chaotic, but later critics argued that its apparent disorder was ___, carefully designed to unsettle listeners before resolving into harmony.",
  q:"Which choice completes the text with the most logical and precise word or phrase?",
  c:["deliberate","accidental","superficial","conventional"],
  e:"“Carefully designed” defines the blank: the disorder was intended, or deliberate."},
 {p:"In her memoir, the scientist describes herself as ___ in childhood: she took apart radios and clocks simply to find out how they worked.",
  q:"Which choice completes the text with the most logical and precise word or phrase?",
  c:["inquisitive","reticent","complacent","meticulous"],
  e:"Taking things apart to find out how they work shows curiosity, which is inquisitive. Meticulous means careful, not curious."},
 {p:"The new evidence does not overturn the theory entirely, but it does ___ it, showing that the effect occurs only under certain conditions.",
  q:"Which choice completes the text with the most logical and precise word or phrase?",
  c:["qualify","confirm","fabricate","popularize"],
  e:"To qualify a claim is to limit it. Here the effect holds only under certain conditions, which limits the theory without overturning it."},
 {p:"Despite the team’s ___ start, losing its first six games, it recovered to finish the season with a winning record.",
  q:"Which choice completes the text with the most logical and precise word or phrase?",
  c:["inauspicious","triumphant","measured","promising"],
  e:"Losing six straight games is an unpromising, or inauspicious, start. “Despite” sets up the contrast with the recovery."},
],
ts: [
 {p:"Many people believe that the Great Wall of China is visible from space with the naked eye. <u>Astronauts who have orbited Earth, including Chinese astronaut Yang Liwei, report that they could not see it.</u> The wall is long, but it is narrow and close in color to the land around it.",
  q:"Which choice best describes the function of the underlined sentence in the text as a whole?",
  c:["It presents evidence that contradicts a popular belief introduced in the previous sentence.","It explains why the Great Wall was built.","It offers an example that supports the popular belief.","It introduces a new belief about the Great Wall that the text goes on to defend."],
  e:"The first sentence states a belief and the underlined sentence gives astronauts’ testimony against it. The last sentence then explains why."},
 {p:"Linguists once assumed that languages with fewer speakers would be simpler than those with many speakers. Studies have since found nearly the opposite: small, isolated communities often have languages with more complex grammar, while widely spoken languages tend to simplify as adults learn them as second languages.",
  q:"Which choice best describes the overall structure of the text?",
  c:["It describes an earlier assumption and then presents findings that reverse it.","It compares two languages and argues that one is easier to learn.","It explains how linguists choose which languages to study.","It lists several features that all languages share."],
  e:"“Once assumed” introduces the old view and “nearly the opposite” introduces findings that reverse it."},
 {p:"The following text is adapted from Charlotte Brontë’s 1847 novel <i>Jane Eyre</i>.<br><br>I resisted all the way: a new thing for me, and a circumstance which greatly strengthened the bad opinion Bessie and Miss Abbot were disposed to entertain of me. <u>The fact is, I was a trifle beside myself; or rather out of myself, as the French would say.</u>",
  q:"Which choice best describes the function of the underlined sentence in the text as a whole?",
  c:["It clarifies the narrator’s unusual emotional state during the resistance described in the previous sentence.","It explains why Bessie and Miss Abbot dislike the narrator.","It introduces a new character who speaks French.","It shows that the narrator regrets nothing about her behavior."],
  e:"“A new thing for me” signals unusual behavior, and the underlined sentence explains it: she was “beside herself,” not acting like herself."},
 {p:"Coral reefs cover less than 1 percent of the ocean floor. <u>Yet they support roughly a quarter of all known marine species.</u> Scientists attribute this to the reefs’ complex structures, which create countless small habitats.",
  q:"Which choice best describes the function of the underlined sentence in the text as a whole?",
  c:["It sets up a surprising contrast that the final sentence then explains.","It provides an example of the reefs’ small size.","It introduces a claim that the rest of the text disputes.","It summarizes a scientific study described earlier."],
  e:"“Yet” contrasts small area with huge biodiversity, and the last sentence explains why. The text does not dispute the claim."},
 {p:"In “The Story of an Hour,” Kate Chopin describes a woman who learns her husband has died. <u>The story spends only a few lines on the news itself and many paragraphs on the woman alone in her room.</u> This structure invites readers to focus less on the event than on the woman’s private, unexpected response to it.",
  q:"Which choice best describes the function of the underlined sentence in the text as a whole?",
  c:["It describes a feature of the story that the final sentence interprets.","It summarizes the ending of the story.","It argues that the story is too short.","It compares Chopin’s story with another writer’s work."],
  e:"The underlined sentence notes how much space goes to each part of the story, and the next sentence explains what that choice achieves."},
 {p:"Some historians argue that the printing press mattered less for the spread of new ideas than is often claimed, since most people in fifteenth-century Europe could not read. Others respond that literacy was not required to encounter printed ideas: pamphlets were commonly read aloud in taverns and marketplaces to crowds of listeners.",
  q:"Which choice best describes the overall structure of the text?",
  c:["It presents an argument and then a counterargument that addresses that argument’s main point.","It describes how the printing press was invented and then how it was improved.","It lists reasons why literacy rates rose in fifteenth-century Europe.","It presents two arguments that agree with each other."],
  e:"The first view depends on low literacy, and the second answers that point directly, so the text is argument and counterargument."},
 {p:"Octopuses have about 500 million neurons, a number comparable to that of dogs. <u>Strikingly, about two-thirds of those neurons are located not in the octopus’s brain but in its arms.</u> Researchers think this may allow each arm to respond to its surroundings with some independence.",
  q:"Which choice best describes the function of the underlined sentence in the text as a whole?",
  c:["It presents an unusual fact about where the neurons are, which the final sentence offers an explanation of.","It contradicts the claim about the number of neurons.","It compares octopuses unfavorably with dogs.","It introduces a hypothesis that the final sentence rejects."],
  e:"The underlined sentence gives the surprising location of the neurons and the last sentence suggests what that might mean. Nothing is rejected."},
 {p:"The following text is adapted from Zora Neale Hurston’s 1937 novel <i>Their Eyes Were Watching God</i>.<br><br>Ships at a distance have every man’s wish on board. For some they come in with the tide. For others they sail forever on the horizon, never out of sight, never landing until the Watcher turns his eyes away in resignation.",
  q:"Which choice best describes the function of the ships in the text?",
  c:["They represent people’s hopes, some of which are fulfilled while others remain out of reach.","They describe the narrator’s job working at a harbor.","They foreshadow a shipwreck that occurs later in the novel.","They show that the Watcher dislikes travel by sea."],
  e:"The ships carry “every man’s wish”: some arrive and some never land, like hopes that are fulfilled or never fulfilled."},
 {p:"Architects once designed hospitals mainly to make medical work efficient. In the 1980s, researcher Roger Ulrich found that surgical patients whose windows looked out on trees recovered faster than patients whose windows faced a brick wall. <u>Since then, many hospitals have added gardens, natural light, and views of nature.</u>",
  q:"Which choice best describes the function of the underlined sentence in the text as a whole?",
  c:["It describes a change in practice that followed the research finding.","It explains how Ulrich conducted his study.","It presents evidence against Ulrich’s finding.","It restates the original priority of hospital architects."],
  e:"“Since then” ties the new design features to Ulrich’s finding, showing the effect of the research."},
],
ct: [
 {p:"<p><b>Text 1</b><br>Many economists argue that raising the minimum wage reduces employment, since businesses facing higher labor costs will hire fewer workers.</p><p><b>Text 2</b><br>In a well-known study, David Card and Alan Krueger compared fast-food restaurants in New Jersey, which raised its minimum wage, with restaurants in nearby Pennsylvania, which did not. They found no drop in employment in New Jersey relative to Pennsylvania.</p>",
  q:"Based on the texts, how would Card and Krueger (Text 2) most likely respond to the economists in Text 1?",
  c:["By pointing to evidence that, at least in one case, a higher minimum wage did not reduce employment","By agreeing that businesses always hire fewer workers when wages rise","By arguing that the minimum wage should be eliminated","By claiming that Pennsylvania’s economy was stronger than New Jersey’s"],
  e:"Their study found no drop in jobs, which challenges the prediction in Text 1. The texts say nothing about which state’s economy was stronger."},
 {p:"<p><b>Text 1</b><br>Some literary critics treat Mary Shelley’s <i>Frankenstein</i> mainly as a warning about scientific ambition, pointing to Victor’s reckless pursuit of knowledge.</p><p><b>Text 2</b><br>Other critics emphasize Victor’s failure after the creature is made: he abandons the creature at its first moment of life. For these readers, the novel’s central concern is not discovery itself but the responsibility creators owe to what they create.</p>",
  q:"Based on the texts, how would the critics in Text 2 most likely respond to the reading in Text 1?",
  c:["They would argue that it focuses on Victor’s ambition but overlooks his more important failure of responsibility.","They would agree that the novel’s main concern is scientific ambition.","They would argue that Victor is not ambitious at all.","They would claim that the creature is the true author of the story."],
  e:"Text 2 shifts focus from making the creature to abandoning it. It does not deny that Victor was ambitious."},
 {p:"<p><b>Text 1</b><br>For decades, the dominant view held that dinosaurs were sluggish, cold-blooded reptiles, much like modern lizards.</p><p><b>Text 2</b><br>Paleontologist John Ostrom’s study of <i>Deinonychus</i>, a predator with a long, stiff tail for balance and a large claw on each foot, convinced many scientists that at least some dinosaurs were fast, agile hunters, an idea that fits poorly with a sluggish, lizard-like lifestyle.</p>",
  q:"Based on the texts, how would Ostrom (Text 2) most likely view the dominant view described in Text 1?",
  c:["As inconsistent with physical features suggesting that some dinosaurs were active and quick","As correct for all dinosaurs, including Deinonychus","As irrelevant, since dinosaurs are not related to reptiles","As supported by his study of Deinonychus"],
  e:"Ostrom’s evidence suggests agility, which “fits poorly” with the sluggish view. He is not described as making claims about dinosaurs’ relationship to reptiles."},
 {p:"<p><b>Text 1</b><br>Urban planner Jane Jacobs argued that busy sidewalks make neighborhoods safer, since shopkeepers and residents keep constant, informal watch on the street.</p><p><b>Text 2</b><br>A recent study of crime in several large cities found that streets with many small shops had fewer street robberies than nearby streets with few shops, even after accounting for income and population.</p>",
  q:"Based on the texts, how would Jacobs (Text 1) most likely respond to the study described in Text 2?",
  c:["She would see its findings as consistent with her view that active streets discourage crime.","She would argue that the study should have ignored income levels.","She would claim that small shops make neighborhoods more dangerous.","She would say the study disproves her argument about sidewalks."],
  e:"More shops means more people watching the street, and the study found less crime there. That supports her argument."},
 {p:"<p><b>Text 1</b><br>Some educators argue that students learn best when they discover principles on their own, with minimal guidance from teachers.</p><p><b>Text 2</b><br>Researchers reviewing dozens of studies concluded that beginners generally learn more from clear, step-by-step instruction than from unguided discovery, although students who already have some expertise can benefit from more open-ended tasks.</p>",
  q:"Based on the texts, how would the researchers in Text 2 most likely respond to the educators in Text 1?",
  c:["By suggesting that minimal guidance may suit experienced students but is less effective for beginners","By agreeing that all students learn best with minimal guidance","By arguing that teachers should never give open-ended tasks","By claiming that discovery learning has never been studied"],
  e:"The review finds guidance better for beginners but allows open tasks for experienced students, so it partly qualifies Text 1. “Never” is too extreme."},
 {p:"<p><b>Text 1</b><br>Many art historians credit Impressionist painters with a radical break from tradition: by painting outdoors and capturing fleeting light, they rejected the polished studio style of academic art.</p><p><b>Text 2</b><br>The break was less sudden than it appears. Earlier painters such as John Constable and the Barbizon school were already sketching outdoors and studying changing light decades before the Impressionists exhibited their work.</p>",
  q:"Based on the texts, how would the author of Text 2 most likely respond to the claim in Text 1?",
  c:["By arguing that the Impressionists’ methods built on earlier painters’ practices rather than appearing from nowhere","By agreeing that the Impressionists invented outdoor painting","By claiming that the Impressionists preferred studio painting","By arguing that academic art was more popular than Impressionism"],
  e:"Text 2 shows earlier painters doing similar things, which makes the change look gradual rather than a sudden, radical break."},
 {p:"<p><b>Text 1</b><br>Some nutrition researchers have claimed that eating breakfast helps people control their weight, citing surveys showing that breakfast eaters weigh less on average.</p><p><b>Text 2</b><br>When researchers randomly assigned adults to eat or skip breakfast for several months, they found no meaningful difference in weight loss between the groups. Surveys alone, they noted, cannot show whether breakfast causes lower weight or whether people with healthier habits simply tend to eat breakfast.</p>",
  q:"Based on the texts, how would the researchers in Text 2 most likely respond to the claim in Text 1?",
  c:["By questioning whether the survey evidence shows that breakfast itself causes lower weight","By agreeing that breakfast is the main cause of weight loss","By arguing that people should skip breakfast to lose weight","By claiming that surveys are always inaccurate"],
  e:"Text 2 explains that surveys show a link but not a cause, and their experiment found no effect. They do not recommend skipping breakfast."},
 {p:"<p><b>Text 1</b><br>Historian Frederick Jackson Turner argued in 1893 that the American frontier, an open area of “free land,” shaped a distinct national character of individualism and democracy.</p><p><b>Text 2</b><br>Later historians criticized Turner for treating the West as empty. The land was home to many Native nations, and Mexican and other communities, and the frontier was a place of conflict and exchange among many peoples, not simply open space waiting for settlers.</p>",
  q:"Based on the texts, how would the historians in Text 2 most likely respond to Turner’s description of “free land”?",
  c:["They would argue that it ignores the people who already lived on that land.","They would agree that the frontier was mostly unoccupied.","They would argue that Turner overstated the importance of democracy in cities.","They would claim that the frontier had no effect on American history."],
  e:"Text 2 directly disputes the idea that the land was empty. It does not claim the frontier had no effect."},
 {p:"<p><b>Text 1</b><br>Some technology writers predict that self-driving cars will dramatically reduce traffic deaths, since most crashes are caused by human error.</p><p><b>Text 2</b><br>Researchers caution that while removing human error could prevent many crashes, self-driving systems may introduce new kinds of errors, such as misreading unusual road conditions, and that their overall safety record cannot yet be judged from limited testing.</p>",
  q:"Based on the texts, how would the researchers in Text 2 most likely respond to the prediction in Text 1?",
  c:["By acknowledging its reasoning but warning that the prediction is premature given possible new risks","By agreeing that self-driving cars have already eliminated traffic deaths","By arguing that human error causes very few crashes","By claiming that self-driving cars should never be tested on public roads"],
  e:"Text 2 accepts that removing human error could help but says new errors and limited data make the prediction too early."},

tr: [
 {p:"The first transatlantic telegraph cable, completed in 1858, allowed messages to cross the ocean in minutes rather than weeks. ___ the cable failed after only three weeks, and a lasting connection was not established until 1866.",
  q:"Which choice completes the text with the most logical transition?",
  c:["However,","Consequently,","Similarly,","For instance,"],
  e:"The first sentence describes a success and the second a quick failure, so a contrast is needed."},
 {p:"Glass appears solid, and it behaves like a solid in everyday life. ___ its atoms are arranged randomly, like those of a liquid, rather than in the orderly pattern found in most solids.",
  q:"Which choice completes the text with the most logical transition?",
  c:["At the atomic level, however,","As a result,","Likewise,","In addition,"],
  e:"The text contrasts how glass behaves in everyday life with its structure at the atomic level. “As a result” would wrongly make the random structure an effect of glass looking solid."},
 {p:"The city’s new recycling program accepts glass, metal, and paper. ___ it does not accept plastic bags, which jam sorting machines and must be returned to grocery stores.",
  q:"Which choice completes the text with the most logical transition?",
  c:["However,","Therefore,","For example,","Similarly,"],
  e:"Listing what is accepted and then what is not calls for a contrast. “For example” would wrongly make plastic bags an example of accepted items."},
 {p:"Honeybees communicate the location of food through a “waggle dance.” The angle of the dance shows the direction of the food relative to the sun. ___ the length of the waggle shows how far away the food is.",
  q:"Which choice completes the text with the most logical transition?",
  c:["Additionally,","Instead,","Nevertheless,","In contrast,"],
  e:"The dance gives two kinds of information at once: direction and distance. Neither contradicts the other."},
 {p:"In the 1950s, many scientists believed that stomach ulcers were caused mainly by stress. Researchers Barry Marshall and Robin Warren later showed that most ulcers are caused by a bacterium. ___ ulcers that once required surgery can now usually be cured with antibiotics.",

  c:["As a result,","Nonetheless,","Previously,","By contrast,"],
  e:"Antibiotics work because ulcers are caused by bacteria, so the last sentence is a result of the discovery."},
 {p:"Some critics dismissed the photographer’s early work as merely decorative. ___ her later series on factory workers was praised for its unflinching portrayal of labor conditions.",

 {p:"The author spent eight years researching the novel, interviewing dozens of former sailors and studying ship logs. ___ the book’s descriptions of life at sea are remarkably accurate.",

 {p:"<p class=\"lead\">While researching a topic, a student has taken the following notes:</p><ul class=\"notes\"><li>The Svalbard Global Seed Vault is located in Norway’s Arctic.</li><li>It stores seed samples from nearly every country.</li><li>In 2015, researchers in Syria withdrew seeds to replace collections damaged by war.</li><li>It was the first withdrawal in the vault’s history.</li></ul>",

 {p:"<p class=\"lead\">While researching a topic, a student has taken the following notes:</p><ul class=\"notes\"><li>Ada Lovelace worked with Charles Babbage on his Analytical Engine in the 1840s.</li><li>The machine was never completed.</li><li>Lovelace wrote a method for the machine to calculate Bernoulli numbers.</li><li>Many historians consider this the first published computer program.</li></ul>",

  e:"An unfamiliar audience needs to know who she was and what she did. The correct choice gives both."},
 {p:"<p class=\"lead\">While researching a topic, a student has taken the following notes:</p><ul class=\"notes\"><li>Tardigrades are microscopic animals.</li><li>They can survive temperatures near absolute zero.</li><li>They have survived exposure to the vacuum of space.</li><li>They are found in moss, soil, and the deep sea.</li></ul>",
  q:"The student wants to emphasize how tough tardigrades are. Which choice most effectively uses relevant information from the notes to accomplish this goal?",
  c:["Tardigrades can survive both temperatures near absolute zero and the vacuum of space.","Tardigrades are microscopic animals found in moss and soil.","Tardigrades live in the deep sea.","Tardigrades are microscopic."],
  e:"Toughness means surviving extreme conditions. The other choices describe size or habitat."},
 {p:"<p class=\"lead\">While researching a topic, a student has taken the following notes:</p><ul class=\"notes\"><li>The Mali Empire was a West African state from about 1235 to 1670.</li><li>Its ruler Mansa Musa made a pilgrimage to Mecca in 1324.</li><li>He gave away so much gold in Cairo that its value there fell for years.</li><li>Timbuktu became a major center of learning under Mali’s rule.</li></ul>",

  e:"Giving away enough gold to lower its value shows enormous wealth. The pilgrimage alone does not."},
 {p:"<p class=\"lead\">While researching a topic, a student has taken the following notes:</p><ul class=\"notes\"><li>Some frogs can freeze solid in winter.</li><li>The wood frog’s heart stops while frozen.</li><li>Its cells fill with glucose, which protects them from damage.</li><li>It thaws and resumes normal activity in spring.</li></ul>",
  q:"The student wants to explain how the wood frog survives being frozen. Which choice most effectively uses relevant information from the notes to accomplish this goal?",

 {p:"<p class=\"lead\">While researching a topic, a student has taken the following notes:</p><ul class=\"notes\"><li>Both Lagos, Nigeria, and Tokyo, Japan, are among the world’s largest urban areas.</li><li>Tokyo’s population is slowly shrinking.</li><li>Lagos is one of the fastest-growing cities in the world.</li><li>Lagos is projected to have more people than Tokyo by 2100.</li></ul>",

/* ---------- estimated SAT R&W score (200-800) ---------- */
const pRight=(th,R)=>.25+.75/(1+Math.pow(10,(R-th)/250));

function rate(it, ok){ if(!it.d || it.t==='m' || it.t==='mean' || it.t==='type') return null; const before=scoreShown();
  S.score=Math.max(200,Math.min(800,S.score+kOf(S.sN)*((ok?1:0)-pRight(S.score,DR[it.d])))); S.sN++;
  const ds=S.dstat[it.d]||(S.dstat[it.d]={r:0,n:0}); ds.n++; if(ok) ds.r++;
  S.sHist[today()]=Math.round(S.score); const k=Object.keys(S.sHist).sort(); if(k.length>90) delete S.sHist[k[0]];
  const after=scoreShown(); return {before, after, d:before!=null&&after!=null?after-before:null}; }
function nextStep(st=S){ const s=scoreShown(st); if(s==null||s>=800) return null; const target=Math.min(800,(Math.floor(st.score/50)+1)*50); let th=st.score, n=st.sN, c=0;
  while(th<target-5 && c<80){ th+=kOf(n)*(1-pRight(th,DR[3])); n++; c++; } return c<80?{target,c}:null; }

  const g=s-st.sHist[old]; return {g:Math.round(g), proj:Math.min(800,Math.round((s+4*Math.max(0,g))/10)*10)}; }

// Core lessons unlock one after another along the path. "More lessons" (deep) in a unit open once that unit's core lessons are done, then one after another.
function coreOf(u){ return u.core||u.lessons.length; }
function coreDone(u,st=S){ return LESSONS.filter(l=>l.unit===u&&!l.deep).every(l=>(st.lessons||{})[l.id]); }

function startTopic(u){ const mis=new Set(S.mistakes); const done=new Set(LESSONS.filter(l=>l.unit===u&&S.lessons[l.id]).flatMap(l=>l.items.map(i=>i.id)));

function bindMatch(it){

function check(){

function cardSession(list){

function trainCard(st){ const l=st.wpmLog||[]; const g=GRAMMAR.filter(x=>(st.lessons||{})['gr-'+x.id]);

  return `<div class="card"><p class="lbl">Reading and grammar</p>${l.length?`<p style="margin:0 0 8px"><b>${avgWpm(st)}</b> words per minute and <b>${avgAcc(st)}%</b> comprehension over the last ${Math.min(5,l.length)} passages (best ${Math.max(...l.map(x=>x.wpm))} wpm).</p><div class="seg">${l.slice(0,8).reverse().map(x=>`<span class="pill ${x.acc>=80?'good':x.acc<60?'bad':''}">${x.wpm} · ${x.acc}%</span>`).join('')}</div>`:''}
   ${g.length?`<p style="margin:10px 0 0">Grammar topics practiced: <b>${g.length} of ${GRAMMAR.length}</b>.</p><div class="seg" style="margin-top:6px">${g.map(x=>`<span class="pill ${st.lessons['gr-'+x.id].best>=80?'good':''}">${x.title} · ${st.lessons['gr-'+x.id].best}%</span>`).join('')}</div>`:''}</div>`; }
function diffRows(ds){ return [1,2,3].map(d=>{ const s=(ds||{})[d]; const p=s&&s.n?accPct(s.r,s.n):null; const col=p==null?'var(--line)':p>=80?'var(--good)':p>=60?'var(--saffron)':'var(--bad)';

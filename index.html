<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Daily SAT Reading and Writing practice">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Qadam SAT</title>
<meta name="theme-color" content="#1F45C8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: one phone-width column; sticky stats bar, grid of topic chests, fixed tab bar. Lessons open as a full-screen sheet.
   Palette: Rishtan ceramic cobalt + turquoise on porcelain, saffron for streak/XP. */
:root{
  --bg:#F2F4FA; --surface:#FFFFFF; --sunk:#E7EBF5; --ink:#141B46; --muted:#59618A; --line:#D7DDEE;
  --cobalt:#1F45C8; --cobalt-d:#14309A; --turq:#0E9C97; --turq-d:#0A716E; --saffron:#E89A12; --saffron-d:#B8770A;
  --plum:#8A3FB8; --plum-d:#682C8C; --coral:#D9503F; --coral-d:#A83A2C;
  --good:#17905A; --good-bg:#DDF5E8; --bad:#C93A33; --bad-bg:#FBE3E1; --heart:#E2434B; --on:#FFFFFF;
  --s1:var(--cobalt); --s1d:var(--cobalt-d); --s2:var(--turq); --s2d:var(--turq-d); --s3:var(--plum); --s3d:var(--plum-d); --s4:var(--coral); --s4d:var(--coral-d); --jade:#0F7A5C; --jade-d:#0A5641; --s5:var(--jade); --s5d:var(--jade-d);
  --f-disp:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-ui:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-read:"Source Serif 4", Georgia, "Times New Roman", serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1128; --surface:#161C3A; --sunk:#1E2549; --ink:#E9EDFB; --muted:#9AA3C9; --line:#2B3360;
  --cobalt:#5B7CFF; --cobalt-d:#3653CC; --turq:#26C2BA; --turq-d:#178F89; --saffron:#F4B13E; --saffron-d:#C1861F;
  --plum:#B47AE0; --plum-d:#8752AE; --coral:#F07462; --coral-d:#BE5141;
  --good:#3CCB84; --good-bg:#123A2A; --bad:#FF7468; --bad-bg:#45191A; --heart:#FF5A62; --on:#FFFFFF; --jade:#2FB487; --jade-d:#1E7D5D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1128; --surface:#161C3A; --sunk:#1E2549; --ink:#E9EDFB; --muted:#9AA3C9; --line:#2B3360;
  --cobalt:#5B7CFF; --cobalt-d:#3653CC; --turq:#26C2BA; --turq-d:#178F89; --saffron:#F4B13E; --saffron-d:#C1861F;
  --plum:#B47AE0; --plum-d:#8752AE; --coral:#F07462; --coral-d:#BE5141;
  --good:#3CCB84; --good-bg:#123A2A; --bad:#FF7468; --bad-bg:#45191A; --heart:#FF5A62; --on:#FFFFFF; --jade:#2FB487; --jade-d:#1E7D5D; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0;letter-spacing:-.01em}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

/* top stats bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:2px solid var(--line)}
.brand{font-family:var(--f-disp);font-weight:800;font-size:22px;color:var(--cobalt);margin-right:auto;display:flex;align-items:center;gap:6px}
.brand svg{width:24px;height:24px}
.chip{display:flex;align-items:center;gap:4px;font-weight:800;font-variant-numeric:tabular-nums;background:none;border:0;padding:6px 6px;border-radius:10px}
.chip svg{width:22px;height:22px}
.chip.streak{color:var(--saffron)} .chip.streak.off{color:var(--muted)}
.chip.theme{color:var(--muted)} .chip.xp{color:var(--cobalt)} .chip.energy{color:var(--turq)} .chip.score{color:var(--plum)} .chip.energy.low{color:var(--bad)}
.timer{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--muted);margin:0 0 12px;font-variant-numeric:tabular-nums}
.timer .tb{flex:1;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}.timer .tb i{display:block;height:100%;background:var(--turq);transition:width .25s linear}
.timer.low .tb i{background:var(--saffron)} .timer.over{color:var(--bad)} .timer.over .tb i{background:var(--bad)}
.dbadge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;padding:1px 7px;border-radius:99px;margin-left:6px;border:1.5px solid currentColor;vertical-align:1px}
.dbadge.d1{color:var(--good)} .dbadge.d2{color:var(--cobalt)} .dbadge.d3{color:var(--plum)}
.lb{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}.lb li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--sunk)}.lb li.me{outline:2px solid var(--cobalt)}
.lb .rk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--surface);flex:none}.lb .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}.lb b{font-variant-numeric:tabular-nums}
.glink2{background:none;border:0;color:var(--cobalt);font-weight:800;padding:4px;cursor:pointer}
.vword{font-size:22px;margin:0 0 6px}.vword span{font-size:14px;color:var(--muted);font-style:italic;margin-left:6px}
.typein{font-size:20px;text-align:center;letter-spacing:.02em}
.fb .meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}.fb .meta span{font-size:13px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--surface);color:var(--ink)}
.scard .big{font-family:var(--f-disp);font-size:46px;line-height:1;color:var(--plum);font-variant-numeric:tabular-nums}.scard .big small{font-size:16px;color:var(--muted);margin-left:6px}
.scale{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,var(--sunk),var(--plum));margin:16px 0 4px}.scale b{position:absolute;top:-5px;width:6px;height:20px;margin-left:-3px;border-radius:3px;background:var(--ink)}
.scale-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700}
.nextbox{background:var(--sunk);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px}
.chip:hover{background:var(--sunk)}
@media (max-width:430px){.top .brand{font-size:0;gap:0}.top .chip{padding:6px 3px;gap:3px}.top .chip svg{width:20px;height:20px}}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.stack{display:flex;flex-direction:column;gap:14px}

/* daily goal */
.goal{display:flex;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px}
.ring{width:58px;height:58px;flex:none}
.ring circle{fill:none;stroke-width:7}
.ring .bgc{stroke:var(--sunk)} .ring .fgc{stroke:var(--saffron);stroke-linecap:round;transition:stroke-dashoffset .6s}
.goal b{font-family:var(--f-disp);font-size:18px;display:block}
.goal p{margin:2px 0 0;color:var(--muted);font-size:14px}

/* topic chests */
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:10px;padding-inline:2px}
.sechead h3{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:var(--f-ui);font-weight:800}
.sechead span{font-size:12px;color:var(--muted);text-align:right}
.chests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:500px){.chests{grid-template-columns:repeat(3,minmax(0,1fr))}}
.chest{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 12px 12px;box-shadow:0 4px 0 var(--line);transition:transform .08s}
.chest:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.chest:hover{border-color:var(--tone)}
.chest .chsvg{width:68px;height:60px;align-self:center;margin:2px 0 6px}
.chest .ck{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tone)}
.chest b{font-family:var(--f-disp);font-size:16px;line-height:1.2;overflow-wrap:anywhere;min-height:2.4em}
.chest .cmeta{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.chest .cmeta svg{width:14px;height:14px}
.cbar{display:block;width:100%;height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;margin:4px 0 2px}
.cbar i{display:block;height:100%;background:var(--tone);border-radius:99px}
.chest.open{border-color:color-mix(in srgb,var(--saffron) 60%,var(--line))}
.chest.open .cbar i{background:var(--saffron)}
.chest.open .cmeta{color:var(--saffron-d)}
.chest.locked{background:var(--bg)}
.chest.locked b,.chest.locked .ck{color:var(--muted)}
.chest.next{border-color:var(--tone);box-shadow:0 4px 0 var(--toned)}
.cnext{position:absolute;top:8px;right:8px;background:var(--tone);color:var(--on);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;animation:bob2 1.6s ease-in-out infinite}
@keyframes bob2{50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.cnext{animation:none}}
.chsvg .ch-lid{fill:var(--tone)} .chsvg .ch-body{fill:var(--toned)} .chsvg .ch-band{fill:var(--saffron-d);opacity:.9} .chsvg .ch-lock{fill:var(--saffron)}
.chsvg .ch-in{fill:#2A1A00} .chsvg .ch-glow{fill:var(--saffron);opacity:.3} .chsvg .ch-sp{fill:var(--saffron)}
.chsvg.locked .ch-lid{fill:var(--line)} .chsvg.locked .ch-body{fill:var(--sunk);stroke:var(--line);stroke-width:2} .chsvg.locked .ch-band{fill:var(--line);opacity:1} .chsvg.locked .ch-lock{fill:var(--muted)} .chsvg.locked .ch-kh{fill:var(--bg)}
/* continue card */
.cont{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:var(--r);padding:12px 14px;background:var(--tone);color:var(--on);box-shadow:0 5px 0 var(--toned);transition:transform .08s}
.cont:active{transform:translateY(4px);box-shadow:0 1px 0 var(--toned)}
.cont .ci{flex:none;width:56px;height:50px;background:rgba(255,255,255,.16);border-radius:12px;display:grid;place-items:center}
.cont .ci .chsvg{width:44px;height:40px}
.cont .ci .ch-lid{fill:#fff;opacity:.95} .cont .ci .ch-body{fill:rgba(255,255,255,.7)}
.cont .ct{flex:1;min-width:0;display:flex;flex-direction:column}
.cont small{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.cont b{font-family:var(--f-disp);font-size:19px;line-height:1.2}
.cont .ct span{font-size:13px;opacity:.9}
.cont .cgo{flex:none;width:42px;height:42px;border-radius:50%;background:#fff;color:var(--tone);display:grid;place-items:center}.cont .cgo svg{width:24px;height:24px}
/* inside a chest */
.backb{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;background:none;border:0;padding:6px 8px 6px 0;font-weight:800;color:var(--cobalt)}
.backb svg{width:20px;height:20px}
.chhero{display:flex;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--line);border-top:6px solid var(--tone);border-radius:var(--r);padding:14px}
.chhero .chsvg{width:84px;height:74px;flex:none}
.chhero>div{min-width:0;flex:1}
.chhero .k{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tone)}
.chhero h1{font-size:24px;line-height:1.15}
.chhero p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.act{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 3px 0 var(--line)}
.act:hover{border-color:var(--tone)}
.act:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.act .ai{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--tone);color:var(--on);box-shadow:0 3px 0 var(--toned)}
.act .ai svg{width:22px;height:22px}
.act .at{flex:1;min-width:0}.act .at b{display:block;font-size:16px}.act .at small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
.act .pill{flex:none}
.act.done .ai{background:var(--saffron);box-shadow:0 3px 0 var(--saffron-d)}
.act.gold .ai{background:var(--saffron);box-shadow:0 3px 0 var(--saffron-d);color:#2A1A00}
.act.bad .ai{background:var(--bad);box-shadow:0 3px 0 color-mix(in srgb,var(--bad) 70%,#000)}
.act.locked{background:var(--bg)}.act.locked .ai{background:var(--sunk);color:var(--muted);box-shadow:0 3px 0 var(--line)}.act.locked .at b{color:var(--muted)}
.act.cur{border-color:var(--tone)}
.wlist{display:flex;flex-direction:column;padding:4px 14px}
.wrow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding-block:10px;border-top:1px solid var(--line)}.wrow:first-child{border-top:0}
.wrow b{font-family:var(--f-disp);font-size:17px}.wrow i{color:var(--muted);font-size:13px}.wrow p{margin:2px 0 0;font-size:14px;color:var(--muted)}.wrow .pill{flex:none;margin-top:2px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{max-width:560px;margin:0 auto;display:flex}
.nav button{flex:1;background:none;border:0;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted)}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="page"]{color:var(--cobalt)}
.nav button[aria-current="page"] .ic{background:var(--sunk);border-radius:12px}
.nav .ic{padding:3px 10px;display:grid;place-items:center}

/* buttons */
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 18px;font-weight:800;font-size:16px;letter-spacing:.05em;text-transform:uppercase;background:var(--cobalt);color:var(--on);box-shadow:0 4px 0 var(--cobalt-d);transition:transform .06s}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn[disabled]{background:var(--sunk);color:var(--muted);box-shadow:0 4px 0 var(--line);cursor:default}
.btn.good{background:var(--good);box-shadow:0 4px 0 color-mix(in srgb,var(--good) 70%,#000)}
.btn.bad{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 70%,#000)}
.btn.ghost{background:var(--surface);color:var(--cobalt);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.saff{background:var(--saffron);box-shadow:0 4px 0 var(--saffron-d)}
.row{display:flex;gap:10px}.row>*{flex:1}

/* cards and tiles */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-size:20px}
.muted{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;min-width:0}
.tile svg{width:28px;height:28px;flex:none}
.tile b{display:block;font-family:var(--f-disp);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile span{font-size:13px;color:var(--muted)}
.lbl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.week{display:flex;gap:8px;align-items:flex-end;height:120px;padding-top:18px}
.week .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.week .d i{display:block;width:100%;max-width:34px;background:var(--cobalt);border-radius:6px 6px 2px 2px;min-height:3px}
.week .d.today i{background:var(--saffron)}
.week .d span{font-size:12px;color:var(--muted);font-weight:700}
.week .d em{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.skill{display:grid;grid-template-columns:minmax(0,1fr) 90px 42px;gap:10px;align-items:center;padding-block:6px;font-size:14px}
.skill .tr{height:10px;border-radius:6px;background:var(--sunk);overflow:hidden}
.skill .tr i{display:block;height:100%;border-radius:6px}
.skill .pct{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.skill .nm{min-width:0;line-height:1.25}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;gap:10px;padding-block:9px;border-top:1px solid var(--line);font-size:14px;align-items:center}
.log li:first-child{border-top:0}
.log .what{min-width:0;flex:1}
.log .what small{display:block;color:var(--muted)}
.log .xpv{font-weight:800;color:var(--cobalt);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--cobalt);color:var(--cobalt);background:var(--sunk)}
.field{width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:8px}
.switch input{width:22px;height:22px;accent-color:var(--cobalt)}
.sync{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--good)} .sync.err i{background:var(--bad)}

/* class dashboard */
.roster{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.roster th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px 6px;font-weight:800;white-space:nowrap}
.roster th:first-child{text-align:left}
.roster td{padding:10px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.roster td:first-child{text-align:left;white-space:normal}
.roster tr.click{cursor:pointer}
.roster tr.click:hover td{background:var(--sunk)}
.who{display:flex;gap:8px;align-items:center;min-width:0}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--on);flex:none;background:var(--cobalt)}
.tblscroll{overflow-x:auto;margin-inline:-4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* lesson sheet */
.ls{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}

<script src="config.js"></script>
<script>
/* Qadam SAT: lesson content. All passages and questions are original, written in the style of the digital SAT.
   Item formats:
   - mcq: {p: passage html, q: question, c: [correct, wrong, wrong, wrong], e: explanation}  (choices are shuffled at run time)
   - tap: {t:'tap', s: "sentence with the *error* token starred", e}
   - match: {t:'m', pairs: [[word, meaning], ...]}
*/
function tbl(cap, head, rows){
  return `<figure class="data"><figcaption>${cap}</figcaption><div class="tblwrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((x,i)=>i?`<td>${x}</td>`:`<th scope="row">${x}</th>`).join('')}</tr>`).join('')}</tbody></table></div></figure>`;
}
function bars(cap, unit, data){
  const max = Math.max(...data.map(d=>d[1]));
  return `<figure class="data"><figcaption>${cap}</figcaption><div class="bars" role="img" aria-label="${cap}">${data.map(([l,v])=>`<div class="bar"><div class="col"><span class="bv">${v}</span><i style="height:${Math.round(v/max*100)}%"></i></div><span class="bl">${l}</span></div>`).join('')}</div><div class="axis">${unit}</div></figure>`;
}
function notes(list){ return `<p class="lead">While researching a topic, a student has taken the following notes:</p><ul class="notes">${list.map(x=>`<li>${x}</li>`).join('')}</ul>`; }

const SECTIONS = [
  {name:'Information and Ideas', share:'about 26% of R&W questions', tone:'s1'},
  {name:'Craft and Structure', share:'about 28% of R&W questions', tone:'s2'},
  {name:'Expression of Ideas', share:'about 20% of R&W questions', tone:'s3'},
  {name:'Standard English Conventions', share:'about 26% of R&W questions', tone:'s4'},
  {name:'Vocabulary Builder', share:'120 high-value SAT words', tone:'s5'},
];

const Q_MAIN = 'Which choice best states the main idea of the text?';
const Q_WORD = 'Which choice completes the text with the most logical and precise word or phrase?';
const Q_TRANS = 'Which choice completes the text with the most logical transition?';
const Q_CONV = 'Which choice completes the text so that it conforms to the conventions of Standard English?';
const Q_TAP = 'Tap the part of the sentence that contains an error.';

const UNITS = [
{ id:'ci', sec:0, title:'Central Ideas and Details',
  tip:'The central idea is the claim every sentence supports. A choice that fits only one sentence is too narrow; a choice that goes beyond the text is too broad.',
  lessons:[[
  {p:'Mangrove forests grow where land meets sea, and their tangled roots do more than anchor the trees. The roots slow incoming waves, trap sediment, and shelter young fish. When a strong storm struck one coastal region, villages behind intact mangroves reported far less flooding than villages where the forests had been cleared for shrimp farms.',
   q:Q_MAIN, c:['Mangrove forests give coastal communities important protection.','Shrimp farming is the leading cause of coastal flooding.','Young fish depend on mangrove roots more than on any other habitat.','Storms have become stronger in recent decades.'],
   e:'Every sentence builds toward the protective role of mangroves. The shrimp-farm choice turns one detail into a claim the text never makes.'},
  {p:'Composer Florence Price wrote her Symphony in E Minor in 1932, blending the structure of European symphonies with melodies drawn from African American spirituals. The work won first prize in a national competition, and the next year the Chicago Symphony Orchestra performed it, making Price the first Black woman to have a symphony played by a major American orchestra.',
   q:'According to the text, what happened after Price\'s symphony won the competition?', c:['It was performed by the Chicago Symphony Orchestra.','Price began studying European symphonies.','Price revised it to include spirituals.','It was performed in Europe for the first time.'],
   e:'The text says "the next year the Chicago Symphony Orchestra performed it." The spirituals were part of the piece from the start.'},
  {p:'Amira had walked past the bakery every morning for a year without going in. Today she stopped, read the handwritten menu twice, and pushed open the door before she could change her mind.',
   q:Q_MAIN, c:['Amira finally acts on something she had long hesitated to do.','Amira is unhappy with the bakery\'s menu.','Amira is late for work and needs a quick breakfast.','The bakery has only recently opened.'],
   e:'"A year without going in" plus "before she could change her mind" shows long hesitation ending in action. The bakery has clearly been there for a year.'},
  {p:'Many people assume that octopuses, which live only a year or two, have little time to learn. Yet in laboratory studies, octopuses have learned to open jars, recognize individual caretakers, and escape tanks by squeezing through small gaps. These findings suggest that a short lifespan does not prevent complex learning.',
   q:Q_MAIN, c:['Despite their short lives, octopuses are capable of complex learning.','Octopuses live longer than most people assume.','Octopuses prefer some caretakers to others.','Laboratory studies of animals are often unreliable.'],
   e:'The last sentence states the conclusion the examples support. Recognizing caretakers is just one example.'},
  {p:'Cities are often several degrees warmer than the surrounding countryside, a pattern called the urban heat island effect. Dark roofs and pavement absorb sunlight during the day and release that heat at night. Planting trees and painting roofs white are two strategies cities have used to reduce the effect.',
   q:'According to the text, why do dark roofs and pavement make cities warmer?', c:['They absorb sunlight and release the heat at night.','They block cooling winds from the countryside.','They reflect sunlight onto nearby buildings.','They replace trees that would otherwise produce heat.'],
   e:'Detail questions are answered by one sentence in the text: dark surfaces "absorb sunlight during the day and release that heat at night."'},
  ],[
  {p:'The old ferry captain knew every rock in the river by name. Passengers riding with him for the first time gripped the rails at each sharp turn, but regular riders kept reading their newspapers and never once looked up.',
   q:Q_MAIN, c:['People who knew the captain trusted his skill completely.','The river was too dangerous for passenger ferries.','Regular riders did not care about their own safety.','The captain named the rocks after his passengers.'],
   e:'The contrast between nervous newcomers and relaxed regulars shows trust built on experience with the captain.'},
  {p:'For decades, scientists believed that bumblebees could not fly in cold weather. Recent field observations, however, show that bumblebees shiver their flight muscles to warm themselves, allowing them to gather food at temperatures near freezing, when few other insects are active.',
   q:Q_MAIN, c:['New observations show that bumblebees can fly in the cold by warming their own muscles.','Bumblebees are more active in winter than in summer.','Most insects cannot survive freezing temperatures.','Scientists have studied bumblebees for decades.'],
   e:'"However" signals the key point: new evidence overturns the old belief. The other choices are side details or overstatements.'},
  {p:'In the 15th century, the astronomer and ruler Ulugh Beg built an observatory in Samarkand. Using a giant curved instrument set into the hillside, his team measured the length of the year to within about a minute of the modern value and cataloged more than a thousand stars.',
   q:'Based on the text, which choice best describes Ulugh Beg\'s observatory?', c:['It produced remarkably precise astronomical measurements.','It was the first observatory ever built.','It was designed mainly to predict the weather.','Its main instrument could be moved from place to place.'],
   e:'"Within about a minute of the modern value" signals precision. The instrument was "set into the hillside," so it was not portable.'},
  {p:'When a town in the Netherlands removed the traffic lights and road signs from a busy intersection, many residents predicted chaos. Instead, accidents decreased. Researchers explained that without signals telling them when to go, drivers slowed down and made eye contact with pedestrians and cyclists.',
   q:Q_MAIN, c:['Removing signals from one intersection made drivers more careful and reduced accidents.','Traffic lights cause most accidents around the world.','Cyclists are safer than drivers in most towns.','Residents designed the new intersection themselves.'],
   e:'The text describes one intersection. "Most accidents around the world" is far broader than anything the text supports.'},
  {p:'A researcher tested whether students remember more after handwriting notes or typing them. Students who typed wrote down more words, but students who wrote by hand did better on questions about key concepts a week later. The researcher suggests that because handwriting is slower, it forces students to summarize rather than copy.',
   q:'According to the text, why might handwriting help students understand concepts?', c:['Its slower pace pushes students to summarize ideas.','It lets students record more words.','Teachers find handwritten notes easier to grade.','Students make more typing errors than writing errors.'],
   e:'The last sentence gives the reason: slowness forces summarizing. Typists, not handwriters, recorded more words.'},
  ]]},

{ id:'ev', sec:0, title:'Command of Evidence: Text',
  tip:'Restate the claim in your own words first. The right quotation or finding must prove that exact claim, all of it, and nothing else.',
  lessons:[[
  {p:'A student claims that the poem "River at Dusk" presents the river as both calming and threatening.',
   q:'Which quotation from the poem most effectively illustrates the claim?', c:['"Its slow voice hums the willows into sleep, / yet the current pulls at the boat like a fist."','"The willows bend along the muddy bank."','"Children run home as the sun goes down."','"The water there is dark and very cold."'],
   e:'The claim has two parts. Only the correct quotation is both calming ("hums the willows into sleep") and threatening ("pulls at the boat like a fist").'},
  {p:'A biologist hypothesizes that songbirds in noisy cities sing at higher pitches so that their songs can be heard over low-pitched traffic noise.',
   q:'Which finding, if true, would most directly support the hypothesis?', c:['Birds of the same species sang at higher pitches in loud city areas than in quiet forests.','City birds sing more often in spring than in autumn.','Forest birds defend larger territories than city birds.','Traffic noise in cities is loudest in the early morning.'],
   e:'Support must link pitch to noise. Comparing the same species in loud and quiet places does exactly that.'},
  {p:'Some economists argue that a four-day work week makes employees more productive because well-rested workers make fewer errors.',
   q:'Which finding, if true, would most directly weaken this argument?', c:['Companies that switched to a four-day week saw error rates rise rather than fall.','Employees on four-day weeks reported higher job satisfaction.','Some companies decided not to try a four-day week.','Four-day weeks are more common in some countries than others.'],
   e:'The argument depends on fewer errors. Evidence that errors went up attacks that link directly.'},
  {p:'In the novel, the narrator describes Marta as fiercely independent.',
   q:'Which quotation from the novel most effectively illustrates this description?', c:['"She refused every offer of help, even when the boxes were heavier than she was."','"Marta liked to drink tea in the afternoon."','"Her brother often visited on Sundays."','"She asked her neighbor to choose her new curtains."'],
   e:'Refusing help, even when struggling, shows independence. Asking a neighbor to choose for her shows the opposite.'},
  {p:'Historians once believed that ancient Silk Road trade moved mainly in one direction, carrying goods from China westward. Recent excavations in Central Asia and western China have challenged this view, suggesting that goods flowed in both directions.',
   q:'Which finding would most directly support the claim that goods flowed in both directions?', c:['Roman glass and Mediterranean coins were found at sites in western China.','Chinese silk was found at sites in Rome.','Caravans used many different routes across Central Asia.','The excavations took several years to complete.'],
   e:'Chinese silk in Rome only shows westward trade, which historians already believed. Western goods found in China show the eastward flow.'},
  ],[
  {p:'A student claims that the narrator of a short story feels out of place at a party.',
   q:'Which quotation from the story most effectively illustrates the claim?', c:['"I stood near the coat rack, holding a glass I never drank from, laughing a second after everyone else."','"The music was so loud that the windows shook."','"The host had hung paper lanterns from every branch."','"I danced with my oldest friends until midnight."'],
   e:'Hovering by the coats and laughing a beat late shows discomfort. The other choices describe the setting or show the narrator at ease.'},
  {p:'Researchers propose that a shrub\'s bright red berries evolved to attract birds, which then spread the shrub\'s seeds.',
   q:'Which finding, if true, would most directly support the proposal?', c:['Birds ate ripe red berries far more often than green ones, and seeds sprouted after passing through the birds.','The shrub grows well in both sun and shade.','The berries contain more sugar in summer than in autumn.','Several kinds of insects lay eggs on the shrub\'s leaves.'],
   e:'The proposal has two links: red attracts birds, and birds spread seeds. Only the finding about birds eating ripe red berries and spreading seeds supports both.'},
  {p:'A teacher claims that reading for 20 minutes a day causes students to earn higher vocabulary scores.',
   q:'Which finding, if true, would most directly weaken the claim?', c:['Students who already had high vocabulary scores were the most likely to choose to read daily.','Students who read daily said they enjoyed reading.','Some students read for more than 20 minutes a day.','The vocabulary test was given in the spring.'],
   e:'If strong students simply chose to read more, the reading may not be the cause. That undercuts a cause-and-effect claim.'},
  {p:'An essay argues that public libraries now serve as community centers, not just places to borrow books.',
   q:'Which quotation from the essay most effectively supports the argument?', c:['"Last year the branch hosted job fairs, citizenship classes, and coding clubs, and more visitors came for events than to borrow books."','"The library owns more than 80,000 books."','"The building was renovated in 1998."','"Some patrons now prefer e-books to print."'],
   e:'Events that draw more visitors than borrowing show the library working as a community center.'},
  {p:'A student claims that the speaker\'s attitude toward winter changes over the course of a poem.',
   q:'Which quotation from the poem most effectively illustrates the claim?', c:['"At first I cursed the frost that closed the roads; / by February I loved the hush it brought."','"Snow covered every roof in town."','"The frost lasted well into March."','"I have always loved the winter months."'],
   e:'"At first I cursed" and "by February I loved" show the change. "Always loved" shows no change at all.'},
  ]]},

{ id:'qe', sec:0, title:'Command of Evidence: Data',
  tip:'Read the title, labels, and units first. Then check the claim against exact numbers. A true statement about the data is still wrong if it does not support the claim.',
  lessons:[[
  {p:tbl('Average daily hours reported by students in one survey',['Grade','Screen time','Sleep'],[['9','4.1','8.0'],['10','4.8','7.6'],['11','5.3','7.2'],['12','5.9','6.9']])+'<p>A researcher notes that in the survey, students in higher grades reported more screen time and less sleep.</p>',
   q:'Which choice most effectively uses data from the table to support the researcher\'s observation?', c:['Grade 9 students reported 4.1 hours of screen time and 8.0 hours of sleep, while grade 12 students reported 5.9 hours of screen time and 6.9 hours of sleep.','Grade 10 and grade 11 students reported similar amounts of sleep.','Grade 12 students reported more sleep than screen time.','Grade 9 students reported less sleep than grade 11 students.'],
   e:'The observation has two trends. Only the grade 9 versus grade 12 comparison shows both screen time rising and sleep falling. The claim that grade 9 students slept less than grade 11 is false (8.0 is more than 7.2).'},
  {p:tbl('Share of electricity from wind (%)',['Country','2015','2023'],[['A','4','12'],['B','10','11'],['C','2','3'],['D','15','9']])+'<p>A student claims that Country A had the largest increase in its wind share between 2015 and 2023.</p>',
   q:'Which choice most effectively uses data from the table to support the claim?', c:['Country A\'s share rose by 8 percentage points, more than any other country\'s.','Country D had the highest share in 2015.','Country C\'s share rose between 2015 and 2023.','Country B\'s share was 11% in 2023.'],
   e:'"Largest increase" needs a comparison of changes: A rose 8 points, B 1, C 1, and D fell.'},
  {p:bars('Museum visitors by day of the week','Visitors',[['Mon',120],['Tue',90],['Wed',150],['Thu',140],['Fri',210],['Sat',340],['Sun',300]]),
   q:'Which choice most accurately describes data from the graph?', c:['The museum had more visitors on Saturday than on any other day.','The number of visitors fell every day from Monday to Sunday.','Wednesday had fewer visitors than Tuesday.','Sunday had the most visitors of the week.'],
   e:'Saturday\'s bar (340) is the tallest. Sunday (300) is close but lower.'},
  {p:tbl('Seed germination under three light conditions',['Condition','Seeds that sprouted'],[['Full sun','92%'],['Partial shade','78%'],['Full shade','31%']])+'<p>A biologist claims that seeds of this species sprout far less often without sunlight.</p>',
   q:'Which choice most effectively uses data from the table to support the claim?', c:['Only 31% of seeds sprouted in full shade, compared with 92% in full sun.','78% of seeds sprouted in partial shade.','More than three-quarters of seeds sprouted in partial shade.','The species is commonly found in forests.'],
   e:'The claim compares no sun with sun, so it needs the full shade and full sun numbers side by side.'},
  {p:tbl('Members of a school reading club',['Month','Members'],[['January','12'],['February','14'],['March','15'],['April','23'],['May','25']]),
   q:'Which choice most accurately describes the data in the table?', c:['Membership grew the most, by 8 members, between March and April.','Membership fell between April and May.','The club had 23 members in March.','Membership doubled between January and February.'],
   e:'March to April is 15 to 23, a gain of 8. No other month gains more than 2.'},
  ],[
  {p:tbl('Average one-way commute in one city',['Mode','Minutes'],[['Car','28'],['Bus','41'],['Bicycle','22'],['Walking','18']])+'<p>An urban planner argues that in this city, cycling offers a faster commute than driving.</p>',
   q:'Which choice most effectively uses data from the table to support the argument?', c:['Cyclists averaged 22 minutes, compared with 28 minutes for drivers.','Bus riders had the longest average commute.','Walkers had the shortest average commute.','Drivers averaged 13 minutes less than bus riders.'],
   e:'The argument compares cycling with driving, so the right answer must name both of those numbers.'},
  {p:tbl('Average reading scores before and after a term',['Group','Before','After'],[['Tutored','61','79'],['Not tutored','60','66']])+'<p>Researchers concluded that the tutoring program, not just another term of school, raised scores.</p>',
   q:'Which choice most effectively uses data from the table to support the conclusion?', c:['Both groups started near 60, but the tutored group gained 18 points while the other group gained only 6.','The group that was not tutored scored 66 after the term.','Both groups improved over the term.','The tutored group scored 61 before the term.'],
   e:'To isolate tutoring, compare gains of similar groups: +18 with tutoring versus +6 without.'},
  {p:bars('Monthly rainfall in one town','Millimeters',[['Apr',40],['May',85],['Jun',130],['Jul',120],['Aug',60]]),
   q:'Which statement is supported by the graph?', c:['June had the most rainfall of the months shown.','Rainfall increased every month from April to August.','July had less rainfall than May.','August had more rainfall than April and May combined.'],
   e:'June (130 mm) is the peak. April and May combined are 125 mm, more than August\'s 60 mm.'},
  {p:tbl('Adults who own a smartphone, by age',['Age group','Ownership'],[['18–29','96%'],['30–49','95%'],['50–64','83%'],['65 and older','61%']])+'<p>A student claims that smartphone ownership is nearly universal among adults under 50 but much lower among the oldest adults.</p>',
   q:'Which choice most effectively uses data from the table to support the claim?', c:['Ownership was 95% or higher in both groups under 50 but 61% among adults 65 and older.','83% of adults aged 50–64 own a smartphone.','Adults aged 18–29 had the highest ownership rate.','Ownership differed by only 1 point between the two youngest groups.'],
   e:'The claim contrasts under-50 adults with the oldest adults. The correct choice gives both sides: 95% or more under 50, and 61% for 65 and older.'},
  {p:'<p>A store tested two window displays. Display X was seen by 400 shoppers, and 60 of them made a purchase. Display Y was seen by 250 shoppers, and 50 of them made a purchase. The manager claims that Display Y was better at turning viewers into buyers.</p>',
   q:'Which choice best supports the manager\'s claim?', c:['20% of Display Y viewers made a purchase, compared with 15% of Display X viewers.','Display X led to more total purchases than Display Y.','Display X was seen by more shoppers than Display Y.','Both displays led to at least 50 purchases.'],
   e:'"Turning viewers into buyers" is a rate: 50 of 250 is 20%, while 60 of 400 is 15%. Total purchases is a trap.'},
  ]]},

{ id:'inf', sec:0, title:'Inferences',
  tip:'The answer must follow from the text with no extra assumptions. If you have to imagine a new fact to make a choice work, it is wrong.',
  lessons:[[
  {p:'Pottery shards from an ancient village contain traces of milk fat. The shards are about 7,000 years old, yet animal bones from the village show no sign that its people kept cattle, sheep, or goats. One explanation is that the villagers ___',
   q:'Which choice most logically completes the text?', c:['obtained milk products from neighboring groups that kept such animals.','made the pottery much more recently than 7,000 years ago.','kept more cattle than any other village in the region.','used the pottery only for storing grain.'],
   e:'Milk with no herd animals points to an outside source. The other choices contradict the text.'},
  {p:'Most desert lizards are active during the day. One species, however, is active only at night, and its eyes contain far more light-sensitive cells than the eyes of related daytime species. This suggests that ___',
   q:'Which choice most logically completes the text?', c:['the species\' eyes may be adapted for seeing in low light.','the species avoids all other lizards.','daytime lizards cannot see colors.','the species spends winter underground.'],
   e:'Night activity plus extra light-sensitive cells leads straight to low-light vision. Nothing in the text covers colors or winter.'},
  {p:'In a study, participants who were told that a puzzle was "nearly impossible" gave up sooner than participants who were told nothing, even though both groups worked on the same solvable puzzle. This finding suggests that ___',
   q:'Which choice most logically completes the text?', c:['people\'s beliefs about a task\'s difficulty can affect how long they keep trying.','the puzzle was too difficult for most participants.','most people dislike solving puzzles.','participants who were told nothing were more intelligent.'],
   e:'The puzzle was identical, so the only difference was what people were told, and that changed how long they persisted.'},
  {p:'When Grandfather read the letter, he set down his spoon, folded his napkin into a perfect square, and left the table without a word. No one finished dinner that night.',
   q:'Based on the text, what can most reasonably be inferred?', c:['The letter\'s news deeply affected Grandfather and the rest of the family.','Grandfather did not like the food that was served.','The family was angry with Grandfather for leaving.','The letter came from one of Grandfather\'s old friends.'],
   e:'His silent exit and the family leaving their food suggest serious news. Nothing hints at the food or the sender.'},
  {p:'Coffee plants grown in shade produce fewer berries than plants grown in full sun, but shade-grown berries ripen more slowly and develop richer flavors. Several farmers who sell to specialty coffee shops have switched to shade growing. These farmers most likely ___',
   q:'Which choice most logically completes the text?', c:['value flavor more highly than the size of their harvest.','want to grow as many berries as possible.','have farms that receive no sunlight at all.','plan to stop selling to specialty coffee shops.'],
   e:'They accepted fewer berries in exchange for richer flavor, which shows what they value.'},
  ],[
  {p:'Monks who copied manuscripts by hand in medieval Europe sometimes left notes in the margins. Some notes complain about freezing fingers, poor ink, or aching eyes. These notes suggest that ___',
   q:'Which choice most logically completes the text?', c:['copying manuscripts was physically demanding work.','most monks did not know how to read.','manuscripts were usually copied in summer.','ink was rarely used in medieval Europe.'],
   e:'Complaints about fingers, eyes, and ink all point to hard physical work.'},
  {p:'A bridge appears on a map made in 1835 but not on a map made in 1820. A letter written in 1828 describes a walk across the bridge. Based on this information, the bridge was most likely built ___',
   q:'Which choice most logically completes the text?', c:['between 1820 and 1828.','after 1835.','before 1820.','between 1828 and 1835.'],
   e:'It was missing in 1820 and already crossed in 1828, so it was built in between.'},
  {p:'Beavers build dams that create ponds. In one valley where beavers were brought back, the ponds held water through dry summers, while nearby streams without dams dried up. These findings imply that ___',
   q:'Which choice most logically completes the text?', c:['beavers could help some landscapes hold water during droughts.','beavers prefer streams that never dry up.','dams always harm fish in nearby streams.','the valley had more rain after the beavers returned.'],
   e:'Dammed ponds kept water while undammed streams dried, so beavers helped hold water in dry conditions.'},
  {p:'A novelist writes every first draft by hand, saying the slow pace lets her "hear" each sentence before she commits to it. Her editor notes that the novelist\'s first drafts need fewer changes than those of most writers she works with. The editor\'s observation suggests that ___',
   q:'Which choice most logically completes the text?', c:['the novelist\'s method may help her produce polished writing early.','handwriting is faster than typing for most writers.','the editor prefers to work with typed drafts.','the novelist rarely revises her later drafts.'],
   e:'Fewer changes to first drafts suggests the slow, careful method pays off early in the process.'},
  {p:'After a town lowered the fare on its bus line, the number of riders rose by 30 percent, yet total fare money collected stayed about the same. This suggests that ___',
   q:'Which choice most logically completes the text?', c:['the extra riders roughly made up for the lower price per ride.','the town raised the fare again soon afterward.','fewer people rode the bus after the change.','fare money doubled after the change.'],
   e:'Lower price times more riders gave about the same total, so the two changes balanced out.'},
  ]]},

{ id:'wic', sec:1, title:'Words in Context',
  tip:'Cover the choices. Predict your own word from the clues around the blank, then pick the choice closest to your prediction.',
  lessons:[[
  {p:'The documentary\'s portrait of the scientist was far from flattering. It was ___, giving her stubbornness and mistakes as much attention as her discoveries.',
   q:Q_WORD, c:['candid','reverent','vague','lighthearted'],
   e:'Showing faults as well as successes is honest and direct, which is candid. Reverent would mean worshipful.'},
  {p:'Although early trials of the vaccine were promising, the researchers remained ___, insisting that larger studies were needed before drawing any conclusions.',
   q:Q_WORD, c:['cautious','elated','indifferent','hostile'],
   e:'"Although promising" sets up a contrast, and wanting more studies before concluding signals caution.'},
  {t:'m', pairs:[['meticulous','extremely careful about details'],['ubiquitous','found everywhere'],['tenuous','weak or slight'],['corroborate','confirm with more evidence']]},
  {p:'The engineers concluded that the bridge\'s design was <u>sound</u> and could safely carry heavier traffic.',
   q:'As used in the text, what does the word "sound" most nearly mean?', c:['reliable','noisy','audible','brief'],
   e:'A design that "could safely carry heavier traffic" is reliable. The noise meanings ignore the context.'},
  {p:'The poet\'s later work is ___: a single short poem may move from grief to humor to quiet wonder.',
   q:Q_WORD, c:['multifaceted','unvarying','predictable','superficial'],
   e:'Shifting across many moods means having many sides, which is multifaceted.'},
  ],[
  {p:'New treatments may <u>arrest</u> the spread of the disease, giving patients more years of good health.',
   q:'As used in the text, what does the word "arrest" most nearly mean?', c:['halt','capture','attract','punish'],
   e:'Stopping a disease from spreading is to halt it. "Capture" is the police meaning, which does not fit.'},
  {t:'m', pairs:[['mitigate','make less severe'],['pragmatic','focused on practical results'],['scrutinize','examine very closely'],['elusive','hard to find or catch']]},
  {p:'Critics first dismissed the architect\'s designs as impractical, but the buildings proved so ___ that they survived three major earthquakes with little damage.',
   q:Q_WORD, c:['resilient','ornate','fragile','temporary'],
   e:'"But" sets up a contrast with "impractical," and surviving earthquakes points to strength: resilient.'},
  {p:'The historian\'s argument rests on ___ evidence: a single letter whose author and date are both uncertain.',
   q:Q_WORD, c:['tenuous','overwhelming','conclusive','abundant'],
   e:'The colon explains the blank. One uncertain letter is weak evidence, which is tenuous.'},
  {p:'Rather than ___ the new policy outright, the senator proposed a series of amendments to improve it.',
   q:Q_WORD, c:['repudiate','endorse','celebrate','enact'],
   e:'"Rather than" contrasts with improving the policy, so the blank means rejecting it completely: repudiate.'},
  ]]},

{ id:'ts', sec:1, title:'Text Structure and Purpose',
  tip:'Ask what each sentence is doing (claiming, explaining, giving an example, objecting), not just what it says.',
  lessons:[[
  {p:'<u>Many people think of deserts as lifeless places.</u> In fact, the Sonoran Desert is home to more than 2,000 plant species. Some bloom only after rare heavy rains, covering the sand with color for just a few weeks.',
   q:'Which choice best describes the function of the underlined sentence in the text as a whole?', c:['It presents a common view that the rest of the text challenges.','It provides evidence for the text\'s main claim.','It summarizes the conclusion of a study.','It defines a scientific term used later.'],
   e:'"In fact" turns against the first sentence. The text sets up a common belief and then disproves it.'},
  {p:'Early bicycles had a huge front wheel and a tiny rear one, which made them fast but dangerous. In the 1880s, the "safety bicycle" introduced two wheels of equal size and a chain drive. Within about a decade, it had almost entirely replaced the older design.',
   q:'Which choice best describes the overall structure of the text?', c:['It describes a problem with an early design and then explains the innovation that replaced it.','It compares the careers of two inventors.','It argues that modern bicycles are still dangerous.','It lists the steps for building a bicycle.'],
   e:'Danger (problem), the safety bicycle (solution), then its success: a problem and solution structure.'},
  {p:'The house looked just as Nadia remembered it. The same blue curtains hung in the windows, the same cracked tile sat by the door, and the kitchen clock still showed 4:10, the time it had stopped years ago.',
   q:'Which choice best states the main purpose of the text?', c:['To show that the house has stayed largely unchanged','To explain why Nadia arrived late','To describe repairs that were made to the house','To suggest that Nadia dislikes the house'],
   e:'Every detail ("the same," "still showed") stresses that nothing has changed.'},
  {p:'Some historians argue that the printing press caused the Renaissance. <u>This claim, though appealing, overstates the case: many key Renaissance works circulated in handwritten copies decades before printing reached Italy.</u>',
   q:'Which choice best describes the function of the underlined sentence?', c:['It qualifies a claim by pointing to evidence that complicates it.','It gives an example that supports the historians\' claim.','It restates the historians\' claim in simpler words.','It introduces a topic unrelated to the first sentence.'],
   e:'"Overstates the case" plus a counterexample limits the claim without rejecting it entirely.'},
  {p:'Critics often call the composer\'s music simple. Yet listeners who pay close attention find that her short melodies rest on unusual rhythms that shift almost every measure.',
   q:'Which choice best states the main purpose of the text?', c:['To suggest that the music is more complex than it first appears','To argue that critics dislike the composer','To explain how to write a short melody','To compare the composer with other musicians'],
   e:'"Yet" pushes back on "simple," revealing hidden complexity.'},
  ]]},

{ id:'ct', sec:1, title:'Cross-Text Connections',
  tip:'Sum up each author\'s position in a few words first. Then ask how the author of Text 2 would react to the claim in Text 1.',
  lessons:[[
  {p:'<p><b>Text 1</b><br>Some nutrition researchers argue that eating breakfast is essential for weight control. They point to studies in which people who ate breakfast weighed less, on average, than people who skipped it.</p><p><b>Text 2</b><br>Those studies show only a correlation. When researchers randomly assigned people either to eat breakfast or to skip it, weight changes were nearly identical in the two groups.</p>',
   q:'Based on the texts, how would the author of Text 2 most likely respond to the researchers in Text 1?', c:['By arguing that their evidence does not show that breakfast causes weight control','By agreeing that breakfast is essential for weight control','By claiming that people who skip breakfast weigh less','By saying that random assignment studies are unreliable'],
   e:'Text 2 says correlation is not causation and offers a controlled test where breakfast made no difference.'},
  {p:'<p><b>Text 1</b><br>Critics often call the novelist\'s endings rushed, since major conflicts are resolved in just a few pages.</p><p><b>Text 2</b><br>The novelist\'s brief endings are deliberate. By resolving conflicts abruptly, she mirrors how suddenly change arrives in her characters\' lives.</p>',
   q:'Based on the texts, how would the author of Text 2 most likely respond to the critics in Text 1?', c:['By arguing that the critics mistake a deliberate choice for a flaw','By agreeing that the endings are rushed','By claiming the novels are too long','By saying the critics have not read the novels'],
   e:'Text 2 accepts that the endings are brief but says the brevity is intentional and meaningful.'},
  {p:'<p><b>Text 1</b><br>Rooftop gardens are too small to make a real difference to a city\'s food supply.</p><p><b>Text 2</b><br>It is true that rooftop gardens rarely feed many people. But they cool buildings, absorb stormwater, and give residents a place to gather.</p>',
   q:'Based on the texts, how would the author of Text 2 most likely respond to Text 1?', c:['By accepting the point about food supply while arguing the gardens have other benefits','By using harvest data to show the gardens feed many people','By arguing that rooftop gardens should be banned','By agreeing that rooftop gardens are not worth building'],
   e:'"It is true... But..." is a concession followed by other benefits.'},
  {p:'<p><b>Text 1</b><br>Many linguists once believed that babies learn language only by imitating adults.</p><p><b>Text 2</b><br>Young children regularly say forms they never hear adults use, such as "goed" instead of "went." These errors show that children apply grammar rules they have worked out on their own.</p>',
   q:'Based on the texts, how would the author of Text 2 most likely view the belief described in Text 1?', c:['As incomplete, because children also build language by applying rules','As correct, because children copy everything adults say','As irrelevant to how children learn language','As proven by children\'s mistakes'],
   e:'"Goed" cannot come from imitation, so imitation alone cannot explain learning.'},
  {p:'<p><b>Text 1</b><br>Self-driving cars will reduce traffic accidents, since most crashes are caused by human error.</p><p><b>Text 2</b><br>Even if automated systems remove some human errors, they bring new risks, such as software failures and confusion when control shifts back to a human driver.</p>',
   q:'Based on the texts, how would the author of Text 2 most likely respond to the argument in Text 1?', c:['It overlooks new kinds of risk that automation may create.','It correctly predicts that accidents will disappear.','It wrongly claims that humans cause most crashes.','It ignores the high cost of self-driving cars.'],
   e:'Text 2 does not deny the human-error point. It adds risks that Text 1 leaves out.'},
  ]]},

{ id:'tr', sec:2, title:'Transitions',
  tip:'Decide the relationship between the two sentences before reading the choices: same direction, contrast, cause and effect, example, or time order.',
  lessons:[[
  {p:'Honeybees share the location of food through a "waggle dance." ___ the angle of the dance tells other bees which direction to fly relative to the sun.',
   q:Q_TRANS, c:['Specifically,','However,','Nevertheless,','In contrast,'],
   e:'The second sentence gives a precise detail about the dance, so "Specifically" fits.'},
  {p:'The first prototype of the device was heavy and expensive. ___ engineers spent two years redesigning it with lighter materials.',
   q:Q_TRANS, c:['Consequently,','Similarly,','For example,','Nonetheless,'],
   e:'The redesign happened because of the problems: cause and effect.'},
  {p:'Many people believe that hummingbirds migrate by riding on the backs of larger birds. ___ hummingbirds make their long journeys entirely under their own power.',
   q:Q_TRANS, c:['In reality,','Likewise,','Therefore,','For instance,'],
   e:'The second sentence corrects a false belief, so "In reality" fits.'},
  {p:'The city\'s population grew rapidly in the 1990s. ___ its public transportation system barely expanded.',
   q:Q_TRANS, c:['However,','Additionally,','Thus,','Similarly,'],
   e:'Rapid growth versus almost no expansion is a contrast.'},
  {p:'Some plants defend themselves with thorns. Others produce bitter chemicals that make their leaves unpleasant to eat. ___ certain acacia trees house ants that attack any animal that tries to feed on them.',
   q:Q_TRANS, c:['Finally,','In other words,','As a result,','Instead,'],
   e:'This is the last item in a list of plant defenses.'},
  ],[
  {p:'The novel received harsh reviews when it was first published. ___ it has since become a classic taught in schools around the world.',
   q:Q_TRANS, c:['Nevertheless,','Moreover,','For this reason,','Likewise,'],
   e:'Harsh reviews, then classic status: a contrast. "For this reason" would wrongly say the reviews caused it.'},
  {p:'Octopuses can change color in less than a second. ___ they can alter the texture of their skin, raising small bumps to imitate rocks or coral.',
   q:Q_TRANS, c:['In addition,','Instead,','Even so,','As a result,'],
   e:'A second ability is added to the first, so this is the same direction.'},
  {p:'The experiment produced the same results in three different laboratories. ___ the researchers were confident that their findings were reliable.',
   q:Q_TRANS, c:['Therefore,','Nonetheless,','For instance,','Conversely,'],
   e:'Repeated results are the reason for confidence: cause and effect.'},
  {p:'Early telephones required an operator to connect every call by hand. ___ automatic switching systems allowed callers to dial numbers themselves.',
   q:Q_TRANS, c:['Later,','Similarly,','For example,','In other words,'],
   e:'This is a step forward in time.'},
  {p:'Some critics praised the film\'s striking visual style. ___ they found its story confusing and slow.',
   q:Q_TRANS, c:['However,','As a result,','For instance,','Likewise,'],
   e:'Praise, then criticism: a contrast.'},
  ]]},

{ id:'rs', sec:2, title:'Rhetorical Synthesis',
  tip:'Ignore which note is most interesting. Read the goal in the question, then pick the choice that does exactly that.',
  lessons:[[
  {p:notes(['The Aral Sea was once one of the four largest lakes in the world.','Beginning in the 1960s, the rivers feeding it were diverted to irrigate cotton fields.','By the 2000s, the sea had lost most of its water.','A dam completed in 2005 has helped the northern part of the sea partly recover.']),
   q:'The student wants to explain the cause of the Aral Sea\'s decline. Which choice most effectively uses relevant information from the notes to accomplish this goal?', c:['The Aral Sea shrank after the rivers feeding it were diverted to irrigate cotton fields, beginning in the 1960s.','The Aral Sea was once one of the four largest lakes in the world.','A dam completed in 2005 has helped the northern Aral Sea partly recover.','By the 2000s, the Aral Sea had lost most of its water.'],
   e:'The goal is the cause. Only one choice names a cause: river diversion for irrigation.'},
  {p:notes(['Mary Anning (1799–1847) was a fossil collector in southern England.','As a young woman, she found the first ichthyosaur skeleton to be correctly identified.','In 1823 she found the first nearly complete plesiosaur skeleton.','Scientists of her time often published her finds without crediting her.']),
   q:'The student wants to emphasize that Anning\'s work was not fully recognized in her lifetime. Which choice most effectively uses relevant information from the notes to accomplish this goal?', c:['Although Anning made major fossil discoveries, scientists of her time often published them without crediting her.','In 1823, Anning found the first nearly complete plesiosaur skeleton.','Mary Anning was a fossil collector who lived from 1799 to 1847.','Anning found the first ichthyosaur skeleton to be correctly identified.'],
   e:'The goal is lack of recognition, so the answer must include the missing credit.'},
  {p:notes(['Researchers grew two groups of tomato plants.','Group A was watered every day.','Group B was watered every three days.','Group B produced fewer tomatoes, but they were sweeter.']),
   q:'The student wants to contrast the results for the two groups. Which choice most effectively uses relevant information from the notes to accomplish this goal?', c:['Plants watered every three days produced fewer but sweeter tomatoes than plants watered daily.','Researchers grew two groups of tomato plants.','One group of tomato plants was watered every day.','Group B was watered every three days.'],
   e:'A contrast of results needs both groups and the outcome.'},
  {p:notes(['The kora is a 21-string instrument from West Africa.','Its body is made from a large gourd covered with cow skin.','It is traditionally played by griots, musicians who also serve as oral historians.','Musician Toumani Diabaté brought the kora to international audiences.']),
   q:'The student wants to describe the kora to an audience unfamiliar with it. Which choice most effectively uses relevant information from the notes to accomplish this goal?', c:['The kora, an instrument from West Africa, has 21 strings and a body made from a large gourd covered with cow skin.','Toumani Diabaté brought the kora to international audiences.','Griots are musicians who also serve as oral historians.','The kora is traditionally played by griots.'],
   e:'An unfamiliar audience needs to know what the instrument is: its origin, strings, and body.'},
  {p:notes(['Ibn Sina (980–1037) was born near Bukhara.','His Canon of Medicine was used as a textbook in Europe for centuries.','He also wrote on philosophy, astronomy, and music.']),
   q:'The student wants to emphasize the wide range of Ibn Sina\'s work. Which choice most effectively uses relevant information from the notes to accomplish this goal?', c:['Ibn Sina wrote not only on medicine but also on philosophy, astronomy, and music.','Ibn Sina was born near Bukhara in 980.','Ibn Sina\'s Canon of Medicine was used in Europe for centuries.','Ibn Sina lived from 980 to 1037.'],
   e:'"Wide range" calls for the many fields he wrote about.'},
  ]]},

{ id:'bd', sec:3, title:'Boundaries',
  tip:'A semicolon or period needs a complete sentence on BOTH sides. A comma alone cannot join two complete sentences. A colon needs a complete sentence before it.',
  lessons:[[
  {p:'The museum closed for renovations in ___ will reopen next spring with three new galleries.',
   q:Q_CONV, c:['March; it','March, it','March it','March, and, it'],
   e:'Both halves are complete sentences. A semicolon can join them; a comma alone makes a comma splice.'},
  {p:'Volcanologists watch for three warning ___ small earthquakes, swelling of the ground, and rising gas emissions.',
   q:Q_CONV, c:['signs:','signs;','signs,','signs'],
   e:'A complete sentence introduces a list, so a colon is correct. A semicolon needs a full sentence after it.'},
  {t:'tap', s:'The team finished the *report,* however, they forgot to include the data tables.',
   e:'"However" here sits between two complete sentences, so it needs a semicolon or period before it: "report; however, they..."'},
  {p:'Zulfiya Karimova\'s first novel became a bestseller. The ___ now lives in London.',
   q:Q_CONV, c:['author, who grew up in Tashkent,','author, who grew up in Tashkent','author who grew up in Tashkent,','author—who grew up in Tashkent,'],
   e:'Extra information is set off by a matching pair of commas (or a pair of dashes). Mixed or single punctuation is wrong.'},
  {p:'Marine biologist Sylvia Earle has spent more than 7,000 hours ___ has led over 100 expeditions.',
   q:Q_CONV, c:['underwater, and she','underwater, she','underwater and, she','underwater; and she'],
   e:'Two complete sentences joined by "and" need a comma before "and." A comma alone would be a splice.'},
  ],[
  {p:'Many desert plants store water in their thick ___ the jade plant, for example, can survive weeks without rain.',
   q:Q_CONV, c:['leaves;','leaves,','leaves','leaves, for'],
   e:'Two complete sentences: use a semicolon (or a period). A comma alone creates a splice.'},
  {t:'tap', s:'My grandmother\'s recipe calls *for:* flour, butter, sugar, and two eggs.',
   e:'"My grandmother\'s recipe calls for" is not a complete sentence, so no colon. Write "calls for flour, butter..."'},
  {p:'The results of the trial were ___ the new drug reduced symptoms in 80 percent of patients.',
   q:Q_CONV, c:['striking:','striking,','striking','striking, being'],
   e:'A colon can introduce an explanation after a complete sentence. A comma would create a splice.'},
  {t:'tap', s:'The players who trained the *hardest,* earned the most playing time.',
   e:'Never put a single comma between a subject ("The players who trained the hardest") and its verb ("earned").'},
  {p:'The ___ a lightweight sensor that tracks air quality, has been adopted by schools in twelve countries.',
   q:Q_CONV, c:['scientist\'s invention,','scientist\'s invention','scientist\'s invention;','scientist\'s invention:'],
   e:'The phrase "a lightweight sensor that tracks air quality" is extra information. It closes with a comma, so it must open with one.'},
  ]]},

{ id:'fss', sec:3, title:'Form, Structure, and Sense',
  tip:'Find the real subject (skip "of..." phrases and extra clauses) and make the verb or pronoun match it. Modifiers must sit right next to what they describe.',
  lessons:[[
  {p:'The collection of ancient coins in the museum\'s west wing ___ visitors from around the world.',
   q:Q_CONV, c:['attracts','attract','are attracting','have attracted'],
   e:'The subject is "collection" (singular), not "coins." Singular subject, singular verb.'},
  {t:'tap', s:'Each of the students *have* submitted a final essay.',
   e:'"Each" is singular, so the verb must be "has."'},
  {p:'Walking through the old city of Bukhara, ___',
   q:Q_CONV, c:['Rustam was amazed by the blue domes of the mosques.','the blue domes of the mosques amazed Rustam.','the mosques\' blue domes were amazing to Rustam.','amazement filled Rustam at the blue domes.'],
   e:'Whoever comes right after the comma must be the one walking. Only Rustam can walk.'},
  {p:'Last summer, the research team ___ water samples from six lakes before the season ended.',
   q:Q_CONV, c:['collected','collects','will collect','has been collecting'],
   e:'"Last summer" fixes the action in the finished past: simple past "collected."'},
  {p:'When the city council and the mayor met, ___ agreed to fund a new library.',
   q:Q_CONV, c:['they','it','he or she','one'],
   e:'Two groups (council and mayor) form a plural antecedent, so "they" is correct.'},
  ],[
  {t:'tap', s:'Neither the coach nor the players *was* happy with the final score.',
   e:'With "neither... nor," the verb agrees with the nearer subject, "players," so use "were."'},
  {p:'The museum displays paintings by Van Gogh, sculptures by Rodin, and ___',
   q:Q_CONV, c:['photographs by Ansel Adams.','Ansel Adams took photographs.','also photographing by Ansel Adams.','photographed by Ansel Adams.'],
   e:'Items in a list must be parallel: paintings by..., sculptures by..., photographs by...'},
  {p:'Scientists studying the island\'s finches found that ___ beaks had changed shape over several generations.',
   q:Q_CONV, c:['their','its','there','they\'re'],
   e:'"Finches" is plural, and the beaks belong to them, so use the plural possessive "their."'},
  {t:'tap', s:'The flock of geese *fly* south every October.',
   e:'"Flock" is the singular subject, so the verb must be "flies."'},
  {p:'Unlike the first edition, ___',
   q:Q_CONV, c:['the second edition includes color maps.','the second edition\'s chapters include color maps.','color maps are included in the second edition.','readers find color maps in the second edition.'],
   e:'Compare like with like: one edition with another edition.'},
  ]]},
];

 {d:1,p:'Many people assume that octopuses live alone and avoid one another. At a site off the coast of Australia nicknamed "Octlantis," however, researchers observed more than a dozen octopuses living close together, sharing dens and frequently signaling to one another with changes in skin color.',

  q:Q_MAIN, c:['Despite her resistance, Gulnora is gradually adapting to the pace of city life.','Gulnora is unhappy because she cannot find her way around the city.','Gulnora walks slowly because she is tired from her journey.','The city is described as calmer than Gulnora\'s village.'],

 {d:2,p:'Linguist Madina Yusupova recorded conversations among teenagers in Tashkent and found that many switched between Uzbek, Russian, and English within a single sentence. Some educators have viewed such mixing as a sign of weak language skills. Yusupova argues the opposite: speakers choose each word deliberately, using whichever language best expresses a particular idea or tone.',
  q:'Which choice best states the main idea of the text?', c:['Yusupova argues that mixing languages in conversation reflects skillful choices rather than weakness.','Teenagers in Tashkent speak English more often than Uzbek or Russian.','Educators have successfully reduced language mixing in schools.','Yusupova believes that students should speak only one language at a time.'],

 {d:3,p:'Because the bristlecone pines of the western United States can live for more than four thousand years, scientists once assumed that the trees simply avoid aging. Studies of their tissues tell a more complicated story: the trees do show signs of aging, but they survive by allowing whole sections of bark and wood to die while a narrow strip of living tissue continues to carry water and nutrients to a few branches.',

 {d:2,p:'Most bridges are designed to last about fifty to one hundred years. Engineers in the Netherlands, however, have begun testing bridges made of a concrete that contains dormant bacteria. When a crack forms and water seeps in, the bacteria awaken and produce limestone, which can seal small cracks before they grow larger.',

 {d:2,p:'Before the invention of printing, many medieval manuscripts included small drawings in their margins: rabbits riding snails, knights fighting snails, monkeys playing instruments. Historians once dismissed these images as idle doodles. More recent scholars have shown that many of the drawings comment on the text beside them, sometimes mocking the very ideas the text presents.',

  e:'The text contrasts the older dismissal with the newer finding that the drawings comment on the text. That finding is the main idea.'},
 {d:3,p:'The following text is adapted from a 1902 novel. Sardor, a young clerk, has been offered a position in a distant city.<br><br>He told himself that he was weighing the advantages: the salary, the prospects, the respect of his employer. Yet each evening he found himself walking past the house where he was born, lingering at the gate, as though the decision had already been made somewhere he could not see.',

 {d:3,p:'Ecologists studying wolves in Yellowstone National Park have long credited the animals\' return in 1995 with allowing streamside willows to recover, reasoning that wolves frightened elk away from the streams where they browsed. A recent study complicates this account. It found that willows recovered mainly where beavers had also returned and rebuilt dams, which raised the water table that willows depend on.',

 {d:1,p:'In 2019, a team of volunteers in Samarkand began photographing every tile in the courtyard of an old madrasa. Using the photographs, conservators created a digital map showing the condition of each tile. The map now helps them decide which damaged tiles to repair first.',

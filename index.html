ts:[
 {d:2,p:'Many people picture inventors working alone in sudden flashes of insight. <u>The light bulb, however, was the product of decades of work by dozens of researchers in several countries, each improving on earlier designs.</u> Thomas Edison\'s team tested thousands of materials before settling on a practical filament.',
  q:'Which choice best describes the function of the underlined sentence in the text as a whole?', c:['It offers an example that challenges a popular image of how inventions happen.','It explains why Edison\'s filament succeeded.','It summarizes the text\'s final conclusion.','It presents a view that the rest of the text supports.'],
  e:'"However" signals that the light bulb story contradicts the lone-genius picture from the first sentence.'},
 {d:2,p:'The kettle sang, the cat stretched on the windowsill, and the morning light spread slowly across the table, warming the bread and the old wooden chairs. For the first time in weeks, Shoira let herself sit down.',
  q:'Which choice best states the main purpose of the text?', c:['To convey a peaceful moment that allows a character to finally rest','To explain how to prepare breakfast','To suggest that Shoira dislikes her home','To describe a busy household preparing for guests'],
  e:'Gentle details build calm, and "for the first time in weeks" shows Shoira finally resting.'},
 {d:2,p:'Some scientists once argued that dinosaurs were slow, cold-blooded reptiles. Fossil evidence of feathers, fast growth, and bird-like breathing has led most researchers to reject that view. Today, many paleontologists consider birds to be living dinosaurs.',
  q:'Which choice best describes the overall structure of the text?', c:['It describes an earlier view, presents evidence against it, and states the current view.','It compares two current theories without choosing between them.','It lists the steps scientists use to find fossils.','It argues that birds and dinosaurs are unrelated.'],
  e:'Old view, then evidence against it, then today\'s view.'},
 {d:3,p:'A city council expected its new bus lane to shorten commutes. <u>Commute times did fall, but by less than one minute on average.</u> Council members are now debating whether the lane is worth its cost.',
  q:'Which choice best describes the function of the underlined sentence?', c:['It reports a result that was positive but smaller than expected.','It shows that the bus lane failed completely.','It explains why the council built the lane.','It provides evidence that commutes became longer.'],
  e:'Times did fall (positive), but barely, which explains the debate that follows.'},
 {d:3,p:'Critics praise the composer\'s symphonies, but her film scores are rarely discussed. That is a mistake: the scores contain some of her boldest experiments with rhythm, techniques she later used in the very symphonies critics admire.',
  q:'Which choice best states the main purpose of the text?', c:['To argue that an overlooked part of the composer\'s work deserves attention','To explain why film music is less important than symphonies','To describe how symphonies are written','To criticize the composer\'s symphonies'],
  e:'"That is a mistake" signals an argument: the neglected film scores matter.'},
],
ct:[
 {d:3,p:'<p><b>Text 1</b><br>Some researchers argue that social media use directly causes anxiety in teenagers.</p><p><b>Text 2</b><br>Large studies find only a weak link between total screen time and anxiety. The effects seem to depend on how teens use social media, such as whether they constantly compare themselves with others, rather than on how much time they spend.</p>',
  q:'Based on the texts, how would the author of Text 2 most likely respond to the researchers in Text 1?', c:['By suggesting that their claim is too simple, since the type of use matters more than the amount','By agreeing that social media causes anxiety in all teenagers','By arguing that teenagers should spend more time online','By claiming that no studies have examined the issue'],
  e:'Text 2 does not deny any effect. It says the picture is more complicated than direct cause and effect.'},
 {d:2,p:'<p><b>Text 1</b><br>The poet\'s later work abandons the clear imagery of her early poems for abstract language, and it is weaker as a result.</p><p><b>Text 2</b><br>Her later poems are more abstract, but this shift reflects her growing interest in philosophy, and the poems reward readers willing to engage with their ideas.</p>',
  q:'Which choice best describes how the author of Text 2 relates to Text 1?', c:['The author agrees that the later poems are more abstract but disagrees that they are weaker.','The author agrees that the later poems are weaker.','The author denies that the later poems are more abstract.','The author argues that the early poems are more philosophical.'],
  e:'"Her later poems are more abstract, but..." concedes the fact and rejects the judgment.'},
 {d:3,p:'<p><b>Text 1</b><br>Planting trees is the most effective way for cities to cool down during heat waves.</p><p><b>Text 2</b><br>Trees help, but they take decades to grow. In the short term, reflective roofs and pavements can lower surface temperatures much more quickly.</p>',
  q:'Based on the texts, how would the author of Text 2 most likely respond to Text 1?', c:['By noting a limitation of the strategy Text 1 favors and proposing a faster alternative','By rejecting the idea that trees cool cities','By agreeing that trees are the fastest solution','By arguing that heat waves are not a serious problem'],
  e:'"Trees help, but..." accepts the benefit, points out the time problem, and offers another option.'},
 {d:3,p:'<p><b>Text 1</b><br>Historians have long believed that the ancient city was abandoned suddenly after an earthquake.</p><p><b>Text 2</b><br>New excavations show that residents removed their valuables and sealed doorways over several years before leaving. Earthquake damage appears mostly in buildings that were already empty.</p>',
  q:'Which choice best describes the relationship between the texts?', c:['Text 2 provides evidence that challenges Text 1\'s account of how the city was abandoned.','Text 2 confirms that the city was abandoned suddenly.','Text 2 argues that the earthquake never happened.','Text 2 explains why historians study earthquakes.'],
  e:'A gradual departure before the quake contradicts a sudden abandonment. Text 2 does not deny the earthquake itself.'},
 {d:3,p:'<p><b>Text 1</b><br>Learning a second language in childhood is essential, because adults rarely become fluent.</p><p><b>Text 2</b><br>Children often have an advantage in pronunciation, but studies show that motivated adults frequently learn grammar and vocabulary faster than children do.</p>',
  q:'Based on the texts, how would the author of Text 2 most likely respond to Text 1?', c:['By arguing that Text 1 overstates children\'s advantage, since adults can learn some parts of a language faster','By agreeing that adults can never become fluent','By claiming that pronunciation is the only important skill','By saying children learn grammar faster than adults'],
  e:'Text 2 grants children one advantage (pronunciation) but shows adults ahead in others.'},
],

rs:[
 {d:2,p:notes(['Al-Khwarizmi was a 9th-century scholar who worked in Baghdad.','He came from the region of Khwarazm, in present-day Uzbekistan.','His book on solving equations gave its name to "algebra."','The word "algorithm" comes from a Latin form of his name.']),

const NEAR = [['corroborate','validate','substantiate','concur'],['tentative','provisional','preliminary','inconclusive'],['resilient','robust','tenacious','steadfast'],
 ['meticulous','rigorous','diligent','comprehensive','exhaustive'],['negligible','marginal','meager','sparse','scarce'],['wary','apprehensive','skeptical'],['detached','aloof','dismissive'],
 ['foster','engender','bolster','advocate','induce'],['diminish','curtail','mitigate'],['contend','assert','qualify'],['convey','articulate','depict','evoke'],['compelling','cogent','lucid','plausible'],
 ['impede','deter','undermine'],['emulate','replicate'],['exacerbate','precipitate'],['unprecedented','unforeseen','novel'],['ambiguous','elusive','inconsistent'],['venerate','reverent'],
 ['prolific','abundant','myriad','ample','substantial'],['nostalgic','wistful'],['frugal','meager'],['zealous','earnest'],['dubious','skeptical','tenuous'],['infer','speculate','discern'],['impetuous','arbitrary','inadvertent'],
 ['robust','compelling','rigorous'],['convey','induce'],['methodology','premise'],['abundant','ubiquitous'],['qualify','curtail'],['tenuous','negligible'],
 ['ephemeral','transient','provisional','tentative'],['perennial','perpetual'],['nascent','novel','preliminary','rudimentary'],['archaic','obsolete'],['abrupt','unforeseen','impetuous'],['commend','extol','endorse','advocate'],['censure','rebuke','admonish','disparage','dismissive'],['reticent','aloof','detached'],['candor','candid'],['astute','perceptive','discern'],['esoteric','ambiguous'],['cognizant','wary'],['profound','substantial'],['autonomy','sovereign'],['consensus','concur'],['disparity','divergent','inconsistent'],['subsidize','bolster','foster'],['unilateral','arbitrary'],['mobilize','induce'],['acclaim','laudatory']];
const WORDS = VSETS.flatMap(s=>s.words.map(w=>w.slice(0,4)));

const VUNITS = VSETS.map((set,k)=>{
  const all = VSETS.flatMap((s,j)=>s.words.map(w=>({w,j})));
  const near = w => new Set(NEAR.filter(g=>g.includes(w)).flat());
  const cloze = (w,i) => {
    const bad = near(w[0]);
    const pool = all.filter(x=>x.j!==k && x.w[1]===w[1] && !bad.has(x.w[0])).map(x=>x.w);
    const pick = []; let h = (k*31 + i*17 + w[0].length) % pool.length;
    while(pick.length<3){ const c = pool[h % pool.length]; if(!pick.includes(c)) pick.push(c); h += 1; }
    return { p:w[4], q:Q_WORD, c:[w[0], ...pick.map(x=>x[0])], word:w[0], d:set.d||2,
      e:`"${w[0]}" means ${w[2]}, which fits the clue in the sentence. ` + pick.map(x=>`"${x[0]}" means ${x[2]}.`).join(' ') };
  };
  const ws = set.words;
  const A = [{t:'m', d:1, pairs:ws.slice(0,4).map(w=>[w[0],w[2]])}, ...ws.slice(0,5).map(cloze)];
  const B = [{t:'m', d:1, pairs:ws.slice(5,9).map(w=>[w[0],w[2]])}, ...ws.slice(5,10).map((w,i)=>cloze(w,i+5))];
  return { id:'v'+(k+1), sec:4, vocab:true, title:set.title, setNo:k+1,
    tip:'Read the whole sentence before the choices. Find the clue (a colon, "but," "because," an example), predict your own word, then pick the closest match.',
    lessons:[A,B] };
});

/* ---------- content index ---------- */

VUNITS.forEach((u,ui)=>{ u.n = ui; u.lessons.forEach((items,li)=>{

  items.forEach((it,k)=>{ it.id = id+'-'+(k+1); it.unit = u.id; it.stat = 'voc'; ITEM[it.id]=it; if(it.word) CLOZE[it.word]=it; });
  VLESSONS.push({id, unit:u, li, items, n:VLESSONS.length, vocab:true});

/* ---------- state ---------- */
const KEY='qadam-sat-v1'+(window.QADAM_UID?'-'+window.QADAM_UID:''), MAXE=25, EREGEN=6*60*1000, INTV=[0,1,3,7,14,30];

  lessons:{}, unit:{}, ans:0, right:0, secs:0, mistakes:[], cards:{}, log:[], sound:true, openAll:false, updatedAt:0}; }
let S = fresh();
try{ const raw = localStorage.getItem(KEY); if(raw) S = Object.assign(fresh(), JSON.parse(raw)); }catch(e){}

/* ---------- estimated SAT R&W score (200-800) ---------- */
const pRight=(th,R)=>.25+.75/(1+Math.pow(10,(R-th)/250));
const kOf=n=>Math.max(10,40-.5*n);
function scoreShown(st=S){ return (st.sN||0)>=CAL ? Math.round((st.score||450)/10)*10 : null; }
function band(s){ return s==null?'Calibrating':s>=700?'Top tier':s>=600?'Strong':s>=500?'Solid':s>=400?'Building':'Getting started'; }
function rate(it, ok){ if(!it.d || it.t==='m') return null; const before=scoreShown();
  S.score=Math.max(200,Math.min(800,S.score+kOf(S.sN)*((ok?1:0)-pRight(S.score,DR[it.d])))); S.sN++;
  const ds=S.dstat[it.d]||(S.dstat[it.d]={r:0,n:0}); ds.n++; if(ok) ds.r++;
  S.sHist[today()]=Math.round(S.score); const k=Object.keys(S.sHist).sort(); if(k.length>90) delete S.sHist[k[0]];

function nextStep(st=S){ const s=scoreShown(st); if(s==null||s>=800) return null; const target=Math.min(800,(Math.floor(st.score/50)+1)*50); let th=st.score, n=st.sN, c=0;

  const g=s-st.sHist[old]; return {g:Math.round(g), proj:Math.min(800,Math.round((s+4*Math.max(0,g))/10)*10)}; }

document.getElementById('cStreak').onclick=()=>{ const st=streakNow(); openModal(`<h2>${st} day streak</h2><p class="muted">${todayXp()>0?'You have practiced today. Come back tomorrow to keep it going.':'Earn XP today to extend your streak.'} Longest streak: ${S.best} days.</p><button class="btn" data-close>Got it</button>`); };
document.getElementById('cXp').onclick=()=>{ TAB='me'; render(); };
function render(){ renderTop(); renderNav(); ({learn:vLearn,words:vWords,review:vReview,me:vMe,class:vClass}[TAB]||vLearn)(); paintSync(); }

/* ---------- modal ---------- */
const modal=document.getElementById('modal');
function openModal(html){ modal.hidden=false; modal.innerHTML=`<div class="scrim" data-close-scrim><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; const f=modal.querySelector('button'); if(f) f.focus(); }
function closeModal(){ modal.hidden=true; modal.innerHTML=''; }
modal.addEventListener('click',e=>{ if(e.target.hasAttribute('data-close-scrim')||e.target.closest('[data-close]')) closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !modal.hidden) closeModal(); });
function energySheet(){ regen(); openModal(`<h2 style="color:var(--turq)">${S.energy} of ${MAXE} energy</h2><p>Each lesson question costs 1 energy. Answer it <b>correctly and within the time</b> and you get it back. Get 5 right in a row for a bonus of +2.</p><p class="muted">${S.energy<MAXE?`Energy refills by 1 every 6 minutes. Next one in about ${nextEnergyMin()} min.`:'Your energy is full.'} A practice round in Review costs nothing and refills 5.</p><div class="row"><button class="btn ghost" data-close>Close</button>${S.energy<MAXE?'<button class="btn" id="mPractice">Practice</button>':''}</div>`);
  const p=document.getElementById('mPractice'); if(p) p.onclick=()=>{closeModal(); startPractice();}; }
function scoreSheet(){ const s=scoreShown(); const ns=nextStep(); const tr=trend();
  openModal(`<h2 style="color:var(--plum)">${s==null?'Finding your level':'Estimated score: '+s}</h2><p>This is an estimate of your <b>SAT Reading and Writing</b> score, on the real 200 to 800 scale, based on every first-try answer you give.</p>
  <div class="stack" style="gap:6px">${[1,2,3].map(d=>`<div class="tipbox" style="--tone:var(--${['','good','cobalt','plum'][d]})"><b>${DNAME[d]} questions</b>Match a score of about ${DR[d]}. ${d===3?'Getting these right moves your score up the most.':d===1?'Missing these costs the most.':'The core of the test.'}</div>`).join('')}</div>
  ${s==null?`<p class="muted">Answer ${CAL-S.sN} more question${CAL-S.sN===1?'':'s'} to see your first estimate.</p>`:`${ns?`<p><b>Next goal:</b> about ${ns.c} more correct Hard answer${ns.c>1?'s':''} would take you to ${ns.target}.</p>`:''}${tr?`<p class="muted">${tr.g>0?`Up ${tr.g} points in the last week. If you keep this pace, you could reach about ${tr.proj} in four weeks.`:`Steady this week. Hard questions move your score the fastest.`}</p>`:''}`}
  <p class="muted" style="font-size:13px">It is a practice estimate, not an official College Board score. Your real result also depends on timing, stamina and test day.</p><button class="btn" data-close>Got it</button>`); }

/* ---------- Learn ---------- */
function goalCard(){ const x=todayXp(), g=S.goal, f=Math.min(1,x/g), C=2*Math.PI*24;
  return `<div class="goal"><svg class="ring" viewBox="0 0 58 58" aria-hidden="true"><circle class="bgc" cx="29" cy="29" r="24"/><circle class="fgc" cx="29" cy="29" r="24" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-f)}" transform="rotate(-90 29 29)"/></svg><div><b>${x>=g?'Daily goal complete':'Daily goal'} · ${x} / ${g} XP</b><p>${x>=g?'Great work. Anything extra counts toward your weekly total.':streakNow()>0&&x===0?`Finish one lesson to keep your ${streakNow()}-day streak.`:'One lesson is about 10 to 15 XP.'}</p></div></div>`; }
function vLearn(){
  const cur=currentLesson(); let html=`<div class="wrap stack">${goalCard()}${wotdCard(true)}`; let lastSec=-1, k=0;
  const offs=[0,-70,-100,-70,0,70,100,70];
  UNITS.forEach(u=>{
    if(u.sec!==lastSec){ lastSec=u.sec; const s=SECTIONS[u.sec]; html+=`<div class="sechead"><h3>Section ${u.sec+1} · ${s.name}</h3><span>${s.share}</span></div>`; }
    const t=toneOf(u);
    html+=`<section style="--tone:var(--${t});--toned:var(--${t}d)"><div class="unit"><div style="min-width:0"><div class="k">Unit ${u.n+1}</div><h2>${u.title}</h2></div><button class="guide" data-guide="${u.id}">Guide</button></div><div class="nodes">`;
    LESSONS.filter(l=>l.unit===u).forEach(l=>{
      const done=!!S.lessons[l.id], open=unlocked(l), isCur=cur&&cur.id===l.id;
      const off=offs[k++%offs.length];
      html+=`<button class="node ${done?'done':open?'':'locked'}" style="transform:translateX(${off}px)" data-lesson="${l.id}" aria-label="${u.title}, lesson ${l.li+1}${done?', completed':open?'':', locked'}">${isCur?'<span class="ringc"></span><span class="bubble">Start</span>':''}${done?I.check:open?I.star:I.lock}</button>`;
    });
    html+=`</div></section>`;
  });
  html+=`<p class="muted" style="text-align:center;font-size:14px">${LESSONS.length} lessons · ${Object.keys(ITEM).length} original SAT-style questions</p></div>`;
  view.innerHTML=html;
  view.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>lessonSheet(LESSON[b.dataset.lesson]));
  const wg=document.getElementById('wotdGo'); if(wg) wg.onclick=()=>{ TAB='words'; render(); window.scrollTo(0,0); };
  view.querySelectorAll('[data-guide]').forEach(b=>b.onclick=()=>{ const u=UNIT[b.dataset.guide]; const st=S.unit[u.id]; openModal(`<div style="--tone:var(--${toneOf(u)})"><div class="qtype">Unit ${u.n+1} guide</div></div><h2>${u.title}</h2><p>${u.tip}</p>${st&&st.n?`<p class="muted">Your accuracy here: ${accPct(st.r,st.n)}% over ${st.n} questions.</p>`:''}<button class="btn" data-close>Got it</button>`); });
}
function lessonSheet(l){
  const done=!!S.lessons[l.id];
  if(!unlocked(l)){ openModal(`<h2>Locked</h2><p class="muted">Finish the lessons before this one to unlock it.</p><button class="btn ghost" data-close>OK</button>`); return; }
  regen();
  if(S.energy<=0){ energySheet(); return; }
  const r=S.lessons[l.id];
  openModal(`<div style="--tone:var(--${toneOf(l.unit)})"><div class="qtype">${l.vocab?'Word set':'Unit'} ${l.unit.n+1} · ${l.vocab?'Part':'Lesson'} ${l.li+1} of ${l.unit.lessons.length}</div></div><h2>${l.unit.title}</h2><div class="tipbox" style="--tone:var(--${toneOf(l.unit)})"><b>Strategy</b>${l.unit.tip}</div><p class="muted">${l.items.length} questions${r?` · best score ${r.best}%`:''}</p><button class="btn" id="mStart">${done?'Practice again +5 XP':'Start +10 XP'}</button>`);
  document.getElementById('mStart').onclick=()=>{ closeModal(); startSession('lesson', l.items, l); };
}

/* ---------- session engine ---------- */
let SES=null; const LS=document.getElementById('lesson');
function startSession(mode, items, lesson){
  SES={mode, lesson, queue:items.slice(), total:items.length, done:0, firstTry:0, tries:0, wrongOnce:new Set(), start:Date.now(), sel:null, checked:false, energy0:S.energy, score0:scoreShown(), sN0:S.sN, run:0, eBonus:0};
  if(mode!=='lesson') SES.queue=shuffle(SES.queue);
  LS.hidden=false; document.body.style.overflow='hidden'; showItem();
}
function startPractice(){
  const pool = LESSONS.concat(VLESSONS).filter(l=>S.lessons[l.id]).flatMap(l=>l.items);
  const src = pool.length>=6 ? pool : LESSONS.slice(0,2).flatMap(l=>l.items);
  startSession('practice', shuffle(src).slice(0,6));
}
function startMistakes(){ const items=S.mistakes.map(id=>ITEM[id]).filter(Boolean).slice(0,8); if(items.length) startSession('mistakes', items); }
function stopTimer(){ if(SES&&SES.tmr){ clearInterval(SES.tmr); SES.tmr=null; } }
function closeSession(){ stopTimer(); LS.hidden=true; LS.innerHTML=''; document.body.style.overflow=''; SES=null; render(); }
function head(){ const pct=Math.round(SES.done/SES.total*100);
  return `<div class="hd"><button class="x" id="lsX" aria-label="Quit">${I.x}</button><div class="prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>${SES.mode==='lesson'?`<span class="chip energy${S.energy<5?' low':''}">${I.battery}${S.energy}</span>`:`<span class="pill">${SES.mode==='mistakes'?'Mistakes':SES.mode==='quiz'?'Word quiz':SES.mode==='official'?'Official SAT':'Practice'}</span>`}</div>`; }
function showItem(){
  stopTimer(); const it=SES.queue[0]; SES.sel=null; SES.checked=false; SES.item=it; SES.qStart=Date.now(); SES.limit=limitOf(it);
  const u=UNIT[it.unit]; const tone=toneOf(u);
  let body='';
  if(it.t==='m'){
    SES.left=shuffle(it.pairs.map((p,i)=>i)); SES.right=shuffle(it.pairs.map((p,i)=>i)); SES.matched=new Set(); SES.mL=null; SES.mR=null; SES.mMiss=0;
    body=`<div class="qtype">${u.title} · Vocabulary${dBadge(it)}</div><h2 style="font-size:22px">Match each word to its meaning</h2><div class="match"><div class="colm">${SES.left.map(i=>`<button class="mt w" data-l="${i}">${esc(it.pairs[i][0])}</button>`).join('')}</div><div class="colm">${SES.right.map(i=>`<button class="mt" data-r="${i}">${esc(it.pairs[i][1])}</button>`).join('')}</div></div>`;
  } else if(it.t==='tap'){
    SES.tokens=it.s.split(' '); SES.ans=SES.tokens.findIndex(w=>w.includes('*')); SES.tokens=SES.tokens.map(w=>w.replace(/\*/g,''));
    body=`<div class="qtype">${u.title}${dBadge(it)}</div><div class="qtext">${Q_TAP}</div><div class="tokens">${SES.tokens.map((w,i)=>`<button class="tok" data-t="${i}" aria-pressed="false">${esc(w)}</button>`).join('')}</div>`;
  } else {
    SES.order=it.fixed?[0,1,2,3]:shuffle([0,1,2,3]);
    body=`<div class="qtype">${u.title}${dBadge(it)}</div>${it.p?`<div class="passage">${it.p.startsWith('<')?fmt(it.p):'<p>'+fmt(it.p)+'</p>'}</div>`:''}<div class="qtext">${it.q}</div><div class="choices">${SES.order.map((ci,k)=>`<button class="choice" data-k="${k}" aria-pressed="false"><span class="letter">${'ABCD'[k]}</span><span>${escI(it.c[ci])}</span></button>`).join('')}</div>`;
  }
  LS.innerHTML=head()+`<div class="bd"><div class="in" style="--tone:var(--${tone})">${S.relaxed?'':`<div class="timer" id="tmr" role="timer"><span>${I.clock.replace('<svg','<svg width="18" height="18"')}</span><span class="tb"><i style="width:100%"></i></span><span id="tmrT"></span></div>`}${body}</div></div><div class="ft" id="lsFt"><div class="in">${it.t==='m'?'<p class="muted" style="margin:0;text-align:center">Tap a word, then its meaning.</p>':'<button class="btn" id="lsCheck" disabled>Check</button>'}</div></div>`;
  LS.querySelector('.bd').scrollTop=0;
  document.getElementById('lsX').onclick=quitAsk;
  if(!S.relaxed){ const tick=()=>{ const el=document.getElementById('tmr'); if(!el||!SES){ stopTimer(); return; } const left=SES.limit-(Date.now()-SES.qStart)/1000;
      el.className='timer'+(left<=0?' over':left<SES.limit*.25?' low':''); el.querySelector('i').style.width=Math.max(0,left/SES.limit*100)+'%';
      document.getElementById('tmrT').textContent=left<=0?'Over time':Math.ceil(left)+'s'; if(left<=0) stopTimer(); };
    tick(); SES.tmr=setInterval(tick,250); }
  if(it.t==='m') bindMatch(it);
  else {
    LS.querySelectorAll('.choice,.tok').forEach(b=>b.onclick=()=>{ if(SES.checked) return; LS.querySelectorAll('.choice,.tok').forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); SES.sel=+(b.dataset.k??b.dataset.t); document.getElementById('lsCheck').disabled=false; sfx.tap(); });
    document.getElementById('lsCheck').onclick=check;
  }
}
function bindMatch(it){
  const pick=()=>{ if(SES.mL==null||SES.mR==null) return; const L=LS.querySelector(`[data-l="${SES.mL}"]`), R=LS.querySelector(`[data-r="${SES.mR}"]`);
    if(SES.mL===SES.mR){ [L,R].forEach(x=>{x.classList.add('ok');x.disabled=true;x.setAttribute('aria-pressed','false');}); SES.matched.add(SES.mL); sfx.tap(); }
    else { SES.mMiss++; [L,R].forEach(x=>{x.classList.add('no');x.setAttribute('aria-pressed','false');setTimeout(()=>x.classList.remove('no'),350);}); sfx.bad(); }
    SES.mL=SES.mR=null;
    if(SES.matched.size===it.pairs.length) setTimeout(()=>feedback(true, SES.mMiss?`Matched with ${SES.mMiss} miss${SES.mMiss>1?'es':''}. Review these words in the Words tab.`:'All four matched on the first try.'), 250);
  };
  LS.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{ LS.querySelectorAll('[data-l]').forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); SES.mL=+b.dataset.l; pick(); });
  LS.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ LS.querySelectorAll('[data-r]').forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); SES.mR=+b.dataset.r; pick(); });
}
function check(){
  if(SES.sel==null||SES.checked) return; SES.checked=true; const it=SES.item; let ok, ansText='';
  if(it.t==='tap'){ ok=SES.sel===SES.ans; LS.querySelectorAll('.tok').forEach((b,i)=>{ b.disabled=true; if(i===SES.ans)b.classList.add('right'); else if(i===SES.sel)b.classList.add('wrong'); }); ansText='The error is "'+SES.tokens[SES.ans]+'".'; }
  else { const A=it.a||0; ok=SES.order[SES.sel]===A; LS.querySelectorAll('.choice').forEach((b,k)=>{ b.disabled=true; if(SES.order[k]===A)b.classList.add('right'); else if(k===SES.sel)b.classList.add('wrong'); }); ansText='Correct answer: '+(it.fixed?'ABCD'[A]+'. ':'')+it.c[A]; }
  feedback(ok, it.e, ok?'':ansText);
}
function feedback(ok, expl, ansText){
  stopTimer(); const it=SES.item; const first=!SES.wrongOnce.has(it.id);
  const secs=Math.round((Date.now()-SES.qStart)/1000); const onTime=S.relaxed||secs<=SES.limit; const meta=[];
  const sc=first?rate(it,ok):null;
  if(sc){ if(sc.d!=null) meta.push(`Score ${sc.d>=0?'+':''}${sc.d} → ${sc.after}`); else if(sc.after!=null) meta.push(`Your first score: ${sc.after}`); else meta.push(`Finding your level ${S.sN}/${CAL}`); }
  if(SES.mode==='lesson'){ useEnergy(1);
    if(ok){ SES.run++; if(onTime){ addEnergy(1); meta.push('Energy kept'); } else meta.push('Over time: −1 energy'); if(SES.run%5===0){ addEnergy(2); SES.eBonus+=2; meta.push('5 in a row: +2 energy'); } }
    else { SES.run=0; meta.push('−1 energy'); } }
  if(!S.relaxed) meta.push((onTime?'':'Over time · ')+Math.floor(secs/60)+':'+pad(secs%60));
  // stats: only first attempts count toward accuracy
  if(first && it.t!=='m'){ S.ans++; const sk=it.stat||it.unit; const us=S.unit[sk]||(S.unit[sk]={r:0,n:0}); us.n++; if(ok){S.right++;us.r++;} }
  if(it.fixed && first){ S.bank=S.bank||{}; S.bank[it.id]=ok?1:0; }
  if(it.word && !ok){ S.cards[it.word]=Object.assign({seen:0}, S.cards[it.word], {box:0, due:today()}); }
  else if(it.word && ok && !S.cards[it.word]){ const d=new Date(); d.setDate(d.getDate()+1); S.cards[it.word]={box:1, due:dkey(d), seen:1}; }
  if(ok){ sfx.good(); if(first) SES.firstTry++; SES.done++; SES.queue.shift();
    if(SES.mode==='mistakes'||first){ const mi=S.mistakes.indexOf(it.id); if(mi>-1) S.mistakes.splice(mi,1); }
  } else { sfx.bad(); SES.wrongOnce.add(it.id); SES.queue.push(SES.queue.shift()); if(!S.mistakes.includes(it.id)) S.mistakes.unshift(it.id); S.mistakes=S.mistakes.slice(0,60);
  }
  SES.tries++;
  save(false);
  const ft=document.getElementById('lsFt'); ft.className='ft '+(ok?'good':'bad');
  const praise=['Nice!','Correct!','Well done!','Exactly!','Great reading!'];
  ft.innerHTML=`<div class="in"><div class="fb" role="status"><h3>${ok?I.check.replace('<svg','<svg width="26" height="26"'):I.x.replace('<svg','<svg width="26" height="26"')}${ok?praise[SES.tries%praise.length]:'Not quite'}</h3>${ansText?`<p class="ans">${escI(ansText)}</p>`:''}<p>${esc(expl||'')}</p>${meta.length?`<div class="meta">${meta.map(m=>`<span>${esc(m)}</span>`).join('')}</div>`:''}</div><button class="btn ${ok?'good':'bad'}" id="lsNext">Continue</button></div>`;
  LS.querySelector('.hd').outerHTML=head(); document.getElementById('lsX').onclick=quitAsk;
  const nb=document.getElementById('lsNext'); nb.focus({preventScroll:true});
  nb.onclick=()=>{ if(SES.mode==='lesson' && S.energy<=0){ outOfEnergy(); return; } if(SES.queue.length) showItem(); else finish(); };
}
function quitAsk(){ openModal(`<h2>Leave this ${SES.mode==='lesson'?'lesson':'round'}?</h2><p class="muted">Your progress in this ${SES.mode==='lesson'?'lesson':'round'} will be lost. Energy you used stays used.</p><div class="row"><button class="btn ghost" id="mQuit">Quit</button><button class="btn" data-close>Keep going</button></div>`); document.getElementById('mQuit').onclick=()=>{ closeModal(); logEvent({k:SES.mode,l:SES.lesson?SES.lesson.unit.title+' · L'+(SES.lesson.li+1):'Practice',xp:0,acc:null,quit:true}); save(); closeSession(); }; }
function outOfEnergy(){
  logEvent({k:'lesson',l:SES.lesson.unit.title+' · L'+(SES.lesson.li+1),xp:0,acc:accPct(SES.firstTry,SES.tries),quit:true}); save();
  LS.innerHTML=`<div class="bd"><div class="in"><div class="done-hero"><div style="color:var(--turq);width:110px">${I.battery}</div><h1 style="color:var(--turq)">Out of energy</h1><p class="muted">Energy refills by 1 every 6 minutes (next in about ${nextEnergyMin()} min). A practice round costs nothing and refills 5 right away.</p></div></div></div><div class="ft"><div class="in"><button class="btn" id="oP">Practice to refill energy</button><button class="btn ghost" id="oQ">Back to path</button></div></div>`;
  document.getElementById('oP').onclick=()=>{ stopTimer(); LS.hidden=true; SES=null; startPractice(); };
  document.getElementById('oQ').onclick=closeSession;
}
function finish(){
  const secs=Math.round((Date.now()-SES.start)/1000); S.secs+=secs;
  const scored=SES.total-SES.queue.length; const acc=Math.round(SES.firstTry/Math.max(1,SES.total)*100);
  let xp=5, note='';
  if(SES.mode==='lesson'){ const l=SES.lesson; const prev=S.lessons[l.id]; xp = prev?5:10; if(acc===100) {xp+=5; note='Perfect lesson bonus +5 XP';}
    S.lessons[l.id]={best:Math.max(prev?prev.best:0,acc), n:(prev?prev.n:0)+1, last:Date.now()}; }
  else if(SES.mode!=='official'){ if(S.energy<MAXE){ addEnergy(5); note='+5 energy refilled'; } }
  if(SES.eBonus) note=(note?note+' · ':'')+'+'+SES.eBonus+' bonus energy';
  const sNow=scoreShown(); const sD=(SES.score0!=null&&sNow!=null)?sNow-SES.score0:null;
  const before=todayXp(); const bumped=addXp(xp); const hitGoal=before<S.goal && todayXp()>=S.goal;
  logEvent({k:SES.mode, l:SES.mode==='lesson'?(SES.lesson.vocab?'Words: ':'')+SES.lesson.unit.title+' · Part '+(SES.lesson.li+1):SES.mode==='mistakes'?'Fixed mistakes':SES.mode==='quiz'?'Vocabulary quiz':SES.mode==='official'?'Official SAT practice':'Mixed practice', xp, acc, dur:secs});
  save(); sfx.done();
  const mm=Math.floor(secs/60)+':'+pad(secs%60);
  LS.innerHTML=`<div class="bd"><div class="in"><div class="done-hero"><svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--saffron)" d="M12 1.5l2.6 4.2 4.8-1.1-1.1 4.8 4.2 2.6-4.2 2.6 1.1 4.8-4.8-1.1L12 22.5l-2.6-4.2-4.8 1.1 1.1-4.8L1.5 12l4.2-2.6-1.1-4.8 4.8 1.1z"/><circle cx="12" cy="12" r="4" fill="var(--bg)"/></svg>
    <h1>${SES.mode==='lesson'?'Lesson complete!':'Round complete!'}</h1>${note?`<p class="muted" style="margin:0">${note}</p>`:''}
    <div class="res"><div style="--c:var(--saffron)"><span>Total XP</span><b>+${xp}</b></div><div style="--c:var(--good)"><span>Accuracy</span><b>${acc}%</b></div><div style="--c:var(--plum)"><span>SAT score</span><b>${sNow==null?S.sN+'/'+CAL:sNow}</b></div></div>
    <p class="muted" style="margin:6px 0 0">${sNow==null?`Answer ${CAL-S.sN} more to unlock your estimated SAT score.`:`Estimated R&amp;W score ${sNow} (${band(sNow)})${sD?`, ${sD>0?'up':'down'} ${Math.abs(sD)} this round`:''}.`} Time ${mm}.</p>
    ${bumped?`<p style="color:var(--saffron);font-weight:800;display:flex;gap:6px;align-items:center;margin:8px 0 0"><span style="width:24px;display:inline-block">${I.flame}</span>${S.streak}-day streak!</p>`:''}
    ${hitGoal?`<p style="font-weight:800;color:var(--good);margin:0">Daily goal reached</p>`:''}
  </div></div></div><div class="ft"><div class="in"><button class="btn" id="fC">Continue</button></div></div>`;
  document.getElementById('fC').onclick=closeSession;
}

/* ---------- Words ---------- */
function cardState(w){ return S.cards[w]||{box:0,due:'',seen:0}; }
function dueCards(){ const t=today(); const seen=WORDS.filter(w=>S.cards[w[0]] && S.cards[w[0]].due<=t); const fresh=WORDS.filter(w=>!S.cards[w[0]]); return seen.concat(fresh); }
function wotd(){ return WORDS[Math.floor(Date.now()/864e5) % WORDS.length]; }
function wotdCard(link){ const w=wotd(); return `<div class="card wotd"><p class="lbl">Word of the day</p><div class="wd">${w[0]} <span>${w[1]}</span></div><p style="margin:4px 0 0">${esc(w[2])}</p><p class="ex">“${esc(w[3])}”</p>${link?'<button class="btn ghost" id="wotdGo" style="margin-top:12px">Practice vocabulary</button>':''}</div>`; }
function startQuiz(){
  const seen=WORDS.filter(w=>S.cards[w[0]]).sort((a,b)=>S.cards[a[0]].box-S.cards[b[0]].box);
  const base=(seen.length>=6?seen:WORDS.slice(0,10)).slice(0,12);
  startSession('quiz', shuffle(base.map(w=>CLOZE[w[0]]).filter(Boolean)).slice(0,8));
}
function vWords(){
  const due=dueCards(); const learning=WORDS.filter(w=>S.cards[w[0]]&&S.cards[w[0]].box<4).length; const m=mastered();
  const sets=VUNITS.map(u=>{ const ls=VLESSONS.filter(l=>l.unit===u); const ws=VSETS[u.n].words; const mm=ws.filter(w=>(S.cards[w[0]]||{}).box>=4).length;
    return `<div class="card vset"><div class="vh"><div><div class="k">Set ${u.n+1}</div><h3>${u.title}</h3></div><span class="pill ${mm===10?'good':''}">${mm}/10 mastered</span></div><p class="vw">${ws.map(w=>w[0]).join(' · ')}</p><div class="row">${ls.map(l=>{ const done=!!S.lessons[l.id], open=unlocked(l); return `<button class="vbtn ${done?'done':open?'':'locked'}" data-vl="${l.id}" aria-label="${u.title}, part ${l.li+1}${done?', completed':open?'':', locked'}">${done?I.check:open?I.star:I.lock}<span>Part ${l.li+1}</span></button>`; }).join('')}</div></div>`; }).join('');
  view.innerHTML=`<div class="wrap stack"><div><h1 style="font-size:28px">Words</h1><p class="muted" style="margin:4px 0 0">${WORDS.length} high-value SAT words in ${VSETS.length} themed sets. Learn a set with its two lessons, then keep it fresh with flashcards and the daily quiz.</p></div>
  ${wotdCard(false)}
  <div class="tiles"><div class="tile" style="color:var(--jade)">${I.cards}<div><b style="color:var(--ink)">${m} / ${WORDS.length}</b><span>words mastered</span></div></div><div class="tile" style="color:var(--saffron)">${I.clock}<div><b style="color:var(--ink)">${Math.min(10,due.length)}</b><span>cards ready</span></div></div></div>
  <div class="row"><button class="btn" id="wGo" ${due.length?'':'disabled'}>${due.length?'Flashcards':'Cards done'}</button><button class="btn saff" id="wQ">Word quiz</button></div>
  <p class="muted" style="margin:0;font-size:14px">The quiz picks the words you find hardest. Missed words go back into your flashcards for tomorrow.</p>
  <h2 style="font-size:20px;margin-top:6px">Word sets</h2>${sets}
  <details class="card deck"><summary>Your whole deck · ${learning} learning</summary><div class="wl">${WORDS.map(w=>{const c=cardState(w[0]);return `<div><b>${w[0]}</b><span class="lv" aria-label="level ${c.box} of 5">${[1,2,3,4,5].map(i=>`<i class="${c.box>=i?'on':''}"></i>`).join('')}</span></div>`}).join('')}</div></details></div>`;
  const b=document.getElementById('wGo'); if(b) b.onclick=()=>cardSession(due.slice(0,10));
  document.getElementById('wQ').onclick=startQuiz;
  view.querySelectorAll('[data-vl]').forEach(x=>x.onclick=()=>lessonSheet(LESSON[x.dataset.vl]));
}
function cardSession(list){
  let q=list.slice(), n=0, total=list.length, reviewed=0; const start=Date.now(); const again=new Set();
  LS.hidden=false; document.body.style.overflow='hidden';
  const draw=()=>{
    if(!q.length){ const secs=Math.round((Date.now()-start)/1000); S.secs+=secs; const bumped=addXp(5); logEvent({k:'words',l:'Vocabulary cards ('+total+')',xp:5,acc:Math.round((total-again.size)/total*100),dur:secs}); save(); sfx.done();
      LS.innerHTML=`<div class="bd"><div class="in"><div class="done-hero"><div style="width:110px;color:var(--turq)">${I.cards}</div><h1 style="color:var(--turq)">Deck reviewed</h1><p class="muted">${total-again.size} of ${total} known on the first try.${bumped?` ${S.streak}-day streak!`:''}</p><div class="res"><div style="--c:var(--saffron)"><span>XP</span><b>+5</b></div><div style="--c:var(--turq)"><span>Mastered</span><b>${mastered()}</b></div><div style="--c:var(--cobalt)"><span>Cards</span><b>${total}</b></div></div></div></div></div><div class="ft"><div class="in"><button class="btn" id="fC">Continue</button></div></div>`;
      document.getElementById('fC').onclick=()=>{LS.hidden=true;LS.innerHTML='';document.body.style.overflow='';render();}; return; }
    const w=q[0]; const pct=Math.round(n/ (total+again.size) *100);
    LS.innerHTML=`<div class="hd"><button class="x" id="lsX" aria-label="Quit">${I.x}</button><div class="prog"><i style="width:${pct}%"></i></div><span class="pill">${q.length} left</span></div>
      <div class="bd"><div class="in"><p class="muted" style="margin:0;text-align:center">Say the meaning out loud, then tap the card.</p><div class="fc" id="fc" role="button" tabindex="0" aria-label="Flip card"><div class="inner"><div class="face"><div class="wd">${w[0]}</div><div class="pos">${w[1]}</div></div><div class="face back"><div class="pos">${w[0]} · ${w[1]}</div><div class="df">${esc(w[2])}</div><div class="ex">“${esc(w[3])}”</div></div></div></div></div></div>
      <div class="ft"><div class="in"><div class="row" id="fcBtns" hidden><button class="btn bad" id="fA">Still learning</button><button class="btn good" id="fK">I knew it</button></div><button class="btn" id="fF">Show meaning</button></div></div>`;
    const fc=document.getElementById('fc'); const flip=()=>{ fc.classList.add('flip'); document.getElementById('fcBtns').hidden=false; document.getElementById('fF').hidden=true; };
    fc.onclick=flip; fc.onkeydown=e=>{ if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();} }; document.getElementById('fF').onclick=flip;
    document.getElementById('lsX').onclick=()=>{ save(); LS.hidden=true; LS.innerHTML=''; document.body.style.overflow=''; render(); };
    const grade=(knew)=>{ const c=Object.assign({box:0,due:'',seen:0}, S.cards[w[0]]); c.seen++; n++;
      if(knew && !again.has(w[0])){ c.box=Math.min(5,c.box+1); sfx.good(); } else if(!knew){ c.box=0; again.add(w[0]); q.push(w); sfx.bad(); } else { sfx.good(); }
      const d=new Date(); d.setDate(d.getDate()+INTV[c.box]); c.due=dkey(d); S.cards[w[0]]=c; q.shift(); reviewed++; save(false); draw(); };
    document.getElementById('fA').onclick=()=>grade(false); document.getElementById('fK').onclick=()=>grade(true);
  };
  draw();
}

/* ---------- Official SAT practice (teacher-approved students only) ---------- */
let OBD=0;
function officialCard(){ if(!BANK||!BANK.length) return '';
  const done=S.bank||{}; const units=[...new Set(BANK.map(x=>x.unit))];
  const row=u=>{ const its=BANK.filter(x=>x.unit===u&&(!OBD||x.d===OBD)); if(!its.length) return ''; const n=its.filter(x=>x.id in done).length, r=its.filter(x=>done[x.id]===1).length;
    return `<button class="vbtn" data-ob="${u}" style="justify-content:space-between;width:100%"><span>${UNIT[u].title}</span><span class="pill ${n&&r/n>=.8?'good':''}">${n}/${its.length}${n?` · ${Math.round(r/n*100)}%`:''}</span></button>`; };
  return `<div class="card stack" style="gap:10px;border-color:var(--plum)"><p class="lbl" style="margin:0;color:var(--plum)">Official SAT practice</p><p style="margin:0" class="muted">${BANK.length} real questions from the College Board question bank, shared by your teacher. Five per round, in test order, with the official explanations.</p>
   <div class="seg" id="obD">${[[0,'All'],[1,'Easy'],[2,'Medium'],[3,'Hard']].map(([d,l])=>`<button data-od="${d}" aria-pressed="${OBD===d}">${l}</button>`).join('')}</div>
   <div class="stack" style="gap:8px">${units.map(row).join('')}</div></div>`; }
function startOfficial(u){ const done=S.bank||{}; const pool=BANK.filter(x=>x.unit===u&&(!OBD||x.d===OBD));
  const next=pool.filter(x=>!(x.id in done)).concat(pool.filter(x=>done[x.id]===0), pool.filter(x=>done[x.id]===1));
  if(next.length) startSession('official', next.slice(0,5)); }

/* ---------- My stats ---------- */
function weekBars(hist){ const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d;}); const vals=days.map(d=>hist[dkey(d)]||0); const mx=Math.max(20,...vals);
  return `<div class="week">${days.map((d,i)=>`<div class="d ${i===6?'today':''}"><em>${vals[i]||''}</em><i style="height:${Math.round(vals[i]/mx*100)}%"></i><span>${'SMTWTFS'[d.getDay()]}</span></div>`).join('')}</div>`; }
function skillRows(unitStats){ return SKILLS.map(u=>{ const s=unitStats[u.id]; const p=s&&s.n?accPct(s.r,s.n):null; const col=p==null?'var(--line)':p>=80?'var(--good)':p>=60?'var(--saffron)':'var(--bad)';
  return `<div class="skill"><span class="nm">${u.title}</span><span class="tr"><i style="width:${p||0}%;background:${col}"></i></span><span class="pct">${p==null?'–':p+'%'}</span></div>`; }).join(''); }
function logRows(log, n=12){ if(!log||!log.length) return `<div class="empty"><p>No activity yet. Finish a lesson and it will show up here.</p></div>`;
  return `<ul class="log">${log.slice(0,n).map(e=>`<li><span class="what">${esc(e.l)}<small>${ago(e.ts)}${e.dur?' · '+Math.max(1,Math.round(e.dur/60))+' min':''}${e.quit?' · left early':''}</small></span>${e.acc!=null?`<span class="pill ${e.acc>=80?'good':e.acc<60?'bad':''}">${e.acc}%</span>`:''}<span class="xpv">+${e.xp} XP</span></li>`).join('')}</ul>`; }
function diffRows(ds){ return [1,2,3].map(d=>{ const s=(ds||{})[d]; const p=s&&s.n?accPct(s.r,s.n):null; const col=p==null?'var(--line)':p>=80?'var(--good)':p>=60?'var(--saffron)':'var(--bad)';
  return `<div class="skill"><span class="nm">${DNAME[d]} <span class="muted" style="font-weight:600">(${DR[d]}-level)</span></span><span class="tr"><i style="width:${p||0}%;background:${col}"></i></span><span class="pct">${p==null?'–':p+'%'}</span></div>`; }).join(''); }
function scoreCard(st, mine=true){ const s=scoreShown(st); const ns=nextStep(st); const tr=trend(st); const pos=s==null?0:(s-200)/6;
  return `<div class="card scard"><p class="lbl">Estimated SAT Reading and Writing</p><div class="big">${s==null?'–':s}<small>${s==null?`calibrating · ${st.sN||0}/${CAL} answers`:'/ 800 · '+band(s)}</small></div>
   ${s!=null?`<div class="scale" aria-hidden="true"><b style="left:${pos}%"></b></div><div class="scale-l"><span>200</span><span>500</span><span>800</span></div>`:''}
   ${mine&&s!=null&&(ns||tr)?`<div class="nextbox">${ns?`<b>If you keep going:</b> about ${ns.c} more correct Hard answer${ns.c>1?'s':''} would take you to <b>${ns.target}</b>.`:''}${tr?` ${tr.g>0?`You are up ${tr.g} points this week; at this pace, about <b>${tr.proj}</b> in four weeks.`:'Steady this week. Hard questions move your score the fastest.'}`:''}</div>`:''}
   ${!mine&&tr?`<p class="muted" style="margin:8px 0 0;font-size:14px">${tr.g>=0?'+':''}${tr.g} points over the last week</p>`:''}
   <div style="margin-top:12px">${diffRows(st.dstat)}</div>
   ${mine?`<p class="muted" style="font-size:13px;margin:8px 0 0">A practice estimate from your first-try answers, not an official score. <button class="linkbtn" id="scWhy" style="background:none;border:0;padding:0;color:var(--cobalt);font-weight:700;text-decoration:underline">How it works</button></p>`:''}</div>`; }

   </div>
   ${weakest?`<div class="card" style="border-color:var(--bad)"><p class="lbl" style="color:var(--bad)">Weakest skill right now</p><p style="margin:0"><b>${weakest.u.title}</b> at ${weakest.p}% class accuracy. A good candidate for your next lesson warm-up.</p></div>`:''}
   <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px"><p class="lbl" style="margin:0">Students</p><div class="seg" id="cSort">${[['active','Recent'],['score','Score'],['xp','Week XP'],['acc','Lowest accuracy'],['name','Name']].map(([k,l])=>`<button data-s="${k}" aria-pressed="${CSORT===k}" style="padding:5px 9px;font-size:13px">${l}</button>`).join('')}</div></div>
    ${rows.length?`<div class="tblscroll"><table class="roster"><thead><tr><th>Student</th><th>Est. score</th><th>Last active</th><th>Streak</th><th>Week XP</th><th>Lessons</th><th>Words</th><th>Accuracy</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="click" data-st="${esc(r.id)}" tabindex="0"><td><span class="who"><span class="av" style="background:${colors[i%colors.length]}">${esc((r.name[0]||'?').toUpperCase())}</span><span>${esc(r.name)}</span></span></td><td><b>${r.sc??'–'}</b></td><td>${ago(r.upd)}</td><td>${r.live}</td><td>${r.s.weekXp||0}</td><td>${r.s.lessonsDone||0}/${LESSONS.length}</td><td>${r.s.words||0}</td><td>${r.acc==null?'–':`<span class="pill ${r.acc>=80?'good':r.acc<60?'bad':''}">${r.acc}%</span>`}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><p>No students yet. Share this app's link with your students. Each one appears here after their first lesson.</p></div>`}
   </div>
   ${window.QADAM_SIGNOUT?bankCard(rows):''}
   <div class="card"><p class="lbl">Class accuracy by skill</p>${skillRows(classUnit)}</div></div>`;
  const bf=document.getElementById('bFile'); if(bf) bf.onchange=e=>{ if(e.target.files[0]) importBank(e.target.files[0]); };
  const ba=document.getElementById('bAll'); if(ba) ba.onclick=async()=>{ ba.disabled=true; for(const r of rows){ if(!(ACCESS&&ACCESS.has(r.id))) if(!await setAccess(r.id,true)) break; } BANK_MSG=BANK_MSG||'Every student on the list can now open the official questions.'; vClass(); };
  document.getElementById('cSort').onclick=e=>{const b=e.target.closest('[data-s]'); if(!b)return; CSORT=b.dataset.s; vClass();};
  view.querySelectorAll('[data-st]').forEach(tr=>{ const go=()=>studentSheet(rows.find(r=>r.id===tr.dataset.st)); tr.onclick=go; tr.onkeydown=e=>{if(e.key==='Enter')go();}; });
}
function studentSheet(r){ if(!r) return; const s=r.s, st=r.st;
  openModal(`<h2>${esc(r.name)}</h2><p class="muted">Last active ${ago(r.upd)} · ${Math.round((s.secs||0)/60)} min practiced in total</p>
   <div class="tiles"><div class="tile" style="color:var(--saffron)">${I.flame}<div><b style="color:var(--ink)">${r.live}</b><span>streak · best ${s.best||0}</span></div></div><div class="tile" style="color:var(--cobalt)">${I.bolt}<div><b style="color:var(--ink)">${s.xp||0}</b><span>XP · ${s.weekXp||0} this week</span></div></div><div class="tile" style="color:var(--turq)">${I.cards}<div><b style="color:var(--ink)">${s.words||0}</b><span>words mastered</span></div></div><div class="tile" style="color:var(--bad)">${I.redo}<div><b style="color:var(--ink)">${s.mistakes||0}</b><span>open mistakes</span></div></div></div>
   ${scoreCard(Object.assign({score:450,sN:0,sHist:{},dstat:{}},st),false)}
   <div><p class="lbl">XP, last 7 days</p>${weekBars(st.hist||{})}</div>
   <div><p class="lbl">Accuracy by skill</p>${skillRows(st.unit||{})}</div>
   <div><p class="lbl">Recent activity</p>${logRows(st.log,15)}</div>
   ${window.QADAM_SIGNOUT&&ACCESS?`<button class="btn ${ACCESS.has(r.id)?'ghost':''}" id="sAcc">${ACCESS.has(r.id)?'Remove access to official questions':'Allow official questions'}</button>`:''}
   <button class="btn ghost" data-close>Close</button>`);
  const sa=document.getElementById('sAcc'); if(sa) sa.onclick=async()=>{ sa.disabled=true; await setAccess(r.id,!ACCESS.has(r.id)); studentSheet(r); if(TAB==='class') vClass(); };
}

/* ---------- welcome ---------- */
function welcome(){
  S.welcomed=true; save(false);
  openModal(`<div style="text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center"><svg viewBox="0 0 24 24" width="64" height="64" aria-hidden="true" style="color:var(--cobalt)"><path fill="currentColor" d="M12 1.5l2.6 4.2 4.8-1.1-1.1 4.8 4.2 2.6-4.2 2.6 1.1 4.8-4.8-1.1L12 22.5l-2.6-4.2-4.8 1.1 1.1-4.8L1.5 12l4.2-2.6-1.1-4.8 4.8 1.1z"/><circle cx="12" cy="12" r="3.6" fill="var(--surface)"/></svg><h2>Welcome to Qadam</h2><p class="muted"><i>Qadam</i> means “step” in Uzbek.</p></div>
  <p>Nobody climbs a mountain in one jump. You climb it one step at a time, and the SAT works the same way. A few focused minutes today and a few more tomorrow add up to a score you will be proud of.</p>
  <div class="stack" style="gap:8px">
   <div class="tipbox" style="--tone:var(--cobalt)"><b>Learn</b>Follow the path through every Reading and Writing skill, one short lesson at a time.</div>
   <div class="tipbox" style="--tone:var(--jade)"><b>Words</b>Build your SAT vocabulary with word sets, flashcards, and a daily quiz.</div>
   <div class="tipbox" style="--tone:var(--coral)"><b>Review</b>Every mistake is a lesson. Fix yours here and refill your energy.</div>
   <div class="tipbox" style="--tone:var(--plum)"><b>Your SAT score</b>Every answer updates your estimated SAT Reading and Writing score, out of 800. Beat the timer to keep your energy.</div>
  </div>
  <p>Set a daily goal and keep your streak alive. You do not have to be perfect. You just have to keep stepping forward.</p>
  <p style="text-align:center;font-weight:800;color:var(--cobalt)">Har kuni bir qadam. One step every day.</p>
  <button class="btn" data-close>Take my first step</button>`);
}

/* ---------- boot ---------- */
render();
if(!S.welcomed) welcome();
setInterval(()=>{ if(LS.hidden) renderTop(); }, 60000);
connect();
try{ if(window.top===window && location.protocol==='https:' && !/claude\.ai|claudeusercontent/.test(location.host)){ const l=document.createElement('link'); l.rel='manifest'; l.href='manifest.webmanifest'; document.head.appendChild(l); if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{}); } }catch(e){}
};
</script>
<script src="boot.js"></script>
</body>
</html>

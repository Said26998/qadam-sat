 {d:3,p:'Researchers removed the foragers from several honeybee colonies. Soon afterward, some young "nurse" bees, which normally stay inside the hive, began foraging days or even weeks earlier than usual. The researchers concluded that the division of labor in a colony is not fixed by age but can shift in response to the colony\'s needs.',
  q:Q_MAIN, c:['Honeybee colonies can change which bees perform which tasks when the colony\'s needs change.','Nurse bees are better at foraging than older bees.','Removing foragers usually causes a colony to collapse.','Young bees never leave the hive.'],
  e:'The final sentence states the conclusion the experiment supports: jobs shift with the colony\'s needs.'},
 {d:2,p:'The Great Wall of China is often said to be visible from space with the naked eye, but astronauts have reported that it is very hard to see from low orbit. The wall is long but narrow, and its color closely matches the surrounding land.',
  q:'According to the text, why is the Great Wall hard to see from orbit?', c:['It is narrow and blends in with the land around it.','It is usually hidden by clouds.','It is shorter than most people believe.','Astronauts rarely travel in low orbit.'],
  e:'The text gives two reasons: the wall is narrow, and its color matches the land.'},
 {d:3,p:'Economist Elinor Ostrom studied communities that share resources such as fishing grounds and forests. Many economists had assumed that shared resources are always overused unless a government or private owner controls them. Ostrom documented many cases in which local users created their own rules, monitored one another, and kept the resources healthy for generations.',
  q:Q_MAIN, c:['Ostrom found evidence that communities can manage shared resources well without outside control.','Ostrom argued that governments should own all forests.','Shared resources are always overused.','Fishing grounds are harder to manage than forests.'],
  e:'Ostrom\'s cases challenge the assumption in the second sentence. "Always overused" is the view she disproved.'},
],
ev:[
 {d:3,p:'A historian claims that early photographs were often staged to tell a story rather than simply recording what was in front of the camera.',
  q:'Which quotation from the historian\'s essay most effectively supports the claim?', c:['"Photographers routinely moved props, and even people, into position before taking a picture, arranging scenes for dramatic effect."','"Early cameras required exposures lasting several seconds."','"Photographs quickly became popular in newspapers."','"Many viewers believed photographs showed exactly what the eye could see."'],
  e:'Only the first quotation shows photographers arranging scenes. The last one describes what viewers believed, not what photographers did.'},
 {d:2,p:'Ecologists hypothesize that a lizard species has shorter legs on islands where most perches are thin branches, because shorter legs grip thin branches more easily.',
  q:'Which finding, if true, would most directly support the hypothesis?', c:['Lizards on islands with mostly thin branches had shorter legs than lizards of the same species on islands with mostly thick trunks.','Short-legged lizards ran faster on open ground.','The islands have fewer predators than the mainland.','Lizards on all the islands ate similar insects.'],
  e:'Support must connect branch thickness to leg length within the same species.'},
 {d:3,p:'A researcher claims that a new reading app raised students\' test scores, because students who used the app scored higher than students who did not.',
  q:'Which finding, if true, would most directly weaken the claim?', c:['The students who used the app were also in smaller classes with more experienced teachers.','Students said they enjoyed using the app.','The app was used most often in the evening.','Some students used the app more than others.'],
  e:'If app users also had smaller classes and stronger teachers, those differences could explain the higher scores.'},
 {d:3,p:'A student claims that in a memoir, the narrator suggests that her grandmother\'s strictness hid deep affection.',

 {d:3,p:'Scientists claim that a soil fungus helps trees share nutrients and that younger trees benefit most from this sharing.',

qe:[
 {d:2,p:tbl('Adults who get news from each source (%)',['Source','2018','2024'],[['Print newspapers','38','21'],['Television','64','55'],['Social media','45','61'],['News websites','52','58']])+'<p>A student claims that between 2018 and 2024, social media had the largest increase of any news source.</p>',
  q:'Which choice most effectively uses data from the table to support the claim?', c:['Social media use rose 16 percentage points, while news websites rose only 6 and the other sources declined.','Television remained the most-used source in 2024.','Print newspaper use fell by 17 percentage points.','58% of adults got news from websites in 2024.'],
  e:'"Largest increase" needs a comparison of changes. The television choice is false: social media (61%) passed television (55%) in 2024.'},
 {d:3,p:tbl('Wheat yield (tons per hectare)',['Plot','Dry year','Wet year'],[['No fertilizer','2.1','3.0'],['Fertilizer','2.3','4.2']])+'<p>Researchers claim that the fertilizer was much more effective in the wet year than in the dry year.</p>',
  q:'Which choice most effectively uses data from the table to support the claim?', c:['In the wet year the fertilizer added 1.2 tons per hectare, but in the dry year it added only 0.2.','Fertilized plots produced 4.2 tons per hectare in the wet year.','All plots produced more in the wet year than in the dry year.','Plots without fertilizer produced 2.1 tons in the dry year.'],
  e:'"Effectiveness" means the gain from fertilizer: 4.2 − 3.0 = 1.2 versus 2.3 − 2.1 = 0.2. Higher yields overall are true but beside the point.'},
 {d:2,p:bars('Average homework per night, by grade','Minutes',[['6',30],['7',40],['8',55],['9',70],['10',85],['11',95],['12',80]]),

  e:'The bars climb to 95 in grade 11, then drop to 80. Grade 8 (55) is less than double grade 6 (30).'},
 {d:3,p:'<p>A city tested bike-sharing in two neighborhoods. Neighborhood A, population 40,000, recorded 12,000 rides. Neighborhood B, population 15,000, recorded 9,000 rides. An official claims that residents of Neighborhood B used the program more heavily.</p>',
  q:'Which choice best supports the official\'s claim?', c:['Neighborhood B had 0.6 rides per resident, compared with 0.3 in Neighborhood A.','Neighborhood A recorded more total rides.','Neighborhood A has the larger population.','Both neighborhoods recorded at least 9,000 rides.'],
  e:'"More heavily" is a rate: 9,000 ÷ 15,000 = 0.6 and 12,000 ÷ 40,000 = 0.3. Total rides is the trap.'},
 {d:2,p:tbl('Temperature and ice cream sales at a beach kiosk',['Day','Temperature (°C)','Sales (units)'],[['Mon','22','140'],['Tue','25','180'],['Wed','19','90'],['Thu','28','240'],['Fri','30','260']])+'<p>The owner concludes that sales tend to rise as the temperature rises.</p>',
  q:'Which choice most effectively uses data from the table to support the conclusion?', c:['The coolest day, Wednesday (19°C), had the fewest sales (90), and the hottest day, Friday (30°C), had the most (260).','Tuesday\'s sales were 180 units.','Thursday was warmer than Monday.','The kiosk sold more than 900 units over the five days.'],

inf:[
 {d:3,p:'Medieval maps of the world often placed Jerusalem at the center and filled distant regions with imaginary creatures. Historians argue that these maps were not mainly tools for travel. Instead, the maps most likely ___',
  q:'Which choice most logically completes the text?', c:['expressed their makers\' beliefs about the meaning and order of the world.','helped merchants plan the fastest trade routes.','were drawn by people who had traveled widely.','were seen only by sailors.'],
  e:'If they were not travel tools and showed imaginary creatures, they served another purpose: expressing a worldview.'},
 {d:2,p:'Two groups of students studied the same list of words. One group was told a test would follow; the other was told nothing. Both groups were then tested, and their scores were nearly identical. This result suggests that ___',
  q:'Which choice most logically completes the text?', c:['knowing about the test did not change how well students remembered the words in this case.','students always learn better when they expect a test.','the word list was too easy for both groups.','the students who were told nothing did not study.'],
  e:'Identical scores mean the warning made no difference here. "Always" overreaches.'},
 {d:3,p:'The workers who built the pyramids at Giza were once thought to have been enslaved. However, archaeologists have found the workers\' tombs near the pyramids, along with evidence that they received regular food rations and medical care for injuries. These findings suggest that ___',
  q:'Which choice most logically completes the text?', c:['the workers may have been laborers who were valued and supported by the state.','the pyramids were built in only a few years.','all of the workers came from foreign lands.','medical care did not exist in ancient Egypt.'],
  e:'Honorable burial, food, and medical care point to valued workers, not enslaved people. The medical-care choice contradicts the evidence the text gives.'},
 {d:2,p:'Some songbirds learn their songs from adults during a short period early in life. Researchers raised young birds of one species in soundproof rooms where they heard no adult songs. As adults, these birds sang simple, unusual songs. This suggests that ___',
  q:'Which choice most logically completes the text?', c:['hearing adults sing is important for young birds to develop their species\' typical song.','songbirds cannot sing at all without training.','soundproof rooms damage birds\' hearing.','adult birds prefer simple songs.'],

 {d:3,p:'An author released a new novel as an e-book and as a print book at the same price. In cities, the e-book sold more copies; in rural areas, the print edition sold more. Rural areas in the region also have fewer stores selling e-readers and slower internet service. One explanation for the pattern is that ___',

],

 {d:2,p:'Rather than simply ___ the old theory, the young physicist showed that it was a special case of a broader principle, preserving what the theory got right.',

ts:[
 {d:2,p:'Many people picture inventors working alone in sudden flashes of insight. <u>The light bulb, however, was the product of decades of work by dozens of researchers in several countries, each improving on earlier designs.</u> Thomas Edison\'s team tested thousands of materials before settling on a practical filament.',
  q:'Which choice best describes the function of the underlined sentence in the text as a whole?', c:['It offers an example that challenges a popular image of how inventions happen.','It explains why Edison\'s filament succeeded.','It summarizes the text\'s final conclusion.','It presents a view that the rest of the text supports.'],
  e:'"However" signals that the light bulb story contradicts the lone-genius picture from the first sentence.'},
 {d:2,p:'The kettle sang, the cat stretched on the windowsill, and the morning light spread slowly across the table, warming the bread and the old wooden chairs. For the first time in weeks, Shoira let herself sit down.',
  q:'Which choice best states the main purpose of the text?', c:['To convey a peaceful moment that allows a character to finally rest','To explain how to prepare breakfast','To suggest that Shoira dislikes her home','To describe a busy household preparing for guests'],
  e:'Gentle details build calm, and "for the first time in weeks" shows Shoira finally resting.'},
 {d:2,p:'Some scientists once argued that dinosaurs were slow, cold-blooded reptiles. Fossil evidence of feathers, fast growth, and bird-like breathing has led most researchers to reject that view. Today, many paleontologists consider birds to be living dinosaurs.',
  q:'Which choice best describes the overall structure of the text?', c:['It describes an earlier view, presents evidence against it, and states the current view.','It compares two current theories without choosing between them.','It lists the steps scientists use to find fossils.','It argues that birds and dinosaurs are unrelated.'],
  e:'Old view, then evidence against it, then today\'s view.'},
 {d:3,p:'A city council expected its new bus lane to shorten commutes. <u>Commute times did fall, but by less than one minute on average.</u> Council members are now debating whether the lane is worth its cost.',
  q:'Which choice best describes the function of the underlined sentence?', c:['It reports a result that was positive but smaller than expected.','It shows that the bus lane failed completely.','It explains why the council built the lane.','It provides evidence that commutes became longer.'],
  e:'Times did fall (positive), but barely, which explains the debate that follows.'},
 {d:3,p:'Critics praise the composer\'s symphonies, but her film scores are rarely discussed. That is a mistake: the scores contain some of her boldest experiments with rhythm, techniques she later used in the very symphonies critics admire.',
  q:'Which choice best states the main purpose of the text?', c:['To argue that an overlooked part of the composer\'s work deserves attention','To explain why film music is less important than symphonies','To describe how symphonies are written','To criticize the composer\'s symphonies'],
  e:'"That is a mistake" signals an argument: the neglected film scores matter.'},
],
ct:[
 {d:3,p:'<p><b>Text 1</b><br>Some researchers argue that social media use directly causes anxiety in teenagers.</p><p><b>Text 2</b><br>Large studies find only a weak link between total screen time and anxiety. The effects seem to depend on how teens use social media, such as whether they constantly compare themselves with others, rather than on how much time they spend.</p>',
  q:'Based on the texts, how would the author of Text 2 most likely respond to the researchers in Text 1?', c:['By suggesting that their claim is too simple, since the type of use matters more than the amount','By agreeing that social media causes anxiety in all teenagers','By arguing that teenagers should spend more time online','By claiming that no studies have examined the issue'],
  e:'Text 2 does not deny any effect. It says the picture is more complicated than direct cause and effect.'},
 {d:2,p:'<p><b>Text 1</b><br>The poet\'s later work abandons the clear imagery of her early poems for abstract language, and it is weaker as a result.</p><p><b>Text 2</b><br>Her later poems are more abstract, but this shift reflects her growing interest in philosophy, and the poems reward readers willing to engage with their ideas.</p>',
  q:'Which choice best describes how the author of Text 2 relates to Text 1?', c:['The author agrees that the later poems are more abstract but disagrees that they are weaker.','The author agrees that the later poems are weaker.','The author denies that the later poems are more abstract.','The author argues that the early poems are more philosophical.'],
  e:'"Her later poems are more abstract, but..." concedes the fact and rejects the judgment.'},
 {d:3,p:'<p><b>Text 1</b><br>Planting trees is the most effective way for cities to cool down during heat waves.</p><p><b>Text 2</b><br>Trees help, but they take decades to grow. In the short term, reflective roofs and pavements can lower surface temperatures much more quickly.</p>',
  q:'Based on the texts, how would the author of Text 2 most likely respond to Text 1?', c:['By noting a limitation of the strategy Text 1 favors and proposing a faster alternative','By rejecting the idea that trees cool cities','By agreeing that trees are the fastest solution','By arguing that heat waves are not a serious problem'],
  e:'"Trees help, but..." accepts the benefit, points out the time problem, and offers another option.'},
 {d:3,p:'<p><b>Text 1</b><br>Historians have long believed that the ancient city was abandoned suddenly after an earthquake.</p><p><b>Text 2</b><br>New excavations show that residents removed their valuables and sealed doorways over several years before leaving. Earthquake damage appears mostly in buildings that were already empty.</p>',
  q:'Which choice best describes the relationship between the texts?', c:['Text 2 provides evidence that challenges Text 1\'s account of how the city was abandoned.','Text 2 confirms that the city was abandoned suddenly.','Text 2 argues that the earthquake never happened.','Text 2 explains why historians study earthquakes.'],
  e:'A gradual departure before the quake contradicts a sudden abandonment. Text 2 does not deny the earthquake itself.'},
 {d:3,p:'<p><b>Text 1</b><br>Learning a second language in childhood is essential, because adults rarely become fluent.</p><p><b>Text 2</b><br>Children often have an advantage in pronunciation, but studies show that motivated adults frequently learn grammar and vocabulary faster than children do.</p>',
  q:'Based on the texts, how would the author of Text 2 most likely respond to Text 1?', c:['By arguing that Text 1 overstates children\'s advantage, since adults can learn some parts of a language faster','By agreeing that adults can never become fluent','By claiming that pronunciation is the only important skill','By saying children learn grammar faster than adults'],
  e:'Text 2 grants children one advantage (pronunciation) but shows adults ahead in others.'},
],

rs:[
 {d:2,p:notes(['Al-Khwarizmi was a 9th-century scholar who worked in Baghdad.','He came from the region of Khwarazm, in present-day Uzbekistan.','His book on solving equations gave its name to "algebra."','The word "algorithm" comes from a Latin form of his name.']),

  q:'The student wants to explain how tardigrades survive extreme conditions. Which choice most effectively uses relevant information from the notes to accomplish this goal?', c:['Tardigrades survive extreme conditions by drying out and almost completely stopping their metabolism.','In 2007, tardigrades survived ten days in outer space.','Tardigrades are about half a millimeter long.','Tardigrades can survive extreme cold, heat, and radiation.'],

 {d:3,p:notes(['The Amazon carries more water than any other river.','The Nile is often listed as the world\'s longest river, at about 6,650 km.','The Amazon is usually measured at about 6,400 km.','Some recent measurements suggest the Amazon is actually longer than the Nile.']),
  q:'The student wants to highlight a disagreement about the rivers\' lengths. Which choice most effectively uses relevant information from the notes to accomplish this goal?', c:['Although the Nile is often listed as the longest river, some recent measurements suggest the Amazon is longer.','The Amazon carries more water than any other river.','The Nile is about 6,650 km long.','The Amazon is usually measured at about 6,400 km.'],

 {d:2,p:notes(['The Registan is a public square in Samarkand.','It is framed by three madrasas built between the 15th and 17th centuries.','The oldest, the Ulugh Beg Madrasa, was completed in 1420.','It is part of a UNESCO World Heritage site.']),

  q:Q_MAIN, c:['The northern Aral Sea has partly recovered, bringing benefits to nearby communities.','The Aral Sea has completely returned to its original size.','Rusting ships remain the main attraction for visitors to the Aral Sea.','Fishing villages near the Aral Sea were never affected by the sea\'s decline.'],
  e:'The text moves from the sea\'s decline to its partial recovery and the benefits for villages. "Completely" overstates the recovery, which the text limits to the northern part.'},
 {d:1,p:'Many people assume that octopuses live alone and avoid one another. At a site off the coast of Australia nicknamed "Octlantis," however, researchers observed more than a dozen octopuses living close together, sharing dens and frequently signaling to one another with changes in skin color.',
  q:'According to the text, what did researchers observe at "Octlantis"?', c:['Octopuses living near one another and communicating through color changes','Octopuses avoiding all contact with others of their species','A single octopus defending a large territory','Octopuses that were unable to change the color of their skin'],
  e:'The text says the octopuses shared dens and signaled "with changes in skin color." The other choices describe the assumption the observation challenges, or details the text never gives.'},
 {d:2,p:'The following text is from a 1910 short story. Gulnora has just moved from her village to the city.<br><br>Everything in the city seemed to hurry: the trams, the merchants, even the pigeons. Gulnora walked slowly on purpose, as if to prove that she, at least, had not yet been swept into the current. But by the end of the week she noticed that she, too, was walking faster.',
  q:Q_MAIN, c:['Despite her resistance, Gulnora is gradually adapting to the pace of city life.','Gulnora is unhappy because she cannot find her way around the city.','Gulnora walks slowly because she is tired from her journey.','The city is described as calmer than Gulnora\'s village.'],
  e:'She first resists the city\'s speed on purpose, then notices she is walking faster too. The text never says she is lost or tired.'},
 {d:2,p:'Linguist Madina Yusupova recorded conversations among teenagers in Tashkent and found that many switched between Uzbek, Russian, and English within a single sentence. Some educators have viewed such mixing as a sign of weak language skills. Yusupova argues the opposite: speakers choose each word deliberately, using whichever language best expresses a particular idea or tone.',
  q:'Which choice best states the main idea of the text?', c:['Yusupova argues that mixing languages in conversation reflects skillful choices rather than weakness.','Teenagers in Tashkent speak English more often than Uzbek or Russian.','Educators have successfully reduced language mixing in schools.','Yusupova believes that students should speak only one language at a time.'],
  e:'The text sets up the educators\' view and then gives Yusupova\'s opposing argument, which is the main idea.'},
 {d:3,p:'Because the bristlecone pines of the western United States can live for more than four thousand years, scientists once assumed that the trees simply avoid aging. Studies of their tissues tell a more complicated story: the trees do show signs of aging, but they survive by allowing whole sections of bark and wood to die while a narrow strip of living tissue continues to carry water and nutrients to a few branches.',
  q:Q_MAIN, c:['Bristlecone pines do age, but they survive for long periods by keeping only part of the tree alive.','Bristlecone pines are the oldest living things on Earth.','Scientists have proved that bristlecone pines never show signs of aging.','Bristlecone pines grow faster than most other trees in the western United States.'],
  e:'The text corrects an earlier assumption: the trees do age, and they survive by letting sections die. The "never age" choice repeats the assumption the text rejects.'},
],[
 {d:2,p:'Most bridges are designed to last about fifty to one hundred years. Engineers in the Netherlands, however, have begun testing bridges made of a concrete that contains dormant bacteria. When a crack forms and water seeps in, the bacteria awaken and produce limestone, which can seal small cracks before they grow larger.',
  q:'According to the text, what happens when water enters a crack in the experimental concrete?', c:['Bacteria in the concrete become active and produce limestone that can fill the crack.','The concrete dissolves and must be replaced.','Engineers inject new bacteria into the bridge.','The bridge becomes stronger than it was when it was built.'],
  e:'The text says that when water seeps in, the bacteria "awaken and produce limestone, which can seal small cracks." It never claims the bridge becomes stronger than new.'},
 {d:2,p:'Before the invention of printing, many medieval manuscripts included small drawings in their margins: rabbits riding snails, knights fighting snails, monkeys playing instruments. Historians once dismissed these images as idle doodles. More recent scholars have shown that many of the drawings comment on the text beside them, sometimes mocking the very ideas the text presents.',
  q:Q_MAIN, c:['Drawings in the margins of medieval manuscripts were often connected to, and sometimes commented on, the nearby text.','Medieval artists drew animals more skillfully than people.','Most medieval manuscripts were created after the invention of printing.','Historians agree that margin drawings were idle doodles.'],
  e:'The text contrasts the older dismissal with the newer finding that the drawings comment on the text. That finding is the main idea.'},
 {d:3,p:'The following text is adapted from a 1902 novel. Sardor, a young clerk, has been offered a position in a distant city.<br><br>He told himself that he was weighing the advantages: the salary, the prospects, the respect of his employer. Yet each evening he found himself walking past the house where he was born, lingering at the gate, as though the decision had already been made somewhere he could not see.',
  q:'Which choice best describes Sardor\'s situation in the text?', c:['Although he claims to be thinking practically, Sardor appears emotionally reluctant to leave his home.','Sardor has decided to accept the position because of its high salary.','Sardor is upset that his employer does not respect him.','Sardor plans to sell the house where he was born.'],
  e:'He "told himself" he was weighing practical factors, but his evening visits to his birthplace suggest a deeper attachment that is already shaping his choice.'},
 {d:3,p:'Ecologists studying wolves in Yellowstone National Park have long credited the animals\' return in 1995 with allowing streamside willows to recover, reasoning that wolves frightened elk away from the streams where they browsed. A recent study complicates this account. It found that willows recovered mainly where beavers had also returned and rebuilt dams, which raised the water table that willows depend on.',
  q:Q_MAIN, c:['New research suggests that the recovery of willows in Yellowstone depended heavily on beavers and not only on wolves.','Wolves had no effect on elk behavior in Yellowstone.','Beavers were reintroduced to Yellowstone in 1995 along with wolves.','Elk prefer to eat willows that grow far from streams.'],
  e:'The study "complicates" the wolf-only explanation by showing the role of beavers. It does not claim wolves had no effect at all.'},
 {d:1,p:'In 2019, a team of volunteers in Samarkand began photographing every tile in the courtyard of an old madrasa. Using the photographs, conservators created a digital map showing the condition of each tile. The map now helps them decide which damaged tiles to repair first.',
  q:'According to the text, how do conservators use the digital map?', c:['To decide the order in which damaged tiles should be repaired','To sell copies of the tiles to visitors','To design a completely new courtyard','To train volunteers in photography'],
  e:'The final sentence states that the map "helps them decide which damaged tiles to repair first."'},
]],
ev:[[
 {d:1,p:'A student claims that honeybees can recognize individual human faces. The student cites a study in which bees were trained to associate a photograph of one face with a sugar reward.',
  q:'Which finding from the study, if true, would most directly support the student\'s claim?', c:['After training, bees flew to the rewarded face far more often than to photographs of other faces, even when no sugar was present.','Bees in the study visited flowers more often in the morning than in the afternoon.','The photographs used in the study were printed in black and white.','Some bees in the study did not participate in every trial.'],
  e:'To support recognition, the bees must pick out the trained face from other faces without the reward. Only that finding shows this.'},
 {d:2,p:'Historian Aziz Karimov argues that coffeehouses in 17th-century Istanbul served as important centers for exchanging news, not just places to drink coffee.',
  q:'Which quotation from a historical account would most directly support Karimov\'s argument?', c:['"Men of every trade gather here each afternoon to read aloud the latest reports and argue over what the news may mean for the city."','"The coffee is brewed in small copper pots and served very hot."','"The building has a low ceiling and windows facing the street."','"Coffee was first brought to the city from Yemen."'],
  e:'The argument is about exchanging news. Only the quotation about reading reports aloud and arguing over news supports it.'},
 {d:2,p:'A team of psychologists hypothesized that people remember information better when they write it by hand than when they type it, because handwriting forces them to summarize instead of copying word for word.',
  q:'Which finding, if true, would most directly support the team\'s hypothesis?', c:['Students who took handwritten notes wrote fewer exact phrases from the lecture and scored higher on a later quiz than students who typed notes.','Students who typed notes wrote more words than students who took handwritten notes.','Students preferred typing to handwriting when given the choice.','Both groups of students scored similarly on a quiz given immediately after the lecture.'],
  e:'The hypothesis has two parts: more summarizing and better memory. Only the first finding shows both.'},
 {d:3,p:'Researchers have proposed that the mountain gazelles of one desert region migrate each spring mainly to follow fresh plant growth rather than to escape rising temperatures.',
  q:'Which finding, if true, would most directly weaken the researchers\' proposal?', c:['In years when spring rains came late and plants grew late, the gazelles still began migrating at the same time, as temperatures rose.','The gazelles ate more fresh plants during migration than during winter.','Young gazelles migrated more slowly than adult gazelles.','The gazelles\' migration route crossed several mountain passes.'],
  e:'If the timing stays tied to temperature even when plant growth is delayed, plants are probably not the main driver. That weakens the proposal.'},
 {d:3,p:'A literature student claims that in the novel <i>The Weaver\'s Daughter</i> (1921), the narrator presents the town as both comforting and confining.',
  q:'Which quotation from the novel most effectively illustrates the claim?', c:['"The same streets that had sheltered her as a child now seemed to close around her, as gently and as firmly as a mother\'s arms."','"The town had three bakeries and one small library."','"She had never traveled beyond the river at the edge of town."','"Every spring the town held a festival in the central square."'],
  e:'The claim has two sides. "Sheltered" and "gently" show comfort; "close around her" and "firmly" show confinement. The other quotations show neither tension.'},
],[
 {d:2,p:'Marine biologist Feruza Alimova claims that the coral species she studied can tolerate warmer water better when the coral grows near seagrass beds.',
  q:'Which finding from Alimova\'s study, if true, would most directly support her claim?', c:['During a marine heat wave, corals growing near seagrass beds lost far less color than corals of the same species growing away from seagrass.','Seagrass beds provide food for many species of fish.','Corals near seagrass beds were larger before the heat wave.','Water near seagrass beds is usually shallower than water elsewhere.'],
  e:'Losing color is a sign of heat stress. Corals of the same species doing better near seagrass during a heat wave directly supports the claim.'},
 {d:3,p:'An economist argues that a city\'s new bicycle lanes reduced car traffic downtown. Critics respond that traffic fell at the same time because fuel prices rose sharply.',
  q:'Which finding, if true, would most directly support the economist\'s argument over the critics\' objection?', c:['Car traffic fell downtown, where the lanes were built, but did not fall in nearby neighborhoods without bike lanes, even though fuel prices rose everywhere.','Fuel prices rose sharply across the whole country that year.','Many residents said they liked the new bicycle lanes.','The bike lanes were painted green to make them visible.'],
  e:'If fuel prices rose everywhere but traffic fell only where lanes were built, fuel prices cannot explain the drop. That is what answers the critics.'},
 {d:3,p:'Anthropologist Laylo Nazarova argues that the spread of mobile phones in rural communities strengthened, rather than weakened, ties among extended family members who lived far apart.',
  q:'Which finding, if true, would most directly support Nazarova\'s argument?', c:['After phones became common, villagers reported speaking with distant relatives several times a week, compared with a few times a year before.','Mobile phones became cheaper over the period Nazarova studied.','Young people used phones more often than older people did.','Some villages received phone service earlier than others.'],
  e:'Her argument is about stronger ties with distant relatives. A large rise in contact with those relatives is direct support.'},
 {d:1,p:'A student claims that the city library\'s new evening hours have attracted more visitors.',
  q:'Which finding would most directly support the student\'s claim?', c:['The number of visitors rose by 30 percent in the months after the library began staying open in the evening.','The library added several new computers last year.','The library\'s evening staff is smaller than its day staff.','Most visitors say they come to borrow novels.'],
  e:'Only the rise in visitors after the change in hours connects the hours to attendance.'},
 {d:2,p:'The following text is from a 1915 poem by a fictional poet, Nodira Saidova, about a river in winter.<br><br>The river does not sleep beneath the ice;<br>it only lowers its voice, and waits,<br>and listens to the patient stones<br>for news of spring.<br><br>A student claims that the poem portrays the frozen river as still active.',
  q:'Which quotation from the poem most effectively illustrates the claim?', c:['"The river does not sleep beneath the ice"','"for news of spring"','"and listens to the patient stones"','"it only lowers its voice"'],
  e:'The claim is that the river is "still active." Saying it does "not sleep" directly states this; the other lines describe what it does without stating that it is awake.'},
]],
inf:[[
 {d:1,p:'Desert tortoises can survive for a year or more without drinking. They store water in their bladders and get additional moisture from the plants they eat. During long droughts, when few plants grow, tortoises that are disturbed by people sometimes release their stored water in self-defense. As a result, ______',
  q:Q_LOGIC, c:['handling a desert tortoise during a drought may put its survival at risk.','desert tortoises prefer to live near people.','desert tortoises drink more water during droughts.','plants grow more quickly when tortoises are nearby.'],
  e:'If disturbed tortoises lose stored water when little moisture is available, disturbing them during a drought endangers them.'},
 {d:2,p:'Archaeologists working at a site in the Fergana Valley found coins from distant kingdoms, glass beads made in the Mediterranean, and silk fragments from China, all in layers dated to the same period. Because the town itself produced none of these goods, the archaeologists concluded that ______',
  q:Q_LOGIC, c:['the town was probably connected to long-distance trade networks during that period.','the town was the main producer of glass in the region.','people in the town did not use coins.','the silk fragments were made in the Fergana Valley.'],
  e:'Goods from far away, none made locally, suggest the town traded with distant places. The text says the town produced none of these goods, so the glass and silk choices contradict it.'},
 {d:2,p:'In a study of reading habits, people who owned many books as teenagers scored higher on adult reading tests than people who owned few, even when the researchers compared people with the same amount of schooling. This suggests that ______',
  q:Q_LOGIC, c:['access to books at home may help build reading skills beyond what schooling alone provides.','schooling has no effect on adult reading skills.','teenagers who own many books spend less time in school.','adults who read often stop buying books.'],
  e:'Because schooling was held equal, the difference points to something extra, such as having books at home. The text does not say schooling has no effect.'},
 {d:3,p:'Some songbirds learn their songs by imitating adults during a sensitive period early in life. In one experiment, young birds raised in silence during this period later produced simple, unusual songs. When those birds\' offspring were raised hearing only their parents\' unusual songs, each new generation\'s songs became more similar to the normal songs of wild birds. This finding suggests that ______',
  q:Q_LOGIC, c:['some features of the species\' typical song may emerge over generations even without a normal model to copy.','young birds cannot learn songs from their parents.','songbirds raised in silence never produce any song at all.','wild birds learn their songs more slowly than birds raised in laboratories.'],
  e:'The songs drifted back toward normal across generations without a normal model, so some typical features must arise on their own. The text says the isolated birds did sing, so the "never produce any song" choice contradicts it.'},
 {d:3,p:'Economic historians have noted that cities with older universities tend to have more new technology companies today. Yet when researchers examined cities where universities were founded mainly for political reasons, such as being placed in a ruler\'s favorite town, those cities also developed more technology companies than similar cities without universities. Because the location of these universities was not chosen for economic reasons, the findings suggest that ______',
  q:Q_LOGIC, c:['universities themselves may help cause the growth of technology companies, rather than simply being located in already prosperous cities.','technology companies prefer cities that rulers favored.','older universities produce fewer graduates than newer ones.','political leaders usually chose cities with strong economies for new universities.'],
  e:'If location was chosen for non-economic reasons, the universities were not just following prosperity, so they likely contributed to it. The choice about rulers picking strong economies contradicts the text.'},
],[
 {d:2,p:'Snow leopards rarely attack people, and they generally avoid areas with heavy human activity. In one mountain region, though, herders reported more snow leopard attacks on their livestock after wild goats, the leopards\' main prey, declined because of hunting. These reports suggest that ______',
  q:Q_LOGIC, c:['snow leopards may turn to livestock when their usual prey becomes scarce.','snow leopards prefer livestock to wild goats.','hunting has increased the number of snow leopards.','herders in the region have stopped keeping livestock.'],
  e:'Attacks rose after wild prey declined, which points to leopards replacing lost prey. Nothing says they prefer livestock in general.'},
 {d:3,p:'Linguists studying a language spoken in the Pamir Mountains found that speakers in isolated valleys preserved older word forms that had disappeared in valleys linked by roads. In one valley, a road was built only twenty years ago, yet older speakers there still use the older forms while younger speakers mostly do not. This pattern suggests that ______',
  q:Q_LOGIC, c:['increased contact with other communities may speed the loss of older word forms, especially among younger speakers.','older word forms are easier to learn than newer ones.','the language is no longer spoken in any isolated valley.','roads were built first in the valleys where older forms survived.'],
  e:'The change appears soon after the road arrives and mostly among younger speakers, linking contact to faster change.'},
 {d:1,p:'A bakery in Bukhara noticed that its bread sold out by noon on weekdays but was often left over on Sundays, when many offices were closed. The manager therefore decided to ______',
  q:Q_LOGIC, c:['bake less bread on Sundays.','close the bakery on weekdays.','raise the price of bread on weekdays only.','stop selling bread altogether.'],
  e:'Bread is left over on Sundays, so baking less on that day is the logical response.'},
 {d:3,p:'Astronomers estimate the ages of some stars by measuring how fast they spin, since stars like the Sun gradually slow down as they age. However, a team recently found that once such stars reach middle age, their spin slows much less than expected. If the team is correct, then for older Sun-like stars, ages estimated from spin alone are likely ______',
  q:Q_LOGIC, c:['too low, because these stars spin faster than the standard method assumes for their age.','too high, because these stars spin more slowly than expected.','exact, because spin is the most reliable measure of age.','impossible to calculate, because these stars do not spin.'],
  e:'If older stars keep spinning faster than the method assumes, the method will read them as younger than they are, so the estimates are too low.'},
 {d:2,p:'Researchers gave two groups of shoppers the same coupon. For the first group, the coupon said "Save 2,000 som"; for the second, it said "Save 10%," which was the same amount. Shoppers in the first group were much more likely to use the coupon. The results suggest that ______',
  q:Q_LOGIC, c:['the way a discount is described can influence whether people use it, even when its value is the same.','shoppers prefer coupons that offer larger discounts.','percentages are always more persuasive than exact amounts.','most shoppers do not use coupons.'],
  e:'The value was identical, so only the wording differed, and the wording changed behavior. The "always more persuasive" choice reverses the result.'},
]],
qe:[[
 {d:1,p:tbl('Students in a school science fair',['Grade','Projects entered','Projects that won a prize'],[['9','24','3'],['10','30','5'],['11','18','6'],['12','12','4']])+'<p>A teacher notes that grade 10 entered the most projects in the science fair, entering ______</p>',
  q:'Which choice most effectively uses data from the table to complete the statement?', c:['30 projects.','24 projects.','5 projects.','12 projects.'],
  e:'In the "Projects entered" column, grade 10 has 30, the largest number. Five is the number of grade 10 projects that won prizes.'},
 {d:2,p:bars('Average daily screen time of surveyed teenagers, 2016–2024','Hours per day',[['2016',4.1],['2018',4.9],['2020',7.2],['2022',6.6],['2024',6.4]])+'<p>A student claims that teenagers\' screen time rose sharply around 2020 and then declined only slightly.</p>',
  q:'Which choice most effectively uses data from the graph to support the claim?', c:['Screen time jumped from 4.9 hours in 2018 to 7.2 hours in 2020, then fell to 6.4 hours by 2024.','Screen time was 4.1 hours in 2016.','Screen time was higher in 2022 than in 2018.','Screen time in 2024 was 6.4 hours.'],
  e:'The claim has two parts, a sharp rise and a small decline. Only one choice gives data for both.'},
 {d:2,p:tbl('Seed germination after 14 days',['Soil type','Seeds planted','Seeds that sprouted'],[['Sandy','50','21'],['Clay','50','17'],['Loam','50','41'],['Peat','50','33']])+'<p>A gardener hypothesized that loam soil would produce the highest rate of sprouting among the four soils tested.</p>',
  q:'Which choice best describes data from the table that support the gardener\'s hypothesis?', c:['Of the 50 seeds planted in each soil, 41 sprouted in loam, more than in any other soil.','Seeds planted in clay sprouted less often than seeds in sandy soil.','The same number of seeds was planted in each soil type.','33 seeds sprouted in peat.'],
  e:'Support must show loam had the most sprouting. With equal seeds planted, 41 is the highest count.'},
 {d:3,p:tbl('Bird species observed before and after a wetland restoration',['Group','2015 (before)','2023 (after)'],[['Wading birds','6','14'],['Ducks','9','11'],['Songbirds','22','20'],['Birds of prey','4','5']])+'<p>Ecologists restored a drained wetland in 2016 by allowing water to flow back into it. They expected the restoration to benefit especially those birds that feed in shallow water. Their expectation is supported by the observation that ______</p>',
  q:'Which choice most effectively uses data from the table to complete the statement?', c:['the number of wading bird species more than doubled, rising from 6 to 14, while other groups changed little.','songbirds remained the group with the most species in both years.','the number of bird-of-prey species rose from 4 to 5.','the number of songbird species fell from 22 to 20.'],
  e:'Wading birds feed in shallow water. Their large increase, compared with small changes elsewhere, matches the expectation.'},
 {d:3,p:bars('Share of electricity from solar power in one country','Percent',[['2014',1],['2016',2],['2018',4],['2020',8],['2022',15]])+'<p>An energy analyst argues that solar power\'s share of the country\'s electricity has not merely grown but has grown at an accelerating pace.</p>',
  q:'Which choice most effectively uses data from the graph to support the analyst\'s argument?', c:['The share roughly doubled every two years, so each increase was larger than the one before it, from 1 point to 7 points.','The share was higher in 2022 than in 2014.','In 2018, solar power provided 4 percent of electricity.','Solar power provided less than 20 percent of electricity in every year shown.'],
  e:'"Accelerating" means the increases themselves get larger. Only one choice compares the size of the increases.'},
],[
 {d:1,p:tbl('Visitors to three museums in one week',['Museum','Weekday visitors','Weekend visitors'],[['History','1,200','2,600'],['Art','900','2,100'],['Science','1,500','3,400']])+'<p>According to the table, the museum with the most weekend visitors was the ______</p>',
  q:'Which choice most effectively uses data from the table to complete the statement?', c:['Science museum, with 3,400 weekend visitors.','History museum, with 2,600 weekend visitors.','Science museum, with 1,500 weekend visitors.','Art museum, with 2,100 weekend visitors.'],
  e:'In the weekend column, 3,400 is the largest value, and it belongs to the Science museum. 1,500 is its weekday figure.'},
 {d:2,p:tbl('Average test scores by study method',['Study method','Score after 1 day','Score after 1 week'],[['Rereading notes','78','52'],['Practice testing','76','71'],['Highlighting','74','49']])+'<p>A student claims that practice testing leads to better long-term memory than the other two methods, even though it does not produce the highest score right away.</p>',
  q:'Which choice most effectively uses data from the table to support the claim?', c:['Practice testing scored 76 after one day, below rereading\'s 78, but 71 after one week, far above rereading\'s 52 and highlighting\'s 49.','Rereading notes produced the highest score after one day.','Highlighting produced the lowest scores at both times.','All three methods produced lower scores after one week than after one day.'],
  e:'The claim has two parts: not the best right away, but the best later. Only one choice addresses both.'},
 {d:3,p:tbl('Households with internet access, by region (%)',['Region','2015','2020','2025'],[['North','40','62','81'],['South','55','68','74'],['East','35','58','79'],['West','60','70','76']])+'<p>An economist claims that the regions that had the lowest internet access in 2015 made the largest gains over the following ten years.</p>',
  q:'Which choice most effectively uses data from the table to support the claim?', c:['North and East, which had the lowest access in 2015 (40% and 35%), gained 41 and 44 percentage points by 2025, while South and West gained 19 and 16.','West had the highest access in 2015.','All four regions had more than 70% access by 2025.','South\'s access rose from 55% to 74% between 2015 and 2025.'],
  e:'The claim links low starting levels with large gains. Only one choice compares starting levels with the size of the gains.'},
 {d:2,p:bars('Average monthly rainfall in one city (mm)','Millimeters',[['Jan',45],['Mar',70],['May',35],['Jul',5],['Sep',10],['Nov',40]])+'<p>A travel guide recommends visiting the city in summer for those who want to avoid rain, noting that in July the city receives only ______</p>',
  q:'Which choice most effectively uses data from the graph to complete the statement?', c:['5 millimeters of rain on average.','70 millimeters of rain on average.','10 millimeters of rain in March.','45 millimeters of rain on average.'],
  e:'The July bar shows 5 millimeters, the lowest value on the graph.'},
 {d:3,p:tbl('Results of a fertilizer trial on wheat',['Treatment','Yield (tons per hectare)','Water used (relative to control)'],[['No fertilizer (control)','3.1','100%'],['Fertilizer A','4.6','125%'],['Fertilizer B','4.4','101%']])+'<p>Farmers in a dry region must limit water use. An agronomist recommends Fertilizer B over Fertilizer A for these farmers, noting that ______</p>',
  q:'Which choice most effectively uses data from the table to complete the statement?', c:['Fertilizer B produced nearly the same yield as Fertilizer A (4.4 versus 4.6 tons per hectare) while using about the same amount of water as the control.','Fertilizer A produced the highest yield of any treatment.','both fertilizers produced higher yields than the control.','the control used 100% of the water.'],
  e:'For dry regions, the case for B must combine yield and water. The correct choice shows B is close in yield and uses much less water than A.'},
]],
};
UNITS.forEach(u=>{ if(MORE2[u.id]) MORE2[u.id].forEach(L=>u.lessons.push(L)); });

/* ---------- Test-style lessons for Craft and Structure, Expression of Ideas, and Standard English (original) ---------- */
const Q_RS = 'Which choice most effectively uses relevant information from the notes to accomplish this goal?';
const MORE3 = {
wic:[
 {d:1,p:'Many desert plants open their pores only at night, when the air is cooler. This habit allows them to ______ water that would otherwise be lost to the heat of the day.',
  q:Q_WORD, c:['conserve','spend','observe','release'],
  e:'Opening pores at night prevents water loss, so the plants "conserve," or save, water. "Release" and "spend" mean the opposite.'},
 {d:2,p:'Although the novelist\'s early books sold poorly, critics now regard them as ______ works that shaped the style of a whole generation of writers.',
  q:Q_WORD, c:['seminal','obscure','derivative','trivial'],
  e:'Works that "shaped the style of a whole generation" are "seminal," meaning highly influential. "Derivative" means copied from others, the opposite of shaping others.'},
 {d:2,p:'The following text is from a 1909 short story.<br><br>The old clockmaker did not hurry. He held each gear up to the window, turning it slowly in the light, as if the smallest scratch might <u>betray</u> a lifetime of careless work.',
  q:'As used in the text, what does the word "betray" most nearly mean?', c:['reveal','abandon','deceive','sell'],
  e:'A scratch that might "betray" careless work would show, or "reveal," it. The other meanings of "betray" do not fit a scratch on a gear.'},
 {d:3,p:'Historian Kamola Ergasheva cautions that the merchant\'s diary, though vivid, should be read with care: written years after the events it describes, it may reflect the merchant\'s later opinions as much as his ______ experiences.',
  q:Q_WORD, c:['contemporaneous','fabricated','subsequent','collective'],
  e:'The contrast is between later opinions and experiences from the time of the events. "Contemporaneous" means happening at the same time. "Subsequent" means later, the opposite.'},
 {d:3,p:'The new species of frog is so ______ that researchers spent three seasons searching the forest before they recorded a single individual.',
  q:Q_WORD, c:['elusive','abundant','vocal','conspicuous'],
  e:'Three seasons of searching to find one frog shows the species is hard to find: "elusive." "Conspicuous" means easy to notice.'},
 {d:2,p:'Engineers did not abandon the original bridge design; instead, they ______ it, adding a second support tower while keeping the shape of the deck the same.',
  q:Q_WORD, c:['modified','rejected','duplicated','concealed'],
  e:'They kept the design but added a tower, so they changed it slightly: "modified." "Rejected" contradicts "did not abandon."'},
],
ts:[
 {d:2,p:'Many people picture glaciers as frozen and still. In fact, glaciers flow. Under their own enormous weight, the ice at the bottom slowly deforms, and the whole mass can creep downhill by several meters a day. Some glaciers even "surge," suddenly moving many times faster for months at a time.',
  q:'Which choice best describes the overall structure of the text?', c:['It presents a common belief about glaciers and then corrects it with details about how glaciers move.','It compares two different types of ice and explains why one melts faster.','It describes a scientific debate and then explains why it remains unresolved.','It tells the story of the discovery of glaciers by early explorers.'],
  e:'The text begins with the belief that glaciers are still, then corrects it ("In fact, glaciers flow") and adds supporting details.'},
 {d:2,p:'The following text is from a 1913 novel. Aziza has just finished her first day teaching in a village school.<br><br>She had planned every minute of the lesson, but the children had questions she had never imagined. By evening she was exhausted, and yet, walking home under the apricot trees, she found herself already planning tomorrow.',
  q:'Which choice best describes the function of the final sentence in the text?', c:['It shows that despite her tiredness, Aziza remains eager to continue teaching.','It explains why Aziza decided to stop teaching.','It describes the questions the children asked.','It suggests that Aziza had not prepared for her lesson.'],
  e:'"And yet" turns from her exhaustion to her eagerness: she is already planning the next day.'},
 {d:3,p:'Some economists argue that raising the minimum wage reduces employment, because businesses hire fewer workers when labor costs more. A study of neighboring regions, one of which raised its minimum wage while the other did not, found no significant difference in employment over the next three years. The authors note, however, that their data cover only restaurants, where demand for workers may be unusually steady.',
  q:'Which choice best describes the function of the final sentence in the overall structure of the text?', c:['It acknowledges a limitation that may affect how widely the study\'s findings apply.','It presents the main conclusion of the study.','It restates the economists\' argument mentioned at the beginning.','It describes the method the researchers used to choose the two regions.'],
  e:'"However" introduces a caution: the data cover only one industry, which limits how far the results can be generalized.'},
 {d:2,p:'Tea did not always come in bags. In 1908, a New York merchant began sending customers samples of tea in small silk pouches. Some customers, assuming the pouches were meant to go into the pot, dropped them straight into hot water. The merchant noticed the trend and began selling tea in pouches on purpose.',
  q:'Which choice best states the main purpose of the text?', c:['To explain how a misunderstanding by customers led to a new way of selling tea','To argue that tea bags make better tea than loose leaves','To describe how silk is produced','To compare tea-drinking habits in different countries'],
  e:'The text tells how customers\' mistaken use of the sample pouches led the merchant to sell tea in bags.'},
 {d:3,p:'Researchers once believed that the giant stone heads of Rapa Nui were moved by being dragged on wooden sleds, a method that would have required enormous numbers of trees. Experiments in which teams rocked a replica statue from side to side with ropes, "walking" it forward, showed that a small group could move a statue with no sleds at all. This finding <u>challenges an explanation for the island\'s loss of its forests</u> that some historians had proposed.',
  q:'Which choice best describes the function of the underlined portion in the text as a whole?', c:['It indicates that the experiment\'s results raise doubts about one proposed reason for deforestation on the island.','It summarizes the history of the island\'s forests.','It describes the method used in the rocking experiment.','It confirms that the statues were moved on wooden sleds.'],
  e:'If statues did not need sleds, the idea that sled-building used up the trees is weakened, which is what the underlined portion points out.'},
 {d:1,p:'Every spring, millions of red crabs on Christmas Island leave the forest and march to the sea to lay their eggs. During the migration, roads are closed, and special bridges and tunnels help the crabs cross safely.',
  q:'Which choice best states the main purpose of the text?', c:['To describe the red crabs\' yearly migration and the steps taken to protect them','To argue that Christmas Island should close all of its roads permanently','To explain how red crabs find food in the forest','To compare red crabs with other kinds of crabs'],
  e:'The text describes the migration and the measures, such as closed roads and crab bridges, that protect the crabs.'},
],
ct:[
 {d:2,p:'<p><b>Text 1</b><br>Many city planners argue that building more roads reduces traffic. With more lanes available, they say, cars spread out and congestion falls.</p><p><b>Text 2</b><br>Studies of new highways have repeatedly found that traffic soon returns to its earlier levels. Wider roads make driving more convenient, so people drive more often and farther, a pattern known as "induced demand."</p>',
  q:'Based on the texts, how would the author of Text 2 most likely respond to the planners discussed in Text 1?', c:['By arguing that new roads tend to encourage more driving, so congestion does not fall for long','By agreeing that more lanes always reduce congestion','By suggesting that planners should build roads only in rural areas','By claiming that people will stop driving if roads are widened'],
  e:'Text 2 says new roads lead to more driving, so traffic returns. That directly challenges the planners\' claim.'},
 {d:3,p:'<p><b>Text 1</b><br>Archaeologist Rustam Holov argues that the ancient city was abandoned suddenly, probably after an earthquake. He points to collapsed walls and household items left in place.</p><p><b>Text 2</b><br>Collapsed walls and abandoned items show that buildings fell, but not when. Soil layers at the site suggest the city\'s population declined over many decades as its river shifted away; the walls may have fallen long after most residents had already left.</p>',
  q:'Based on the texts, how would the author of Text 2 most likely respond to Holov\'s argument?', c:['By noting that the evidence Holov cites does not show that the city was abandoned suddenly','By agreeing that an earthquake was the main reason residents left','By arguing that the walls of the city never collapsed','By claiming that no household items were found at the site'],
  e:'Text 2 accepts that walls fell but says this does not show when, and offers evidence of a slow decline instead.'},
 {d:2,p:'<p><b>Text 1</b><br>Some teachers worry that calculators weaken students\' arithmetic skills, since students no longer practice basic calculations by hand.</p><p><b>Text 2</b><br>In a study of middle school classes, students who used calculators for complex problems did as well on hand-calculation tests as students who did not, and they solved more advanced problems.</p>',
  q:'Based on the texts, how would the researchers in Text 2 most likely respond to the teachers\' concern in Text 1?', c:['Their findings suggest the concern may be unfounded, at least when calculators are used for complex problems.','They would agree that calculators should be banned in classrooms.','They would argue that hand calculation is more important than advanced problem solving.','They would say that their study did not measure arithmetic skills.'],
  e:'Calculator users did just as well on hand calculation, which suggests the worry is not supported, at least in the situation studied.'},
 {d:3,p:'<p><b>Text 1</b><br>Literary critic Nilufar Saidova argues that the poet\'s later work abandoned the rich imagery of his youth in favor of plain statement, and that his poetry grew weaker as a result.</p><p><b>Text 2</b><br>The poet\'s later style is indeed plainer, but this was a deliberate choice. In letters, he described ornament as "a curtain between the reader and the truth," and the later poems, though simple, are among his most widely quoted.</p>',
  q:'Based on the texts, how would the author of Text 2 most likely respond to Saidova\'s argument?', c:['By accepting that the later style is plainer while disputing that the change made the poetry weaker','By agreeing that the poet\'s later work is weaker than his early work','By denying that the poet\'s style changed over time','By arguing that the poet wrote very little after his youth'],
  e:'Text 2 agrees the style became plainer ("indeed plainer") but argues the change was deliberate and successful, rejecting the claim that the poems grew weaker.'},
 {d:2,p:'<p><b>Text 1</b><br>Bird feeders are often praised for helping birds survive harsh winters.</p><p><b>Text 2</b><br>Feeders can also spread disease, because many birds touch the same surfaces. Researchers recommend cleaning feeders every two weeks.</p>',
  q:'Which choice best describes how Text 2 relates to Text 1?', c:['It points out a possible drawback of feeders and suggests a way to reduce it.','It argues that feeders do not help birds in winter.','It describes the history of bird feeders.','It agrees that feeders have no disadvantages.'],
  e:'Text 2 adds a risk, disease, and gives advice to limit it. It does not deny that feeders help birds.'},
 {d:3,p:'<p><b>Text 1</b><br>Economist Jamshid Tursunov contends that remote work lowers productivity because employees lose the quick, informal exchanges that happen in an office.</p><p><b>Text 2</b><br>A large study of software companies found that remote employees completed slightly more tasks per week, but that teams working remotely produced fewer new product ideas than teams working in the same building.</p>',
  q:'Based on the texts, how would the authors of the study in Text 2 most likely respond to Tursunov\'s claim?', c:['By suggesting that remote work may not reduce individual output, though informal exchanges may matter for generating new ideas','By agreeing completely that remote employees complete fewer tasks','By arguing that office workers produce fewer new ideas than remote workers','By claiming that informal exchanges have no value for companies'],
  e:'The study partly supports and partly challenges Tursunov: output did not fall, but idea generation did, which fits his point about informal exchanges.'},
],
tr:[
 {d:1,p:'Snow leopards are well adapted to cold mountains. Their thick fur keeps them warm. ______ their wide paws work like snowshoes, helping them walk on deep snow.',
  q:Q_TRANS, c:['Additionally,','However,','Instead,','As a result,'],
  e:'The text lists a second adaptation, so "Additionally" fits. Nothing contrasts or follows as a result.'},
 {d:2,p:'Early telescopes produced blurry images with colored edges. ______ astronomers could identify only the largest features of the planets they observed.',
  q:Q_TRANS, c:['Consequently,','Nevertheless,','Similarly,','For example,'],
  e:'Blurry images caused the limited observations, so a cause-and-effect transition, "Consequently," fits.'},
 {d:2,p:'Most metals expand when heated. Water, ______ behaves unusually: between 0 and 4 degrees Celsius, it contracts as it warms.',
  q:Q_TRANS, c:['by contrast,','for instance,','in addition,','therefore,'],
  e:'Water does the opposite of most metals, so a contrast transition is needed.'},
 {d:3,p:'The museum\'s collection includes thousands of textiles from Central Asia. Many have never been displayed, since light can fade their dyes. ______ curators have photographed every piece so that researchers can study them online.',
  q:Q_TRANS, c:['To make the collection accessible anyway,','For this reason, the textiles are often displayed, and','In other words,','Similarly,'],
  e:'The textiles cannot be displayed, yet curators found another way to share them, which "To make the collection accessible anyway" expresses. The choice saying the textiles are often displayed contradicts the text.'},
 {d:3,p:'Some scientists predicted that the new drug would help patients sleep longer. In the trial, ______ patients who took the drug slept no longer than those who took a placebo, though they reported feeling more rested.',
  q:Q_TRANS, c:['however,','moreover,','likewise,','accordingly,'],
  e:'The result goes against the prediction, so "however" is needed.'},
 {d:2,p:'The city first tested electric buses on a single route in 2021. The trial was a success. ______ by 2024, electric buses served every route in the city center.',
  q:Q_TRANS, c:['Subsequently,','Conversely,','In comparison,','Even so,'],
  e:'The text describes what happened next in time, so "Subsequently" fits.'},
],
rs:[
 {d:2,p:notes(['Ulugh Beg was a 15th-century ruler and astronomer in Samarkand.','He built a large observatory there in the 1420s.','His star catalog listed the positions of more than 1,000 stars.','It was the most accurate star catalog of its time.']),
  q:'The student wants to emphasize the importance of Ulugh Beg\'s scientific work. '+Q_RS, c:['Ulugh Beg\'s catalog of more than 1,000 stars was the most accurate of its time.','Ulugh Beg was a ruler in Samarkand in the 15th century.','Ulugh Beg built an observatory in the 1420s.','Samarkand had a ruler named Ulugh Beg.'],
  e:'"Most accurate of its time" shows the importance of the work. The other choices give facts without showing importance.'},
 {d:2,p:notes(['Hummingbirds can hover in place.','They beat their wings up to 80 times per second.','Bees also hover, but they beat their wings about 230 times per second.','Both animals hover to feed on flowers.']),
  q:'The student wants to compare how fast hummingbirds and bees beat their wings. '+Q_RS, c:['While hummingbirds beat their wings up to 80 times per second, bees beat theirs about 230 times per second.','Hummingbirds and bees both hover to feed on flowers.','Hummingbirds can hover in place by beating their wings.','Bees beat their wings about 230 times per second.'],
  e:'A comparison needs both numbers. Only one choice gives both numbers.'},
 {d:3,p:notes(['A study tested two ways of teaching new vocabulary.','Group A read each word\'s definition.','Group B used each new word in a sentence of their own.','One week later, Group B remembered 40% more words than Group A.']),
  q:'The student wants to present the study\'s finding to readers unfamiliar with it. '+Q_RS, c:['In one study, students who used new words in their own sentences remembered 40% more of the words a week later than students who only read definitions.','Group B remembered 40% more words than Group A.','A study tested two different ways of teaching vocabulary.','Some students read definitions, while others wrote sentences.'],
  e:'Readers unfamiliar with the study need to know what the groups did and what happened. "Group A" and "Group B" mean nothing to them on their own.'},
 {d:3,p:notes(['The Great Green Wall is a project to plant trees across Africa\'s Sahel region.','It began in 2007.','Its goal is to restore 100 million hectares of land by 2030.','By 2023, about 18 million hectares had been restored.']),
  q:'The student wants to emphasize how much work remains to reach the project\'s goal. '+Q_RS, c:['By 2023, the Great Green Wall had restored about 18 million of the 100 million hectares it aims to restore by 2030.','The Great Green Wall project began in 2007.','The Great Green Wall involves planting trees across the Sahel region.','The Great Green Wall aims to restore land in Africa.'],
  e:'To show what remains, the sentence must compare progress (18 million) with the goal (100 million).'},
 {d:1,p:notes(['Amir Timur founded the Timurid Empire.','He was born in 1336 near Shahrisabz.','He made Samarkand his capital.','He built many mosques and palaces there.']),
  q:'The student wants to identify Timur\'s capital city. '+Q_RS, c:['Timur made Samarkand the capital of his empire.','Timur was born in 1336.','Timur founded the Timurid Empire.','Timur was born near Shahrisabz.'],
  e:'Only one choice names his capital: Samarkand.'},
 {d:2,p:notes(['Penguins cannot fly.','Their wings have become stiff flippers.','The flippers let them swim at up to 35 kilometers per hour.','Some penguins dive deeper than 500 meters.']),
  q:'The student wants to explain how penguins\' wings help them in water. '+Q_RS, c:['Penguins\' wings have become stiff flippers that let them swim at up to 35 kilometers per hour.','Penguins cannot fly.','Some penguins dive deeper than 500 meters.','Penguins have wings, but they cannot fly with them.'],
  e:'The goal links wings to swimming. The correct choice connects the flippers to swimming speed; the others never mention swimming.'},
],
bd:[
 {d:1,p:'The library was ______ only a few students were studying at the long wooden tables.',
  q:Q_CONV, c:['quiet;','quiet','quiet,','quiet and,'],
  e:'Two complete sentences ("The library was quiet" and "only a few students were studying...") can be joined with a semicolon.'},
 {d:2,p:'The expedition\'s goals were ambitious ______ to map the glacier, measure its speed, and collect ice samples from its base.',
  q:Q_CONV, c:[':',';',',','.'],
  e:'A colon introduces the list that explains "goals." A semicolon would need a complete sentence after it.'},
 {d:2,p:'Navoi, who wrote poetry in both Persian and ______ is often called the founder of Uzbek literature.',
  q:Q_CONV, c:['Chagatai,','Chagatai','Chagatai;','Chagatai:'],
  e:'The clause "who wrote poetry in both Persian and Chagatai" needs a comma on each side.'},
 {d:3,p:'The researchers had expected the seeds to sprout within a ______ after two weeks, however, none had appeared.',
  q:Q_CONV, c:['week;','week,','week','week:'],
  e:'"After two weeks, however, none had appeared" is a complete sentence, so it must be separated from the first with a semicolon, not a comma.'},
 {t:'tap', d:2, s:'The museum\'s first exhibit *featured,* rugs and ceramics from Bukhara and Khiva.',
  e:'No comma belongs between the verb "featured" and its object "rugs."'},
 {t:'tap', d:3, s:'The river floods every *spring,* the farmers, therefore, plant their crops only in early summer.',
  e:'Two complete sentences are joined by only a comma after "spring." A semicolon or a period is needed there. "Therefore" does not join sentences.'},
],
fss:[
 {d:1,p:'Each of the students in the robotics club ______ a different part of the machine.',
  q:Q_CONV, c:['builds','build','are building','have built'],
  e:'The subject is "Each," which is singular, so the verb must be singular: "builds."'},
 {d:2,p:'The collection of ancient coins, found by farmers in the Zarafshan Valley, ______ now on display at the museum.',
  q:Q_CONV, c:['is','are','were','have been'],
  e:'The subject is "collection," which is singular. "Of ancient coins" and the phrase between commas do not change the subject.'},
 {d:2,p:'When the scientists finally reviewed the data, ______ realized that the instrument had been recording the wrong temperatures.',
  q:Q_CONV, c:['they','it','one','he or she'],
  e:'The pronoun refers to "the scientists," which is plural, so "they" is correct.'},
 {d:3,p:'Walking through the old city at dawn, ______',
  q:Q_CONV, c:['the visitor heard the call of doves echoing from the blue domes.','the call of doves could be heard echoing from the blue domes.','the blue domes echoed with the call of doves.','echoes of doves\' calls filled the blue domes.'],
  e:'The phrase "Walking through the old city" must describe the person doing the walking, so "the visitor" must come right after the comma. The other choices make the domes or the calls the walkers.'},
 {d:3,p:'By the time the bridge was completed, engineers ______ more than twenty different designs.',
  q:Q_CONV, c:['had tested','have tested','test','will test'],
  e:'The testing happened before another past event (the bridge was completed), so the past perfect "had tested" is needed.'},
 {d:2,p:'The coach praised the team for its speed, its teamwork, and ______',
  q:Q_CONV, c:['its determination.','being determined.','because it was determined.','they were determined.'],
  e:'Items in a list should be parallel: "its speed, its teamwork, and its determination."'},
],
};

const WORDS = VSETS.flatMap(s=>s.words.map(w=>w.slice(0,4)));

const VUNITS = VSETS.map((set,k)=>{
  const all = VSETS.flatMap((s,j)=>s.words.map(w=>({w,j})));
  const near = w => new Set(NEAR.filter(g=>g.includes(w)).flat());
  const cloze = (w,i) => {
    const bad = near(w[0]);
    const pool = all.filter(x=>x.j!==k && x.w[1]===w[1] && !bad.has(x.w[0])).map(x=>x.w);
    const pick = []; let h = (k*31 + i*17 + w[0].length) % pool.length;
    while(pick.length<3){ const c = pool[h % pool.length]; if(!pick.includes(c)) pick.push(c); h += 1; }
    return { p:w[4], q:Q_WORD, c:[w[0], ...pick.map(x=>x[0])], word:w[0], d:set.d||2,
      e:`"${w[0]}" means ${w[2]}, which fits the clue in the sentence. ` + pick.map(x=>`"${x[0]}" means ${x[2]}.`).join(' ') };
  };
  const ws = set.words;
  const A = [{t:'m', d:1, pairs:ws.slice(0,4).map(w=>[w[0],w[2]])}, ...ws.slice(0,5).map(cloze)];
  const B = [{t:'m', d:1, pairs:ws.slice(5,9).map(w=>[w[0],w[2]])}, ...ws.slice(5,10).map((w,i)=>cloze(w,i+5))];
  const meaning = (w,i) => { const others=[1,2,3].map(s=>ws[(i+s*3)%10]); return { t:'mean', d:1, word:w[0], p:`<p class="vword"><b>${w[0]}</b> <span>${w[1]}</span></p><p>“${w[3]}”</p>`, q:'Which choice best gives the meaning of the word as it is used in the sentence?',
      c:[w[2], ...others.map(o=>o[2])], e:`"${w[0]}" means ${w[2]}.` + others.map(o=>` ${o[2].charAt(0).toUpperCase()+o[2].slice(1)} would be "${o[0]}".`).join('') }; };
  const spell = w => ({ t:'type', d:2, word:w[0], ans:w[0], p:w[4], q:`Type the missing word. It means “${w[2]}” and starts with “${w[0][0]}”.`, e:`The word is "${w[0]}": ${w[2]}. Example: ${w[3]}` });
  const C = [...[1,3,5,7,9].map(i=>meaning(ws[i],i)), ...[0,4,8].map(i=>spell(ws[i]))];
  return { id:'v'+(k+1), sec:4, vocab:true, title:set.title, setNo:k+1,
    tip:'Read the whole sentence before the choices. Find the clue (a colon, "but," "because," an example), predict your own word, then pick the closest match.',
    lessons:[A,B,C], meaning };
});

{ id:'gfrag', grp:0, stat:'bd', title:'Sentences and Fragments',
  intro:'A complete sentence (an independent clause) needs a subject and a main verb and must express a complete thought. Anything less is a fragment, and the SAT always marks fragments wrong.',
  rules:[
   ['Independent clause','Subject + main verb + complete thought. <i>The river flooded.</i> It can stand alone as a sentence.'],
   ['Dependent clause','Starts with a word like <i>because, although, when, which, that, who, if, since</i>. <i>Because the river flooded</i> cannot stand alone.'],
   ['Fragment check','Read the sentence by itself. If you are left waiting ("Because the river flooded... what?"), or there is no main verb, it is a fragment.'],
   ['Watch for -ing and which','<i>The study, which lasted ten years.</i> is a fragment: "which lasted" belongs to a describing clause, so the sentence still has no main verb.'],
  ],
  ex:[['Although the museum was small. It held many treasures.','Although the museum was small, it held many treasures.','"Although the museum was small" is dependent; it must attach to an independent clause.'],
      ['The researcher, who collected samples for a decade.','The researcher collected samples for a decade.','The "who" clause leaves the subject without a main verb.']],
  items:[
   {d:1,p:'Because the bridge was closed for ______ drivers had to take a longer route.',q:Q_CONV,c:['repairs,','repairs;','repairs.','repairs:'],e:'"Because the bridge was closed..." is a dependent clause. It joins the independent clause with a comma. A period or semicolon would leave it as a fragment.'},
   {d:2,p:'The ancient manuscript, discovered in a monastery library in 1950, ______ a list of medicinal plants.',q:Q_CONV,c:['contains','containing','which contains','that contains'],e:'The subject "manuscript" needs a main verb. The other choices turn the rest of the sentence into a description, leaving no main verb.'},
   {d:2,p:'Scientists studying the glacier ______ that it had retreated almost two kilometers.',q:Q_CONV,c:['found','finding','who found','having found'],e:'"Scientists studying the glacier" is the subject; it needs the main verb "found."'},
   {d:3,p:'The festival, which began as a small gathering of local musicians in ______ visitors from across Central Asia.',q:Q_CONV,c:['1998, now attracts','1998, now attracting','1998 and now attracts','1998, which now attracts'],e:'The "which" clause must close with a comma after "1998" so that "festival" gets its main verb, "attracts." The other choices leave the sentence without a main verb.'},
   {t:'tap',d:2,tq:'Tap the word that makes this group of words a fragment.',s:'*Although* the experiment produced clear results.',e:'"Although" makes the clause dependent. Without it, the words form a complete sentence.'},
   {d:3,p:'Mirzo Ulugbek, ______ an observatory that measured the length of the year with remarkable accuracy.',q:Q_CONV,c:['a ruler and astronomer, built','a ruler and astronomer who built','who was a ruler and astronomer, building','a ruler and astronomer, building'],e:'Only one choice gives "Mirzo Ulugbek" a main verb ("built"). The others leave the sentence without one.'},

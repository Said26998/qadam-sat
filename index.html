{ id:'gjoin', grp:1, stat:'bd', title:'Joining Sentences: Periods, Semicolons, Commas',
  intro:'This is the most tested boundary rule on the digital SAT. When two independent clauses meet, only a few punctuation patterns are allowed.',
  rules:[
   ['Period = semicolon','Both separate two complete sentences: <i>The rain stopped<b>.</b> The sun came out.</i> / <i>The rain stopped<b>;</b> the sun came out.</i>'],
   ['Comma + FANBOYS','A comma can join two sentences <b>only</b> with <i>for, and, nor, but, or, yet, so</i>: <i>The rain stopped<b>, and</b> the sun came out.</i>'],
   ['Comma splice','A comma alone between two sentences is <b>always wrong</b>: <i>The rain stopped, the sun came out.</i>'],
   ['Transition words are not FANBOYS','<i>However, therefore, moreover, thus, consequently, for example</i> cannot join sentences with a comma. Use: <i>The rain stopped<b>; however,</b> the sun stayed hidden.</i>'],
  ],
  ex:[['The tea was cold, she drank it anyway.','The tea was cold, but she drank it anyway.','A comma alone cannot join two sentences; add a FANBOYS word or use a semicolon.'],
      ['The road was icy, therefore, the school closed.','The road was icy; therefore, the school closed.','"Therefore" is a transition, not a FANBOYS conjunction.']],
  items:[
   {d:1,p:'The museum closed at six ______ visitors were asked to leave the galleries ten minutes earlier.',q:Q_CONV,c:['o\'clock;','o\'clock,','o\'clock','o\'clock, and,'],e:'Two complete sentences: a semicolon is correct. A comma alone makes a comma splice.'},
   {d:2,p:'The first experiment ______ the team learned enough from it to design a better one.',q:Q_CONV,c:['failed, but','failed,','failed','failed, however'],e:'Joining two sentences with a comma requires a FANBOYS word such as "but." "However" cannot join sentences with a comma.'},
   {d:2,p:'Cotton needs large amounts of water ______ farmers in dry regions often rely on irrigation canals.',q:Q_CONV,c:['to grow;','to grow,','to grow','to grow, thus'],e:'Two independent clauses: use a semicolon. "Thus" after a comma would still be a splice.'},
   {d:3,p:'The architect wanted the building to stay cool without air conditioning ______ she added thick walls and a central courtyard.',q:Q_CONV,c:['; therefore,',', therefore,',', therefore','therefore,'],e:'"Therefore" begins the second sentence, so a semicolon must come before it and a comma after it.'},
   {t:'tap',d:2,s:'The market opened at *dawn,* farmers arrived with carts of melons.',e:'"Farmers arrived..." is a second complete sentence, joined by a comma alone (a comma splice). Use "dawn;" or "dawn." or "dawn, and" instead.'},
   {t:'tap',d:3,s:'The bridge is over a century old, *however,* engineers still consider it safe.',e:'"However" cannot join two sentences with commas. Write "old; however," instead.'},

{ id:'gcolon', grp:1, stat:'bd', title:'Colons and Dashes',
  intro:'Colons and dashes are tested often because students use them loosely. The rules are actually simple.',
  rules:[

   ['No colon after a verb or "such as"','Wrong: <i>The recipe needs: flour...</i> / <i>such as: flour</i>. The part before the colon must be able to stand alone.'],
   ['A single dash','Works like a colon: complete sentence first, then an explanation: <i>Only one thing mattered<b>—</b>speed.</i>'],
   ['A pair of dashes','Surrounds extra information, like a pair of commas: <i>The tower<b>—</b>built in 1127<b>—</b>still stands.</i> Never mix a dash with a comma for one interruption.'],
  ],
  ex:[['The bag contained: a map, a compass, and a knife.','The bag contained a map, a compass, and a knife.','"The bag contained" is not a complete thought, so no colon.'],

  items:[

   {d:2,p:'The garden includes plants such ______ basil, mint, and coriander.',q:Q_CONV,c:['as','as:','as;','as—'],e:'Never put a colon or dash right after "such as." No punctuation is needed.'},

   {d:3,p:'The rare orchid—found only on a few cliffs in the ______ blooms for just two days each year.',q:Q_CONV,c:['Pamirs—','Pamirs,','Pamirs','Pamirs;'],e:'The interruption opened with a dash, so it must close with a dash.'},
   {d:3,p:'The study\'s conclusion was ______ students who slept more remembered more.',q:Q_CONV,c:['clear:','clear;','clear, that','clear:that'],e:'"The study\'s conclusion was clear" is complete, and what follows explains it: use a colon followed by a space.'},
   {t:'tap',d:2,s:'The best route to the summit *includes:* a river crossing and a steep ridge.',e:'"The best route to the summit includes" is not a complete sentence, so it cannot come before a colon.'},

{ id:'gsva', grp:2, stat:'fss', title:'Subject-Verb Agreement',
  intro:'A singular subject takes a singular verb (<i>it is, it runs</i>); a plural subject takes a plural verb (<i>they are, they run</i>). The SAT hides the subject so you match the verb to the wrong word.',
  rules:[

   ['Skip interrupters','<i>The <b>director</b>, along with the actors, <b>was</b> late.</i> "Along with," "as well as" and phrases between commas do not change the subject.'],
   ['Singular words that sound plural','<i>Each, every, either, neither, everyone, the number of, a collection, a series, a team</i> take singular verbs.'],
   ['Inverted sentences','<i>Near the gate <b>stand</b> two old <b>trees</b>.</i> Find the subject after the verb.'],
  ],
  ex:[['The list of required books are long.','The list of required books is long.','The subject is "list," not "books."'],
      ['Each of the paintings were restored.','Each of the paintings was restored.','"Each" is singular.']],

   {d:2,p:'The mayor, along with several council members, ______ the opening of the new park.',q:Q_CONV,c:['attended','have attended','were attending','attend'],e:'"Along with several council members" does not change the singular subject "mayor." "Attended" works for singular subjects.'},

{ id:'gtense', grp:2, stat:'fss', title:'Verb Tense and Form',
  intro:'Keep the tense consistent with the time clues in the sentence and the passage. Change tense only when the timing actually changes.',
  rules:[
   ['Follow the time clues','Words like <i>in 1920, last year, now, currently, by the time</i> tell you which tense is needed.'],
   ['Past perfect (had + verb)','An action completed <b>before another past action</b>: <i>By the time the rescuers arrived, the storm <b>had passed</b>.</i>'],
   ['Present perfect (has/have + verb)','Started in the past and continues or matters now: <i>Scientists <b>have studied</b> the lake since 1960.</i>'],
   ['Correct forms','<i>has <b>begun</b></i> (not began), <i>had <b>written</b></i> (not wrote), <i>has <b>gone</b></i> (not went).'],
  ],
  ex:[['In 1903, the brothers fly the first powered airplane.','In 1903, the brothers flew the first powered airplane.','"In 1903" requires the past tense.'],
      ['She has wrote three novels.','She has written three novels.','After "has," use the past participle "written."']],
  items:[
   {d:1,p:'In 1924, the city ______ its first electric tram line.',q:Q_CONV,c:['opened','opens','will open','has opened'],e:'"In 1924" is a finished past time, so the simple past "opened."'},
   {d:2,p:'By the time the firefighters arrived, the neighbors ______ most of the animals from the barn.',q:Q_CONV,c:['had rescued','rescue','have rescued','will have rescued'],e:'The rescuing finished before the firefighters arrived, so the past perfect is needed.'},
   {d:2,p:'Since 2015, researchers ______ more than 200 new species in the forest.',q:Q_CONV,c:['have identified','identified','identify','had identified'],e:'"Since 2015" describes a period continuing to now: present perfect.'},
   {d:3,p:'The novel follows a young weaver who leaves her village. At first she struggles, but eventually she ______ her own workshop.',q:Q_CONV,c:['opens','opened','had opened','would have opened'],e:'The passage describes the novel in the present tense ("follows," "leaves," "struggles"), so stay in present: "opens."'},
   {t:'tap',d:2,s:'The team has *began* testing the new design.',e:'After "has," the correct form is "begun."'},
   {t:'tap',d:3,s:'Last summer the volunteers *plant* trees along the river and repaired the old footbridge.',e:'"Last summer" calls for the past tense: "planted," which matches "repaired."'},
  ]},
{ id:'gpro', grp:2, stat:'fss', title:'Pronouns',
  intro:'A pronoun must clearly refer to one noun and agree with it in number. The SAT most often tests <i>it/its</i> vs <i>they/their</i>.',
  rules:[
   ['Agreement','Singular nouns take <i>it, its</i>; plural nouns take <i>they, their</i>. Companies, teams, cities and organizations are singular: <i>The company changed <b>its</b> logo.</i>'],
   ['Find the noun','Look back for the noun the pronoun replaces, skipping nouns in prepositional phrases.'],
   ['Its vs it\'s, their vs they\'re','<i>its</i> = belonging to it; <i>it\'s</i> = it is. <i>their</i> = belonging to them; <i>they\'re</i> = they are; <i>there</i> = a place.'],
   ['Who vs which','<i>who</i> for people, <i>which</i> for things. <i>Whose</i> shows possession for both.'],
  ],
  ex:[['The museum reopened their doors in May.','The museum reopened its doors in May.','"Museum" is singular.'],
      ['The bees returned to it\'s hive.','The bees returned to their hive.','"Bees" is plural, and "it\'s" means "it is."']],
  items:[
   {d:1,p:'The orchestra performed ______ final concert of the season in the open air.',q:Q_CONV,c:['its','their','it\'s','they\'re'],e:'"Orchestra" is a single group: "its."'},
   {d:2,p:'The leaves of the plant change color when ______ exposed to cold air.',q:Q_CONV,c:['they are','it is','it was','its'],e:'The pronoun refers to "leaves," which is plural.'},
   {d:2,p:'The scientist ______ discovery changed the field later won a national prize.',q:Q_CONV,c:['whose','who\'s','which','who'],e:'Possession ("the scientist\'s discovery") requires "whose."'},
   {d:3,p:'The city\'s new library, along with its two branches, ______ visitors free access to online databases.',q:Q_CONV,c:['offers','offer','are offering','have offered'],e:'"Along with its two branches" is an interrupter; the subject "library" is singular.'},
   {t:'tap',d:2,s:'The company announced that *their* profits had doubled.',e:'"Company" is singular, so the pronoun must be "its."'},
   {t:'tap',d:3,s:'The giraffe stretched *it\'s* long neck toward the highest leaves.',e:'"It\'s" means "it is." To show possession, use "its."'},
  ]},
{ id:'gapos', grp:2, stat:'fss', title:'Apostrophes: Possessives and Plurals',
  intro:'An apostrophe shows possession (or a contraction). A plain plural never takes an apostrophe.',
  rules:[
   ['Singular possessive','Add <b>\'s</b>: <i>the city\'s walls, the student\'s book.</i>'],
   ['Plural possessive','Plural ending in s: add only <b>\'</b>: <i>the students\' books, the cities\' walls.</i> Irregular plural: <i>the children\'s books.</i>'],
   ['Plain plural','No apostrophe: <i>the students left.</i>'],
   ['Test','Ask: does the word own the next noun? If yes, use an apostrophe. Is it one or many owners? That decides \'s or s\'.'],
  ],
  ex:[['The farmer\'s harvested their crops.','The farmers harvested their crops.','"Farmers" is a plain plural; it owns nothing.'],
      ['The two countries\'s borders were redrawn.','The two countries\' borders were redrawn.','Plural ending in s: add only an apostrophe.']],
  items:[
   {d:1,p:'The ______ performance impressed the judges.',q:Q_CONV,c:['dancer\'s','dancers','dancers\'s','dancer'],e:'One dancer owns the performance: "dancer\'s."'},
   {d:2,p:'Several ______ were damaged by the storm.',q:Q_CONV,c:['houses\' roofs','house\'s roofs','houses roofs\'','houses roof\'s'],e:'Many houses (plural) own the roofs: "houses\' roofs." "Roofs" is a plain plural.'},
   {d:2,p:'The ______ research focused on how bats find insects in complete darkness.',q:Q_CONV,c:['scientists\'','scientists','scientist\'s\'','scientists\'s'],e:'Several scientists own the research: plural possessive "scientists\'."'},
   {d:3,p:'The museum displayed the ______ toys alongside drawings made by their parents.',q:Q_CONV,c:['children\'s','childrens\'','childrens','children\'s\''],e:'"Children" is an irregular plural, so add \'s.'},
   {t:'tap',d:2,s:'The *tourist\'s* crowded into the narrow streets of the old city.',e:'"Tourists" is a plain plural here; it owns nothing.'},
   {t:'tap',d:3,s:'Both *country\'s* governments signed the water agreement in 2023.',e:'Two countries own the governments: the plural possessive is "countries\'."'},
  ]},
{ id:'gmod', grp:2, stat:'fss', title:'Modifiers',
  intro:'A describing phrase at the start of a sentence must be followed immediately by the noun it describes. If not, it is a dangling modifier.',
  rules:[
   ['Who is doing it?','After an opening phrase like <i>Walking to school,</i> ask "who was walking?" That noun must come right after the comma.'],
   ['Most-tested form','The SAT gives the opening phrase and asks you to choose the rest of the sentence. Pick the choice that begins with the correct noun.'],
   ['Possessives do not count','<i>Walking to school, <b>Ali\'s</b> bag broke</i> is wrong: the bag was not walking.'],
   ['Place modifiers near the word they describe','<i>She almost failed every test</i> (did not fail) is different from <i>She failed almost every test</i>.'],
  ],
  ex:[['Flying over the mountains, the villages looked tiny.','Flying over the mountains, the pilot saw tiny villages.','The villages were not flying.'],
      ['Known for its tilework, tourists visit the Shah-i-Zinda.','Known for its tilework, the Shah-i-Zinda attracts tourists.','The tilework belongs to the Shah-i-Zinda, so it must follow the comma.']],
  items:[
   {d:2,p:'Built in the fifteenth century, ______',q:Q_CONV,c:['the observatory once held a giant marble instrument for measuring stars.','astronomers once used a giant marble instrument in the observatory.','a giant marble instrument for measuring stars was once held in the observatory.','the giant instrument\'s marble once measured stars in the observatory.'],e:'The observatory was built in the fifteenth century, so it must come right after the comma.'},
   {d:2,p:'After studying the data for months, ______',q:Q_CONV,c:['the researchers concluded that the river was shrinking.','the conclusion was that the river was shrinking.','the river was found to be shrinking by the researchers.','the researchers\' conclusion was that the river was shrinking.'],e:'Only the researchers studied the data.'},
   {d:3,p:'A pioneer of modern Uzbek theater, ______',q:Q_CONV,c:['Hamza Hakimzoda Niyoziy wrote plays that addressed social reform.','plays about social reform were written by Hamza Hakimzoda Niyoziy.','social reform was a theme of Hamza Hakimzoda Niyoziy\'s plays.','Hamza Hakimzoda Niyoziy\'s plays addressed social reform.'],e:'The pioneer is a person, so his name must follow the comma. "Niyoziy\'s plays" makes the plays the pioneer.'},
   {d:1,p:'Hungry after the long hike, ______',q:Q_CONV,c:['the students ate everything in the picnic basket.','everything in the picnic basket was eaten.','the picnic basket was emptied by the students.','the students\' picnic basket was emptied.'],e:'The students were hungry, so "the students" must follow the comma.'},
   {d:3,p:'Using a new type of satellite, ______',q:Q_CONV,c:['scientists mapped the ocean floor in greater detail than ever before.','the ocean floor was mapped in greater detail than ever before.','a more detailed map of the ocean floor was produced.','the ocean floor\'s map became more detailed than ever before.'],e:'Scientists used the satellite, so they must be named right after the comma.'},
   {d:2,p:'Covered in snow for most of the year, ______',q:Q_CONV,c:['the peaks of the Pamirs are home to few plants.','few plants grow on the peaks of the Pamirs.','there are few plants on the peaks of the Pamirs.','the Pamirs\' plants are few on the peaks.'],e:'The peaks are covered in snow, so "the peaks" must come first.'},
  ]},
{ id:'gpar', grp:2, stat:'fss', title:'Parallel Structure',
  intro:'Items in a list or comparison must have the same grammatical form.',
  rules:[
   ['Lists','<i>She likes reading, writing, and <b>painting</b></i> (not "to paint").'],
   ['Pairs','<i>not only ... but also, either ... or, neither ... nor, both ... and</i> must join matching forms: <i>not only <b>fast</b> but also <b>cheap</b>.</i>'],
   ['Comparisons','Compare like with like: <i>The climate of Tashkent is drier than <b>that of</b> London</i> (not "than London").'],
  ],
  ex:[['The program teaches students to code, design, and they also present projects.','The program teaches students to code, design, and present projects.','All three items should be verbs in the same form.'],
      ['Her essay was longer than her classmates.','Her essay was longer than her classmates\' essays.','Compare an essay to essays, not to people.']],
  items:[
   {d:1,p:'The new park offers space for running, cycling, and ______',q:Q_CONV,c:['picnicking.','to picnic.','people picnic.','a picnic is possible.'],e:'The list uses -ing words: "running, cycling, and picnicking."'},
   {d:2,p:'The guide was not only knowledgeable but also ______',q:Q_CONV,c:['patient.','had patience.','she was patient.','showing patience.'],e:'"Not only knowledgeable" (an adjective) must be matched by "but also patient."'},
   {d:3,p:'The population of Tashkent is far larger than ______',q:Q_CONV,c:['that of Bukhara.','Bukhara.','Bukhara\'s city.','in Bukhara.'],e:'Compare population to population: "that of Bukhara."'},
   {d:2,p:'Volunteers cleaned the riverbank, planted new trees, and ______ signs about protecting wildlife.',q:Q_CONV,c:['put up','putting up','they put up','to put up'],e:'The list uses past-tense verbs: "cleaned, planted, and put up."'},
   {t:'tap',d:2,s:'The coach wanted players who were fast, focused, and *having* discipline.',e:'The list of adjectives needs "disciplined."'},
   {d:3,p:'For the competition, students may either submit a written essay or ______',q:Q_CONV,c:['present a short film.','a short film.','presenting a short film.','they may present a short film.'],e:'"Either submit..." must be matched by "or present..."'},
  ]},
];

{ id:'gintro', grp:1, stat:'bd', title:'Introductory Phrases and Clauses',
  intro:'Many SAT sentences open with a phrase or a dependent clause before the main idea. A single comma usually separates that opener from the independent clause that follows.',
  rules:[
   ['Comma after a dependent opener','<i>Although the storm passed, the roads stayed closed.</i> The clause starting with <b>although, because, when, if, since, while</b> ends with a comma.'],
   ['Comma after a long phrase','<i>After three hours of careful work, the team found the error.</i> Longer prepositional or -ing phrases take a comma.'],
   ['No comma after the subject','The opener ends where the subject begins. Never put a comma between the subject and its verb: <i>The team, found the error</i> is wrong.'],
   ['Not a semicolon','A semicolon needs a complete sentence on <b>both</b> sides. <i>Because it rained; we stayed inside</i> is wrong because the first part is dependent.'],
  ],
  ex:[['When the bell rang the students rushed out.','When the bell rang, the students rushed out.','The dependent clause "When the bell rang" needs a comma before the main clause.'],
      ['Because the bridge was closed; we took the ferry.','Because the bridge was closed, we took the ferry.','A dependent clause cannot stand before a semicolon.']],
  items:[
   {d:1,p:'Although the museum is small ______ holds more than two thousand ancient coins.',q:Q_CONV,c:[', it',' it','; it','. It'],e:'The dependent clause "Although the museum is small" ends with a comma before the main clause.'},
   {d:1,p:'After weeks of practice ______ finally mastered the difficult piece.',q:Q_CONV,c:[', the pianist',' the pianist,','; the pianist','. The pianist'],e:'A comma closes the long introductory phrase. No comma goes between the subject and the verb "mastered."'},
   {t:'tap',d:2,tq:'Tap the punctuation mark that should be a comma.',s:'Since the river changed its course*;* the old village now sits far from the water.',e:'"Since the river changed its course" is dependent, so it is followed by a comma, not a semicolon.'},
   {d:2,p:'Using satellite images from the past forty years, ______ how quickly the glacier had retreated.',q:Q_CONV,c:['the researchers measured','the researchers, measured','measuring the researchers','the researchers\' measurement of'],e:'The subject right after the opener must be the ones "using" the images, and no comma separates it from the verb.'},
   {d:3,p:'If the results of the second trial match those of the ______ will publish the findings next spring.',q:Q_CONV,c:['first, the team','first the team','first; the team','first. The team'],e:'The "If" clause is dependent and ends after "first," so a comma comes next.'},
   {t:'tap',d:3,tq:'Tap the unnecessary comma.',s:'When the festival ended, the musicians from Khiva*,* packed their instruments and drove home.',e:'"The musicians from Khiva" is the subject. No comma goes between a subject and its verb "packed."'},
  ]},
{ id:'glist', grp:1, stat:'bd', title:'Punctuating Lists',
  intro:'Lists appear in many SAT punctuation questions. Most lists use commas. When the items themselves contain commas, the list switches to semicolons.',
  rules:[
   ['Simple list','Use commas between items: <i>wool, silk, and cotton</i>. The SAT accepts the comma before <i>and</i>.'],
   ['Colon to introduce a list','A colon may introduce a list only after a <b>complete sentence</b>: <i>She packed three things: a map, water, and a hat.</i>'],
   ['No colon after a verb or preposition','<i>The kit includes: a map</i> is wrong. The words before the colon are not a complete sentence.'],
   ['Semicolons for complex lists','If items already contain commas, separate them with semicolons: <i>Tashkent, Uzbekistan; Almaty, Kazakhstan; and Bishkek, Kyrgyzstan</i>.'],
  ],
  ex:[['The recipe needs: flour, salt, and water.','The recipe needs flour, salt, and water.','"The recipe needs" is not a complete sentence, so no colon.'],
      ['They visited Rome, Italy, Paris, France, and Madrid, Spain.','They visited Rome, Italy; Paris, France; and Madrid, Spain.','Each item contains a comma, so semicolons separate the items.']],
  items:[
   {d:1,p:'The bazaar sells dried apricots, raisins ______ and almonds.',q:Q_CONV,c:[', walnuts,',' walnuts',', walnuts;','; walnuts,'],e:'A simple list uses commas between all items.'},
   {d:2,p:'The expedition carried everything it needed to survive ______ tents, stoves, and two months of food.',q:Q_CONV,c:[':',';',', such as:',' including:'],e:'"The expedition carried everything it needed to survive" is a complete sentence, so a colon can introduce the list.'},
   {t:'tap',d:2,tq:'Tap the punctuation mark that should be removed.',s:'The new library includes*:* a reading hall, a recording studio, and a café.',e:'"The new library includes" is not a complete sentence, so no colon. The verb leads straight into its objects.'},
   {d:3,p:'The panel included Dilnoza Karimova, a chemist ______ Aziz Rahimov, a historian; and Lola Saidova, a poet.',q:Q_CONV,c:[';',',',':','—'],e:'Each item contains a comma ("Dilnoza Karimova, a chemist"), so semicolons separate the items, matching the one before "and Lola Saidova."'},
   {d:3,p:'The tour stops in three cities: Samarkand, known for the Registan; Bukhara, known for its old trading domes ______ Khiva, known for its walled inner town.',q:Q_CONV,c:['; and',', and',' and',': and'],e:'The items contain commas, so the list uses semicolons, including before the final "and."'},
   {d:2,p:'To apply, students must submit a transcript, two letters of ______ and a short essay.',q:Q_CONV,c:['recommendation,','recommendation;','recommendation:','recommendation'],e:'The list items contain no internal commas, so plain commas separate them.'},
  ]},
{ id:'gcomp', grp:2, stat:'fss', title:'Logical Comparisons',
  intro:'When a sentence compares two things, they must be the same kind of thing. The SAT likes to compare a thing with a person or a place by mistake.',
  rules:[
   ['Compare like with like','<i>Her score was higher than <b>his</b></i> (his score) is fine. <i>Her score was higher than <b>him</b></i> compares a score to a person.'],
   ['that of / those of','Use <i>that of</i> (singular) or <i>those of</i> (plural) to avoid repeating the noun: <i>The climate of Nukus is drier than <b>that of</b> Tashkent.</i>'],
   ['Possessives can do it too','<i>Samarkand\'s history is older than <b>Tashkent\'s</b></i> means Tashkent\'s history.'],
   ['Than vs. then','<i>Than</i> compares (<i>taller than</i>). <i>Then</i> shows time (<i>first this, then that</i>).'],
  ],
  ex:[['The rivers in Africa are longer than Europe.','The rivers in Africa are longer than those in Europe.','Compare rivers to rivers, not to a continent.'],
      ['A cheetah\'s speed is greater than a lion.','A cheetah\'s speed is greater than a lion\'s.','Compare speed to speed.']],
  items:[
   {d:1,p:'The new phone\'s battery lasts much longer than ______',q:Q_CONV,c:['the old phone\'s.','the old phone.','the old phone does battery.','then the old phone.'],e:'Compare battery to battery: "the old phone\'s" (battery).'},
   {d:2,p:'The population of Samarkand is smaller than ______ but its tourist industry is larger.',q:Q_CONV,c:['that of Tashkent,','Tashkent,','those of Tashkent,','Tashkent\'s population is,'],e:'"That of Tashkent" means "the population of Tashkent," a singular noun, so "that" not "those."'},
   {d:2,p:'Unlike ______ the Aral Sea has shrunk to a small fraction of its former size.',q:Q_CONV,c:['Lake Issyk-Kul,','Lake Issyk-Kul\'s water level,','that of Lake Issyk-Kul,','those of Lake Issyk-Kul,'],e:'The Aral Sea (a body of water) is compared with another body of water, Lake Issyk-Kul, not with its water level.'},
   {t:'tap',d:2,tq:'Tap the word that creates an illogical comparison.',s:'The leaves of the Asian elm are smaller than the *oak*, so the tree lets in more light.',e:'Leaves are compared with a tree. It should be "those of the oak."'},
   {d:3,p:'Researchers found that the bones of birds are lighter than ______ because they are filled with tiny air pockets.',q:Q_CONV,c:['those of mammals','mammals','that of mammals','mammal'],e:'Compare bones (plural) with bones: "those of mammals."'},
   {d:2,p:'Today, the train trip from Tashkent to Samarkand takes far less time ______ it did twenty years ago.',q:Q_CONV,c:['than','then','than what','then what'],e:'"Than" makes a comparison. "Then" is about time order, and "what" adds an extra word that breaks the sentence.'},
  ]},
{ id:'gconf', grp:2, stat:'fss', title:'Commonly Confused Words',
  intro:'Some small words sound alike but play different roles. The SAT tests the most common pairs, especially contractions and possessives.',
  rules:[
   ['its / it\'s','<i>Its</i> = belonging to it (<i>the tree lost its leaves</i>). <i>It\'s</i> = it is or it has.'],
   ['their / there / they\'re','<i>Their</i> = belonging to them. <i>There</i> = a place or "there is." <i>They\'re</i> = they are.'],
   ['whose / who\'s','<i>Whose</i> = belonging to whom. <i>Who\'s</i> = who is or who has.'],
   ['affect / effect','Usually <i>affect</i> is the verb (<i>rain affects crops</i>) and <i>effect</i> is the noun (<i>the effect of rain</i>).'],
  ],
  ex:[['The company changed it\'s logo.','The company changed its logo.','Possession needs "its," with no apostrophe.'],
      ['The scientist who\'s research won the prize spoke first.','The scientist whose research won the prize spoke first.','"Whose" shows possession; "who\'s" means "who is."']],
  items:[
   {d:1,p:'The falcon spread ______ wings and rose above the canyon.',q:Q_CONV,c:['its','it\'s','its\'','their'],e:'The wings belong to the falcon (singular), so "its."'},
   {d:1,p:'The students left ______ backpacks in the hall before the exam.',q:Q_CONV,c:['their','there','they\'re','its'],e:'The backpacks belong to the students: "their."'},
   {d:2,p:'Doctors are studying how screen time ______ the sleep of teenagers.',q:Q_CONV,c:['affects','effects','affect','effect'],e:'The verb is needed, and the subject "screen time" is singular: "affects."'},
   {t:'tap',d:2,tq:'Tap the word that is used incorrectly.',s:'The author, *who\'s* novels have been translated into twenty languages, lives in Tashkent.',e:'The novels belong to the author, so it should be "whose."'},
   {d:3,p:'The museum says ______ planning to return the manuscript to the library where it was first found.',q:Q_CONV,c:['it\'s','its','its\'','it'],e:'"It is planning" is needed, so the contraction "it\'s."'},
   {d:3,p:'The new policy had an immediate ______ on traffic: commute times dropped by twenty percent.',q:Q_CONV,c:['effect','affect','effects','affects'],e:'After "an immediate," a singular noun is needed: "effect."'},
  ]},
);

{ id:'r1', title:'The Water Wheels of Bukhara', genre:'History', d:1, text:[
 'For more than a thousand years, the people of Bukhara lived at the edge of a desert. Rain was rare, and summers were long and hot. Yet travelers who arrived at the city described green gardens, shady pools and fruit trees heavy with apricots and pomegranates. The secret was water, carefully moved from the Zarafshan River through a network of canals.',
 'The canals were only part of the system. Because much of the land sat higher than the canals, farmers needed a way to lift the water. They built tall wooden wheels, called <i>chigir</i>, fitted with clay pots around the rim. As a donkey or camel walked in a circle, the wheel turned. Each pot dipped into the canal, filled with water, rose to the top and emptied into a channel that fed the fields.',
 'Within the city, water was stored in large stone pools known as <i>hauz</i>. The most famous, the Lyab-i Hauz, was built in 1620 and surrounded by mulberry trees. These pools were more than reservoirs. People gathered beside them to drink tea, trade news and escape the heat. In this way, the water system shaped not only farming but also the social life of the city.',
 'The pools had a serious drawback, however. Still water became a breeding ground for disease, and in the early twentieth century most of them were filled in. Today only a few remain, but they still remind visitors how much ingenuity it took to make a desert city bloom.'],

  {d:1,q:'According to the passage, how did the chigir lift water?',c:['Clay pots on a turning wheel filled with water and emptied it at the top.','Workers carried water up hills in clay pots.','Water flowed uphill through stone pipes.','Rain collected in pots attached to the city walls.'],e:'Paragraph 2: each pot "dipped into the canal, filled with water, rose to the top and emptied."'},

  {d:2,q:'Why does the author mention that people drank tea and traded news beside the pools?',c:['To show that the pools also played a role in social life','To argue that tea was more popular than water','To explain how the pools were built','To show that the pools caused disease'],e:'The next sentence says the system shaped "the social life of the city."'},
  {d:3,q:'Which choice best describes the function of the final paragraph?',c:['It notes a problem with the pools and explains why most of them disappeared.','It introduces a new type of water wheel.','It argues that the pools should be rebuilt.','It summarizes the history of the Zarafshan River.'],e:'"The pools had a serious drawback" introduces the disease problem and their filling-in.'},

{ id:'r2', title:'Why Zebras Have Stripes', genre:'Science', d:2, text:[
 'Few questions in biology have produced as many theories as the zebra\'s stripes. Over the past century, scientists have suggested that the stripes confuse lions during a chase, help zebras recognize one another, or keep the animals cool by creating small breezes over the skin. Each idea seemed reasonable, but none had strong evidence behind it.',
 'In the 2010s, a team led by biologist Tim Caro took a different approach. Instead of asking what stripes might do, they asked where stripes are found. They compared dozens of species of horses and zebras across Africa and Asia and mapped how strongly striped each one was. The pattern that emerged surprised them. Stripes were not linked to the number of lions in an area, nor to temperature. They were most closely linked to the presence of biting flies.',
 'To test the idea directly, the researchers dressed horses in coats printed with black-and-white stripes and filmed flies approaching them. The flies flew toward the striped coats as often as toward plain ones, but they failed to land. Many flew past or bumped into the coats clumsily, as if they could not judge the distance. On plain coats, by contrast, flies slowed down and landed smoothly.',
 'Exactly why stripes confuse flies is still debated. One possibility is that the pattern interferes with the way flies\' eyes detect motion. Whatever the mechanism, the finding matters: in regions where biting flies spread serious diseases, avoiding bites may make the difference between life and death.'],
 qs:[
  {d:2,q:'Which choice best states the main idea of the passage?',c:['Evidence suggests that zebra stripes mainly protect against biting flies.','Zebra stripes have no purpose at all.','Lions are confused by zebra stripes during a chase.','Scientists have proved exactly how stripes affect flies\' eyes.'],e:'The research described points to biting flies; the mechanism is still debated, so "proved exactly how" overstates it.'},
  {d:2,q:'How was Caro\'s team\'s first approach different from earlier research?',c:['It examined where striped animals live instead of guessing what stripes do.','It studied only zebras in captivity.','It focused on how lions hunt.','It measured the temperature of zebras\' skin.'],e:'Paragraph 2: "Instead of asking what stripes might do, they asked where stripes are found."'},
  {d:2,q:'What did the experiment with striped coats show?',c:['Flies approached the striped coats but often failed to land on them.','Flies avoided striped coats completely.','Flies landed more often on striped coats.','Horses refused to wear the coats.'],e:'Flies "flew toward the striped coats as often" but "failed to land."'},
  {d:3,q:'As used in paragraph 4, "mechanism" most nearly means',c:['the process by which something works','a machine','an experiment','a disease'],e:'The author is discussing how the effect works, so "process."'},
  {d:3,q:'Based on the passage, the researchers would most likely agree that',c:['the earlier theories about stripes were not well supported by evidence.','zebras would survive equally well without stripes.','biting flies are found only in Asia.','temperature is the main factor in stripe patterns.'],e:'Paragraph 1 says none of the earlier ideas "had strong evidence," and the mapping found no link with temperature.'},
 ]},
{ id:'r3', title:'The Last Letter', genre:'Fiction', d:2, text:[
 'Every Thursday for eleven years, Dilfuza had walked to the post office at the end of Navoi Street to collect letters for her grandmother. The old woman could no longer manage the stairs, and so the errand had passed to Dilfuza when she was nine. At first she had resented it. The walk was long, the clerk was rude, and most of the letters were from people she had never met.',
 'Somewhere along the way, though, the errand had changed. She began to recognize the handwriting: the careful loops of a cousin in Namangan, the cramped, hurried script of an old friend in Moscow. She learned which envelopes would make her grandmother laugh and which would make her fall silent for an afternoon. By the time she was sixteen, she was reading the letters aloud, and her grandmother was dictating the replies.',
 'Now, on this Thursday, there was only one letter, and it was addressed not to her grandmother but to Dilfuza herself. She recognized the handwriting at once. It was her grandmother\'s, the same steady hand that had written a thousand replies through her.',
 'She did not open it on the street. She carried it home, past the bakery and the plane trees, and sat in the empty chair by the window where her grandmother had always waited for her. Only then did she break the seal.'],
 qs:[
  {d:2,q:'Which choice best describes how Dilfuza\'s attitude toward the errand changes over the passage?',c:['She resents it at first but comes to value it.','She enjoys it at first but grows bored of it.','She is indifferent to it throughout.','She refuses to do it after her grandmother stops writing.'],e:'Paragraph 1: "At first she had resented it." Paragraph 2: the errand "had changed" as she grew attached to the letters.'},
  {d:2,q:'As used in paragraph 2, "script" most nearly means',c:['handwriting','a film screenplay','a written test','a computer program'],e:'The sentence describes the "cramped, hurried" way someone writes, so "handwriting."'},
  {d:3,q:'The details in paragraph 4, such as the "empty chair by the window," most strongly suggest that',c:['Dilfuza\'s grandmother is no longer living.','Dilfuza is angry with her grandmother.','the letter contains bad news about a cousin.','Dilfuza has moved to a new house.'],e:'The empty chair where her grandmother "had always waited," and a letter written to her, suggest the grandmother has died.'},
  {d:2,q:'Why does the author mention that the grandmother had "written a thousand replies through her"?',c:['To emphasize the close bond the letters created between Dilfuza and her grandmother','To show that the grandmother was a professional writer','To criticize the grandmother for relying on Dilfuza','To explain why the post office clerk was rude'],e:'Dilfuza had written replies as her grandmother dictated, which shows how connected they became.'},
  {d:3,q:'Which choice best describes the overall structure of the passage?',c:['It traces a long-standing routine and ends with a moment that breaks it.','It compares two different post offices.','It explains how to write a formal letter.','It describes a single conversation in detail.'],e:'Paragraphs 1–2 describe the routine; paragraphs 3–4 show the unusual letter that ends it.'},
 ]},
{ id:'r4', title:'The Cost of a Free Map', genre:'Social science', d:3, text:[
 'When digital maps became free to use on every phone, they seemed to offer only benefits. Drivers could find the fastest route, avoid traffic jams and discover shortcuts that only taxi drivers once knew. Within a few years, however, residents of some quiet neighborhoods noticed a change: streets that had been nearly empty were suddenly crowded with cars.',
 'The cause was the very feature that made the apps useful. Navigation programs calculate routes for each driver individually, choosing whatever path is fastest at that moment. When a main road becomes congested, the apps send drivers onto side streets. Each driver saves a few minutes, but the side streets, which were never designed for heavy traffic, become congested in turn.',
 'Economists call this a problem of individual versus collective benefit. A choice that is sensible for one person can produce a worse outcome when thousands make the same choice. Some studies suggest that when every driver follows such an app, total travel time across a city can actually increase.',
 'Cities have responded in different ways. Some have added speed bumps or turned residential streets into dead ends. Others have begun sharing traffic plans with app companies, hoping the programs can be adjusted to consider the whole road network rather than the single fastest route. Whether such cooperation will work remains an open question.'],
 qs:[
  {d:3,q:'Which choice best states the central idea of the passage?',c:['Navigation apps help individual drivers but can create traffic problems for cities as a whole.','Digital maps have made driving slower for every driver.','Taxi drivers know better shortcuts than navigation apps.','Cities have solved the problem of app-driven traffic.'],e:'The passage contrasts individual benefits with collective costs; the last sentence says the solution is uncertain.'},
  {d:2,q:'According to paragraph 2, why do navigation apps send drivers onto side streets?',c:['They choose the fastest route for each driver at that moment.','They are designed to avoid speed bumps.','Side streets are always shorter than main roads.','City governments require them to do so.'],e:'"Navigation programs calculate routes for each driver individually, choosing whatever path is fastest at that moment."'},
  {d:3,q:'As used in paragraph 3, "collective" most nearly means',c:['shared by a whole group','collected over time','expensive','personal'],e:'It is contrasted with "individual," so it means belonging to the whole group.'},
  {d:3,q:'Which finding, if true, would most strongly support the claim in paragraph 3?',c:['In a city simulation, average travel time rose when all drivers followed app routes compared with when some did not.','Most drivers say they enjoy using navigation apps.','Navigation apps are free in most countries.','Side streets have more trees than main roads.'],e:'The claim is that total travel time can increase when everyone uses the apps; the simulation shows exactly that.'},
  {d:3,q:'The author\'s attitude toward cities\' cooperation with app companies is best described as',c:['uncertain','enthusiastic','hostile','mocking'],e:'The final sentence: "Whether such cooperation will work remains an open question."'},
 ]},
{ id:'r5', title:'Navoi and the Turkic Language', genre:'History', d:2, text:[
 'In the fifteenth century, educated people in Central Asia faced a choice whenever they sat down to write poetry. Persian was the language of the court and of most respected literature. Turkic languages, spoken by much of the population, were widely considered too rough for serious art.',
 'Alisher Navoi disagreed. Born in Herat in 1441, he wrote fluently in Persian, but he devoted most of his work to Chagatai, the Turkic literary language of his time. In a famous essay, <i>Judgment of Two Languages</i>, he argued that Turkic was in some ways richer than Persian. To prove his point, he listed words for which Turkic had several precise terms while Persian had only one, such as the many Turkic words for different kinds of weeping.',
 'Navoi did not only argue; he demonstrated. He wrote five long narrative poems in Chagatai, modeled on a celebrated Persian series, along with thousands of shorter poems. His work showed that the language could express love, grief, philosophy and humor with great subtlety.',
 'His influence was lasting. Later poets across the Turkic-speaking world studied his work, and today he is honored in Uzbekistan as the founder of its literary tradition. Streets, theaters and a national library bear his name.'],
 qs:[
  {d:2,q:'What is the main purpose of the passage?',c:['To explain how Navoi helped establish Turkic as a language for serious literature','To compare Persian and Turkic grammar in detail','To describe the city of Herat in the fifteenth century','To argue that Persian poetry is better than Turkic poetry'],e:'The passage describes Navoi\'s argument for Turkic, his poetry in Chagatai and his lasting influence.'},
  {d:2,q:'Why does the author mention the many Turkic words for kinds of weeping?',c:['To give an example Navoi used to show the richness of Turkic','To show that Navoi\'s poems were sad','To explain why Persian was the language of the court','To criticize the Turkic language'],e:'Paragraph 2: "To prove his point, he listed words..." It is Navoi\'s evidence.'},
  {d:2,q:'As used in paragraph 3, "demonstrated" most nearly means',c:['showed through example','protested in public','taught in a classroom','argued loudly'],e:'"Navoi did not only argue; he demonstrated" by writing poems that showed the language\'s power.'},
  {d:3,q:'Based on the passage, which statement about Navoi is most likely true?',c:['He could have written his major works in Persian but chose Chagatai.','He spoke no language other than Chagatai.','He believed Persian should be banned.','He wrote only short poems.'],e:'He "wrote fluently in Persian, but he devoted most of his work to Chagatai."'},
  {d:2,q:'Which detail best supports the claim that Navoi\'s influence was "lasting"?',c:['Streets, theaters and a national library bear his name today.','He was born in Herat in 1441.','He wrote fluently in Persian.','Persian was the language of the court.'],e:'Things named after him today show influence that continues.'},
 ]},
{ id:'r6', title:'Sleep and Memory', genre:'Science', d:3, text:[
 'Students often treat sleep as the first thing to sacrifice before an exam. Research in neuroscience suggests this may be a costly mistake, because sleep appears to play an active role in turning new information into lasting memories.',
 'During the day, the brain stores new experiences temporarily in a region called the hippocampus. Studies in rats and humans suggest that during deep sleep, the hippocampus "replays" these experiences, sending signals to the outer layer of the brain, the cortex, where long-term memories are kept. In one well-known experiment, rats that ran through a maze showed the same pattern of brain activity during sleep that they had shown while running, as if they were practicing the route.',
 'Human studies point in the same direction. In a typical experiment, two groups learn a list of word pairs. One group sleeps for a night; the other stays awake for the same number of hours. When both groups are tested, the group that slept usually remembers significantly more, even though both had the same amount of time since learning.',
 'Sleep does not simply preserve memories; it may also reorganize them. Some studies have found that people are more likely to discover a hidden rule in a set of problems after a night of sleep than after an equal period awake. For students, the lesson is clear: an all-night study session may leave less in memory than a shorter session followed by a full night\'s rest.'],
 qs:[
  {d:2,q:'Which choice best states the main idea of the passage?',c:['Sleep appears to help the brain strengthen and reorganize new memories.','Rats remember mazes better than humans remember word lists.','The hippocampus stores all long-term memories.','Students should never study before an exam.'],e:'The passage presents evidence that sleep turns new information into lasting memories and may reorganize them.'},
  {d:3,q:'Why does the author describe the experiment with rats in paragraph 2?',c:['To give evidence that the brain replays experiences during sleep','To show that rats sleep more than humans','To explain how mazes are built','To argue that rats are smarter than expected'],e:'The rats\' brain activity during sleep matched their activity while running, supporting the idea of replay.'},
  {d:3,q:'In the word-pair experiment, why is it important that both groups had "the same number of hours" since learning?',c:['It ensures that the difference in memory is due to sleep, not to the amount of time passed.','It ensures that both groups learned the same words.','It makes the experiment shorter.','It shows that staying awake improves memory.'],e:'Equal time rules out time as the explanation, isolating sleep.'},
  {d:2,q:'As used in paragraph 4, "preserve" most nearly means',c:['keep safe','cook','hide','reduce'],e:'Sleep "does not simply preserve memories": it keeps them, and also reorganizes them.'},
  {d:3,q:'Which conclusion about studying is most supported by the passage?',c:['A shorter study session followed by sleep may be more effective than staying up all night.','Students should study only in the morning.','Sleep has no effect on solving problems.','Studying word pairs is the best way to prepare for exams.'],e:'The final sentence draws exactly this conclusion.'},
 ]},
{ id:'r7', title:'The Silk Road Was Not a Road', genre:'History', d:3, text:[
 'The phrase "Silk Road" calls to mind a single highway running from China to Rome, crowded with camel caravans carrying silk westward. The image is memorable but misleading. The term itself was coined only in 1877, by the German geographer Ferdinand von Richthofen, long after the trade it describes had faded.',
 'Historians now describe a shifting web of routes rather than one road. Paths split around deserts and mountain ranges, joined at oasis cities such as Samarkand and Kashgar, and changed as empires rose and fell. Few merchants traveled the entire distance. Instead, goods passed from hand to hand, moving a few hundred kilometers at a time between local traders.',
 'Silk was also only part of the story. Caravans carried paper, glass, spices, horses, metalwork and medicines. Ideas traveled too. Buddhism spread from India into China along these routes, and techniques such as papermaking moved westward, reaching Samarkand by the eighth century and later the Islamic world and Europe.',
 'Some historians argue that the exchange of knowledge mattered far more than the exchange of goods. Silk could be worn out in a few years; the ability to make paper changed how societies stored information for centuries.'],
 qs:[
  {d:3,q:'The author\'s main purpose in the passage is to',c:['correct a common but oversimplified picture of the Silk Road','argue that silk was the most valuable good ever traded','describe the life of Ferdinand von Richthofen','explain how camels were used in caravans'],e:'The first paragraph calls the usual image "misleading," and the rest replaces it with a more accurate picture.'},
  {d:2,q:'According to the passage, how did most goods travel along the routes?',c:['They passed between many local traders over short distances.','Single merchants carried them from China to Rome.','They were shipped by sea.','Governments transported them in large convoys.'],e:'"Goods passed from hand to hand, moving a few hundred kilometers at a time between local traders."'},
  {d:3,q:'Why does the author mention that the term was "coined only in 1877"?',c:['To suggest that the name reflects a later view rather than the traders\' own understanding','To show that trade began in 1877','To praise von Richthofen\'s accuracy','To explain why silk was valuable'],e:'A name invented long after the trade faded is not how the traders themselves saw it.'},
  {d:2,q:'As used in paragraph 2, "shifting" most nearly means',c:['changing','sliding','hidden','dangerous'],e:'The routes "changed as empires rose and fell."'},
  {d:3,q:'Which choice best supports the claim in the final paragraph that knowledge mattered more than goods?',c:['Papermaking changed how societies stored information for centuries.','Caravans carried glass and spices.','Samarkand was an oasis city.','Silk was carried westward.'],e:'The author contrasts silk, which wears out, with papermaking\'s long-lasting effect.'},
 ]},
{ id:'r8', title:'A Garden on the Roof', genre:'Fiction', d:1, text:[
 'When Timur\'s family moved into the ninth-floor apartment, the only outdoor space was a flat, gray roof above the stairwell. His mother called it "the desert." His father said it was too hot for anything to grow.',
 'Timur was twelve and stubborn. He collected old paint buckets from a building site, drilled holes in their bottoms and filled them with soil he carried up the stairs one bag at a time. He planted tomatoes, mint and a single sunflower, and every evening he climbed up with a bottle of water.',
 'For weeks nothing much happened. The tomatoes stayed small and the sunflower leaned sadly to one side. Then, in July, everything changed at once. The tomatoes turned red, the mint spread over the edges of its bucket, and the sunflower straightened and opened, taller than Timur himself.',
 'One evening his mother followed him up the stairs. She stood for a long time looking at the green buckets against the gray roof. "Well," she said at last, "I suppose I\'ll have to stop calling it the desert."'],
 qs:[
  {d:1,q:'Which choice best describes Timur?',c:['Determined and patient','Lazy and careless','Shy and fearful','Angry and impatient'],e:'He carried soil up nine floors "one bag at a time" and watered the plants every evening for weeks.'},
  {d:1,q:'According to the passage, where did Timur get the containers for his plants?',c:['From a building site','From his school','From a garden shop','From his neighbors'],e:'"He collected old paint buckets from a building site."'},
  {d:2,q:'As used in paragraph 3, "spread" most nearly means',c:['grew outward','was shared','covered with butter','stretched its arms'],e:'The mint grew "over the edges of its bucket."'},
  {d:2,q:'What does the mother\'s final statement suggest?',c:['She is impressed that Timur has changed the roof.','She is angry that Timur used the roof.','She thinks the plants will soon die.','She wants to move to a new apartment.'],e:'She will "stop calling it the desert" because it is now green.'},

{ id:'r9', title:'The Prince Who Mapped the Stars', genre:'History', d:2, text:[
 'In the 1420s, the ruler of Samarkand was not only a prince but also a serious scientist. Ulugh Beg, the grandson of Timur, was fascinated by mathematics and astronomy. Rather than spend the city\'s wealth only on palaces, he built an observatory on a hill outside Samarkand and invited dozens of scholars to work there.',
 'The observatory\'s most remarkable instrument was a giant curved track cut deep into the rock, with a radius of about forty meters. Because it was so large, astronomers could measure the height of the sun and stars with unusual precision. Small errors that would ruin a measurement on a handheld instrument became tiny when spread across such a huge scale.',
 'The results were impressive. Ulugh Beg\'s team produced a catalogue listing the positions of more than a thousand stars, the most complete since ancient times. They also calculated the length of the year to within about a minute of the modern value. Scholars in Europe would later translate and study the catalogue.',
 'The story did not end happily. Ulugh Beg was killed in 1449, and the observatory was abandoned and slowly buried. For centuries, its location was forgotten. In 1908, the archaeologist Vasily Vyatkin found the remains of the great curved track underground. Today visitors can walk down into it and see how one prince turned a hilltop into one of the world\'s great centers of science.'],

  {d:3,q:'Which choice best describes the function of the final paragraph?',c:['It explains what happened to the observatory and how it was found again.','It describes how the curved track was used.','It compares Ulugh Beg with European astronomers.','It lists the stars in Ulugh Beg\'s catalogue.'],e:'The paragraph covers the abandonment, the rediscovery in 1908 and what visitors see today.'},

{ id:'r10', title:'Skin That Sees', genre:'Science', d:2, text:[
 'An octopus resting on a coral reef can vanish in less than a second. Its skin changes color, brightness and even texture until it matches the rock or seaweed behind it. Few animals can disguise themselves so quickly or so completely.',
 'The change is controlled by thousands of tiny sacs of pigment in the skin called chromatophores. Each sac is surrounded by muscles connected to nerves. When the muscles pull, the sac stretches and its color spreads across a wider area; when they relax, the sac shrinks to a dot. Because the brain controls these muscles directly, the octopus can change its whole body almost instantly.',
 'This ability raises a puzzle. Most evidence suggests that octopuses are color-blind: their eyes have only one type of light-sensitive cell, so they should not be able to tell red from green. How, then, can they match colors so well? One possible answer came when researchers found light-sensing proteins in octopus skin itself. These proteins may allow the skin to respond to light directly, without waiting for the eyes.',
 'Scientists do not yet know how much this "seeing skin" helps with camouflage. Still, the discovery has inspired engineers, who are trying to build flexible materials that change color when light hits them. One day, such materials could be used to make clothing or buildings that adjust to their surroundings.'],
 qs:[
  {d:1,q:'What is the main purpose of paragraph 2?',c:['To explain how an octopus physically changes its color','To argue that octopuses are color-blind','To describe where octopuses live','To compare octopuses with other animals'],e:'It describes chromatophores and the muscles that stretch them.'},
  {d:2,q:'According to the passage, what happens when the muscles around a chromatophore relax?',c:['The sac shrinks and shows less color.','The sac stretches and spreads its color.','The octopus becomes color-blind.','The skin changes texture.'],e:'"When they relax, the sac shrinks to a dot."'},
  {d:2,q:'What puzzle does the author describe in paragraph 3?',c:['Octopuses match colors well even though their eyes probably cannot see color.','Octopuses cannot change color in bright light.','Octopuses have no nerves in their skin.','Octopuses change color more slowly than other animals.'],e:'The author asks how a color-blind animal "can match colors so well."'},
  {d:3,q:'Which choice best describes the author\'s view of the "seeing skin" idea?',c:['It is a promising possibility that has not yet been fully confirmed.','It has been proved to be the main source of camouflage.','It has been disproved by later experiments.','It is unimportant to scientists.'],e:'The author says the proteins "may allow" a response, and scientists "do not yet know how much" it helps.'},
  {d:2,q:'As used in paragraph 4, "inspired" most nearly means',c:['given ideas to','breathed in','frightened','confused'],e:'The discovery gave engineers ideas for new materials.'},
 ]},
{ id:'r11', title:'Why Cities Are Hotter', genre:'Social science', d:3, text:[
 'On a summer night, the center of a large city can stay several degrees warmer than the farmland around it. Scientists call this effect the urban heat island. It is not caused by a different climate but by the city itself: by the materials it is built from and the way it is arranged.',
 'Dark surfaces such as asphalt and roofing tar absorb most of the sunlight that hits them. During the day they store this energy, and at night they release it slowly as heat. Tall buildings make the problem worse by trapping warm air in narrow streets and blocking breezes. Meanwhile, cities have fewer trees and less open soil. In the countryside, plants release water vapor that cools the air, much as sweat cools the skin. Concrete does not.',
 'The consequences are more than uncomfortable. Hot nights prevent people\'s bodies from recovering from daytime heat, which is especially dangerous for older residents. Air conditioners run longer, raising electricity use and, in many places, pollution from power plants, which can in turn warm the city further.',
 'Cities are now testing ways to cool themselves. Some paint roofs white or light gray so that they reflect sunlight instead of absorbing it. Others plant trees along streets or create "green roofs" covered with grass. Each measure is small, but together they show that the heat island is not inevitable. Because people created it through choices about building, people can also reduce it.'],
 qs:[
  {d:2,q:'Which choice best states the main idea of the passage?',c:['Cities trap extra heat because of how they are built, but changes in building can reduce it.','Cities have a different climate from the countryside because they are farther north.','Air conditioners are the main cause of hot nights in cities.','Trees cannot survive in cities because of the heat.'],e:'Paragraphs 1–2 explain the causes in the built environment; paragraph 4 describes solutions.'},
  {d:2,q:'According to the passage, how do plants help cool the countryside?',c:['They release water vapor that cools the air.','They absorb sunlight and release it at night.','They block breezes from reaching farms.','They reflect sunlight back into space like white roofs.'],e:'"Plants release water vapor that cools the air, much as sweat cools the skin."'},
  {d:3,q:'Why does the author mention pollution from power plants in paragraph 3?',c:['To show how the heat island can make itself worse through a cycle','To argue that cities should close all power plants','To explain why older residents are at risk','To prove that air conditioners do not work'],e:'More cooling leads to more power use and pollution, "which can in turn warm the city further."'},
  {d:3,q:'As used in paragraph 4, "inevitable" most nearly means',c:['impossible to avoid','very expensive','easy to see','recently discovered'],e:'The author argues the heat island can be reduced, so it is not unavoidable.'},
  {d:3,q:'Based on the passage, which change would most likely reduce a city\'s nighttime temperature?',c:['Replacing a dark parking lot with a park full of trees','Building taller towers along narrow streets','Covering more roofs with black tar','Running air conditioners for longer'],e:'Trees add cooling water vapor and replace a dark heat-storing surface; the other choices add heat.'},
 ]},
{ id:'r12', title:'Stories in Thread', genre:'Arts', d:1, text:[
 'In many Uzbek homes, the brightest object in the room is a suzani. These large cloth panels are covered with embroidery: red and orange circles, curling vines, flowers and pomegranates stitched in silk or cotton thread. They hang on walls, cover beds or are spread out for special guests.',
 'Traditionally, a suzani was made for a wedding. When a girl was born, the women of her family would begin planning the panels she would one day take to her new home. The work was often shared. One woman would draw the design onto the cloth, and the cloth would be cut into strips so that several women could stitch at the same time. Later, the strips were sewn back together.',
 'This method left small clues. Because different women worked on different strips, the colors or stitches sometimes do not line up perfectly where the pieces meet. Collectors once saw these mismatches as mistakes. Today many people see them as a record of the family members who worked side by side.',
 'The designs carry meaning, too. Pomegranates, full of seeds, stand for many children and a large family. Large circles may represent the sun or the moon. Every suzani is therefore more than decoration. It is a wish for the future, written in thread.'],
 qs:[
  {d:1,q:'What is the main idea of the passage?',c:['Suzanis are embroidered panels that carry family history and meaning.','Suzanis are made by machines in large factories.','Pomegranates are the most popular fruit in Uzbekistan.','Suzanis are used only in museums.'],e:'The passage describes how suzanis were made and what their designs mean.'},
  {d:1,q:'According to the passage, why was the cloth cut into strips?',c:['So that several women could stitch at the same time','So that the suzani would be easier to sell','So that the colors would match perfectly','So that the design could be drawn more easily'],e:'"The cloth would be cut into strips so that several women could stitch at the same time."'},
  {d:2,q:'How has the view of mismatched strips changed over time?',c:['They were once seen as mistakes but are now valued as signs of shared work.','They were once valued but are now seen as mistakes.','They have always been seen as beautiful.','They have always been hidden by collectors.'],e:'Paragraph 3: "Collectors once saw these mismatches as mistakes. Today many people see them as a record..."'},

   ${rows.length?boardList(rows,kind,50):'<p class="muted">Nobody here yet.</p>'}<p class="muted" style="font-size:13px">${kind==='week'?'XP earned in the last 7 days.':kind==='score'?'Estimated SAT Reading and Writing score (after 10 answers).':'Days in a row with practice.'} You can hide yourself in My stats › Settings.</p><button class="btn ghost" data-close>Close</button>`);
  document.getElementById('lbSeg').onclick=e=>{ const b=e.target.closest('[data-lb]'); if(b) boardSheet(b.dataset.lb); }; }
function paintSync(){ document.querySelectorAll('[data-sync]').forEach(el=>{ el.className='sync '+(SYNC==='ok'?'ok':SYNC==='err'?'err':''); el.lastElementChild.textContent = SYNC==='ok'?'Progress saved to your teacher\'s class':SYNC==='err'?'Could not save to the class. Progress is kept on this device.':'Progress is kept on this device only'; }); }
async function connect(){
  if(!window.claude || !window.claude.use) return;
  try{
    USER = await window.claude.use('user');
    if(USER){ OWNER = await USER.isOwner().catch(()=>false); UID = await USER.id().catch(()=>null); }
    DB = await window.claude.use('db');
    if(!DB || !UID){ paintSync(); if(OWNER) renderNav(); return; }
    const snap = await DB.doc('students/'+UID).get();
    if(snap.exists){ const d=snap.data(); if(d && d.state && (d.updatedAt||0) > (S.updatedAt||0)){ S = Object.assign(fresh(), JSON.parse(JSON.stringify(d.state))); save(false); render(); } else push(); SYNC='ok'; }
    else { await push(); }
    paintSync();
    if(OWNER){ renderNav(); watchClass(); loadAccess(); loadLogins(); }
    loadBank(); watchBoard(); pushBoard();
  }catch(e){ SYNC='err'; paintSync(); }
}
const clean=s=>String(s||'').replace(/<\/?(script|iframe|object|embed|style|link|meta)[^>]*>/gi,'').replace(/\son\w+\s*=/gi,' data-x=');
async function loadBank(){ const col=DB&&DB.collection('bank'); if(!col||!col.get) return;
  try{ const s=await col.get(); const items=s.docs.map(d=>Object.assign({},d.data(),{id:d.id})).filter(x=>x.c&&x.c.length===4&&UNIT[x.unit]).sort((a,b)=>(a.n||0)-(b.n||0));
    items.forEach(it=>{ it.fixed=true; it.p=clean(it.p); ITEM[it.id]=it; }); BANK=items; }
  catch(e){ BANK=null; }
  if(!LS.hidden) return; render(); }
async function loadAccess(){ const col=DB&&DB.collection('access'); if(!col||!col.get) return; try{ const s=await col.get(); ACCESS=new Set(s.docs.map(d=>d.id)); }catch(e){ ACCESS=null; } if(TAB==='class'&&LS.hidden) render(); }
async function setAccess(uid,on){ try{ if(on) await DB.doc('access/'+uid).set({ok:true,at:Date.now()}); else await DB.doc('access/'+uid).delete(); ACCESS=ACCESS||new Set(); on?ACCESS.add(uid):ACCESS.delete(uid); return true; }catch(e){ BANK_MSG='Could not change access ('+((e&&e.code)||'error')+'). Check that the new database rules are pasted in Firebase.'; return false; } }
/* Teacher-made logins for students without email (website only). */
const ADM=()=>window.QADAM_ADMIN&&window.QADAM_SIGNOUT?window.QADAM_ADMIN:null;
const PWW=['tiger','river','maple','comet','lemon','cedar','pearl','sunny','orbit','mango','eagle','piano','delta','bloom','spark','ocean'];
const genPw=()=>{ const r=new Uint32Array(2); crypto.getRandomValues(r); return PWW[r[0]%PWW.length]+String(1000+r[1]%9000); };
async function loadLogins(){ if(!ADM()) return; try{ const s=await DB.collection('logins').get(); LOGINS=s.docs.map(d=>Object.assign({},d.data(),{id:d.id})).sort((a,b)=>(a.name||'').localeCompare(b.name||'')); }catch(e){ LOGINS=null; LOGIN_MSG='Could not load student logins ('+((e&&e.code)||'error')+'). Paste the new database rules in Firebase, then reload.'; } if(TAB==='class'&&LS.hidden) render(); }
function credSheet(title,l,pw,note){ openModal(`<h2>${esc(title)}</h2><p class="muted">${esc(note)}</p>
  <div class="card stack" style="gap:6px"><p style="margin:0">Name: <b>${esc(l.name||'')}</b></p><p style="margin:0">Username: <b>${esc(l.id)}</b></p><p style="margin:0">Password: <b>${esc(pw)}</b></p></div>
  <p class="muted" style="font-size:14px">The student signs in on the website by typing the username in the "Email or username" box.</p><button class="btn" data-close>Done</button>`); }
async function createLogin(){ const g=id=>document.getElementById(id).value.trim(); const name=g('lName'), u=g('lUser').toLowerCase(), pw=g('lPw'); LFORM={name,u,pw};
  if(!name){ LOGIN_MSG='Enter the student\'s name.'; return vClass(); }
  if(!/^[a-z0-9._-]{3,30}$/.test(u)){ LOGIN_MSG='A username needs 3 to 30 letters, numbers, dots or dashes, with no spaces.'; return vClass(); }
  if(pw.length<6){ LOGIN_MSG='Use a password with at least 6 characters.'; return vClass(); }
  if(LOGINS&&LOGINS.some(l=>l.id===u)){ LOGIN_MSG='You already made a login with that username.'; return vClass(); }
  const b=document.getElementById('lGo'); if(b){ b.disabled=true; b.textContent='Creating…'; }
  try{ const uid=await ADM().create(u,pw,name); const l={name,pw,uid,createdAt:Date.now()};
    try{ await DB.doc('logins/'+u).set(l); }catch(e){ LOGIN_MSG='The account works, but its password could not be saved to your list ('+((e&&e.code)||'error')+'). Write it down now: '+pw; }
    LOGINS=(LOGINS||[]).concat([Object.assign({id:u},l)]).sort((a,b)=>(a.name||'').localeCompare(b.name||'')); if(!LOGIN_MSG.startsWith('The account')) LOGIN_MSG=''; LFORM=null; vClass();
    credSheet('Login created',{id:u,name},pw,'Give these details to the student.'); }
  catch(e){ LOGIN_MSG=(e&&e.message)||'Could not create the login.'; vClass(); } }
async function resetLogin(l){ const pw=genPw();
  openModal(`<h2>Reset ${esc(l.name||l.id)}'s password?</h2><p class="muted">Their old password stops working. You will see the new one next.</p><div class="row"><button class="btn ghost" data-close>Cancel</button><button class="btn" id="mRp">Reset password</button></div>`);
  document.getElementById('mRp').onclick=async()=>{ const b=document.getElementById('mRp'); b.disabled=true; b.textContent='Resetting…';
    try{ await ADM().reset(l.id,l.pw,pw); l.pw=pw; l.resetAt=Date.now(); LOGIN_MSG='';
      try{ await DB.doc('logins/'+l.id).set({name:l.name||'',pw,uid:l.uid||'',createdAt:l.createdAt||0,resetAt:l.resetAt}); }catch(e){ LOGIN_MSG='Password changed, but your list could not be updated. Write it down now: '+pw; }
      vClass(); credSheet('New password set',l,pw,'Give the new password to the student.'); }
    catch(e){ closeModal(); LOGIN_MSG=(e&&e.message)||'Could not reset the password.'; vClass(); } }; }
function loginCard(){ if(!ADM()) return '';
  return `<div class="card stack" style="gap:10px;border-color:var(--cobalt)" id="lCard"><p class="lbl" style="margin:0;color:var(--cobalt)">Student logins (no email needed)</p>

   <button class="btn" id="lGo">Create login</button>

function wireLogins(){ const go=document.getElementById('lGo'); if(!go) return; go.onclick=createLogin;
  const c=document.getElementById('lCard'); c.querySelectorAll('[data-lshow]').forEach(b=>b.onclick=()=>{ const id=b.dataset.lshow; LOGIN_SHOW.has(id)?LOGIN_SHOW.delete(id):LOGIN_SHOW.add(id); vClass(); });
  c.querySelectorAll('[data-lreset]').forEach(b=>b.onclick=()=>resetLogin(LOGINS.find(l=>l.id===b.dataset.lreset))); }
async function importBank(file){
  BANK_MSG='Reading the file…'; vClass();
  try{ const j=JSON.parse(await file.text()); const items=(j.items||j).filter(x=>x&&x.id&&x.c&&x.c.length===4&&x.q&&UNIT[x.unit]);
    if(!items.length) throw {code:'no questions found in this file'};
    const list=items.map((x,n)=>[String(x.id).replace(/[^\w-]/g,''), {n, qid:x.qid||'', p:clean(x.p), q:x.q, c:x.c, a:+x.a||0, e:x.e||'', d:[1,2,3].includes(+x.d)?+x.d:2, unit:x.unit}]);
    await DB.collection('bank').setMany(list); BANK_MSG=`Loaded ${list.length} questions.`; await loadBank(); }
  catch(e){ BANK_MSG='Import failed: '+((e&&(e.code||e.message))||'unknown error')+'. If it says permission-denied, paste the new database rules in Firebase first.'; }
  if(TAB==='class') vClass(); }
function watchClass(){
  const timer=setTimeout(()=>{ if(!CLASS){ CLASS_ERR='The class data is taking a while to load.'; if(TAB==='class') render(); } },10000);
  DB.collection('students').onSnapshot(async snap=>{
    clearTimeout(timer); CLASS_ERR='';
    CLASS = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    try{ const ps = await USER.profiles(CLASS.map(c=>c.id)); CLASS_NAMES = {}; for(const c of CLASS){ CLASS_NAMES[c.id] = (ps[c.id]&&ps[c.id].name) || (c.profile&&c.profile.name) || (c.summary&&c.summary.nick) || (c.profile&&c.profile.email) || (c.profile&&c.profile.username) || 'Student'; } }catch(e){}
    if(TAB==='class') render();
  }, err=>{ clearTimeout(timer); CLASS_ERR='Class data could not be loaded right now ('+((err&&err.code)||'unknown error')+').'; if(TAB==='class') render(); });
}

/* ---------- Learn ---------- */
function goalCard(){ const x=todayXp(), g=S.goal, f=Math.min(1,x/g), C=2*Math.PI*24;
  return `<div class="goal"><svg class="ring" viewBox="0 0 58 58" aria-hidden="true"><circle class="bgc" cx="29" cy="29" r="24"/><circle class="fgc" cx="29" cy="29" r="24" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-f)}" transform="rotate(-90 29 29)"/></svg><div><b>${x>=g?'Daily goal complete':'Daily goal'} · ${x} / ${g} XP</b><p>${x>=g?'Great work. Anything extra counts toward your weekly total.':streakNow()>0&&x===0?`Finish one lesson to keep your ${streakNow()}-day streak.`:'One lesson is about 10 to 15 XP.'}</p></div></div>`; }
function vLearn(){
  const cur=currentLesson(); let html=`<div class="wrap stack">${goalCard()}${boardCard()}${wotdCard(true)}`; let lastSec=-1, k=0;
  const offs=[0,-70,-100,-70,0,70,100,70];
  UNITS.forEach(u=>{
    if(u.sec!==lastSec){ lastSec=u.sec; const s=SECTIONS[u.sec]; html+=`<div class="sechead"><h3>Section ${u.sec+1} · ${s.name}</h3><span>${s.share}</span></div>`; }
    const t=toneOf(u);
    html+=`<section style="--tone:var(--${t});--toned:var(--${t}d)"><div class="unit"><div style="min-width:0"><div class="k">Unit ${u.n+1}</div><h2>${u.title}</h2></div><button class="guide" data-guide="${u.id}">Guide</button></div><div class="nodes">`;
    LESSONS.filter(l=>l.unit===u).forEach(l=>{
      const done=!!S.lessons[l.id], open=unlocked(l), isCur=cur&&cur.id===l.id;
      const off=offs[k++%offs.length];
      html+=`<button class="node ${done?'done':open?'':'locked'}" style="transform:translateX(${off}px)" data-lesson="${l.id}" aria-label="${u.title}, lesson ${l.li+1}${done?', completed':open?'':', locked'}">${isCur?'<span class="ringc"></span><span class="bubble">Start</span>':''}${done?I.check:open?I.star:I.lock}</button>`;
    });
    html+=`</div></section>`;
  });
  html+=`<p class="muted" style="text-align:center;font-size:14px">${LESSONS.length} lessons · ${Object.keys(ITEM).length} original SAT-style questions</p></div>`;
  view.innerHTML=html;

function lessonSheet(l){
  const done=!!S.lessons[l.id];
  if(!unlocked(l)){ openModal(`<h2>Locked</h2><p class="muted">Finish the lessons before this one to unlock it.</p><button class="btn ghost" data-close>OK</button>`); return; }
  regen();
  if(S.energy<=0){ energySheet(); return; }
  const r=S.lessons[l.id];
  openModal(`<div style="--tone:var(--${toneOf(l.unit)})"><div class="qtype">${l.vocab?'Word set':'Unit'} ${l.unit.n+1} · ${l.vocab?'Part':'Lesson'} ${l.li+1} of ${l.unit.lessons.length}</div></div><h2>${l.unit.title}</h2><div class="tipbox" style="--tone:var(--${toneOf(l.unit)})"><b>Strategy</b>${l.unit.tip}</div><p class="muted">${l.items.length} questions${r?` · best score ${r.best}%`:''}</p><button class="btn" id="mStart">${done?'Practice again +5 XP':'Start +10 XP'}</button>`);
  document.getElementById('mStart').onclick=()=>{ closeModal(); startSession('lesson', l.items, l); };

/* ---------- session engine ---------- */
let SES=null; const LS=document.getElementById('lesson');
function startSession(mode, items, lesson){
  SES={mode, lesson, queue:items.slice(), total:items.length, done:0, firstTry:0, tries:0, wrongOnce:new Set(), start:Date.now(), sel:null, checked:false, energy0:S.energy, score0:scoreShown(), sN0:S.sN, run:0, eBonus:0};
  if(mode!=='lesson' && mode!=='reading') SES.queue=shuffle(SES.queue);
  LS.hidden=false; document.body.style.overflow='hidden'; showItem();
}
function startPractice(){
  const pool = LESSONS.concat(VLESSONS).filter(l=>S.lessons[l.id]).flatMap(l=>l.items);
  const src = pool.length>=6 ? pool : LESSONS.slice(0,2).flatMap(l=>l.items);
  startSession('practice', shuffle(src).slice(0,6));
}
function startMistakes(){ const items=S.mistakes.map(id=>ITEM[id]).filter(Boolean).slice(0,8); if(items.length) startSession('mistakes', items); }
function stopTimer(){ if(SES&&SES.tmr){ clearInterval(SES.tmr); SES.tmr=null; } }
function stopAll(){ stopTimer(); if(SES){ clearInterval(SES.speedT); clearTimeout(SES.adv); } }
function closeSession(){ stopAll(); LS.hidden=true; LS.innerHTML=''; document.body.style.overflow=''; SES=null; render(); }
function head(){ const pct=Math.round(SES.done/SES.total*100);
  return `<div class="hd"><button class="x" id="lsX" aria-label="Quit">${I.x}</button><div class="prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>${SES.mode==='speed'?`<span class="pill" id="spd" style="font-size:15px">${Math.max(0,Math.ceil((SES.deadline-Date.now())/1000))}s · ${SES.firstTry} ✓</span>`:SES.mode==='lesson'?`<span class="chip energy${S.energy<5?' low':''}">${I.battery}${S.energy}</span>`:`<span class="pill">${SES.mode==='mistakes'?'Mistakes':SES.mode==='quiz'?'Word quiz':SES.mode==='official'?'Official SAT':SES.mode==='reading'?'Reading':'Practice'}</span>`}</div>`; }
function showItem(){
  stopTimer(); const it=SES.queue[0]; SES.sel=null; SES.checked=false; SES.item=it; SES.qStart=Date.now(); SES.limit=limitOf(it);
  const u=UNIT[it.unit]; const tone=toneOf(u);
  let body='';
  if(SES.mode==='speed' && Date.now()>=SES.deadline){ finish(); return; }
  if(it.t==='m'){
    SES.left=shuffle(it.pairs.map((p,i)=>i)); SES.right=shuffle(it.pairs.map((p,i)=>i)); SES.matched=new Set(); SES.mL=null; SES.mR=null; SES.mMiss=0;

  }

  LS.querySelector('.bd').scrollTop=0;
  document.getElementById('lsX').onclick=quitAsk;
  if(!S.relaxed && SES.mode!=='speed'){ const tick=()=>{ const el=document.getElementById('tmr'); if(!el||!SES){ stopTimer(); return; } const left=SES.limit-(Date.now()-SES.qStart)/1000;
      el.className='timer'+(left<=0?' over':left<SES.limit*.25?' low':''); el.querySelector('i').style.width=Math.max(0,left/SES.limit*100)+'%';

}
function bindMatch(it){
  const pick=()=>{ if(SES.mL==null||SES.mR==null) return; const L=LS.querySelector(`[data-l="${SES.mL}"]`), R=LS.querySelector(`[data-r="${SES.mR}"]`);
    if(SES.mL===SES.mR){ [L,R].forEach(x=>{x.classList.add('ok');x.disabled=true;x.setAttribute('aria-pressed','false');}); SES.matched.add(SES.mL); sfx.tap(); }
    else { SES.mMiss++; [L,R].forEach(x=>{x.classList.add('no');x.setAttribute('aria-pressed','false');setTimeout(()=>x.classList.remove('no'),350);}); sfx.bad(); }
    SES.mL=SES.mR=null;
    if(SES.matched.size===it.pairs.length) setTimeout(()=>feedback(true, SES.mMiss?`Matched with ${SES.mMiss} miss${SES.mMiss>1?'es':''}. Review these words in the Words tab.`:'All four matched on the first try.'), 250);
  };
  LS.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{ LS.querySelectorAll('[data-l]').forEach(x=>x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); SES.mL=+b.dataset.l; pick(); });

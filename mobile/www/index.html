<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qadam SAT</title>
<style>
:root{--bg:#F2F4FA;--ink:#141B34;--muted:#5A6380;--cobalt:#1F45C8}
@media (prefers-color-scheme:dark){:root{--bg:#0E1222;--ink:#EEF1FA;--muted:#A3ABC5;--cobalt:#7F9BFF}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center}
main{max-width:340px;display:flex;flex-direction:column;gap:14px;align-items:center}
h1{margin:0;font-size:26px;color:var(--cobalt)}
p{margin:0;color:var(--muted)}
button{margin-top:8px;font:inherit;font-weight:800;color:#fff;background:var(--cobalt);border:0;border-radius:14px;padding:14px 28px;min-width:180px}
</style>
</head>
<body>
<main>
  <svg width="64" height="64" viewBox="0 0 24 24" aria-hidden="true" style="color:var(--cobalt)"><path fill="currentColor" d="M12 1.5l2.6 4.2 4.8-1.1-1.1 4.8 4.2 2.6-4.2 2.6 1.1 4.8-4.8-1.1L12 22.5l-2.6-4.2-4.8 1.1 1.1-4.8L1.5 12l4.2-2.6-1.1-4.8 4.8 1.1z"/><circle cx="12" cy="12" r="3.6" fill="var(--bg)"/></svg>
  <h1>No internet connection</h1>
  <p>Qadam SAT needs the internet the first time it opens. Connect to Wi-Fi or mobile data, then try again.</p>
  <button type="button" onclick="location.href='https://said26998.github.io/qadam-sat/'">Try again</button>
</main>
</body>
</html>
